<!doctype html>
<html lang="en">
<head>

<style>
  /* Move's Learn: the Exercise & Movement list, as the app draws it. Its own page, so nothing here leads into Eat.
     No Back at the top: the tab bar and the browser's own back do that. Photos: v7/img/move/learn/CREDITS.md.
     ponytail: rows do not open an article yet. */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #fff; font-family: Roboto, Arial, sans-serif; letter-spacing: .25px; color: var(--g-900); -webkit-font-smoothing: antialiased; }
  button { font: inherit; letter-spacing: inherit; color: inherit; }
  .col { position: relative; max-width: var(--col); margin: 0 auto; min-height: 100vh; padding-bottom: 96px; overflow-x: hidden; background: #fff; }
  .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .backico { width: 22px; height: 22px; fill: currentColor; stroke: none; flex-shrink: 0; }

  /* Eat's Learn list, measured the same (v7/r3/learn.html .nl-*): a pale band right under the status bar, then one plain list */
  .band { padding: 20px 18px 27px; background: linear-gradient(180deg, #EEF2FB 0%, #FFFFFF 100%); }
  h1 { margin: 0; font: 700 26px/34px "Playfair Display", Georgia, serif; letter-spacing: 0; color: #101010; }
  .list { padding: 0 18px 24px; }
  .row { display: flex; gap: 16px; padding: 18px 0 16px; border-bottom: 1px solid var(--g-200); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .th { flex: 0 0 88px; height: 88px; border-radius: 10px; overflow: hidden; border: 1px solid var(--g-200); box-shadow: 2px 3px 0 0 var(--g-200); background: var(--g-50); }
  .th img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; min-height: 88px; }
  .tx b { margin: 4px 0 0; font: 600 18px/25px Roboto, sans-serif; letter-spacing: .25px; color: var(--g-900); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tx span { margin-top: 10px; font: 400 14px/20px Roboto, sans-serif; letter-spacing: .25px; color: var(--g-500); }

  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--col); background: #fff; border-top: 1px solid var(--g-200); display: flex; padding: 8px 6px calc(8px + var(--gf-home-h, 20px) + env(safe-area-inset-bottom, 0px)); z-index: 20; }
  .nav a, .nav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--g-500); cursor: pointer; min-height: 48px; justify-content: center; text-decoration: none; }
  .nav .on { color: var(--brand-600); font-weight: 700; }
  .nav .ico { width: 22px; height: 22px; stroke-width: 1.8; }
  .nav .on .ico { stroke-width: 2.4; }
</style>
</head>

<div class="col">
  <div class="band"><h1>Exercise &amp; Movement</h1></div>
  <main class="list" id="list"></main>
  <nav class="nav">
    <button><svg class="backico" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path fill="currentColor" d="M9.409 3.444c-.015-.015-.473-.13-1.018-.255s-.997-.208-1.004-.185-.064.401-.125.84c-.124.882-.424 1.911-.744 2.555-1 2.006-2.791 3.334-4.964 3.68L1 10.165v1.773l.502.084c3.286.551 5.429 3.008 5.83 6.686.026.24.057.436.069.436.11 0 1.947-.443 1.982-.478.025-.025.006-.25-.042-.5-.531-2.765-2.053-5.015-4.027-5.955l-.474-.226 9.74-.018 6.16-.01v-1.794l-6.176-.011-9.717-.018.598-.303c1.552-.786 2.78-2.328 3.503-4.397.206-.59.517-1.934.46-1.99"/></svg>Back</button>
    <a href="/move/index.html"><svg class="ico" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Move</a>
    <a href="/move/trend.html"><svg class="ico" viewBox="0 0 24 24"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>Trend</a>
    <a href="#" class="on" aria-current="page"><svg class="ico" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Learn</a>
  </nav>
</div>
<script>
  var I = "/v7/img/move/learn/";
  var A = [
    ["Move &amp; Recover: Why Light Movement Is the Secret to Sustainable Fitness", "8 min read . 24 Dec 25", "recover"],
    ["Strength for Metabolism: How Simple Strength Training Helps Your Body Burn More", "8 min read . 24 Dec 25", "strength"],
    ["HIIT vs Jogging: Which One Burns More Fat?", "7 min read . 20 Nov 25", "hiit"],
    ["Why a 10 Minute Walk After Meals Helps Your Blood Sugar", "5 min read . 12 Nov 25", "after-meal"],
    ["Sitting All Day? What Standing More Really Does for You", "6 min read . 03 Nov 25", "stand"],

    ["Take the Stairs: The Easiest Workout You Are Not Counting", "4 min read . 15 Oct 25", "stairs"],
