<!doctype html><meta charset=utf-8><body style="margin:0;display:flex;gap:12px;padding:8px;background:#ddd">
<script>
location.hash.slice(1).split('|').forEach(function(u,i){var f=document.createElement('iframe');f.id='f'+i;f.src=u;f.style.cssText='width:390px;height:760px;border:0;background:#fff;flex:none';document.body.appendChild(f);});
</script>
<script>
window.fd=function(i){return document.getElementById('f'+i).contentDocument};
window.audit = function(i){var d=fd(i),w=d.defaultView,W=d.documentElement.clientWidth,H=w.innerHeight,out={sw:d.documentElement.scrollWidth,W:W,small:[],off:[],fs:[]};
d.querySelectorAll('button,a,input,select,textarea,[role=button],.chipb,.gday,.wk').forEach(function(e){var r=e.getBoundingClientRect(),cs=w.getComputedStyle(e);if(!r.width||cs.visibility=='hidden'||e.closest('[hidden]'))return;var lab=(e.getAttribute('aria-label')||e.textContent||e.placeholder||e.className).trim().replace(/\s+/g,' ').slice(0,30);
if(r.height<36||r.width<36)out.small.push(lab+' '+Math.round(r.width)+'x'+Math.round(r.height));
if(r.right>W+1||r.left<-1)out.off.push(lab+' '+Math.round(r.left)+'-'+Math.round(r.right));
if(/INPUT|SELECT|TEXTAREA/.test(e.tagName)&&e.type!='checkbox'&&e.type!='radio'&&parseFloat(cs.fontSize)<16)out.fs.push(lab+' '+cs.fontSize)});return out};
window.click=function(i,sel,txt){var d=fd(i);var els=[...d.querySelectorAll(sel)];var e=txt?els.find(b=>b.textContent.trim().includes(txt)):els[0];if(!e)return 'NOTFOUND '+sel+' '+txt;e.click();return 'clicked '+(e.textContent||'').trim().slice(0,30)};
window.wait=function(ms){return new Promise(r=>setTimeout(r,ms||300))};
</script>
