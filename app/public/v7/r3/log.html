    /* no bulge on the way up: a card that grows before it leaves is the same
       gimmick as the bar jumping when it lands */
    { transform: "translate(" + (dx * .1) + "px," + (-lift) + "px) scale(1)", opacity: 1, offset: .24,
      easing: "cubic-bezier(.5,0,.85,.4)" },
    { transform: "translate(" + (dx * .82) + "px," + (dy * .86) + "px) scale(.52)", opacity: .92, offset: .78,
      easing: "cubic-bezier(.4,0,.2,1)" },
    { transform: "translate(" + dx + "px," + dy + "px) scale(.16)", opacity: 0, offset: 1 }
  ], { duration: DUR, fill: "forwards" });

  /* the bar takes it just before the card finishes shrinking, so the two
     overlap instead of queueing */
  setTimeout(function () {
    if (tok) {
      tok.style.transform = "";
      tok.style.opacity = "";
      /* It settles, it does not spring. The old curve overshot to 1.16 and
         came back, which on a token this small read as a pop rather than as
         something arriving. */
      tok.animate([
        { transform: "scale(.72)", opacity: 0 },
        { transform: "scale(1)", opacity: 1 }
      ], { duration: 280, easing: "cubic-bezier(.05,.7,.1,1)" });
    }
    if (strip) {
      /* No nudge downward. The bar jumping 4px on every add was the gimmicky
         part: the whole strip moved for one small thing joining it. A light
         crosses it once instead, which says the same thing without displacing
         anything the eye was already reading. */
      strip.classList.remove("lit");
      void strip.offsetWidth;
      strip.classList.add("lit");
    }
  }, DUR * 0.8);

  fly.onfinish = function () { m.remove(); INFLIGHT--; };
}

function addAt(id, qty, fromEl) {
  var at = -1;
  for (var i = 0; i < S.items.length; i++) { if (S.items[i].id === id) at = i; }
  if (at === -1) S.items = S.items.concat({ id: id, qty: qty });
  else S.items = S.items.map(function (x, i) { return i === at ? { id: x.id, qty: x.qty + qty } : x; });
  var fd = byId(id);
  LASTADD = id;
  var srcRow = fromEl ? fromEl.closest(".row") : null;
  var from = srcRow ? srcRow.getBoundingClientRect() : null;
  render();
  /* the row after the render, so the dim plays on the live node */
  var liveRow = document.querySelector('.row[data-food="' + id + '"]');
  if (from && fd) toss(from, fd.name, fd.unit, liveRow);
}

function bump(id, by, fromEl) {
  var at = -1;
  for (var i = 0; i < S.items.length; i++) { if (S.items[i].id === id) { at = i; } }
  if (at === -1) {
    if (by > 0) S.items = S.items.concat({ id: id, qty: 1 });
  } else {
    var next = S.items[at].qty + by;
    if (next <= 0) S.items = S.items.filter(function (x) { return x.id !== id; });
    else S.items = S.items.map(function (x, i) { return i === at ? { id: x.id, qty: next } : x; });
  }
  /* measured before render(), which takes the row away and leaves every
     node from it detached with a zero rect */
  var srcRow = by > 0 && fromEl ? fromEl.closest(".row") : null;
  var rect = srcRow ? srcRow.getBoundingClientRect() : null;
  var fd = byId(id);
  if (by > 0) LASTADD = id;
  JUST = by > 0 ? id : null;
  render();
  JUST = null;
  var liveRow = document.querySelector('.row[data-food="' + id + '"]');
  if (rect && fd) toss(rect, fd.name, fd.unit, liveRow);
}
/* the row that just took an item, so it can confirm in place */
var JUST = null;

/* ---------- the plan, shared items lifted out of the options ---------- */
/* The tally strip. Newest first, because the thing you just tapped is the
   thing you are checking. Three tokens then a +N, so its width is fixed
   whether the tray holds four items or forty. */

function renderTally() {
  var host = el("tally");
  if (!S.items.length) { host.innerHTML = ""; return; }
  var newest = S.items.slice().reverse();
  var shown = newest.slice(0, 2);
  var extra = newest.length - shown.length;
  var fresh = JUST || LASTADD;

  var toks = shown.map(function (it) {
    return '<span class="tok">' + I.dish + "</span>";
  }).join("");
  if (extra > 0) toks += '<span class="tok more">+' + extra + "</span>";

  /* past ten the names give up rather than the strip growing or shrinking
     the type to fit */
  var names = newest.length >= 10
    ? newest.length + " items"
    : newest.map(function (it) { return byId(it.id).name; }).join(", ");

  host.innerHTML = '<button class="tally" id="tallyBtn" aria-label="See what is in this meal">' +
    '<span class="stack">' + toks + "</span>" +
    '<span class="names' + (fresh ? " fresh" : "") + '">' + esc(names) + "</span>" +
    '<span class="kc">' + kcalTotal() + " kcal</span>" +
    '<span class="chev">' + I.chev + "</span></button>";
  LASTADD = null;
}
/* which item arrived last, so the strip can point at it once */
var LASTADD = null;

/* Slides the indicator onto whichever tab is live. Measured rather than
   computed, so it stays right whatever the labels say. */
function moveTabInd() {
  var ind = el("tabInd"), on = el("tabBtns").querySelector(".tab.on");
  if (!ind) return;
  if (!on) { ind.style.opacity = "0"; return; }
  /* One coordinate system for both, offsetLeft against the same offsetParent,
     rather than mixing getBoundingClientRect (viewport) with a transform
     applied in the container's own space. Mixing the two is what kept putting
     this 16px out in one direction or the other.

     The width is the icon plus the gap plus the label, because the button is
     flex:1 and therefore a third of the bar whatever it says. The icon is an
     SVG, which has no offsetLeft, so its width comes from its box. */
  var lab = on.lastElementChild;
  var gap = parseFloat(getComputedStyle(on).gap) || 0;
  var iconW = on.firstElementChild.getBoundingClientRect().width || 17;
  var contentW = iconW + gap + lab.offsetWidth;
  ind.style.width = Math.round(contentW) + "px";
  /* offsetLeft is measured from the container's padding box, but the
     indicator's own static position is its border box, so the container's
     16px has to come back off. Measured on screen: without this the bar
     lands exactly one padding to the right of its label. */
  var pad = parseFloat(getComputedStyle(el("tabs")).paddingLeft) || 0;
  ind.style.transform =
    "translateX(" + Math.round(on.offsetLeft + (on.offsetWidth - contentW) / 2 - pad) + "px)";
  ind.style.opacity = "1";
}

/* Re-measure once Roboto has actually arrived, and again if the column is
   resized. Both change the label's width under a bar that was positioned
   from it. */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { moveTabInd(); });
}
window.addEventListener("resize", moveTabInd);

/* The coach's three options are numbered, because that is what a coach says on
   the phone and what the person reads back. The calorie total rides underneath
   so the three can still be compared without tapping each one in turn. */

/* PLAN_DIV and PLAN are set up with MEAL, above, because S.option is clamped
   against PLAN.length long before this point. */

/* An empty tab is not an error, so it does not apologise. It names what the
   tab is for, says how it fills, and where a list would have been it puts one
   real object: the house pictogram for recents, and for favourites the very
   heart the sentence is asking the reader to press. */
/* One line, not a headline and a paragraph under it. There is nothing here to
   summarise, so a heading had nothing to do but repeat the sentence below it
   in fewer words. */
function emptyList(art, line, cta) {
  return '<div class="empty"><div class="eart">' + art + "</div>" +
    "<p>" + line + "</p>" +
    (cta ? '<button class="cta" data-act="toSearch">' + I.search + cta + "</button>" : "") +
    "</div>";
}

/* a plan row carries the coach's quantity, and the tick asks before it logs */
function planRow(it) {
  var fd = byId(it.id); if (!fd) return "";
  var qty = qtyOf(fd.id);
  /* The same control every other row has. A checkbox here said "tick off the
     plan", which made a plan food a different kind of thing from a searched
     one. It is not: both are food going into the same tray.

     This screen still carries no Skip. Saying "not today" to a coach's food
     is a decision about the plan, not about this tray, so it lives in the
     meal card's overflow menu on the Eat screen and nowhere else. */
  return '<div class="row' + (qty ? " has" : "") + '" data-food="' + fd.id + '">' +
    '<button class="nm"><b>' + esc(fd.name) + I.chev + "</b><span>" +
      ((it.qty > 1 ? it.qty + " x " + esc(fd.unit) : esc(fd.unit)) + " \u00b7 " + Math.round(fd.kcal * it.qty) + " kcal") +
      "</span></button>" +
    (qty
      ? '<span class="step"><button data-dec="' + fd.id + '" aria-label="One less ' + esc(fd.name) + '">' + I.minus + "</button><b>" + qty + "</b>" +
        '<button data-inc="' + fd.id + '" aria-label="One more ' + esc(fd.name) + '">' + I.plusSm + "</button></span>"
      : '<button class="add" data-plan="' + fd.id + ":" + it.qty + '" aria-label="Add ' + esc(fd.name) + '">' + I.plus + "</button>") +
    "</div>";
}

/* ---------- rows ---------- */
function foodRow(fd) {
  var qty = qtyOf(fd.id), fav = S.fav.indexOf(fd.id) > -1;
  return '<div class="row' + (qty ? " has" : "") + '" data-food="' + fd.id + '">' +
    '<button class="nm"><b>' + esc(fd.name) + I.chev + '</b><span>' + esc(fd.unit) + " · " + fd.kcal + " kcal" + '</span></button>' +
    '<button class="heart' + (fav ? " on" : "") + '" data-fav="' + fd.id + '" aria-label="' + (fav ? "Remove from favourites" : "Add to favourites") + '">' + I.heart(fav) + '</button>' +
    (qty
      ? '<span class="step"><button data-dec="' + fd.id + '" aria-label="One less ' + esc(fd.name) + '">' + I.minus + '</button><b>' + qty + '</b>' +
        '<button data-inc="' + fd.id + '" aria-label="One more ' + esc(fd.name) + '">' + I.plusSm + '</button></span>'
      : '<button class="add" data-inc="' + fd.id + '" aria-label="Add ' + esc(fd.name) + '">' + I.plus + '</button>') +
    "</div>";
}

/* what is different about this log is said once, at the top. A day that is not
   today follows the wheel, so it is rebuilt whenever the time changes. */
function dayNoteHTML() {
  var out = "";
  if (EDITING) {
    out += '<div class="daynote">' + I.pencil +
      "<span>You are fixing <b>a meal you already logged</b>. Saving replaces what was there.</span></div>";
  }
  return out;
}

/* ---------- render ---------- */
function render() {
  var q = S.query.trim().toLowerCase();
  var div = divisionForTime(S.time);

  if (FUTURE) return renderFuture();

  /* header: which meal this lands in, and the window the coach set for it */
  el("hTitle").textContent = "Log your meal";
  el("hSub").textContent = dayTitle(S.dayOffset);

  el("dayNote").innerHTML = dayNoteHTML();

  /* The field holds nothing but the field now. Two 44px targets inside a 52px
     input crowded the one thing it is for, and neither glyph on its own said
     that a whole meal can go in by talking. The offer moved to the tab tucked
     under the bar, which has room for words. */
  el("sTools").innerHTML = q
    ? '<button class="iconbtn" id="clearQ" aria-label="Clear search">' + I.x + "</button>"
    : "";
  /* and the tab stands down the moment somebody types, because by then they
     have already chosen how they are logging */
  el("kstrip").classList.toggle("gone", !!q);
  document.querySelector(".srch").classList.toggle("typed", !!q);
  var km = el("kstripMark");
  if (km && !km.firstChild) km.innerHTML = I.kmarkTab;

  /* tabs */
  /* Recent, Favourites, then the plan. Frequent and Favourites were two
     names for the same shelf, so Frequent became Recent: one is what you
     reach for by habit, the other what you chose to keep. */
  var tabs = [{ id: "recent", label: "Recent", icon: I.clock },
              { id: "fav", label: "Favourites", icon: I.heartLine }];
  if (S.hasPlan) tabs.push({ id: "plan", label: "Your plan", icon: I.clipboard });
  el("tabBtns").innerHTML = q ? "" : tabs.map(function (t) {
    return '<button class="tab' + (S.tab === t.id ? " on" : "") + '" data-tab="' + t.id + '">' +
      t.icon + '<span>' + t.label + "</span></button>";
  }).join("");
  el("tabs").style.display = q ? "none" : "block";
  moveTabInd();

  /* the list */
  var html = "";
  if (q) {
    var hits = FOODS.filter(function (x) { return x.name.toLowerCase().indexOf(q) > -1; });
    if (!hits.length) {
      /* The database not knowing a dish is not the user's problem to solve.
         Telling them to try a shorter word puts the work back on them for a
         gap on our side, so the search miss hands straight to Kaira, who can
         take a description and log it. The spelling tip stays, quietly,
         underneath, for the times it really was a typo. */
      html = '<div class="empty">' +
        '<div class="eart">' + I.kmark + "</div>" +
        "<p>We could not find <b>" + esc(S.query) + "</b>. Kaira can log it for you.</p>" +
        '<button class="cta" data-act="kairaLog">Log it with Kaira</button></div>';
    } else {
      html = hits.map(foodRow).join("");
    }
  } else if (S.tab === "plan") {
    /* one option is chosen, the others are a tap away */
    html += '<div class="opts">' + PLAN.map(function (o, i) {
      /* The same two axes the meal card uses: the fill is how much of this
         option is already in the tray, the ring is the one you are reading. */
      /* no progress fill: options share foods, so a check once any one is added */
      var any = o.some(function (x) { return qtyOf(x.id) > 0; });
      return '<button class="opt' + (i === S.option ? " on" : "") + (any ? " done" : "") + '" data-opt="' + i + '"' +
          ' aria-label="Option ' + (i + 1) + (any ? ", added" : "") + '">' +
        '<span class="ot"><b>Option ' + (i + 1) + "</b></span>" +
        (any ? I.check : "") + "</button>";
    }).join("") + "</div>";
    /* One list, in the coach's own order. It used to be split into "in every
       option" and "only in option 2", which made the reader hold all three
       options in their head to read one, and answered a question nobody had
       asked: they have already chosen. */
    html += PLAN[S.option].map(planRow).join("");
  } else if (S.tab === "fav") {
    var favs = FOODS.filter(function (x) { return S.fav.indexOf(x.id) > -1; });
    /* The empty state shows the exact control it is asking for. A generic
       illustration would make the reader go and hunt for the heart; the real
       one, at the size it appears on a row, is the instruction. */
    html = favs.length ? favs.map(foodRow).join("")
      : emptyList(
          '<div class="favdemo" aria-hidden="true">' +
            '<div class="fdrow"><span class="fdt"><b>Vegetable poha</b><i>1 bowl, 242 kcal</i></span>' +
              '<span class="fdh"><span class="fdring"></span>' +
                '<span class="fdo">' + I.heart(false) + "</span>" +
                '<span class="fdf">' + I.heart(true) + "</span></span></div>" +
            '<span class="fdtip"></span><span class="fdfly">' + I.heart(true) + "</span></div>",
          "Tap the heart on a food, and it is here whenever you want it.");
  } else if (S.fresh) {
    /* Nothing has ever been logged, so there is nothing to recall. The screen
       says what this tab is for rather than printing an apology, and points
       at the field above, which is the only thing that can fill it. */
    html = emptyList(
      '<img src="../icons/pictogram-eat.png" alt="" width="47" height="72">',
      "Start with whatever you ate last. No judgement, ever.",
      "Find your food");
  } else {
    var recent = FOODS.filter(function (x) { return x.tags.indexOf("freq") > -1 || x.tags.indexOf("fav") > -1; });
    html = '<div class="glab">' + (S.hasPlan ? "What you logged lately" : "Common meals to start with") + "</div>" + recent.map(foodRow).join("");
  }
  el("list").innerHTML = html;

  /* the tray: chips, a banner when there is something to know, the count */
  var top = "";
  if (S.banner === "offline") {
    top += '<div class="ban off">' + I.cloud + '<span class="bt"><b>You are offline</b>' +
      "Log it anyway. It sends by itself when you are back.</span></div>";
  }
  if (S.banner === "failed") {
    top += '<div class="ban err">' + I.warn + '<span class="bt"><b>That did not save</b>' +
      "Your meal is still here, nothing is lost.</span>" +
      '<button class="retry" id="retry">Retry</button></div>';
  }

  el("trayTop").innerHTML = top;

  var n = count();
  el("count").innerHTML = n === 0 ? "No items yet"
    : "<b>" + n + "</b> " + (n === 1 ? "item" : "items") + " · " + kcalTotal() + " kcal";
  renderTally();
  el("timeLbl").textContent = fmtTime(S.time);
  el("timeBtn").setAttribute("aria-label", "Change the time, now " + fmtTime(S.time));
  el("lands").innerHTML = n > 0 ? '<div class="lands">This lands under <b>' + DIV_LABEL[div] + "</b></div>" : "";
  var btn = el("saveBtn");
  btn.disabled = n === 0;
  /* an edit is a correction, so the button says so rather than counting items
     into a meal that already has them */
  btn.textContent = S.banner === "failed" ? "Try again"
    : EDITING ? (S.banner === "offline" ? "Save changes when back online" : "Save changes")
    : n === 0 ? "Log meal"
    : S.banner === "offline" ? "Log " + n + (n === 1 ? " item" : " items") + " when back online"
    : "Log " + n + (n === 1 ? " item" : " items");

  renderSheet();
}

/* nothing to log on a day that has not happened, so the screen says it once and stops */
function renderFuture() {
  el("hTitle").textContent = "Log your meal";
  el("hSub").textContent = FUTURE;
  el("dayNote").innerHTML = "";
  el("sTools").innerHTML = "";
  el("tabs").style.display = "none";
  el("list").innerHTML = '<div class="future"><span class="dic">' + I.cal + "</span>" +
    "<b>" + esc(FUTURE) + " has not happened yet</b>" +
    "<p>You can log a meal on the day itself, or afterwards. Come back then.</p></div>";
  document.querySelector(".tray").style.display = "none";
  document.querySelector(".srch").style.display = "none";
}

/* ---------- sheets ---------- */
function openSheet(s) { S.sheet = s; render(); }
function closeSheet() { S.sheet = null; render(); }

function renderSheet() {
  var s = S.sheet, sheet = el("sheet"), scrim = el("scrim");
  if (!s) { WHEEL = null; sheet.classList.remove("on"); scrim.classList.remove("on"); return; }
  sheet.classList.add("on"); scrim.classList.add("on");
  var title = "", body = "";

  if (s.kind === "tray") {
    title = "In this meal";
    body = '<div class="trayrows">' + S.items.map(function (it) {
      var fd = byId(it.id);
      return '<div class="trayrow">' +
        '<button class="nm" data-qty="' + it.id + '"><b>' + esc(fd.name) + "</b>" +
        "<span>" + it.qty + " \u00d7 " + esc(fd.unit) + " \u00b7 " + Math.round(fd.kcal * it.qty) + " kcal</span></button>" +
        '<button class="rm" data-rm="' + it.id + '" aria-label="Remove ' + esc(fd.name) + '">' + I.x + "</button></div>";
    }).join("") + "</div>";
  } else if (s.kind === "qty") {
    var fd = byId(s.id), inTray = qtyOf(s.id);
    /* The title never changes. It named the sheet "Add item" before the tap
       and "In this meal" after, which is the same sheet claiming to be two
       different sheets: the user has not gone anywhere, so the label they
       navigated by should not move under them. Only the one control that
       actually changed changes, and it changes in place.
       The unit chips are gone too: the helping a food comes in is the
       helping, and offering "1 plate" for a katori of curd asked a question
       nobody had. */
    title = "Add item";
    var q2 = inTray || 1;
    body = '<div class="qitem"><b>' + esc(fd.name) + "</b><span>" + esc(fd.unit) + "</span></div>" +
      /* Macros first, calories under them. The four macros are what the food is
         made of and the calorie figure is what they add up to, so it reads as
         the total of the row above rather than a headline the macros footnote.
         It is named now too: every other figure in this panel carries its own
         word, and "98 kcal" alone left the reader to supply the only one that
         did not. Label left, figure right, which is how the day view's own
         calorie strip is built. */
      '<div class="qfacts">' +
        '<div class="qmac">' +
          [["protein", "Protein", fd.p], ["carbs", "Carbs", fd.c],
           ["fats", "Fats", fd.f], ["fibre", "Fibre", fd.fibre]].map(function (m) {
            return '<div><span class="g glyph-' + m[0] + '"></span><b>' +
              m[2] + "g</b><span>" + m[1] + "</span></div>";
          }).join("") + "</div>" +
        '<div class="qcal">' + I.flame + '<span class="cl">Calories</span>' +
          "<b>" + fd.kcal + "</b><span class=\"cu\">kcal</span></div>" +
      "</div>" +
      /* a coach's food is confirmed before it goes in: how much, and when */
      (s.plan ? timePart() : "") +
      (inTray
        /* once it is in, the same place becomes the control that changes it */
        ? '<div class="qstep"><button id="qMinus" aria-label="' +
            (q2 === 1 ? "Take it out of this meal" : "One less") + '">' + I.minus + "</button>" +
            '<span class="v"><b>' + q2 + "</b><i>" + esc(unitPlural(fd.unit, q2)) + "</i></span>" +
            '<button id="qPlus" aria-label="One more">' + I.plusSm + "</button></div>"
        : '<button class="sok" id="qSave">' + (s.plan ? "Log it" : "Add to meal") + "</button>");
  }


  if (s.kind === "time") {
    title = "When did you eat?";
    /* One control, not two. Chips beside a wheel meant the same value could be
       set two ways, and the chips could only ever reach seven of the 1,440
       minutes in a day. The wheel reaches all of them. */
    body = wheelHTML() +
      '<p class="vh" id="tLive" role="status" aria-live="polite">' + esc(liveLine()) + "</p>" +
      '<div class="landing" id="tLanding">' + landingLine() + "</div>" +
      '<button class="sok" id="tDone">Done</button>';
  }

  if (s.kind === "snap") {
    title = "Log with a photo";
    if (s.step === "frame") {
      body = '<div class="cap"><div class="frame"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>' +
        '<span class="plate">' + I.cam + "</span></div>" +
        '<p class="capsay">Get the whole plate in frame and <b>hold steady</b>. One photo of the full meal reads better than three close ups.</p>' +
        '<button class="sok" id="shoot">Take photo</button></div>';
    } else if (s.step === "reading") {
      body = '<div class="cap"><div class="frame"><span class="scanline"></span><span class="plate">' + I.cam + "</span></div>" +
        '<p class="capsay"><b>Reading your photo</b><br>Matching what is on the plate to foods and portions.</p></div>';
    } else if (s.step === "result") {
      body = '<div class="cap found"><div class="fh">' + I.check + "Found 3 items</div>" +
        found([{ id: "poha", qty: 1, sure: "Confident" }, { id: "eggs", qty: 2, sure: "Confident" }, { id: "chai", qty: 1, sure: "Not certain", low: true }]) +
        '<p class="capsay" style="text-align:left">Tap any row to fix the food or the portion before it goes in.</p>' +
        '<button class="sok" id="acceptFound">Add 3 items</button>' +
        '<button class="sghost" id="retake">Take another photo</button></div>';
    } else if (s.step === "none") {
      body = '<div class="cap"><div class="frame"><span class="plate">' + I.cam + "</span></div>" +
        '<p class="capsay"><b>Nothing recognised in that one</b><br>Bright light and the whole plate in frame help. Or add it by hand, which is just as good.</p>' +
        '<button class="sok" id="retake">Take another photo</button>' +
        '<button class="sghost" id="toSearch">Add it by hand</button></div>';
    } else {
      body = '<div class="cap denied"><span class="dic">' + I.block + "</span>" +
        '<p class="capsay"><b>The camera is switched off for this app</b><br>Turn it on in Settings to log with a photo. Searching and speaking still work.</p>' +
        '<button class="sok" id="toSettings">Open settings</button>' +
        '<button class="sghost" id="toSearch">Add it by hand</button></div>';
    }
  }

  if (s.kind === "voice") {
    title = "Log by speaking";
    if (s.step === "listening") {
      body = '<div class="cap"><div class="wave" role="img" aria-label="The microphone is on">' + LEVELS.map(function (h, i) {
          return '<i style="height:' + h + 'px;animation-delay:' + (i * 0.09).toFixed(2) + 's"></i>';
        }).join("") + "</div>" +
        '<p class="capsay"><b>Listening</b><br>Say what you ate, the way you would tell a friend. "Two eggs, a bowl of poha and chai."</p>' +
        '<button class="sghost" id="stopVoice">Stop</button></div>';
    } else if (s.step === "heard") {
      body = '<div class="cap"><div class="quote"><span>Heard that</span>"Two boiled eggs, a bowl of poha and one masala chai"</div>' +
        '<p class="capsay">Working out the foods and portions from that.</p>' +
        '<button class="sghost" id="retakeVoice">Say it again</button></div>';
    } else if (s.step === "result") {
      body = '<div class="cap found"><div class="quote" style="margin-top:0"><span>Heard that</span>"Two boiled eggs, a bowl of poha and one masala chai"</div>' +
        '<div class="fh" style="margin-top:16px">' + I.check + "Found 3 items</div>" +
        found([{ id: "eggs", qty: 2, sure: "Confident" }, { id: "poha", qty: 1, sure: "Confident" }, { id: "chai", qty: 1, sure: "Confident" }]) +
        /* snap and voice are the same three beats, so they teach the same thing */
        '<p class="capsay" style="text-align:left">Tap any row to fix the food or the portion before it goes in.</p>' +
        '<button class="sok" id="acceptFound">Add 3 items</button>' +
        '<button class="sghost" id="retakeVoice">Say it again</button></div>';
    } else if (s.step === "none") {
      body = '<div class="cap"><div class="wave" style="opacity:.5"><i style="height:14px"></i><i style="height:14px"></i><i style="height:14px"></i></div>' +
        '<p class="capsay"><b>That came through quiet</b><br>Somewhere less noisy usually does it. Or add it by hand, which is just as good.</p>' +
        '<button class="sok" id="retakeVoice">Try again</button>' +
        '<button class="sghost" id="toSearch">Add it by hand</button></div>';
    } else {
      body = '<div class="cap denied"><span class="dic">' + I.block + "</span>" +
        '<p class="capsay"><b>The microphone is switched off for this app</b><br>Turn it on in Settings to log by speaking. Searching and photos still work.</p>' +
        '<button class="sok" id="toSettings">Open settings</button>' +
        '<button class="sghost" id="toSearch">Add it by hand</button></div>';
    }
  }

  el("sTitle").textContent = title;
  el("sBody").innerHTML = body;
  if (s.kind === "time") wheelInit(); else WHEEL = null;
}

/* the resting shape of the level meter, so the panel is never an empty box */
var LEVELS = [18, 30, 44, 34, 58, 38, 46, 26, 18];

var TIME_OPTS = [6 * 60 + 30, 8 * 60 + 30, 10 * 60, 13 * 60 + 30, 17 * 60 + 30, 20 * 60 + 30, 22 * 60 + 30];
function timeChips() {
  return '<div class="times">' + TIME_OPTS.map(function (m) {
    return '<button class="tchip' + (m === S.time ? " on" : "") + '" data-time="' + m + '">' + fmtTime(m) + "</button>";
  }).join("") + "</div>";
}
/* ---------- the wheel ----------
   Four columns: the day, the hour, the minute in fives, and AM or PM, the way
   Yazio carries a whole "when" in one control. Scroll snap plus a scroll
   listener is the whole engine, so there is nothing to install: touch flicks a
   column, the mouse drags it through pointer events, and the arrow keys step
   it. Each column is a spinbutton that says its own value, and a quiet live
   region reads the whole answer back. Everything it lands on is written into
   S.time, so the header, the meal window and the landing line keep deriving
   exactly as they always did. */
var WROW = 44;        // one row, and the lozenge, and a tap target
var WHEEL = null;     // the four live columns, only while the time sheet is up
function reduceMotion() {
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function minuteIndex(m) { return Math.max(0, Math.min(59, m)); }

function wheelHTML() {
  var h24 = Math.floor(S.time / 60), mn = S.time % 60;
  var h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  var hrs = [], mins = [], i;
  for (i = 1; i <= 12; i++) hrs.push(String(i));
  for (i = 0; i < 60; i++) mins.push((i < 10 ? "0" : "") + i);
  function col(cls, id, label, items, sel) {
    return '<div class="wcol ' + cls + '" id="' + id + '" role="spinbutton" tabindex="0" aria-label="' + label +
      '" aria-valuemin="0" aria-valuemax="' + (items.length - 1) + '" aria-valuenow="' + sel +
      '" aria-valuetext="' + esc(items[sel]) + '">' +
      items.map(function (t, k) { return '<div class="wi' + (k === sel ? " on" : "") + '">' + esc(t) + "</div>"; }).join("") +
      "</div>";
  }
  /* Hour, minute, morning or afternoon. No day: the day is chosen by opening
     that day on the Eat screen and logging from there, which keeps this sheet
     about one question. */
  return '<div class="wheel"><span class="wloz" aria-hidden="true"></span>' +
    col("hr", "wHr", "Hour", hrs, h12 - 1) +
    '<span class="wsep" aria-hidden="true">:</span>' +
    col("mn", "wMn", "Minute", mins, minuteIndex(mn)) +
    col("ap", "wAp", "Morning or afternoon", ["AM", "PM"], h24 < 12 ? 0 : 1) +
    "</div>";
}

function wheelInit() {
  var hr = el("wHr");
  if (!hr) { WHEEL = null; return; }
  WHEEL = { hr: hr, mn: el("wMn"), ap: el("wAp") };
  ["hr", "mn", "ap"].forEach(function (k) { wheelColumn(WHEEL[k]); });
}

function colIndex(c) {
  return Math.max(0, Math.min(c.children.length - 1, Math.round(c.scrollTop / WROW)));
}

function wheelColumn(c) {
  c.scrollTop = +c.getAttribute("aria-valuenow") * WROW;
  var tick = null;
  c.addEventListener("scroll", function () {
    if (c._to !== null && c._to !== undefined) return;   // a scroll we started ourselves
    if (tick) return;
    tick = requestAnimationFrame(function () { tick = null; markCol(c, colIndex(c)); });
  });
  c.addEventListener("keydown", function (e) {
    var n = c.children.length, at = +c.getAttribute("aria-valuenow"), to = at;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") to = at + 1;
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") to = at - 1;
    else if (e.key === "PageDown") to = at + 3;
    else if (e.key === "PageUp") to = at - 3;
    else if (e.key === "Home") to = 0;
    else if (e.key === "End") to = n - 1;
    else return;
    e.preventDefault();
    scrollCol(c, Math.max(0, Math.min(n - 1, to)));
  });
  /* a mouse has no flick, so it gets a drag of its own. Touch keeps the
     browser's own scrolling, which is smoother than anything written here. */
  var drag = null, moved = 0;
  c.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse") return;
    drag = { y: e.clientY, top: c.scrollTop }; moved = 0;
    c.classList.add("grab");
    try { c.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  c.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dy = e.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dy));
    c.scrollTop = drag.top - dy;
  });
  function endDrag(e) {
    if (!drag) return;
    drag = null;
    c.classList.remove("grab");
    try { c.releasePointerCapture(e.pointerId); } catch (err) {}
    scrollCol(c, colIndex(c));
  }
  c.addEventListener("pointerup", endDrag);
  c.addEventListener("pointercancel", endDrag);
  /* a row you can see is a row you can tap, so it winds itself to the middle */
  c.addEventListener("click", function (e) {
    if (moved > 4) { moved = 0; return; }
    var row = e.target.closest(".wi");
    if (!row) return;
    scrollCol(c, [].indexOf.call(c.children, row));
    c.focus();
  });
}

/* the value is decided the moment it is asked for, the scroll only catches up */
function scrollCol(c, i) {
  c._to = i;
  markCol(c, i);
  if (c.scrollTo) c.scrollTo({ top: i * WROW, behavior: reduceMotion() ? "auto" : "smooth" });
  else c.scrollTop = i * WROW;
  clearTimeout(c._tt);
  c._tt = setTimeout(function () { c._to = null; }, reduceMotion() ? 0 : 420);
}

function markCol(c, i) {
  if (+c.getAttribute("aria-valuenow") === i) return;
  c.setAttribute("aria-valuenow", i);
  c.setAttribute("aria-valuetext", c.children[i].textContent);
  for (var k = 0; k < c.children.length; k++) c.children[k].classList.toggle("on", k === i);
  readWheel();
}

function readWheel() {
  if (!WHEEL) return;
  var h12 = +WHEEL.hr.children[+WHEEL.hr.getAttribute("aria-valuenow")].textContent;
  var mn = +WHEEL.mn.children[+WHEEL.mn.getAttribute("aria-valuenow")].textContent;
  var pm = +WHEEL.ap.getAttribute("aria-valuenow") === 1;
  S.time = ((h12 % 12) + (pm ? 12 : 0)) * 60 + mn;
  timeChanged();
}

/* the chips and the wheel are one control, so a chip moves the wheel rather
   than jumping past it */
function setWheelTime(mins) {
  var h24 = Math.floor(mins / 60), mn = mins % 60;
  scrollCol(WHEEL.hr, (h24 % 12 === 0 ? 12 : h24 % 12) - 1);
  scrollCol(WHEEL.mn, minuteIndex(mn));
  scrollCol(WHEEL.ap, h24 < 12 ? 0 : 1);
}

function liveLine() {
  return dayLabel(S.dayOffset) + ", " + fmtTime(S.time) + ", lands under " + DIV_LABEL[divisionForTime(S.time)];
}
function landingLine() {
  return "The time decides the meal. <b>" + esc(dayLabel(S.dayOffset)) + "</b> at <b>" + fmtTime(S.time) +
    "</b> lands under <b>" + DIV_LABEL[divisionForTime(S.time)] + "</b>.";
}

/* The wheel owns its own DOM while it is up, so a full render would pull it out
   from under the finger. Everything the time decides is refreshed in place
   instead, and Done does the full render on the way out. */
function timeChanged() {
  var div = divisionForTime(S.time);
  if (!FUTURE) {
    el("hTitle").textContent = "Log your meal";
    el("hSub").textContent = dayTitle(S.dayOffset);
    el("dayNote").innerHTML = dayNoteHTML();
    el("timeLbl").textContent = fmtTime(S.time);
    el("timeBtn").setAttribute("aria-label", "Change the time, now " + fmtTime(S.time));
    el("lands").innerHTML = count() > 0 ? '<div class="lands">This lands under <b>' + DIV_LABEL[div] + "</b></div>" : "";
  }
  var land = el("tLanding"); if (land) land.innerHTML = landingLine();
  var live = el("tLive"); if (live) live.textContent = liveLine();
  [].forEach.call(document.querySelectorAll(".tchip"), function (b) {
    b.classList.toggle("on", +b.getAttribute("data-time") === S.time);
  });
}

/* the time is part of confirming a coach's food, because the time picks the meal */
function timePart() {
  var div = divisionForTime(S.time);
  return '<div class="glab" style="margin-top:16px">When did you eat it?</div>' + timeChips() +
    (div === PLAN_DIV
      ? '<div class="landing"><b>' + fmtTime(S.time) + "</b> keeps it under <b>" + DIV_LABEL[PLAN_DIV] + "</b>, where your coach put it.</div>"
      : '<div class="landing">At <b>' + fmtTime(S.time) + "</b> this goes under <b>" + DIV_LABEL[div] +
        "</b> instead of " + DIV_LABEL[PLAN_DIV].toLowerCase() + ". That is fine, it still counts.</div>");
}

/* one food, one target: the row itself, carrying the portion it was read at so
   the sheet opens on that number rather than resetting to one */
function found(rows) {
  return rows.map(function (r) {
    var fd = byId(r.id);
    return '<button class="fitem" data-editfound="' + r.id + ':' + r.qty + '">' +
      '<span class="fn">' + esc(fd.name) + "<span>" + (r.qty > 1 ? r.qty + " x " + esc(fd.unit) : esc(fd.unit)) + " · " + (fd.kcal * r.qty) + " kcal</span></span>" +
      '<span class="sure' + (r.low ? " low" : "") + '">' + r.sure + "</span>" +
      '<span class="edit" aria-hidden="true">' + I.pencil + "</span></button>";
  }).join("");
}

/* ---------- the favourite burst ----------
   Twitter's heart: the glyph overshoots and a ring throws outward with a few
   dots behind it, then every part of it is taken away. Nothing is built at all
   when motion is turned down, because an element whose animation has been
   switched off by the reduced-motion rule would simply sit there. */
function heartBurst(btn) {
  if (!btn || reduceMotion()) return;
  btn.classList.remove("pop");
  void btn.offsetWidth;                    // so a second tap replays it
  btn.classList.add("pop");
  var b = document.createElement("span");
  b.className = "burst";
  b.setAttribute("aria-hidden", "true");
  var html = '<span class="ring"></span>';
  for (var i = 0; i < 7; i++) {
    var a = (i / 7) * Math.PI * 2 - Math.PI / 2, r = 20 + (i % 2) * 5;
    html += '<i style="--tx:' + (Math.cos(a) * r).toFixed(1) + "px;--ty:" + (Math.sin(a) * r).toFixed(1) +
      "px;background:" + (i % 2 ? "#FDA29B" : "#F04438") + '"></i>';
  }
  b.innerHTML = html;
  btn.appendChild(b);
  setTimeout(function () {
    if (b.parentNode) b.parentNode.removeChild(b);
    btn.classList.remove("pop");
  }, 620);
}

/* ---------- a one line answer, when there is nowhere to go ---------- */
var toastT = null;
function toast(msg) {
  var host = el("toastHost");
  host.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>";
  var t = host.firstChild;
  /* a frame, so the start state commits before the class flips it */
  requestAnimationFrame(function () { t.classList.add("on"); });
  clearTimeout(toastT);
  toastT = setTimeout(function () {
    t.classList.remove("on");
    setTimeout(function () { if (host.firstChild === t) host.innerHTML = ""; }, 220);
  }, 3600);
}

/* ---------- saving ---------- */
function showSaving() {
  el("savingHost").innerHTML = '<div class="saving"><div class="box"><div class="spin"></div>' +
    "<b>" + (EDITING ? "Saving your changes" : "Saving your meal") + "</b><span>" + count() + " items into " +
      DIV_LABEL[divisionForTime(S.time)] + "</span></div></div>";
}
/* Which target this meal pushed hardest, so the overlay can name it rather
   than congratulating the user for nothing in particular. */
function movedMost() {
  var t = { p: 0, c: 0, f: 0, fibre: 0 };
  S.items.forEach(function (it) {
    var fd = byId(it.id); if (!fd) return;
    t.p += fd.p * it.qty; t.c += fd.c * it.qty; t.f += fd.f * it.qty; t.fibre += fd.fibre * it.qty;
  });
  /* against a rough daily target each, so grams of carbs do not always win */
  var per = { p: t.p / 94, c: t.c / 236, f: t.f / 62, fibre: t.fibre / 30 };
  var NAME = { p: "Protein", c: "Carbs", f: "Fats", fibre: "Fibre" };
  var top = Object.keys(per).sort(function (a, b) { return per[b] - per[a]; })[0];
  return { name: NAME[top], share: per[top] };
}

/* what the win says: the gain, the macro that moved most, and where it went */
function winFacts(queued) {
  var m = movedMost();
  return { m: m, queued: queued,
    /* a plausible move on a 0 to 100 score, from what actually went in */
    d: Math.max(1, Math.min(12, Math.round(m.share * 34))),
    moved: queued ? "Saved on your phone" : m.name + " moved most",
    sub: count() + " into " + DIV_LABEL[divisionForTime(S.time)] + (queued ? ", it sends when you are back" : ""),
    /* the detail the win screen layouts can use: grams per macro, the meal, and what went in */
    meal: DIV_LABEL[divisionForTime(S.time)], n: count(), key: { Protein: "p", Carbs: "c", Fats: "f", Fibre: "fibre" }[m.name],
    names: S.items.map(function (it) { return byId(it.id).name; }),
    lines: S.items.map(function (it) { var fd = byId(it.id); return { name: fd.name, kcal: Math.round(fd.kcal * it.qty) }; }),
    kcal: kcalTotal(),
    g: S.items.reduce(function (t, it) { var fd = byId(it.id); if (fd) ["p", "c", "f", "fibre"].forEach(function (k) { t[k] += fd[k] * it.qty; }); return t; },
      { p: 0, c: 0, f: 0, fibre: 0 }) };
}
function showWon(queued) {
  var f = winFacts(queued), m = f.m, d = f.d;
  try { sessionStorage.setItem("gfLogged", String(d)); } catch (e) {}
  /* clock angle, travel, kind and colour, read off the design system frame.
     Dots and arcs alternate and the arcs stay closer in. */
  var PIECES = [
    [-90, 86, "dot", "#FFB127"], [-150, 70, "arc", "#FF84B3"], [-30, 70, "arc", "#F97316"],
    [-20, 90, "dot", "#66BEFF"], [180, 88, "dot", "#FF5994"], [40, 90, "dot", "#C495FF"],
    [120, 84, "dot", "#69B7FF"], [150, 68, "arc", "#FFB2F0"], [70, 68, "arc", "#F97316"]
  ];
  var burst = PIECES.map(function (p, i) {
    return '<span class="p ' + p[2] + '" style="--a:' + p[0] + 'deg;--d:' + p[1] + 'px;' +
      (p[2] === "dot" ? "background:" : "color:") + p[3] + ";animation-delay:" + (260 + i * 12) + 'ms"></span>';
  }).join("");

  el("savingHost").innerHTML =
    '<div class="won" role="status">' +
      '<span class="halo" aria-hidden="true"></span>' +
      '<div class="col2"><span class="burstrow"><span class="burst">' +
        '<span class="tk"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>' + burst +
      '</span></span>' +
      '<div class="d">+<b id="wonN">0</b><s> points</s></div>' +
      '<p>' + (queued ? "Saved on your phone" : m.name + " moved most") + '</p>' +
      '<span class="m">' + count() + " into " + DIV_LABEL[divisionForTime(S.time)] +
        (queued ? ", it sends when you are back" : "") + '</span></div>' +
    '</div>';

  /* the number counts up rather than appearing, which the system asks for */
  var nEl = document.getElementById("wonN"), t0 = null;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { nEl.textContent = d; }
  else requestAnimationFrame(function step(ts) {
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0) / 620);
    nEl.textContent = Math.round(d * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  });
  /* long enough to read, short enough that nobody reaches for a button */
  setTimeout(goEat, 1700);
}

/* Back to the day, which is the screen that already holds everything else
   this log changed. */
function goEat() {
  if (window.parent !== window) {
    parent.postMessage({ nav: "eat", flags: { items: count(), kcal: kcalTotal() } }, "*");
    return;
  }
  location.href = "eat.html";
}

function save() {
  if (!count()) return;
  /* the win moment (assets/win-moment.js) starts on the tap and covers the
     save; without it, or for the classic overlay, the spinner does */
  var ctl = window.WinMoment && WinMoment.begin(el("saveBtn").getBoundingClientRect(),
    S.items.map(function (it) { return byId(it.id).name; }));
  var finish = function (queued) {
    if (!ctl) return showWon(queued);
    var f = winFacts(queued);
    try { sessionStorage.setItem("gfLogged", String(f.d)); } catch (e) {}
    ctl.win(f, goEat);
  };
  if (!ctl) showSaving();
  if (S.banner === "offline") { setTimeout(function () { finish(true); }, 900); return; }
  setTimeout(function () {
    if (STATE === "failed") { if (ctl) ctl.cancel(); el("savingHost").innerHTML = ""; S.banner = "failed"; render(); return; }
    finish(false);
  }, 1100);
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var t = e.target;
  var hit = function (sel) { return t.closest(sel); };

  var inc = hit("[data-inc]"); if (inc) return bump(inc.getAttribute("data-inc"), 1, inc);
  var dec = hit("[data-dec]"); if (dec) return bump(dec.getAttribute("data-dec"), -1);
  var rm = hit("[data-rm]"); if (rm) { S.items = S.items.filter(function (x) { return x.id !== rm.getAttribute("data-rm"); }); return render(); }
  var fav = hit("[data-fav]"); if (fav) {
    var id = fav.getAttribute("data-fav");
    var liking = S.fav.indexOf(id) === -1;
    S.fav = liking ? S.fav.concat(id) : S.fav.filter(function (x) { return x !== id; });
    render();
    /* the row is rebuilt by then, so the burst goes on the heart that came back */
    if (liking) heartBurst(document.querySelector('[data-fav="' + id + '"]'));
    return;
  }
  var tab = hit("[data-tab]"); if (tab) { S.tab = tab.getAttribute("data-tab"); return render(); }
  var opt = hit("[data-opt]"); if (opt) { S.option = +opt.getAttribute("data-opt"); return render(); }
  var pl = hit("[data-plan]"); if (pl) {
    var parts = pl.getAttribute("data-plan").split(":"), pid = parts[0], want = +parts[1];
    return addAt(pid, want, pl);
  }
  if (hit("#tallyBtn")) return openSheet({ kind: "tray" });
  var qty = hit("[data-qty]"); if (qty) { var qid = qty.getAttribute("data-qty"); return openSheet({ kind: "qty", id: qid, qty: qtyOf(qid) || 1 }); }
  var nameHit = hit(".row .nm"); if (nameHit) {
    var row = nameHit.closest("[data-food]");
    if (row) { var fid = row.getAttribute("data-food"); return openSheet({ kind: "qty", id: fid, qty: qtyOf(fid) || 1 }); }
  }
  var tm = hit("[data-time]"); if (tm) {
    var mins = +tm.getAttribute("data-time");
    /* with the wheel up, a chip winds it to that time rather than jumping past it */
    if (WHEEL) return setWheelTime(mins);
    S.time = mins; return render();
  }
  var ef = hit("[data-editfound]"); if (ef) {
    var fp = ef.getAttribute("data-editfound").split(":");
    return openSheet({ kind: "qty", id: fp[0], qty: +fp[1] || 1 });
  }

  switch (t.closest("button") && t.closest("button").id) {
    case "sX": case "tDone": return closeSheet();
    case "clearQ": S.query = ""; el("q").value = ""; return render();
    case "snapBtn": return openSheet({ kind: "snap", step: "frame" });
    case "voiceBtn": return runVoice();
    /* The tab opens her logger, which carries BOTH doors in its own composer:
       a Snap pill at the foot left and a mic at the foot right. So the line
       promising voice or snap is honest, and neither route is lost. */
    case "kstripBtn": return openKairaLog();
    case "shoot": S.sheet = { kind: "snap", step: "reading" }; render();
      return setTimeout(function () { S.sheet = { kind: "snap", step: "result" }; render(); }, 1900);
    case "retake": S.sheet = { kind: "snap", step: "frame" }; return render();
    case "retakeVoice": return runVoice();
    case "stopVoice": return closeSheet();
    case "toSearch": closeSheet(); return el("q").focus();
    /* in the app this opens Kaira on the logging thread with the search text
       already in it. The prototype stops here rather than faking a chat. */
    case "kairaLog": return toast("Kaira opens here with \u201c" + S.query +
      "\u201d ready to describe. This is a prototype, so it stops here.");
    /* in the app this fires the platform settings intent. In the prototype it
       says so, rather than being a full width primary that does nothing. */
    case "toSettings": return toast("In the app this opens your phone's settings for GoodFlip. This is a prototype, so it stops here.");
    case "acceptFound": return acceptFound();
    case "qSave": return saveQty();
    case "qPlus": return bump(S.sheet.id, 1);
    /* Minus at one takes the item back out and the bar returns to "Add to
       meal", in place, with the sheet still open. It used to close the sheet,
       which punished a mis-tap by throwing the user out of the thing they
       were in. Add and remove are now the same gesture in both directions. */
    case "qMinus": return bump(S.sheet.id, -1);
    case "retry": S.banner = null; return save();
    case "saveBtn": return save();
    case "back": return history.length > 1 ? history.back() : null;
  }

  if (t.classList && t.classList.contains("unit")) {
    [].forEach.call(document.querySelectorAll(".unit"), function (u) { u.classList.remove("on"); });
    t.classList.add("on");
  }
  if (t === el("scrim")) closeSheet();
});

/* The bar stands down while you are reading the list and comes back the moment
   you head up. Two guards keep it from flickering: it only reacts to a real
   move of 6px or more, so a thumb resting on the list does nothing, and the
   two thresholds are different, 40 down to collapse but any upward move to
   restore, so a reader hovering around one number cannot make it flap. */
function watchScroll() {
  var list = document.getElementById("list");
  var srch = document.querySelector(".srch");
  if (!list || !srch) return;
  /* The block is worth 90px, and handing that back to the list can remove the
     very overflow that let it scroll. On a short list the browser then clamps
     scrollTop to 0, this handler reads the clamp as a scroll upward, restores
     the bar, the overflow returns, and the two fight each other: the list
     appears frozen at the top. So it only stands down when the list will
     still have room to scroll without it. */
  var RESERVE = 90;
  var last = 0, away = false, lock = false, lockT = null;
  list.addEventListener("scroll", function () {
    if (lock) return;
    var y = list.scrollTop, d = y - last;
    if (Math.abs(d) < 4) return;
    var room = list.scrollHeight - list.clientHeight + (away ? RESERVE : 0);
    if (room <= RESERVE + 8) {
      if (away) { away = false; list.classList.remove("x");
        document.querySelector(".srch").classList.remove("away");
        document.body.classList.remove("findup"); }
      last = y; return;
    }
    /* Down past 12 puts it away. Once away it STAYS away until the list is
       back at the top, or until the glyph is tapped. Restoring on any upward
       flick meant the bar reappeared every time somebody nudged back a row to
       re-read something, and a control that comes and goes under the reading
       is worse than one that simply waits. */
    var want = away ? y > 6 : (y > 12 && d > 0);
    if (want !== away) {
      away = want;
      srch.classList.toggle("away", away);
      document.body.classList.toggle("findup", away);
      /* the field cannot hold focus once it is not on screen */
      if (away) { var q = document.getElementById("q"); if (q) q.blur(); }
      /* Collapsing changes the list's height, and the browser answers that
         with a scroll event of its own. Read as a gesture it looks like the
         opposite direction, which flips the bar straight back. Ignoring the
         next 420ms, the length of the transition, lets the layout settle
         before this listens again. */
      lock = true;
      clearTimeout(lockT);
      lockT = setTimeout(function () { lock = false; last = list.scrollTop; }, 420);
    }
    last = y;
  }, { passive: true });
  /* Tapping the glyph is a request for the field, so it brings the whole
     block back and puts the cursor in it rather than only scrolling. */
  var find = document.getElementById("hFind");
  if (find) find.addEventListener("click", function () {
    list.scrollTop = 0;
    away = false; last = 0;
    srch.classList.remove("away");
    document.body.classList.remove("findup");
    var q = document.getElementById("q");
    if (q) setTimeout(function () { q.focus(); }, 260);
  });
}

/* Her logger, as the product builds it. The sample exchange is permanent: it
   sits above every real message rather than being a first-run state, because
   the one thing a blank chat cannot do is teach you what to type into it. */
function openKairaLog() {
  var el = document.getElementById("klog");
  if (!el) {
    el = document.createElement("div");
    el.id = "klog";
    el.className = "klog";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.innerHTML =
      '<div class="klog-hd"><div class="klog-bar">' +
        '<button class="klog-burger" aria-label="Open menu"><i></i><i></i><i></i></button>' +
        '<div class="klog-pill"><span>Kaira AI</span></div>' +
        '<button class="klog-x" id="klogX" aria-label="Close">' + I.kx + '</button>' +
      '</div></div>' +
      '<div class="klog-body">' +
        '<img class="klog-bg" src="../icons/kaira-chat-bg.svg" alt="" aria-hidden="true">' +
        '<div class="klog-in"><div class="klog-row">' +
          /* 32px, and flat: the sample mark does not carry the halo */
          GFKaira.mark(32, { halo: false }) +
          '<div class="klog-col">' +
            '<div class="klog-say">Hey! Just let me know what you ate and when, and I’ll log it for you</div>' +
            '<hr class="klog-rule">' +
            '<div class="klog-lab">Sample log:</div>' +
            '<div class="klog-say klog-eg">I had <b>1 plate</b> <b>poha</b> at <u>8AM</u></div>' +
            '<hr class="klog-rule">' +
          '</div></div></div>' +
      '</div>' +
      '<div class="klog-foot"><div class="klog-sheet"><span class="klog-seam"></span>' +
        '<textarea class="klog-ta" rows="1" placeholder="I had [quantity] of [food] at [time]"></textarea>' +
        '<div class="klog-acts">' +
          '<button class="klog-snap">' + I.kcam + 'Snap</button>' +
          '<div class="klog-right"><button class="klog-mic" aria-label="Voice input">' + I.kmic + '</button></div>' +
        '</div></div></div>';
    document.querySelector(".col").appendChild(el);
    el.querySelector("#klogX").onclick = function () { el.classList.remove("on"); };
  }
  var bar = document.querySelector(".gf-status");
  el.style.setProperty("--klog-top", (bar ? bar.getBoundingClientRect().height : 0) + "px");
  setTimeout(function () { el.classList.add("on"); }, 16);
  return el;
}

function runVoice() {
  S.sheet = { kind: "voice", step: "listening" }; render();
  setTimeout(function () { S.sheet = { kind: "voice", step: "heard" }; render(); }, 1800);
  setTimeout(function () { S.sheet = { kind: "voice", step: "result" }; render(); }, 3000);
}
function acceptFound() {
  var rows = S.sheet.kind === "snap"
    ? [{ id: "poha", qty: 1 }, { id: "eggs", qty: 2 }, { id: "chai", qty: 1 }]
    : [{ id: "eggs", qty: 2 }, { id: "poha", qty: 1 }, { id: "chai", qty: 1 }];
  rows.forEach(function (r) {
    var at = S.items.filter(function (x) { return x.id === r.id; })[0];
    if (at) at.qty += r.qty; else S.items = S.items.concat({ id: r.id, qty: r.qty });
  });
  closeSheet();
}
/* The unit carries the count, so "2" alone never has to be guessed at. The
   helping is written as "1 bowl", so the number comes off the front and the
   noun takes an s when there is more than one. */
function unitPlural(unit, n) {
  var noun = String(unit).replace(/^\s*[\d.]+\s*/, "") || "serving";
  if (n <= 1) return noun;
  return /s$/.test(noun) ? noun : noun + "s";
}

function saveQty() {
  var id = S.sheet.id, q2 = S.sheet.qty || 1;
  var at = S.items.filter(function (x) { return x.id === id; })[0];
  if (at) at.qty = q2; else S.items = S.items.concat({ id: id, qty: q2 });
  /* A coach's food is a confirmation, so the sheet has done its job and goes.
     Anything else stays open, because the quantity control is the thing that
     replaces the button and adjusting it is the likely next move. */
  if (S.sheet.plan) return closeSheet();
  LASTADD = id;
  render();
}

el("q").addEventListener("input", function (e) { S.query = e.target.value; render(); });
el("timeBtn").addEventListener("click", function () { openSheet({ kind: "time" }); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

/* ---------- the review picker ---------- */
(function () {
  var states = ["search", "typing", "noresults", "quantity", "multi", "plan", "noplan", "time",
    "snap", "snapreading", "snapresult", "snapnone", "snapdenied",
    "voice", "voiceheard", "voiceresult", "voicenone", "voicedenied",
    "saving", "offline", "failed"];
  /* the strip is for reviewing states, so it stays out of the way unless asked for */
  if (Q.get("picker") !== "1") { document.body.classList.add("nopicker"); return; }
  document.body.classList.add("haspicker");
  el("picker").innerHTML = states.map(function (s) {
    return '<a href="?state=' + s + (ENTRY !== "plus" ? "&entry=" + ENTRY : "") + '"' + (s === STATE ? ' class="on"' : "") + ">" + s + "</a>";
  }).join("");
})();

el("q").value = S.query;
render();
watchScroll();
if (p.saving) showSaving();
</script>
