<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquid Score, intros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="glyph-masks.css">
<style>
  :root { --paper: #fcfcfb; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #ebe9e6; display: grid; place-items: center; overflow: hidden;
    font-family: Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: var(--paper);
    touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
  @media (min-width: 520px) {
    .stage { width: auto; height: min(874px, calc(100dvh - 64px)); aspect-ratio: 402 / 874; border-radius: 54px;
      box-shadow: 0 0 0 11px #121216, 0 0 0 12px #3b3b42, 0 50px 90px -30px rgba(30, 40, 50, .45); }
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .score { position: absolute; left: 0; top: 0; color: var(--ink, #fff); text-align: center; pointer-events: none; transition: color .6s;
    opacity: 0; will-change: transform, opacity, filter; }
  .score .num { font: 500 36px/1 Roboto, sans-serif; letter-spacing: -.03em;
    margin: 0; text-shadow: var(--ink-shadow, none); transition: text-shadow .6s; font-variant-numeric: tabular-nums; }
  .score .num i { font-style: normal; font-weight: 400; font-size: .4em; vertical-align: .95em; margin-left: 2px; }
  .score .word { font: 400 14px/1 Roboto, sans-serif; letter-spacing: .01em; opacity: .92; margin-top: 2px; }
  /* status tags, from the GoodFlip Figma chips (node 6875:9957): 22px tall, 8px radius, 8px side padding, 12px text,
     1px inside border drawn as a gradient layer behind the fill */
  .tag { position: absolute; left: 0; top: 0; height: 22px; padding: 0 8px; border-radius: 8px; opacity: 0; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; font: 400 12px/1 Roboto, sans-serif; cursor: pointer;
    border: 1px solid transparent; color: var(--t-ink); background: var(--t-fill) padding-box, var(--t-line) border-box; }
  /* Solid Day, exact from Solid-day.svg: diagonal fill tinted at two corners; angular border with two dark sweeps.
     Figma stretches the angular gradient to the 68×22 box, so its stops are re-projected into CSS conic angles */
  .tag[data-s="solid"]     { --t-ink: #039855;
    --t-fill: linear-gradient(112.36deg, #d1fadf 3%, #ecfdf3 20.1%, #ecfdf3 79.9%, #d1fadf 94.4%);
    --t-line: conic-gradient(from 90deg, #32d583 0deg, #039855 11.51deg, #32d583 36.77deg, #32d583 175.4deg, #039855 193.58deg, #32d583 224.26deg, #32d583 360deg); }
  /* the rest share Solid Day's structure, each re-projected for its own width (98, 106 and 115 × 22) */
  .tag[data-s="grow"]      { --t-ink: #dc6803;
    --t-fill: linear-gradient(120.65deg, #fef0c7 3%, #fffaeb 20.1%, #fffaeb 79.8%, #fef0c7 94.3%);
    --t-line: conic-gradient(from 90deg, #fdb022 0deg, #dc6803 8.04deg, #fdb022 27.41deg, #fdb022 176.8deg, #dc6803 189.51deg, #fdb022 214.06deg, #fdb022 360deg); }
  .tag[data-s="attention"] { --t-ink: #d92d20;
    --t-fill: linear-gradient(122.66deg, #fee4e2 3%, #fef3f2 20.1%, #fef3f2 79.8%, #fee4e2 94.3%);
    --t-line: conic-gradient(from 90deg, #f97066 0deg, #d92d20 7.44deg, #f97066 25.61deg, #f97066 177.04deg, #d92d20 188.81deg, #f97066 212.01deg, #f97066 360deg); }
  .tag[data-s="none"], .tag[data-s="gathering"], .tag[data-s="log"] { --t-ink: #667085;
    --t-fill: linear-gradient(124.82deg, #f2f4f7 3%, #f9fafb 20.1%, #f9fafb 79.8%, #f2f4f7 94.3%);
    --t-line: conic-gradient(from 90deg, #f2f4f7 0deg, #e4e7ec 6.87deg, #f2f4f7 23.84deg, #f2f4f7 177.28deg, #e4e7ec 188.13deg, #f2f4f7 209.95deg, #f2f4f7 360deg); }
  /* Figma sets Roboto a touch wider than browsers, so pin each chip to its Figma width */
  .tag { justify-content: center; }
  .tag[data-s="solid"] { width: 68px; }
  .tag[data-s="grow"] { width: 98px; }
  .tag[data-s="attention"] { width: 106px; }
  .tag[data-s="none"] { width: 115px; }
  .tag .spin { display: none; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #e4e7ec; border-top-color: #475467;
    animation: spin 1s linear infinite; }
  .tag[data-s="gathering"] .spin { display: block; }
  @keyframes spin { to { rotate: 360deg; } }
  .end { position: absolute; left: 0; top: 0; color: #7a7f8c; font: 400 14px/1 Roboto, sans-serif;
    pointer-events: none; opacity: 0; font-variant-numeric: tabular-nums; }
  /* bottom bar: replay and the variant sheet */
  .bar { position: absolute; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex;
    justify-content: center; gap: 8px; opacity: 0; }
  .bar button { font: 500 14px/1 Roboto, sans-serif; color: #475467; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    background: rgba(255, 255, 255, .75); border: 1px solid #e4e7ec; }
  .bar button:focus-visible, .sheet button:focus-visible { outline: 2px solid #12b76a; outline-offset: 2px; }

  /* ---- what shaped the score: the macro card from the Eat prototype (v7/r3/eat.html) ----
     each glyph is a vessel that fills to its own level; the fill is a gradient stop driven by --f */
  @property --bob { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
  .shaped { position: absolute; left: 16px; right: 16px; top: 0; opacity: 0; }
  .shaped h2 { margin: 0 0 12px; font: 500 16px/24px Roboto, sans-serif; color: #101828; }
  /* light indigo ground (in-50), as on the Eat card; the outline is lightened toward it so it stays an even hairline */
  .mcard { border-radius: 16px; background: #eef4ff; --out: #b4bcc9; }
  .mgrid { display: flex; justify-content: space-between; gap: 8px; padding: 16px 16px 14px; }
  .m { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  /* a soft neutral ellipse under each vessel, so it stands on the card */
  .m::before { content: ""; position: absolute; top: 37px; left: 50%; width: 26px; height: 7px; transform: translateX(-50%);
    border-radius: 999px; background: radial-gradient(closest-side, rgba(16, 24, 40, .16), rgba(16, 24, 40, .05) 62%, transparent); }
  /* a hairline round each vessel: eight zero-blur drop shadows, on the wrapper because filter runs before mask */
  .gwrap { position: relative; width: 40px; height: 40px;
    filter: drop-shadow(.5px 0 0 var(--out)) drop-shadow(-.5px 0 0 var(--out)) drop-shadow(0 .5px 0 var(--out)) drop-shadow(0 -.5px 0 var(--out))
      drop-shadow(.5px .5px 0 var(--out)) drop-shadow(-.5px .5px 0 var(--out)) drop-shadow(.5px -.5px 0 var(--out)) drop-shadow(-.5px -.5px 0 var(--out)); }
  /* liquid, not a block: deep at the base, lighter as it rises, brightest at the surface */
  .gfill { position: absolute; inset: 0; --f: 0%;
    background:
      radial-gradient(118% 76% at 27% 16%, rgba(255, 255, 255, .34), transparent 58%),
      linear-gradient(to top, var(--l0) 0%, var(--l1) calc((var(--f) + var(--bob)) * .34), var(--l2) calc((var(--f) + var(--bob)) * .72),
        var(--l3) calc(var(--f) + var(--bob) - 6%), var(--l4) calc(var(--f) + var(--bob) - 1.5%), var(--e0) calc(var(--f) + var(--bob)), var(--e1) 100%); }
  .gfill.glyph-fats { -webkit-mask-size: auto 80%; mask-size: auto 80%; }
  .gfill.glyph-fibre { -webkit-mask-size: auto 84%; mask-size: auto 84%; }
  .mtext { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mval { font: 400 14px/18px Roboto, sans-serif; white-space: nowrap; color: #667085; font-variant-numeric: tabular-nums; }
  .mval strong { font-weight: 700; color: #101828; }
  .mname { font: 400 12px/16px Roboto, sans-serif; color: #667085; }
  .cal { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; border-top: 1px solid rgba(16, 24, 40, .06);
    font: 400 14px/20px Roboto, sans-serif; color: #667085; font-variant-numeric: tabular-nums; }
  .cal b { color: #101828; font-weight: 700; }
  /* fill variants: none are indigo */
  .mcard[data-v="graphite"] { --l0: #344054; --l1: #475467; --l2: #5d6b80; --l3: #7e8a9c; --l4: #c3cad5; --e0: #c4cbd6; --e1: #d3d9e2; }
  .mcard[data-v="orb"]      { --l0: #05603a; --l1: #039855; --l2: #12b76a; --l3: #32d583; --l4: #6ce9a6; --e0: #c4cbd6; --e1: #d3d9e2; }
  .mcard[data-v="glass"]    { --l0: #12b76a; --l1: #32d583; --l2: #6ce9a6; --l3: #a6f4c5; --l4: #ecfdf3; --e0: #c4cbd6; --e1: #d3d9e2; }
  .mcard[data-v="sage"]     { --l0: #2f3b34; --l1: #43564b; --l2: #5e7568; --l3: #8fa398; --l4: #c5d3ca; --e0: #c4cbd6; --e1: #d3d9e2; }
  /* Glass keeps its waterline moving, a slow swell each vessel takes in turn */
  .mcard[data-v="glass"] .gfill { animation: bob 3.4s ease-in-out infinite; }
  .mcard[data-v="glass"] .m:nth-child(2) .gfill { animation-delay: -.85s; }
  .mcard[data-v="glass"] .m:nth-child(3) .gfill { animation-delay: -1.7s; }
  .mcard[data-v="glass"] .m:nth-child(4) .gfill { animation-delay: -2.55s; }
  @keyframes bob { 0%, 100% { --bob: -1.6%; } 50% { --bob: 1.6%; } }

  /* variant sheet: title top left, circle X top right, no drag handle, at most 90% tall */
  .scrim { position: absolute; inset: 0; background: rgba(16, 24, 40, .28); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%; overflow-y: auto; background: #fff;
    border-radius: 24px 24px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
  .stage.sheet-open .scrim { opacity: 1; pointer-events: auto; }
  .stage.sheet-open .sheet { transform: none; }
  .sheet header { display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 { margin: 0; font: 500 18px/24px Roboto, sans-serif; color: #101828; }
  .sheet .x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #f2f4f7; color: #475467; display: grid; place-items: center; cursor: pointer; }
  .sheet h3 { margin: 20px 0 8px; font: 500 12px/16px Roboto, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #667085; }
  .macro { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    pointer-events: none; opacity: 0; color: #1d4d38; transition: color .5s; font-variant-numeric: tabular-nums; }
  .macro i { width: 14px; height: 14px; background: #039855; transition: background .5s; }
  .macro b { font: 500 14px/1 Roboto, sans-serif; }
  .macro span { font: 400 12px/1 Roboto, sans-serif; color: #6b7a72; transition: transform .5s; }
  .in-drop .macro { color: #fff; }
  .in-drop .macro i { background: #fff; }
  .in-drop .macro b { text-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  .in-drop .macro span { transform: translateY(24px); }
  .slot { display: inline-flex; }
  .slot .col { height: 1em; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); }
  .slot .strip { display: flex; flex-direction: column; will-change: transform; }
  .slot .strip span { height: 1em; }
  .variants { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .variants button { padding: 11px 8px; border-radius: 12px; border: 1px solid #e4e7ec; background: #fff; cursor: pointer;
    color: #475467; font: 500 14px/1 Roboto, sans-serif; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
  .variants button[aria-pressed="true"] { border-color: #32d583; background: #ecfdf3; color: #05603a; }
  /* embedded as a hero (?embed=1): no phone, no card, no controls, just the score on white */
  .embed, .embed body { background: transparent; display: block; }
  .embed .stage { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; aspect-ratio: auto; background: transparent; cursor: default; }
  .embed .shaped, .embed .bar, .embed .sheet, .embed .scrim { display: none; }
  .embed .tag { pointer-events: none; }
  /* locked (no plan yet): the padlock takes the number's place, and there is no number, word or tag */
  .lock { display: none; width: 76px; height: 76px; margin: 0 auto; }
  .locked .score .num, .locked .score .word, .locked .tag { display: none; }
  .locked .lock { display: block; }
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="85 percent Sufficient, Solid Day">
  <canvas id="ln"></canvas>
  <canvas id="c"></canvas>
  <div class="score" id="score" aria-hidden="true">
    <div class="num"><span class="slot" id="n"></span><i>%</i></div>
    <div class="word">Sufficient</div>
    <div class="lock" id="lock"></div>
  </div>
  <div class="tag" id="tag" data-s="solid"><span id="tagText">Solid Day</span><i class="spin"></i></div>
  <div id="macros" aria-hidden="true"></div>
  <div class="end" id="lo">0</div>
  <div class="end" id="hi">100</div>
  <section class="shaped" id="shaped" aria-label="What shaped your score">
    <h2>What shaped your score?</h2>
    <div class="mcard" id="mcard" data-v="graphite">
      <div class="mgrid" id="mgrid"></div>
      <div class="cal"><span>Calories</span><span><b id="calNow">0</b> of 1,900 kcal</span></div>
    </div>
  </section>
  <div class="bar" id="bar">
    <button id="replay">Play again</button>
    <button id="openSheet" aria-haspopup="dialog">Variants</button>
  </div>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle">Variants</h2>
      <button class="x" id="closeSheet" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button>
    </header>
    <h3>Score</h3>
    <div class="variants" id="variants" role="group" aria-label="Score variant"></div>
    <h3>Macro card</h3>
    <div class="variants" id="cardVariants" role="group" aria-label="Macro card variant"></div>
  </section>
</main>

<script>
// INTROS: Cloud Drop with a different way in, picked by ?intro=. Every one is built from the shader's own
// liquid (its smooth union merges droplets the way water does) and the real orb artwork, and every one lands
// on Cloud Drop's rest unchanged: the fill, the number, the tag, the idle.
//   murmuration  droplets and orbs spiral in from every side and pool into the bubble (the default)
//   feed         the orbs come first, round the arc, and each sends a droplet in to make the bubble
// and five that add drawn lines, on a 2D layer under the glass so the bubble covers what it takes in:
//   ribbons      three silk ribbons, twisting, spiral in and wrap the bubble; an orb rides each tip
//   topo         contour lines draw themselves out like a map, orbs riding them, then close onto the gauge
//   stream       streamlines bend round the growing bubble like water round a stone; orbs ride the current
//   aurora       soft curtains of light sway across the top, then pour down into the glass, dripping
//   enso         one brush stroke paints a zen circle, flicks droplets off its tail, and the circle fills
// score gauge: a 270° arc from bottom-left, clockwise over the top, to bottom-right
// ?embed=1 runs as a hero inside another screen: ?score= sets the number, ?v= the variant
const QS = new URLSearchParams(location.search), EMBED = QS.has('embed');
const WAY = QS.get('intro') || 'murmuration';
if (EMBED) document.documentElement.classList.add('embed');
// SIZE scales the whole gauge: bubble, ring, pearls, drops, labels and the text inside. Embedded, it is set so the
// gauge comes out at the same pixel size as the designed 874px-tall screen; S is the scale against that design
const SIZE = EMBED ? .75 * 874 / (innerHeight || 300) : .75, R0 = .112 * SIZE, S = SIZE / .75;
// numbers written into the shader always as decimals: GLSL rejects 3.6/1 and has no Infinity
const F = x => (isFinite(x) ? +x : 1).toFixed(6);
const ARC0 = 1.25 * Math.PI, SWEEP = 1.5 * Math.PI, RING = .132 * SIZE;
const P = 30, NF = 30, NS = 12, N = 1 + P + 2 + 4 + NF; // 1 big bubble, 30 score pearls, 2 tap drops, 4 macro drops, 30 flock (12 of them orbs)
// nutrition sufficiency is built from four macros; their average is the score
// v is % of target met; g is the day's target in grams
const MACROS = [{ key: 'protein', name: 'Protein', v: 92, g: 95 }, { key: 'carbs', name: 'Carbs', v: 78, g: 238 }, { key: 'fats', name: 'Fats', v: 88, g: 63 }, { key: 'fibre', name: 'Fibre', v: 82, g: 30 }];
const CAL = { goal: 1900, eaten: 1620 };
const FS = `
precision highp float;
uniform vec2 uRes, uEye, uLight;
uniform float uTime, uRc, uArm, uVivid, uSwirl, uK, uPop, uGlow, uScale, uFill, uArcIn;
uniform vec4 uB[${N}];
uniform vec3 uSA[6], uSB[6], uSG[6], uGlowC;   // skies the liquid drifts between, a green sky for streaks, glow colour
uniform float uGreenIn, uGauge, uRim, uGlowS, uEdgeAmt, uLift;
uniform vec3 uGA, uGB, uEdge;
uniform float uTide, uSeg, uRingOn, uAura, uLocal;   // uLocal: the intro stays inside the gauge's own space   // liquid level in the bubbles, gauge split into four macros, gauge visibility
uniform vec4 uMac;                    // each macro's fill so far, 0..1
const vec3 PAPER = ${EMBED ? 'vec3(1.)' : 'vec3(.988, .99, .985)'};

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p), u = f*f*(3. - 2.*f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++) { v += a*noise(p); p = m*p + vec2(3.1, 1.7); a *= .5; }
  return v;
}
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 ramp(float h, vec3 a, vec3 b, vec3 c, vec3 d, vec3 e, vec3 f){
  h = clamp(h, 0., 1.)*5.;
  vec3 k = mix(a, b, smoothstep(0., 1., h));
  k = mix(k, c, smoothstep(1., 2., h));
  k = mix(k, d, smoothstep(2., 3., h));
  k = mix(k, e, smoothstep(3., 4., h));
  return mix(k, f, smoothstep(4., 5., h));
}
vec3 skyA(float h){ return ramp(h, uSA[0], uSA[1], uSA[2], uSA[3], uSA[4], uSA[5]); }
vec3 skyB(float h){ return ramp(h, uSB[0], uSB[1], uSB[2], uSB[3], uSB[4], uSB[5]); }
vec3 skyG(float h){ return ramp(h, uSG[0], uSG[1], uSG[2], uSG[3], uSG[4], uSG[5]); }
// GoodFlip green along the gauge: brand 400 at the start to brand 600 at the end
vec3 gauge(float u){ return mix(uGA, uGB, clamp(u, 0., 1.)); }

vec3 fluid(vec2 p){
  vec2 q = p - uEye;
  float r = length(q);
  float rt = uTime - uPop;
  if (rt > 0.) q += q/max(r, 1e-3)*.02*exp(-rt*1.6)*exp(-pow((r - rt*.35)*16., 2.));
  // local: the twist and the texture are scaled to the drop, so it spirals rather than turning as a rigid disc
  float rl = r*mix(1., 3.6/${F(S)}, uLocal);
  q = rot(uSwirl*(6.5*exp(-rl*3.2) + 1.1*exp(-rl*.9)))*q;
  q *= (1. + uSwirl*.55*exp(-rl*3.5))*mix(1., 2.6/${F(S)}, uLocal);
  q += uEye;
  float t = uTime*.05;
  vec2 w1 = vec2(fbm(q*1.3 + vec2(0., t)), fbm(q*1.3 + vec2(5.2, 1.3) - t));
  vec2 w2 = vec2(fbm(q*1.5 + 2.2*w1 + vec2(1.7, 9.2) + t*1.4), fbm(q*1.5 + 2.2*w1 + vec2(8.3, 2.8) - t*.9));
  float f = fbm(q*1.2 + 2.*w2);
  float h = .5 - (q.y - uEye.y)*.95*mix(1., 2.2/${F(S)}, uLocal) + (f - .47)*1.2 + (w2.y - .47)*.4;
  h = mix(.52 + (h - .5)*.5, h, uVivid);   // soft middle of the sky while it opens
  float mv = clamp(.5 + .42*sin(uTime*.09) + (w2.x - .47)*1.8, 0., 1.);
  vec3 col = mix(skyA(h), skyB(h), mv);
  if (uGreenIn > 0.) col = mix(col, skyG(h), smoothstep(.34, .56, w1.x)*uGreenIn);   // emerald streaks
  col = mix(col, vec3(.55, .90, .80), smoothstep(.58, .74, w1.y)*.3*(1. - abs(h - .5)));
  col += .06*smoothstep(.5, .85, f);
  return mix(mix(PAPER, col, .55), col, uVivid);
}

float scene(vec2 p, out float R, out float F, out vec2 C){
  float d = 1e3; R = .1; F = 1.; C = uEye;
  for (int i = 0; i < ${N}; i++) {
    vec4 b = uB[i];
    if (b.z < 1e-4) continue;
    float di = length(p - b.xy) - b.z*(i == 0 ? uScale : 1.);
    float k = uK*clamp(b.z*12., .25, 1.);
    float h = clamp(.5 + .5*(di - d)/k, 0., 1.);   // smooth union: bubbles bud and merge like liquid
    d = mix(di, d, h) - k*h*(1. - h);
    R = mix(b.z, R, h);

    if (orbMix > .01 && pr > 0) {  // orbs rise from the bubble's edge rather than its centre, since they sit above it
      const e = mix(main.r / q.ro, 1, k), X = mix(main.x, hx, e) * 2 / A, Y = mix(main.y, hy, e) * 2;
      const sx = pr / ORB_PAD * 2 / A, sy = pr / ORB_PAD * 2;
      orbV.set([X - sx, Y + sy, 0, 0, fill,  X + sx, Y + sy, 1, 0, fill,  X - sx, Y - sy, 0, 1, fill,
                X + sx, Y + sy, 1, 0, fill,  X + sx, Y - sy, 1, 1, fill,  X - sx, Y - sy, 0, 1, fill], orbN++ * 30);
    }
  });

  // Drops: four macro bubbles bud off the main one, each holding its own liquid level
  MACROS.forEach((m, j) => {
    const tb = 6.0 + j * .15, k = eOut(seg(t, tb, tb + 1.4)), lv = m.v / 100 * prog;
    const an = QUAD[j] + .03 * Math.sin(t * .5 + j * 1.7), dr = (.2 + .004 * Math.sin(t * .8 + j)) * SIZE;
    const x = mix(main.x, main.x + Math.cos(an) * dr, k), y = mix(main.y, main.y + Math.sin(an) * dr, k);
    const rr = .038 * SIZE * eOut(seg(t, tb, tb + .7)) * quadM;
    B.set([x, y, rr, 2 + lv], (1 + P + 2 + j) * 4);
    // label: inside its drop, or in a legend row under the gauge
    const lx = mix(main.x + (j - 1.5) * .105, x, quadM), ly = mix(main.y - .3 * SIZE, y, quadM);
    const [px, py] = toPx(lx, ly), el = MAC_EL[j];
    el.style.opacity = eOut(seg(t, 7.2, 8)) * Math.max(segM, quadM);
    el.style.transform = `translate(${px}px,${py}px) translate(-50%,${quadM > .5 ? -15 : -50}px)`;
    el.children[1].textContent = Math.round(m.v * prog) + '%';
  });

  // the intro's own liquid: put() places a droplet in the shader (where it merges), sprite() draws a real orb
  const put = (j, x, y, r) => B.set([x, y, r, 1], (1 + P + 2 + 4 + j) * 4);
  const sprite = (x, y, r) => {
    if (r <= 0 || orbMix < .01 || orbN >= P + NS) return;
    const X = x * 2 / A, Y = y * 2, sx = r / ORB_PAD * 2 / A, sy = r / ORB_PAD * 2;
    orbV.set([X - sx, Y + sy, 0, 0, 1,  X + sx, Y + sy, 1, 0, 1,  X - sx, Y - sy, 0, 1, 1,
              X + sx, Y + sy, 1, 0, 1,  X + sx, Y - sy, 1, 1, 1,  X - sx, Y - sy, 0, 1, 1], orbN++ * 30);
  };
  INTROS[WAY](t, put, sprite);
  if (LINES[WAY] && !lnDone) {
    lctx.setTransform(LD, 0, 0, LD, 0, 0); lctx.clearRect(0, 0, W, H);
    if (t < 6) LINES[WAY](lctx, t); else lnDone = true;   // every line has faded by then
  }

  // tap drops glide into the bubble and merge
  drops.forEach((m, i) => {
    if (!m.r) return;
    const dx = main.x - m.x, dy = main.y - m.y, d = Math.hypot(dx, dy);
    m.v = Math.min(.35, m.v + dt * .25);
    m.x += dx / d * m.v * dt; m.y += dy / d * m.v * dt;
    if (d < main.r * .7) { m.r = 0; pulseV += .6; return; }
    B.set([m.x, m.y, m.r * eOut(seg(t, m.born, m.born + .5)), 1], (1 + P + i) * 4);
  });

  const grow = (local ? Math.min(.28 * SIZE, .44) : 1.4) * eOut(seg(t, .2, 2)), pk = seg(t, 2.4, 5.2), back = .5 * (pk + pk * pk * (3 - 2 * pk));
  gl.useProgram(pr);
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uRc, -1);   // no ink pour: every intro brings its colour in with its own liquid
  gl.uniform1f(U.uArm, 0);
  gl.uniform1f(U.uVivid, eIO(seg(t, 1.4, 3.6)));
  gl.uniform1f(U.uSwirl, eIO(seg(t, 1.2, 3.2)) * (1 - .7 * eIO(seg(t, 4, 7.5))));
  gl.uniform1f(U.uK, .045 * S);
  gl.uniform1f(U.uPop, pop);
  gl.uniform1f(U.uGlow, eIO(seg(t, 4.4, 6.8)));
  gl.uniform1f(U.uScale, 1 + pulse);
  // introSky: the bloom and pour play in these colours, then the settled bubble fades to the variant's own
  // Murmuration: the glass starts white while the flock gathers, turns green as the orbs pool into it,
  // then settles back to Cloud Drop's white; every other intro keeps Cloud Drop's green-to-white
  const iv = VARIANTS[vIdx].introSky,
    ik = !iv ? 0 : WAY === 'murmuration' ? eIO(seg(t, 1.8, 3.8)) * (1 - eIO(seg(t, 4.8, 6.8))) : 1 - eIO(seg(t, 4.6, 6.8));
  const sky = (j, off) => ik ? vCur.slice(off, off + 18).map((c, n) => mix(c, SKY[iv[j]][n], ik)) : vCur.slice(off, off + 18);
  gl.uniform3fv(U.uSA, sky(0, 0)); gl.uniform3fv(U.uSB, sky(1, 18)); gl.uniform3fv(U.uSG, vCur.slice(36, 54));
  gl.uniform3fv(U.uGlowC, vCur.slice(54, 57));
  gl.uniform1f(U.uGreenIn, vCur[57]); gl.uniform1f(U.uGauge, vCur[58]); gl.uniform1f(U.uRim, vCur[59]); gl.uniform1f(U.uGlowS, vCur[60]);
  gl.uniform3fv(U.uGA, vCur.slice(61, 64)); gl.uniform3fv(U.uGB, vCur.slice(64, 67)); gl.uniform3fv(U.uEdge, vCur.slice(67, 70));
  gl.uniform1f(U.uEdgeAmt, vCur[70]); gl.uniform1f(U.uLift, vCur[71]);
  gl.uniform1f(U.uFill, filled / 100);
  gl.uniform1f(U.uAura, vCur[76]);
  gl.uniform1f(U.uLocal, local ? 1 : 0);
  gl.uniform1f(U.uTide, tideM); gl.uniform1f(U.uSeg, segM); gl.uniform1f(U.uRingOn, ringM);
  gl.uniform4f(U.uMac, ...MACROS.map(m => m.v / 100 * prog));
  gl.uniform1f(U.uArcIn, FEED ? eIO(seg(t, .2, 1.6)) : WAY === 'topo' ? eIO(seg(t, 4.6, 5.9)) : eIO(seg(t, 5.9, 7.2)));   // Topo: the gauge takes over from the closing contours
  gl.uniform2f(U.uEye, main.x, main.y);
  gl.uniform2f(U.uLight, -.55, .835);   // fixed key light, upper left
  gl.uniform4fv(U.uB, B);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (orbTex && orbN) drawOrbs(orbN, orbMix);

  const [bx, by] = toPx(main.x, main.y);
  const op = eOut(seg(t, 6.0, 6.9));
  scoreEl.style.opacity = op;
  if (lockAnim && !lockPlayed && t > 6.1) { lockPlayed = true; if (!STILL) lockAnim.play(); }
  scoreEl.style.filter = `blur(${(1 - op) * 8}px)`;
  // number and word sit centred, then glide up as the tag arrives beneath them
  const tagP = eIO(seg(t, 8.7, 9.5));
  scoreEl.style.transform = `translate(${bx}px,${by}px) translate(-50%,-50%) scale(${(.92 + .08 * op) * (1 + pulse)})`;   // text keeps real pixel sizes, never scaled below 12px
  tagEl.style.opacity = tagP;
  // chip sits in the gauge's open gap, centred between 0 and 100
  // Text sits still: anchored to the bubble's resting seat, not its breathing, and snapped to whole pixels once it
  // has arrived. A 12px label nudged by fractions of a pixel every frame is redrawn at a new offset each time and
  // shimmers. (The seat is where main.y settles; before that the tag is not shown.)
  const seatY = Y1 * (local ? 1 : eIO(seg(t, 4.9, 6.8)));
  const [tx, ty] = toPx(main.x, seatY + Math.sin(ARC0) * .2 * SIZE - .019);
  const tx0 = Math.round(tx - tagEl.offsetWidth / 2), ty0 = Math.round(ty - tagEl.offsetHeight / 2);
  tagEl.style.transform = tagP < 1
    ? `translate(${tx0}px,${ty0 + (1 - tagP) * 6}px) scale(${.96 + .04 * tagP})`
    : `translate(${tx0}px,${ty0}px)`;
  tagEl.style.filter = tagP < 1 ? `blur(${(1 - tagP) * 3}px)` : '';
  if (FROM != null) {
    // the number counts rather than spins, and a small +n rises off it and fades
    numEl.textContent = Math.round(filled);
    const gk = seg(since, .6, 2.4);
    gainEl.style.opacity = Math.sin(Math.PI * gk);
    gainEl.style.transform = `translate(${bx}px,${by - 58 - 22 * eOut(gk)}px) translate(-50%,-50%)`;
  } else SLOT.forEach(c => {
    const x = seg(t, 6.8 + c.j * .2, 8.1 + c.j * .45), sp = Math.pow(1 - x, 3);
    c.strip.style.transform = `translateY(${-(1 - sp * (1 - x)) * c.n}em)`;
    c.strip.style.filter = sp > .02 ? `blur(${Math.min(1.2, sp * 2)}px)` : '';   // a touch of motion blur while it spins
  });
  const eo = eOut(seg(t, 7.0, 7.8));
  [[lo, ARC0], [hi, ARC0 - SWEEP]].forEach(([el, an]) => {
    const [x, y] = toPx(main.x + Math.cos(an) * .2 * SIZE, seatY + Math.sin(an) * .2 * SIZE - .02).map(Math.round);   // still, like the tag
    el.style.opacity = eo * ringM * (LOCK ? .55 : 1); el.style.transform = `translate(${Math.round(x - el.offsetWidth / 2)}px,${y}px)`;
  });
  // the card rises in under the gauge once the chip has landed, then its vessels fill in turn
  const cardP = eOut(seg(t, 9.3, 10.1));
  shaped.style.opacity = cardP;
  shaped.style.transform = `translateY(${toPx(0, Y1 + Math.sin(ARC0) * .2 * SIZE - .02)[1] + 40 + (1 - cardP) * 16}px)`;   // anchored to the gauge's resting seat, so it doesn't bob with the bubble
  CELLS.forEach((c, i) => {
    const k = eOut(seg(t, 9.9 + i * .1, 10.9 + i * .1));
    c.fill.style.setProperty('--f', (c.lvl * k).toFixed(2) + '%');
    c.num.textContent = fmt(Math.round(c.eaten * k));
  });
  calNow.textContent = fmt(Math.round(CAL.eaten * eOut(seg(t, 9.9, 11))));
  bar.style.opacity = eOut(seg(t, 10.6, 11.3));
  requestAnimationFrame(frame);
}

// taps only: no hover or pointer-follow effects, since phones have no hover
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button, .tag, .shaped, .sheet, .scrim')) return;
  const b = stage.getBoundingClientRect(), ptr = fromPx(e.clientX - b.left, e.clientY - b.top);
  const t = clock(performance.now());
  if (t < 6.8) return;
  if (Math.hypot(ptr[0] - main.x, ptr[1] - main.y) < main.r) {
    pulseV += 1.1; pop = t; navigator.vibrate?.(6);
  } else {
    const m = drops.find(d => !d.r) || drops[0];
    Object.assign(m, { x: ptr[0], y: ptr[1], r: .014 + Math.random() * .01, born: t, v: 0 });
  }
});
replay.addEventListener('click', () => reset());

let stepped = false;
const gainEl = document.createElement('div');
gainEl.textContent = FROM != null ? '+' + (SCORE - FROM) + '%' : '';   // the gain reads in %, like the score
gainEl.style.cssText = 'position:absolute;left:0;top:0;opacity:0;padding:3px 9px;border-radius:999px;background:#ECFDF3;color:#039855;font:700 13px/16px Roboto,sans-serif;pointer-events:none';
stage.append(gainEl);
reset(FROM != null || STILL ? 30 : matchMedia('(prefers-reduced-motion: reduce)').matches ? 10 : 0);
requestAnimationFrame(frame);
</script>
</body>
</html>
