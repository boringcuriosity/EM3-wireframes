<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../icons/glyph-masks.css">
<link rel="stylesheet" href="goodflip-ui.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* several blocks here are flex or grid, so hidden has to beat their display */
  [hidden] { display: none !important; }
  body { background: #FFFFFF; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.25px; color: var(--g-900); -webkit-font-smoothing: antialiased; }
  button { font: inherit; letter-spacing: inherit; color: inherit; }
  .col { position: relative; max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 88px; overflow-x: hidden;
    background: #FFFFFF; }
  .gut { padding-left: var(--gut); padding-right: var(--gut); }
  .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  /* The back arrow is its own shape, not a chevron: a stroked line with a
     flared tail. It is fill based, so it cannot wear .ico, which sets
     fill:none and stroke:currentColor and would render it invisible. */
  .backico { width: 22px; height: 22px; fill: currentColor; stroke: none; flex-shrink: 0; }
  /* one section rhythm: heading, 16 to its content, 40 to the next section */
  .sect { margin-top: 40px; }
  /* The first section under a plate with no verdict pill. The plate's canvas
     runs 32px past its own outermost dots, so clearing that dead band takes a
     negative margin rather than a small positive one.
     It has to be positioned as well as pulled up: the stage above is
     position:relative, so without a layer of its own a plain block sliding
     under it is painted over and loses its top edge. */
  .sect.tight { position: relative; z-index: 1; margin-top: -10px; }

  /* ---------------------------------------------------------------- header */
  .eatline { display: flex; align-items: center; gap: 8px; height: 52px; font-size: 14px; color: var(--g-500); }
  .eatline b { color: var(--g-900); font-weight: 600; font-size: 16px; }
  /* the tagline takes its own width, so the info mark sits right after it; the Earn chip holds the right end */
  .eatline .info { position: relative; width: 28px; height: 28px; margin: 0 0 0 -4px; flex-shrink: 0; }
  .eatline .info::after { content: ""; position: absolute; inset: -8px; }   /* still a 44px target */
  .eatline .tag { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info { width: 44px; height: 44px; margin-right: -12px; border: 0; background: none; display: grid; place-items: center;
    color: var(--g-400); cursor: pointer; border-radius: var(--r-pill); flex-shrink: 0; }
  .info:hover { color: var(--g-500); background: var(--g-100); }

  /* the day chip. The delta is grey on purpose, never green.
     When there is no comparison yet, .solo centres the pill so the row
     does not read as empty on the right. */
  .dateline { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; }
  .dateline.solo { justify-content: center; }
  .dateline.solo .pill { margin-left: 0; }
  .dateline.solo .dayd { display: none; }
  .pill { display: flex; align-items: center; gap: 2px; margin-left: -12px; }
  .pill .arr { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--g-500); cursor: pointer; border-radius: var(--r-pill); }
  .pill .arr:hover:not([disabled]) { background: var(--g-50); }
  /* the arrows hug "Today": a 24px box each (just the chevron), the label's own padding trimmed,
     and a 44px target kept by an invisible ring that reaches past the box */
  .pill { margin-left: -2px; gap: 0; }
  .pill .arr { position: relative; width: 24px; }
  .pill .arr::after { content: ""; position: absolute; inset: 0 -10px; }
  .dateline .pill .lbl { padding: 0 5px; }   /* .dateline so it wins over the base .pill .lbl rule below */
  /* "Today" ends in text, whose side bearing plus the chevron's own inset left a wider gap than the calendar icon does on the left */
  #nextDay { margin-left: -6px; }   /* measured: keeps both sides equal, about 13px */
  .pill .arr[disabled] { color: var(--g-300); cursor: default; }
  .pill .lbl { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; border: 0; background: none; cursor: pointer;
    border-radius: var(--r-sm); font-size: 14px; font-weight: 600; color: var(--g-900); }
  .pill .lbl:hover { background: var(--g-50); }
  .dayd { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; color: var(--g-400); white-space: nowrap; }

  /* ------------------------------------------------------------ the stage */
  /* The plate keeps its own face. Behind it sits one wash in the verdict's
     colour, fading into white with no seam, so a poor day does not read green. */
  .stage { position: relative; overflow: hidden; padding: 8px 0 4px; --tint: rgba(152,162,179,.12); }
  .stage .tint { position: absolute; left: 50%; top: -30px; width: 520px; height: 330px; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(closest-side, var(--tint), rgba(255,255,255,0) 70%); transition: background .5s var(--ease); }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 72px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0), #fff 78%); }
  .stage.ok { --tint: rgba(18,183,106,.16); }
  .stage.warn { --tint: rgba(231,193,68,.22); }
  .stage.bad { --tint: rgba(217,45,32,.12); }
  .vwrap { position: relative; z-index: 2; display: flex; justify-content: center; margin-top: -4px; }
  .gf-verdict.flat {
    background: linear-gradient(90deg, var(--g-100), var(--g-50) 30%, var(--g-50) 70%, var(--g-100)) padding-box,
      conic-gradient(from 180deg, var(--g-300), var(--g-200) 25%, var(--g-200) 50%, var(--g-300) 75%, var(--g-200)) border-box;
    color: var(--g-600);
  }

  /* the score, at 65%: heroes still draw into 342x320, the wrapper just shows it smaller */
  #heroWrap { position: relative; z-index: 1; width: 222px; height: 208px; margin: 0 auto; }
  #hero { position: absolute; left: 0; top: 0; width: 342px; height: 320px; transform: scale(.65); transform-origin: 0 0; }
  .hero-missing { position: absolute; inset: 24px; border: 1.5px dashed var(--g-200); border-radius: var(--r-xl); display: grid; place-items: center; text-align: center; color: var(--g-400); font-size: 12px; }
  .hero-missing b { display: block; font-family: Roboto, Arial, sans-serif; font-size: 40px; color: var(--g-900); font-weight: 600; line-height: 1; margin-bottom: 8px; }

  /* ---------------------------------------------- what shaped your score */
  /* Two ways to answer the same question, picked with ?rail=.
     icons (the default) puts the four macros under the heading, so the screen
     carries one macro block instead of two. cards keeps the glass stat rail. */
  /* Figma's own 12px gap, and flex-start so a short card is never grown to
     match a tall one */
  .gf-rail { padding-bottom: 10px; gap: 12px; align-items: flex-start; }
  /* Figma floats these over hero art, so its face is white at 0.40 and the
     art shows through. Here they sit on a white page, and a translucent face
     let the conic border-box gradient print straight through the card as a
     dark wedge down the middle. So the face is opaque, which keeps the conic
     where it belongs: in the 1px border. The faint vertical shift stands in
     for the glass. */
  .gf-stat { background: linear-gradient(180deg, #FBFCFF 0%, #FFFFFF 64%) padding-box,
      conic-gradient(from 90deg, var(--g-300) 62.8%, var(--in-600) 75.1%, var(--g-300) 87.2%) border-box; }
  .gf-stat.shim-stat { background: var(--g-50); border-color: var(--g-100); box-shadow: none; }
  .gf-stat.shim-stat::before { display: none; }

  /* ---------------------------------------------------------- the macros */
  /* The calorie block below gets its presence from a flat indigo wash. This one
     is the same family, not the same trick: a white base lit from the top by a
     faint indigo wash, and a radial bloom sitting behind the glyph row, which is
     the ring designs' own device. It reads as lit rather than tinted, so it does
     not become a second flat slab under the score. */
  /* Neutral, not green and no longer indigo either. Green is the verdict
     colour, what the score and the sufficiency read are entitled to say, so
     filling four glyphs green told the user four times over that something was
     going well when all it meant was that a number had a value. Indigo said
     the same thing more quietly but still spent a family colour on a fact, and
     it sat on an indigo ground, so the vessels and the card were the same hue.
     A macro is a measurement. It is drawn in ink.
     Which ink is open: neutrals are compared in ../macro-fill-options.html
     and this is variant A, graphite, the same ramp as the type. */
  /* Variant O. The macro card and the calorie strip are one object now: one
     tinted ground, no border, no shadow, the nutrients on top and their sum in
     a footer under a hairline. Flat because the card informs rather than
     invites, which is also the house rule; across both Figma files it is
     10,388 flat surfaces to 998 lifted. */
  .macros { position: relative; border: 0; box-shadow: none; overflow: hidden;
    border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--in-50); padding: 16px; }
  .gf-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gf-h .tag { font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--g-500); background: var(--g-100); border-radius: var(--r-pill); padding: 2px 8px; }
  /* Four glyphs side by side, each one filling to its own level. The icon IS
     the gauge: no bar beside it, nothing to read twice. A hard stop inside the
     mask would look like a cut, so the waterline carries a 3px lighter band and
     the fill is animated through a registered custom property, which is the
     only way a gradient stop can transition at all. */
  @property --f { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
  /* space-between, so the first and last glyph sit exactly on the 16px the
     card is padded by. Equal columns left them 18px inside that line, which
     read as loose in the middle and tight at the ends. */
  .mgrid { position: relative; display: flex; justify-content: space-between; gap: 12px; }
  /* Two gaps, so two containers. M3 is explicit that gaps belong on the parent
     and a margin on a child is the thing to avoid, so the value and its name
     are wrapped rather than nudged: 8 from the glyph, 4 between the two lines,
     because proximity is what says they belong together. */
  .m { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; flex: 0 0 auto; }
  /* A soft ellipse on the ground under each vessel, so it sits above the card
     rather than on it. Neutral, not tinted: a coloured ellipse reads as a glow.
     It hangs off .m, not off .gwrap, because the outline filter on .gwrap
     catches its pseudo-elements too and would ring the ellipse in grey. 40px
     is the glyph box, so the shadow meets the base of the vessel. */
  .m::before { content: ""; position: absolute; top: 37px; left: 50%; width: 26px; height: 7px;
    transform: translateX(-50%); border-radius: var(--r-pill); pointer-events: none;
    background: radial-gradient(closest-side, rgba(16,24,40,.16), rgba(16,24,40,.05) 62%, rgba(16,24,40,0)); }
  .mtext { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  /* A hairline around each vessel, built from eight zero-blur drop shadows
     because a mask cannot take a stroke, and on the wrapper rather than the
     masked element because CSS applies filter before mask: on the same node
     the outline is drawn and then clipped away by its own mask. */
  .gwrap { position: relative; width: 40px; height: 40px;
    /* The shadows overlap, so an alpha here would stack into a dark ring. A
       flat colour instead, which keeps the hairline even. #B4BCC9 is the
       value this treatment was built with, in ../../liquid-score/index.html.
       FOUR points, not eight: north, south, east, west, no diagonals.
       Variant E in ../macro-stroke-options.html. The diagonal pair lands at
       .71px from centre against the cardinal pair's .5px, so it thickens the
       corners of the rim by half again and the edge reads heavier than it
       measures. Dropping it leaves the hairline lighter, and slightly open
       where a curve runs at 45 degrees, which on these rounded vessels is
       most of the outline. That softness is the point. */
    --out: #B4BCC9;
    filter: drop-shadow(.5px 0 0 var(--out)) drop-shadow(-.5px 0 0 var(--out))
      drop-shadow(0 .5px 0 var(--out)) drop-shadow(0 -.5px 0 var(--out)); }
  /* the bloom only shows when a nutrient is home, so it reads as an event */
  /* No bloom behind a nutrient that is home. The outline filter on .gwrap
     applies to everything inside it, pseudo-elements included, so a round
     bloom came back outlined as a grey disc. It was redundant anyway: a
     vessel filled to the top is already the signal that the target is met. */
  /* No cast shadow. It belonged to a white card that sat above the page; in a
     flat card it puts back the elevation the card just gave up, and on a
     tinted ground it reads as dirt rather than as lift. */

  /* The fill is liquid, not a flat block: deep at the base, lighter as it rises,
     and brightest right at the surface, which is what gives it a meniscus
     instead of a cut. The empty part carries its own faint gradient too, so the
     unfilled glyph never looks like a solid grey sticker. */
  .gfill { position: absolute; inset: 0; --f: 0%;
    background:
      radial-gradient(118% 76% at 27% 16%, rgba(255,255,255,.34), rgba(255,255,255,0) 58%),
      linear-gradient(to top,
        var(--g-900) 0%,
        var(--g-700) calc(var(--f) * .34),
        var(--g-500) calc(var(--f) * .72),
        var(--g-400) calc(var(--f) - 6%),
        var(--g-400) calc(var(--f) - 1.5%),
        #C4CBD6 var(--f),
        #D3D9E2 100%);
    transition: --f .9s var(--ease); }
  .m.done .gfill { background: linear-gradient(to top, var(--g-900), var(--g-500) 55%, var(--g-400)); }

  /* Optical balance. The four masks fill their box differently: the droplet is
     a solid tall wedge and the fibre glyph is tall and busy, so both read
     heavier than the bean and the loaf at the same nominal size. */
  /* Sized by HEIGHT, not width: `contain` lets a tall glyph reach the full box
     while a wide one stops short, which is why the droplet and the sprout read
     heavier than the bean and the loaf. Capping their height evens the row. */
  .gfill.glyph-fats { -webkit-mask-size: auto 80%; mask-size: auto 80%; }
  .gfill.glyph-fibre { -webkit-mask-size: auto 84%; mask-size: auto 84%; }
  /* no target to measure against, so the glyph is a flat silhouette, not a gauge */
  /* Grams with no target: the glyph is full, so it is drawn as a full vessel of
     the same slate liquid, deep at the base and lit from the top left, rather
     than a flat grey sticker. */
  .gfill.flat { background:
      radial-gradient(118% 76% at 27% 16%, rgba(255,255,255,.38), rgba(255,255,255,0) 58%),
      linear-gradient(to top, #1D2939 0%, #344054 30%, #475467 62%, #667085 88%, #98A2B3 100%); }
  /* Targets set and nothing logged is not a lesser state, so the glyphs are
     the same solid grey a day with no targets gets. At --g-200 they read as
     ghosts of icons, which made the card look switched off rather than
     waiting. */
  .gfill.empty { background:
      radial-gradient(118% 76% at 27% 16%, rgba(255,255,255,.4), rgba(255,255,255,0) 58%),
      linear-gradient(to top, #475467 0%, #667085 40%, #98A2B3 80%, #B9C0CC 100%); }
  /* The value and its target are one number read in two parts, so they are
     one size and only weight separates them. */
  .mval { font: 400 13px/18px Roboto, sans-serif; white-space: nowrap; letter-spacing: 0; color: var(--g-500); }
  .mval strong { font-weight: 700; color: var(--g-900); }
  .mval span { color: var(--g-500); font-weight: 400; }
  /* the same colour the Calories label carries below: both name a measure */
  .mname { font: 400 11px/16px Roboto, sans-serif; color: var(--g-500); }
  .mnote { position: relative; margin: 16px 0 0; font-size: 12px; line-height: 18px; color: var(--g-500); display: flex; gap: 8px; align-items: flex-start; }

  /* before the plan: the card explains instead of measuring */
  /* When Kaira's mark is on this card, the card is hers, so it takes her
     border and her clipped top-left corner rather than sitting in a grey
     strip that belongs to nothing. Same two-tone gradient border as .kaira
     below, same shadow, so the two read as one object in two places. */
  .macros.kcard { border: 3px solid transparent; border-radius: 0 var(--r-lg) var(--r-lg) var(--r-lg);
    background: linear-gradient(180deg, var(--in-25) 0%, #FFFFFF 46%) padding-box,
      linear-gradient(100deg, var(--in-600), var(--teal-600)) border-box; }
  .mhead { margin: -16px -16px 16px; padding: 14px 16px; display: flex; gap: 12px;
    align-items: flex-start; border-bottom: 1px solid var(--in-100); }
  .mhead h4 { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; }
  .mhead p { margin: 4px 0 0; font-size: 12px; line-height: 18px; color: var(--g-500); }

  /* ------------------------------------------------------- the calories */
  /* GoodFlip puts calories on an indigo wash with a warm flame, never on green.
     Green measures the score; this measures the budget, so it takes its own hue. */
  /* the footer of the card above, not a card of its own */
  #calstrip { width: 100%; margin-top: 0; }
  /* The per-metric card's two additions: the macro's own glyph in place of a
     line icon, and a flat bar carrying the same level the glyph fills to in
     the other variant. Indigo, because a macro is a fact and not a verdict. */
  /* the target is the quiet half of the figure, the way the drawn card sets
     a unit beside its number */
  .gf-stat .v s { text-decoration: none; font-size: 13px; font-weight: 400; color: var(--g-500); }
  .gf-stat .sg { width: 18px; height: 18px; background: var(--in-600);
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }

  /* with ?rail=icons the macros have moved up under the score heading, so this
     section is the calorie block alone: it loses the heading's 16px and keeps a
     section's worth of air above it rather than a card's 12 */
  #nutSect.calonly { margin-top: 24px; }
  #nutSect.calonly #calstrip { margin-top: 0; }
  /* One line: the label, then the sum. The bar, the "left today" and the
     frond all stand down, because the four gauges above already answer "how
     far through", and a fifth filled shape in the same ink would claim to be
     a fifth gauge by similarity when it is only a label. They stay in the DOM
     so the live repaint still finds them. */
  .calc { position: relative; display: flex; align-items: baseline; gap: 8px;
    border-radius: 0 0 var(--r-lg) var(--r-lg); background: var(--in-50);
    border-top: 1px solid var(--in-100); padding: 12px 16px; overflow: hidden; }
  .calc .wm, .calc .cb, .calc .cr { display: none; }
  .calc .ct svg { display: none; }
  /* No target means no bar and nothing on the right, so the card has no reason
     to be three rows tall. Label and figure share one line. */
  /* the frond bleeds off the right edge, so on one line the figure has to
     stop short of it rather than sit under it */
  .calc.slim { display: flex; align-items: baseline; gap: 10px; padding: 10px 44px 10px 14px; }
  .calc.slim .ch { flex: 0 0 auto; }
  .calc.slim .cv { margin-top: 0; margin-left: auto; }
  .calc.slim .wm { right: -90px; top: -58px; }
  /* Further out and higher than Figma places it. In the source the block is
     340x69 and the frond runs off the right edge; our block is shorter, so the
     same offset let too much of it sit over the number and the bar. */
  .calc .wm { position: absolute; right: -84px; top: -70px; width: 131px; height: 156px; pointer-events: none; user-select: none; }
  .calc .ch { position: relative; flex: 0 0 auto; }
  .calc .ct { font: 400 11px/16px Roboto, sans-serif; color: var(--g-500); }
  .calc .cr { font-size: 12px; line-height: 18px; color: var(--g-500); white-space: nowrap; }
  .calc .cv { position: relative; margin: 0 0 0 auto; font: 400 13px/18px Roboto, sans-serif;
    color: var(--g-500); white-space: nowrap; }
  .calc .cv b { font: 700 13px/18px Roboto, sans-serif; color: var(--g-900); }
  .calc .cb { position: relative; display: block; height: 6px; margin-top: 8px; border-radius: var(--r-pill); background: var(--in-100); overflow: hidden; }
  .calc .cb i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--in-600); transition: width .6s var(--ease); }
  .calc.over .cb i { background: var(--amber-600); }

  /* kaira */
  /* Figma draws this as the Kaira insights nudge, 4719:3057: a 3px stroke in
     her gradient at full strength, indigo #444CE7 on the left to cyan #44E7E7
     on the right, running across rather than diagonally. Ours was 2px of
     --in-200 to --teal-200, which are the 200 tints, so the edge was both
     thinner and washed out and the card read as a faint box rather than as
     hers. */
  .kaira { border-radius: 0 var(--r-lg) var(--r-lg) var(--r-lg); padding: 16px;
    box-shadow: var(--shadow-card); border: 3px solid transparent;
    background: linear-gradient(#fff, #fff) padding-box, linear-gradient(100deg, var(--in-600), var(--teal-600)) border-box; }
  .kact { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--g-100); }
  .klab { display: block; font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--g-400); }
  .kact .btns { margin-top: 8px; }
  .kaira .say { display: flex; gap: 12px; align-items: flex-start; }
  .kmark { width: 36px; height: 36px; border-radius: 9999px; background: var(--in-25); display: grid; place-items: center; flex-shrink: 0; }
  .kaira p { flex: 1; min-width: 0; margin: 0; font-size: 14px; line-height: 21px; color: var(--g-700); text-wrap: pretty; }
  .kaira p strong { color: var(--g-900); font-weight: 600; }
  .logday { width: 100%; min-height: 44px; border: 0; background: none; color: var(--brand-600); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .logday:hover { text-decoration: underline; }

  /* Before the plan: Kaira teaches and offers the two ways to log, in one card.
     Three ways to spend the vertical space, chosen with ?v=1|2|3. */
  /* the pre-plan card: one text column, the teaching in its own quiet block,
     then the two ways to log under a rule */
  .edu { padding: 16px; }
  .edu .eh { display: flex; gap: 12px; align-items: center; }
  .edu .kmark { width: 36px; height: 36px; }
  .edu h4 { margin: 0; font-size: 18px; font-weight: 600; line-height: 24px; color: var(--g-900); }
  .edu .sub { margin: 2px 0 0; font-size: 12px; line-height: 18px; color: var(--g-500); }
  .edu .btns { margin-top: 12px; }
  .edu .kact { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--g-100); }
  .elist { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .erow { display: flex; gap: 12px; align-items: flex-start; }
  /* teaching is gold's job in this system, never the brand green */
  .erow .ic { flex-shrink: 0; width: 36px; display: grid; place-items: center; margin-top: -1px; color: var(--gold-800); }
  .erow .t { font-size: 14px; line-height: 21px; color: var(--g-700); text-wrap: pretty; }
  /* v2: the two steps as one strip */
  .stepbar { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .stepbar .n { width: 22px; height: 22px; border-radius: 9999px; background: var(--g-700); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
  .stepbar .lb { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .stepbar .ln { flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--g-200), var(--g-100)); }
  .stepsub { margin: 8px 0 0; font-size: 12px; line-height: 18px; color: var(--g-500); }
  /* v3: shortest at rest, the rest one tap away */
  .more { margin-top: 12px; border-top: 1px solid var(--g-100); }
  .more summary { list-style: none; display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 600; color: var(--g-700); cursor: pointer; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary .ico { width: 16px; height: 16px; transition: transform .25s cubic-bezier(.4,0,.2,1); }
  .more[open] summary .ico { transform: rotate(180deg); }
  .more .inner { padding-bottom: 6px; }
  /* Inside the disclosure the rows were a 36px icon column carrying a 12px
     glyph, so nothing lined up with the summary above it, and the label and its
     line ran together on one line because both were inline. One 20px column,
     one left edge down the block, and the label gets a line of its own. */
  .more .elist { gap: 14px; }
  .more .erow { gap: 10px; align-items: flex-start; }
  .more .erow .ic { width: 22px; justify-items: start; margin-top: 2px; }
  .more .erow .t { display: block; }
  .more .erow .t b { display: block; font-weight: 600; color: var(--g-900); }
  .more .erow .t span { display: block; font-size: 12px; line-height: 18px; color: var(--g-500); }
  /* the lock is a caveat, not teaching, so it keeps the same column and loses
     the gold */
  .more .erow.quiet .ic { color: var(--g-400); }
  .more .erow.quiet .t { font-size: 12px; line-height: 18px; color: var(--g-500); }

  /* diary */
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 16px; gap: 12px; }
  .sec h2 { margin: 0; font: 400 14px/16.8px Roboto, sans-serif; letter-spacing: .25px; color: var(--g-900); }
  .sec span { font-size: 12px; color: var(--g-500); white-space: nowrap; }
  .intro { margin: -8px 0 16px; font-size: 12px; line-height: 18px; color: var(--g-500); }
  /* GoodFlip's repeating card, from the ring Home stack (5834:34325), retinted
     indigo: radius 24, a wash over the top 29% only, a 1px conic border with
     the accent at dead top centre fading to grey by 43 degrees each side, and
     the lighter #E4E7EC letterpress. A repeating card takes its ornament on
     the edges, never on the field, which is why there is no watermark here.
     The wash is in-25, deliberately lighter than the calorie block's in-50, so
     that block stays the anchor. */
  .meal { margin-bottom: 16px; border-radius: var(--r-xl); border: 1px solid transparent;
    box-shadow: 2px 2px 0 var(--g-200);
    background: linear-gradient(180deg, var(--in-25) 0%, #fff 29%, #fff 100%) padding-box,
      conic-gradient(from 0deg, var(--in-600) 0deg, var(--g-200) 43deg, var(--g-200) 317deg, var(--in-600) 360deg) border-box; }
  .mh { display: flex; align-items: flex-start; gap: 8px; padding: 16px 16px 16px 16px; }
  .mh .t { flex: 1; min-width: 0; }
  .mh .n { display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 22px; font-weight: 600; }
  .mh .s { font-size: 12px; line-height: 18px; color: var(--g-500); margin-top: 2px; }
  /* Outlined, not filled. GoodFlip's repeating cards carry a filled green disc,
     but ours would sit inches from the filled green tick on every food row and
     the two would read as the same control. The outline keeps it green without
     that collision, and keeps six of them off the page as solid marks. */
  .plus { width: 44px; height: 44px; margin: -6px -6px -6px 0; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .plus i { width: 26px; height: 26px; border-radius: 9999px; border: 1.5px solid var(--brand-600); background: #fff; color: var(--brand-600); display: grid; place-items: center; }
  .plus:hover i { background: var(--brand-50); }
  /* no coach plan: the square plus the rest of the logging doors use, not the plan card's circle */
  .plus.sq i { width: auto; height: auto; border: 0; border-radius: 6px; background: none; }
  .plus.sq:hover i { background: var(--brand-50); }
  /* the glyph's square is 17 of its 24, so at 30px it matches the 26px circle the planned cards carry */
  .plus.sq svg { width: 30px; height: 30px; stroke-width: 1.7; }   /* a touch lighter than the glyph's 2, since it is drawn larger */
  .mb > div { overflow: hidden; }
  .mbi { margin: 0 16px; padding: 12px 0 16px; border-top: 1px solid var(--g-100); }
  /* One rule for every uppercase section label on this card. They used to sit
     12/12, 12/6 and 12/16 above and below their content: one symmetric, one
     correct, one inverted, so the Tips heading was further from the tips than
     from the rule above it.
     USWDS asks for at least 1.5x more space above a heading than below it and
     Carbon ships 2:1, which is 24 above and 8 below here. Every label on this
     card follows a divider, so THE RULE OWNS THE 24: 12 above it, 12 below it,
     then the label, then 8 to its content. Stacking a 24 margin on top of the
     divider's own 12 gave 36, which is a section break, not a heading.
     line-height is declared so the space around them is a decision rather than
     a font-metric accident, which is what made the old rhythm unmeasurable. */
  .lab, .elselab { font-family: Roboto, sans-serif; font-size: 12px; line-height: 16px;
    font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--g-500);
    margin: 12px 0 8px; }
  /* the rule these two sit under already spends the 12 */
  .textrow > .elselab, .tips > .lab { margin-top: 0; }
  /* no extras above it, so the card's own header rule spends the 12 instead */
  .mbi > .lab:first-child { margin-top: 0; }
  /* No scroll container. Declaring overflow-x alone forces overflow-y to
     auto, and every chip's 44px hit ::after stands 6px proud of the 32px row,
     so the rail became a 6px vertical scroller that stole the page's gesture.
     The options fit the card, so they wrap instead. */
  /* 16, not 18. 18 appears on no published spacing ladder, M3's included, and
     it was the one off-grid value doing structural work on this card. */
  .chips { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 16px; }
  /* The chip is the option's ordinal, with what the whole option costs under
     it. The chip is its own 44px target because it holds two lines, so it no
     longer borrows one. */
  /* One line of text, so the pill is slim. The tap target is still 44px, held
     open by a transparent ::after rather than by growing the pill. */
  .chip { position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px;
    border-radius: 9999px; border: 1px solid var(--g-200); background: #fff; color: var(--g-500); cursor: pointer; }
  .chip::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
  .chip .ot { display: block; text-align: left; }
  .chip .ot b { display: block; font-size: 14px; font-weight: 600; line-height: 18px; color: var(--g-700); white-space: nowrap; }
  /* ---- The chip carries two things at once, on two different properties ----
     Food can be logged from more than one option, so "selected" and "not
     selected" cannot cover it. There are six states here, not two: viewing is
     one axis and progress is the other, and they are independent.
     The FILL is progress: the tint runs left to right in proportion to how
     many of that option's foods are in the day, so the chip is its own meter.
     The RING is viewing. Keeping them on separate properties is the whole
     point, because both want to be green and would otherwise compete.
     Explored in ../option-chip-options.html, variant B. */
  /* An option with anything logged in it earns a tint, an edge and a check; there is
     no progress fill, because options share foods and a fill would claim both. */
  .chip.done { border-color: var(--brand-200); background: var(--brand-50); }
  /* Viewing is a ring, not a fill: a filled chip is already saying progress,
     so selection had to move to a property the fill does not use. */
  .chip.on { background: #fff; border-color: var(--brand-600);
    box-shadow: 0 0 0 1px var(--brand-600); }
  .chip.on .ot b { color: var(--brand-600); }
  /* The rhythm is one number on the parent, not a margin on each child. M3 is
     explicit: "Define padding and gaps on the parent container" and "Avoid
     defining margins on child elements as they usually aren't uniform".
     12 is M3's own ItemBetweenSpace for a contained list. */
  .items, .extras { display: flex; flex-direction: column; gap: 12px; }
  /* 16 from the mark to the name. M3 ItemLeadingSpace, Compose
     LeadingContentEndPadding, Flutter horizontalTitleGap and the iOS
     imageToTextPadding all specify 16 for a list row's leading element. */
  .item { display: flex; align-items: flex-start; gap: 16px; }
  /* No min-height. It added 4px of dead space under every two-line row, so the
     declared 14 between rows painted as 18, and a row whose name wrapped lost
     the slack and painted as 14. There was no constant rhythm at all. */
  /* everything on the right settles onto the name's first line, so the row
     reads as one line with a helping under it rather than a drift */
  .item .kc { margin-top: 3px; }
  .item .manual, .item .skiptag { margin-top: 0; }
  /* The mark is 24 and the target is 44, held by an overlay that costs no
     layout, which is what .chip and .askk already do. Five different negative
     margins used to hold the same 44 open, and the calorie figure ended 8px
     INSIDE the overflow button because .kc and .dots each closed the same gap,
     so tapping "146 cal" opened the options sheet. */
  .tickbtn, .dots { position: relative; width: 24px; height: 24px; border: 0; background: none;
    padding: 0; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .tickbtn::after, .dots::after { content: ""; position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px; transform: translate(-50%, -50%); }
  .tickbtn[disabled] { cursor: default; }
  .tick { width: 24px; height: 24px; border-radius: 9999px; border: 1.5px solid var(--g-300); background: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .tick.on { background: var(--ok-600); border-color: var(--ok-600); }
  .item .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 20px; }
  /* the helping sits under the name. Beside it, a long dish and its helping
     competed for the same line and the calorie figure got squeezed. */
  .item .nm span { display: block; margin-top: 2px; color: var(--g-500);
    font-weight: 400; font-size: 12px; line-height: 18px; }
  .item.done .nm { color: var(--g-700); }
  .manual { font-size: 12px; font-weight: 600; color: var(--g-500); background: var(--g-50); border: 1px solid var(--g-200); border-radius: 9999px; padding: 2px 8px; flex-shrink: 0; }
  .kc { font-size: 12px; color: var(--g-500); white-space: nowrap; }
  .dots { color: var(--g-400); }
  .note { font-size: 12px; color: var(--g-500); line-height: 18px; margin: 0 0 8px; }
  /* 12 above the rule; the label below it brings its own 12, so the dashed
     rule sits centred in 24 the same way every other divider here does */
  .extras { padding-bottom: 12px; border-bottom: 1px dashed var(--g-200); }
  /* inside a meal card, too tight for 8px of travel, so the system's flat */


  /* GoodFlip's own quiet action, and the reverse, which is quieter still */
  /* a column now: the label sits above the two routes it names */
  /* 12 above the rule as well as below it. There was nothing above it before,
     so the rule sat hard against the last food and read as part of the list it
     was supposed to be separating. All four dividers on this card are now 12
     and 12. */
  .textrow { display: flex; flex-direction: column; align-items: stretch;
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--g-200); }
  /* The words are the heading of a small group, not the button. Underneath,
     the two ways to do it are named outright, so no glyph has to carry the
     meaning on its own: a plus promises "you do the typing", Kaira's mark
     promises "tell me and I will work it out", and those are different jobs.
     Explored in ../else-row-options.html, variant G. */
  /* its type and spacing come from the shared .lab rule above */
  /* They fill the card rather than hugging their words, so the two routes read
     as equal halves of one decision and neither looks like the afterthought. */
  /* One segmented control, two halves: a white box with a hairline edge, split by a hairline.
     Neither half is filled, so the two routes read as equal choices of one decision. */
  .acts { display: flex; border: 1px solid var(--g-200); border-radius: var(--r-md); background: #fff; overflow: hidden; }
  .achip { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center;
    gap: 7px; min-height: 48px; padding: 0 12px; border: 0; border-radius: 0;
    background: #fff; color: var(--brand-700);
    font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .achip + .achip { border-left: 1px solid var(--g-200); }
  .achip:active { background: var(--g-50); }
  /* DIRECT CHILD ONLY. Kaira's mark is an svg nested inside her .gfk span,
     which GFKaira.mark() has already sized and which the span's own box is
     built around, so a bare ".achip svg" rule reaches in and resizes her
     artwork inside a box that does not move with it: the hexagon grows out of
     its own container and the chip's gap is measured against the stale box.
     The plus is a direct child of the button, so ">" separates them.
     19, because the square plus is a thin outline holding a small cross and
     carries far less ink than her solid hexagon at the same nominal size. It
     still sits under the label's 20px line, which is the ceiling before a mark
     starts to outrank the words it belongs to. */
  .achip > svg { width: 19px; height: 19px; flex-shrink: 0; }
  .achip .gfk { flex-shrink: 0; }
  /* Searching is the road most people take, so it keeps the fill. Kaira is the
     way out when you cannot name the food, the rarer case, so she is outlined.
     Drawing them as identical twins would be a false balance. */
  .achip.k { color: var(--in-600); }
  .tips { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--g-100); }
  /* A tip row and a food row have the same anatomy, a 20px title over an 18px
     line, so they get the same 12 between them and the same 16 from the mark.
     They used to be 8 apart against the food rows' 18, which is the same job
     drawn two ways. The side padding gives the tick's wash something to sit
     in, and the negative margin puts the content back where it was. */
  .tiplist { display: flex; flex-direction: column; gap: 12px; }
  .tip { position: relative; display: flex; gap: 16px; align-items: flex-start;
    padding: 0 8px; margin: 0 -8px; border-radius: var(--r-md); }
  /* the mark sits on the headline's own line; the 44 is the overlay's job */
  /* The headline carries Kaira's chip where the info circle used to sit, so a
     question is asked about THIS tip rather than about tips in general. A tip
     title can be long, so the line wraps and the chip follows it down rather
     than squeezing the words. */
  /* Text, not a flex row. As a flex container the words were one item and the
     chip another, so the chip could only ever sit beside the whole title or
     drop below all of it: it could not follow the last word. Left as plain
     inline content the chip flows after the final word the way another word
     would, and wraps with it, which is what makes it read as trailing the
     title rather than as a second thing under it. */
  .tip .tt { font-size: 14px; font-weight: 600; line-height: 20px; }
  /* Her clipped corner: square top left, rounded elsewhere, the one shape that
     is hers alone in this pillar. Her card and her sheet cut the same corner,
     so the chip is recognisably hers before a word of it is read. A hairline,
     not a fill: there is one of these on every tip, and at that count a filled
     chip stops being a detail and becomes the texture of the screen.
     Explored in ../ask-kaira-chip-options.html, variant D. */
  .askk { position: relative; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    vertical-align: middle; margin-left: 8px;
    height: 24px; padding: 0 9px 0 6px; cursor: pointer;
    font-size: 11.5px; font-weight: 600; letter-spacing: .3px; color: var(--in-700);
    border: 1px solid transparent; border-radius: 0 var(--r-pill) var(--r-pill) var(--r-pill);
    background: linear-gradient(180deg, var(--in-25), #FFFFFF 70%) padding-box,
      linear-gradient(100deg, var(--in-600), var(--teal-600)) border-box;
    transition: transform .22s var(--ease), box-shadow .3s var(--ease); }
  /* the hit area is 44 while the chip stays 24, the same trick every small
     control on this card uses */
  .askk::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
  .askk:hover { box-shadow: 0 2px 10px rgba(68,76,231,.18); }
  .askk:active { transform: scale(.97); }
  .askk .gfk { flex-shrink: 0; }
  /* Once a tip is done there is nothing left to ask about it, so her chip goes
     rather than sitting there greyed. */
  .tip.done .askk { display: none; }
  .tip .td { font-size: 12px; color: var(--g-500); line-height: 18px; margin-top: 2px; }
  .tip.done .tt { color: var(--g-500); }

  /* ---- Ticking a tip, lifted from the To-do in the EM3 wireframes ----
     Transcribed from app/public/v6/assets (taskPop, haloOut, confettiOut,
     checkDraw, flashOut, strikeWipe). Every keyframe, duration, delay and
     cubic-bezier below is the shipped value, including taskPop's overshoot at
     1.56, which is the one place this pillar is allowed to bounce: it is what
     the To-do already does when a task is done, and a tip is the same kind of
     small win. Six things fire together, and the whole moment is over in
     1.1s, which is how long the wireframe holds its own state. */
  @keyframes taskPop { 0% { transform: scale(1); } 30% { transform: scale(1.32); }
    55% { transform: scale(.92); } 75% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes haloOut { 0% { opacity: .5; transform: scale(.65); } 100% { opacity: 0; transform: scale(2.6); } }
  @keyframes confettiOut { 0% { opacity: 0; transform: translate(0) scale(.4) rotate(0); }
    15% { opacity: 1; } 70% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); } }
  @keyframes checkDraw { to { stroke-dashoffset: 0; } }
  @keyframes flashOut { 0% { opacity: .85; } 35% { opacity: .5; } 100% { opacity: 0; } }

  /* 1. the mark pops */
  .tmark.pop { animation: taskPop .55s cubic-bezier(.34,1.56,.64,1) both; }
  /* 2. a ring leaves it and opens to 2.6x */
  .tmark.pop::after { content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--ok-600); pointer-events: none;
    animation: haloOut .8s cubic-bezier(.22,.7,.3,1) forwards; }
  /* 3. the check draws itself rather than appearing */
  .tmark.pop svg path { stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: checkDraw .34s cubic-bezier(.4,0,.2,1) .12s forwards; }
  /* 4. twelve pieces on fixed vectors, three colours, staggered 26ms apart */
  .burst { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .burst i { position: absolute; left: 50%; top: 50%; display: block;
    animation: confettiOut .72s cubic-bezier(.16,.7,.3,1) forwards; }
  /* 5. the row itself flashes its pillar tint and drains */
  .tip.cheer::before { content: ""; position: absolute; inset: 2px -10px; border-radius: 12px;
    background: var(--brand-100); pointer-events: none; z-index: 0;
    animation: flashOut .9s ease forwards; }
  /* the flash is behind the words, never over them */
  .tip > * { position: relative; z-index: 1; }
  /* No strike-through. The To-do rules a task out because the line is a job
     that is now closed. A tip is advice you took, so ruling it out reads as
     cancelling it. The mark and the colour say done on their own. */
  .tip .tt, .tip .td { transition: color .3s ease-out; }
  /* A tip is ticked off the same way a food is, so it wears the same mark:
     same 24px circle, same green. The two differ in what happens behind them,
     a food confirms quantity and time while a tip just toggles, but that is a
     difference in flow, not in what the control means, and "done" is "done". */
  .tmark { position: relative; width: 24px; height: 24px; border-radius: 9999px; border: 1.5px solid var(--g-300);
    background: #fff; display: grid; place-items: center; flex-shrink: 0;
    transition: background .18s ease-out, border-color .18s ease-out, transform .18s cubic-bezier(.4,0,.2,1); }
  .tmark.on { background: var(--ok-600); border-color: var(--ok-600); }

  /* ---- Kaira's own pair, transcribed from the production app ----
     src/components/atoms/Button/KairaButton.variants.ts, variants "kaira" and
     "kaira-outline", as rendered by molecules/diet/KairaFoodLogWidget.tsx.

     These are NOT the house .gf-btn. They carry no depth lip: the design
     system says the depth bar is never present on the Kaira pair, and the
     production component has no box-shadow and no pressed state either. What
     reads as depth is a 2px gradient RING: the button itself is painted with
     the gradient and padded 2px, and the face sits on top 2px smaller. The
     ring runs 0deg and the face runs 114deg, so the two disagree by 114
     degrees and the edge catches light on one side. That disagreement is the
     whole effect. */
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .kbtn { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center;
    padding: 2px; border: 0; border-radius: 14px; overflow: hidden; cursor: pointer;
    background: linear-gradient(0deg, #299D6B 6.47%, #2A805A 91.92%);
    transition: all .15s cubic-bezier(.4,0,.2,1); }
  .kbtn > span { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 8px 16px; border-radius: 12px;
    /* 14/20 at weight 400, not the 700 our house buttons use. The production
       CTA passes children rather than a label, so the bold label slot never
       applies and the type comes from TextV2 label-medium. */
    font: 400 14px/20px Roboto, sans-serif; letter-spacing: .25px; }
  .kbtn svg { width: 16px; height: 16px; flex-shrink: 0; }
  /* both labels are 400. The b element is only a hook for the gradient clip on
     the secondary, so its own bold has to be undone. */
  .kbtn b { font-weight: 400; }
  /* primary: the face is the same two greens on a diagonal */
  .kbtn > span { background: linear-gradient(114deg, #299D6B 6.47%, #2A805A 91.92%); color: #fff; }
  /* secondary: white face, and the word itself is the gradient, clipped to the
     glyphs at 108deg. The mic stays flat brand green. */
  .kbtn.out > span { background: #fff; }
  .kbtn.out b { font-weight: 400; background: linear-gradient(108deg, #299D6B 6.47%, #2A805A 91.92%);
    -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.25; }
  .kbtn.out svg { color: #299D6B; }

  /* loading */
  .shim { background: linear-gradient(90deg, var(--g-100) 25%, var(--g-200) 37%, var(--g-100) 63%); background-size: 400% 100%; border-radius: 6px; animation: sweep 1.5s linear infinite; }
  @keyframes sweep { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .shim-card { height: 96px; border-radius: var(--r-lg); margin-bottom: 12px; }

  /* chrome */
  /* Kaira floats in the right gutter, which is the same 44px column every meal
     card's + sits in, so a scroll that stops on a meal header puts her 48px
     button on top of a 44px one and swallows it whole. Measured: the two
     columns are identical, and a + lands under her at about one scroll position
     in five. Clearing it means taking her off the corner, which is a placement
     decision rather than a bug fix, so it is left for Shaheer to pick. */
  /* Bottom right, as designed. It does overlap the meal card "+" and the row
     overflow menus at some scroll positions; that is the standard floating
     button trade and the fix belongs in those targets, not here. */
  /* The launcher is the product's, drawn by assets/kaira.js, so this only
     places it. It is 60px there, not 48, and carries its own rim and shadow. */
  .fab { position: fixed; bottom: 100px; left: calc(50% + 195px - 76px); width: 60px; height: 60px; z-index: 20; }
  @media (max-width: 390px) { .fab { left: auto; right: var(--gut); } }
  /* the card mark: the same hexagon, at the size a card sets it */
  .kmark { width: 27px; height: 30px; background: none; display: block; }
  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #fff; border-top: 1px solid var(--g-200); display: flex; padding: 8px 6px calc(8px + var(--gf-home-h, 20px) + env(safe-area-inset-bottom, 0px)); z-index: 20; }
  .nav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--g-500); cursor: pointer; min-height: 48px; justify-content: center; }
  .nav button.on { color: var(--brand-600); font-weight: 700; }
  /* mobile has no hover, so without this a nav tap answers with nothing until
     the next screen paints */
  .nav button { transition: transform .2s ease-out, color .15s ease-out; }
  .nav button:active { transform: scale(.92); }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s ease-out; z-index: 40; }
  /* house rules: a sheet is at most 90% of the screen, its title sits top left
     beside a filled close circle, there is no drag handle, and long content
     scrolls under a header that stays put */
  .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 390px; max-height: 90vh; display: flex; flex-direction: column;
    background: #fff; border-radius: var(--r-lg) var(--r-lg) 0 0; transform: translate(-50%, 100%); transition: transform .3s ease-out; z-index: 41; box-shadow: 0 20px 25px -5px rgba(0,0,0,.1); }
  .shead { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px var(--gut) 8px; }
  .sbody { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 var(--gut) calc(24px + env(safe-area-inset-bottom, 0px)); }
  .open-date .scrim { opacity: 1; pointer-events: auto; }
  .open-date #dateSheet { transform: translate(-50%, 0); }
  .sheet h4 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; }
  .sheet p { margin: 0 0 12px; font-size: 14px; line-height: 21px; color: var(--g-600); }
  /* the 44px target overhangs the gutter by 6 so the circle itself lands on it */
  .sheet .x { width: 44px; height: 44px; margin: 0 -6px 0 0; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; border-radius: 9999px; }
  .sheet .ok { width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: var(--r-sm); background: var(--brand-600); color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 7px 0 var(--brand-700); cursor: pointer; }

  /* the date sheet: one month of days, each carrying its own sufficiency ring.
     The month sits on a bound paper pad, so the calendar reads as its own
     object rather than as more sheet. */
  .dspad { position: relative; margin: 16px 0 0; padding: 36px 0 6px; border-radius: var(--r-md) var(--r-md) 0 0;
    background: linear-gradient(180deg, var(--in-25) 0%, #FFFFFF 92%); border-top: 2px solid var(--in-400); border-bottom: 1px solid var(--g-100); }
  /* Shaheer's artwork, tiled along the pad's top edge: bead below the line, wire
     crossing it, tail above. Decoration only. */
  .dsr { position: absolute; left: 12px; right: 12px; top: -2px; height: 34px; pointer-events: none;
    background: url(assets/binding.svg) no-repeat center top; background-size: 100% 34px; }
  .dsm { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 0 8px; }
  .dsm .arr { width: 44px; height: 44px; border: 0; background: none; color: var(--g-500); display: grid; place-items: center; cursor: pointer; border-radius: 9999px; }
  .dsm .arr:hover:not([disabled]) { background: var(--g-50); }
  .dsm .arr[disabled] { color: var(--g-300); cursor: default; }
  .dsm .mo { min-width: 152px; text-align: center; font-size: 16px; font-weight: 700; }
  .dsw { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dsw span { text-align: center; font-size: 12px; font-weight: 600; color: var(--g-400); padding: 6px 0 12px; }
  .dsg { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 12px; padding: 12px 0 8px; }
  .dsd { min-height: 62px; padding: 8px 0; border: 0; background: none; border-radius: var(--r-md);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; cursor: pointer; }
  .dsd:hover:not([disabled]) { background: var(--g-50); }
  .dsd[disabled] { cursor: default; }
  .dsn { font-size: 12px; font-weight: 600; color: var(--g-700); line-height: 16px; }
  .dsd[disabled] .dsn { color: var(--g-300); }
  .dsd.today .dsn { color: var(--g-900); font-weight: 700; }
  .dsd.sel { background: var(--brand-50); box-shadow: inset 0 0 0 1.5px var(--brand-600); }
  .dsd.sel:hover { background: var(--brand-50); }
  .dsblank { min-height: 62px; }
  .dsl { margin: 0; padding: 24px 0 16px; font-size: 12px; line-height: 18px; color: var(--g-400); text-align: center; }
  .dsmsg { text-align: center; padding: 24px 8px 8px; }
  .dsmsg p { margin: 0; font-size: 14px; line-height: 21px; color: var(--g-600); }
  /* an error is not a brand moment: Retry is a plain secondary */
  .dsretry { height: 44px; margin-top: 12px; padding: 0 24px; border-radius: var(--r-md); border: 1px solid var(--g-300);
    background: #fff; color: var(--g-700); font-size: 14px; font-weight: 600; cursor: pointer; }
  .dsretry:hover { background: var(--g-50); }
  /* logged, but before the plan existed: indigo is this system's colour for logging */
  .dsdot { width: 8px; height: 8px; border-radius: 9999px; background: var(--in-400); margin: 12px 0; }
  /* a loading day keeps the ring's shape, so the grid does not change size when the month lands */
  .dsshim { position: relative; width: 32px; height: 32px; border-radius: 9999px; }
  .dsshim i { position: absolute; inset: 3px; border-radius: 9999px; background: #fff; }

  /* education sheets: the same Cloud Drop score as the day view (compact),
     a white card of the rows behind it, then short sections by dashed rules */
  .ehero { position: relative; margin: 0 calc(var(--gut) * -1); padding: 4px var(--gut) 0; overflow: hidden;
    background: linear-gradient(180deg, var(--g-50) 0%, #fff 78%); }
  /* Day view mounts the gauge at 300px; the sheet uses the same frame so the
     12px status tag stays at real pixels (never scaled below the house minimum). */
  .ehero .eg { position: relative; width: 100%; height: 280px; margin: 0 auto; overflow: hidden; }
  .ehero .eg iframe { display: block; width: 100%; height: 300px; border: 0; background: transparent; pointer-events: none;
    margin-top: -10px; }
  .ecap { margin: -4px 0 10px; text-align: center; font-size: 12px; line-height: 18px; color: var(--g-500); }
  .ecard { position: relative; margin: 0; background: #fff; border: 1px solid var(--g-200); border-radius: var(--r-lg); padding: 2px 16px;
    box-shadow: var(--shadow-card); }
  .er { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 6px 0;
    border: 0; border-bottom: 1px solid var(--g-100); background: none; text-align: left; font: inherit; letter-spacing: inherit; }
  .ecard .er:last-child { border-bottom: 0; }
  .er .k { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--g-600); }
  .er .v { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--g-900); white-space: nowrap; }
  .er.tot .k, .er.tot .v { font-weight: 700; color: var(--g-900); }
  /* Macros and calories share one filled silhouette treatment (grey ink). */
  .eglyph { width: 18px; height: 18px; flex-shrink: 0; background: var(--g-500); }
  .eglyph.svg { background: none; color: var(--g-500); }
  .eglyph.svg svg { width: 18px; height: 18px; display: block; }
  .esec { padding: 16px 0 0; }
  .esec h5 { margin: 0 0 8px; font-size: 14px; line-height: 16.8px; font-weight: 600; color: var(--g-900); }
  .ehd { padding: 12px 16px 2px; font-size: 12px; line-height: 18px; color: var(--g-400); }
  /* the coach is a person, not the score */
  .ecoach { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px; border-radius: var(--r-md); background: var(--g-50); border: 1px solid var(--g-200); }
  .ecoach .av { flex-shrink: 0; width: 36px; height: 36px; border-radius: 9999px; background: var(--in-100); color: var(--in-900); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .ecoach .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ecoach .t b { font-size: 14px; line-height: 20px; color: var(--g-900); }
  .ecoach .t span { font-size: 12px; line-height: 18px; color: var(--g-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ecoach .msg { flex-shrink: 0; min-height: 44px; padding: 0 16px; border-radius: 9999px; border: 1px solid var(--g-300); background: #fff; color: var(--g-700); font-size: 14px; font-weight: 600; cursor: pointer; }
  .ecoach .msg:hover { background: var(--g-50); }
  /* the formula is a fact, so it sits in the system's tinted panel, not in green body copy */
  .eformula { margin: 8px 0 12px; padding: 12px; border-radius: var(--r-md); background: var(--g-100);
    font-size: 14px; line-height: 21px; font-weight: 400; color: var(--g-700); }
  .elist2 { margin: 8px 0 0; padding-left: 20px; }
  .elist2 li { margin: 0 0 4px; font-size: 14px; line-height: 21px; color: var(--g-600); }
  .esec p { margin: 0 0 8px; font-size: 14px; line-height: 21px; color: var(--g-600); text-wrap: pretty; }
  .esec p:last-child { margin-bottom: 0; }
  .edash { border: 0; border-top: 1px dashed var(--g-200); margin: 16px 0 0; }
  .esheet.on { transform: translate(-50%, 0); }

  /* ---- Kaira's chat sheet ----
     The tap that opened this WAS the question, so the thread starts with it
     already sent. Asking somebody to retype what they just tapped is what
     makes a chat feel like a form. She answers after a beat, because an
     answer in the same frame reads as a lookup, and the point of her being
     here is the half a card cannot hold.
     Ported from app/src/components/KairaChatSheet.jsx, with three things put
     right on the way: her mark there is green with a letter K, which the
     design system explicitly forbids, so this uses her real indigo to teal
     one; her bubble clipped the bottom-left when the top-left is her corner
     everywhere else in this pillar; and the close was a bare glyph when the
     house rule is a filled circle. */
  .ksheet { height: 90vh; }
  .ksheet .shead { align-items: center; gap: 10px; padding: 16px var(--gut) 12px;
    border-bottom: 1px solid var(--g-100); }
  .ksheet .kwho { flex: 1; min-width: 0; }
  .ksheet .kwho b { display: block; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--g-900); }
  .ksheet .kwho span { display: block; font-size: 11px; line-height: 16px; color: var(--g-500); margin-top: 1px; }
  .ksheet .sbody { flex: 1 1 auto; display: flex; flex-direction: column; padding-top: 16px; }
  /* Sent, past tense. The mirrored corner of hers, so the two sides of the
     conversation are visibly the same shape facing each other. */
  .kme { align-self: flex-end; max-width: 82%; margin-bottom: 16px; padding: 10px 13px;
    border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
    background: var(--in-50); color: var(--in-800, #2D31A6);
    font-size: 12.5px; line-height: 1.5; }
  .krow { display: flex; gap: 8px; margin-bottom: 10px; }
  /* Her mark rides beside the first line only, so a two part answer reads as
     one person talking rather than as two notifications. The gutter is held
     open on every row so the continuations stay aligned under it. */
  .kgut { width: 22px; flex-shrink: 0; }
  .kbub { max-width: 88%; padding: 11px 13px; border-radius: 4px var(--r-lg) var(--r-lg) var(--r-lg);
    background: #fff; border: 1px solid var(--in-100);
    font-size: 12.5px; line-height: 1.55; color: var(--g-900); }
  .krow { animation: rise .32s cubic-bezier(.32,.72,0,1) both; }
  /* Three dots out of step with each other. The stagger is what makes it read
     as thinking rather than as a loading bar. */
  .kdots { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .kdots i { width: 6px; height: 6px; border-radius: 9999px; background: var(--g-400);
    animation: kpulse 1.1s ease-in-out infinite; }
  .kdots i:nth-child(2) { animation-delay: .18s; }
  .kdots i:nth-child(3) { animation-delay: .36s; }
  @keyframes kpulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(1.45); } }
  /* A real looking box that goes nowhere on purpose. This screen has one
     answer to give and a working field would promise a second. */
  .kfoot { flex: 0 0 auto; display: flex; gap: 9px; align-items: center;
    padding: 10px var(--gut) calc(18px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--g-100); }
  .kfield { flex: 1; min-width: 0; padding: 11px 15px; border-radius: var(--r-pill);
    background: var(--g-50); border: 1px solid var(--g-200);
    font-size: 12.5px; color: var(--g-400); }
  .ksend { width: 38px; height: 38px; flex-shrink: 0; border-radius: 9999px;
    background: var(--g-50); border: 1px solid var(--g-200); color: var(--g-400);
    display: grid; place-items: center; }
  .open-edu .scrim { opacity: 1; pointer-events: auto; }

  /* ============================================================
     Interactive layer. The score keeps the green, Kaira keeps the
     indigo, gold marks the one gap and the rare perfect day, and
     teal carries the quiet explanations.
     ============================================================ */

  /* a tick that fills and springs, rather than swapping a state */
  /* The lift lives in the keyframes (.7 to 1.14 to 1), so the curve only has
     to decelerate. A springy cubic-bezier on top of an overshooting keyframe
     bounces twice, and the design system's curves are ease-out anyway. */
  .tick { transition: background .18s ease-out, border-color .18s ease-out, transform .18s cubic-bezier(.4,0,.2,1); }
  .tickbtn:not([disabled]):active .tick, .tickbtn:not([disabled]):active .tmark { transform: scale(.88); }
  .tick.pop { animation: tickpop .34s cubic-bezier(.25,.1,.25,1); }
  @keyframes tickpop { 0% { transform: scale(.7); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .tick svg { animation: tickdraw .22s ease-out; }
  @keyframes tickdraw { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
  .item { transition: opacity .2s ease-out; }
  .item .nm, .item .kc { transition: color .2s ease-out; }

  /* a meal that just filled up settles once, then goes quiet again */
  .meal { transition: border-color .3s ease-out, box-shadow .3s ease-out; }
  .meal.settled { border-color: var(--ok-300); box-shadow: 0 0 0 3px rgba(18,183,106,.08), var(--shadow-card); }

  /* cards arrive in order rather than all at once */
  .rise { animation: rise .42s cubic-bezier(.25,.1,.25,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* the score moved: a number rises off the plate and fades */
  #heroWrap { transition: transform .22s ease-out; }
  #heroWrap.bump { animation: bump .5s cubic-bezier(.25,.1,.25,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
  .delta { position: absolute; left: 50%; top: 42%; transform: translate(-50%, 0); font-size: 16px; font-weight: 700;
    color: var(--ok-600); pointer-events: none; animation: deltaup 1.1s ease-out forwards; z-index: 3; }
  .delta.down { color: var(--g-400); }
  @keyframes deltaup { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.9); } 22% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); } }

  /* the one gap, in gold, and only when there is one */
  .gap { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding: 2px 8px; border-radius: 9999px;
    background: var(--gold-50); border: 1px solid var(--gold-200); color: var(--gold-800); font-size: 12px; font-weight: 600; letter-spacing: 0; }
  .gap svg { width: 12px; height: 12px; }

  /* undo lives in a toast, so nothing needs confirming */
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 16px); width: calc(100% - var(--gut) * 2); max-width: 358px;
    display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: var(--r-md); background: var(--g-800); color: #fff;
    font-size: 14px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.18); opacity: 0; pointer-events: none;
    transition: opacity .2s ease-out, transform .2s ease-out; z-index: 45; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast span { flex: 1; min-width: 0; }
  .toast button { border: 0; background: none; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    text-decoration: underline; padding: 6px 8px; margin: -6px -4px -6px 0; border-radius: var(--r-sm); }

  /* No Reset day control. It only called location.reload(), which is what the
     browser's own refresh already does, and it parked a demo affordance in the
     corner of every screenshot of the real thing. */

  /* the item menu */
  .menurow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; border: 0; background: none; text-align: left;
    font: inherit; letter-spacing: inherit; font-size: 14px; color: var(--g-700); cursor: pointer; border-bottom: 1px solid var(--g-100); }
  .menurow:last-child { border-bottom: 0; }
  .menurow.warn { color: var(--red-600); }
  .menurow .mi { width: 32px; display: grid; place-items: center; color: var(--g-400); }
  .menurow.warn .mi { color: var(--red-600); }
  .qty { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0 4px; }
  .qty .lab2 { font-size: 14px; color: var(--g-700); }
  .qty .st { display: flex; align-items: center; gap: 4px; }
  .qty .st button { width: 44px; height: 44px; border-radius: 9999px; border: 1px solid var(--g-200); background: #fff; color: var(--g-700);
    font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .qty .st button:hover:not([disabled]) { background: var(--g-50); }
  .qty .st button[disabled] { color: var(--g-300); cursor: default; }
  .qty .st b { min-width: 58px; text-align: center; font-size: 16px; }
  /* why a food is in the plan is teaching, not action: teal, quiet */
  .why { display: flex; gap: 12px; margin-top: 12px; padding: 12px; border-radius: var(--r-md); background: var(--teal-100); border: 1px solid var(--teal-200); }
  .why svg { flex-shrink: 0; color: var(--teal-800); margin-top: 1px; }
  .why p { margin: 0; font-size: 14px; line-height: 21px; color: var(--g-600); }
  .why.quiet { background: var(--g-50); border-color: var(--g-100); }
  .why.quiet svg { color: var(--g-400); }

  /* a food the day skipped: still on the plan, out of the count */
  .item.skipped .nm { color: var(--g-400); text-decoration: line-through; text-decoration-color: var(--g-300); }
  .item.skipped .tick { border-style: dashed; border-color: var(--g-300); color: var(--g-400); }
  .skiptag { font-size: 12px; font-weight: 600; color: var(--g-400); background: var(--g-50); border: 1px solid var(--g-200);
    border-radius: 9999px; padding: 2px 8px; flex-shrink: 0; }

  /* the confirm step: a quantity, a time, and where that time sends the food */
  .cfrow + .cfrow { border-top: 1px solid var(--g-100); }
  .cfcal { font-size: 12px; line-height: 18px; color: var(--g-500); margin: 2px 0 0; }
  .cfmove { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; padding: 12px; border-radius: var(--r-md);
    background: var(--gold-50); border: 1px solid var(--gold-200); font-size: 14px; line-height: 21px; color: var(--g-600); }
  .cfmove svg { flex-shrink: 0; color: var(--gold-700); margin-top: 1px; }

  /* the rare day everything lands: gold, once, then gone */
  .bloom { position: fixed; left: 50%; top: 210px; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 9999px;
    pointer-events: none; z-index: 5; background: radial-gradient(closest-side, rgba(231,193,68,.28), rgba(231,193,68,0) 70%);
    animation: bloom 1.6s ease-out forwards; }
  @keyframes bloom { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div class="col" id="col">

  <div class="eatline gut">
    <svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;color:var(--g-900)"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
    <b>Eat</b><span class="tag">Fuel your body right</span>
    <button class="info" id="infoBtn" aria-label="What is nutrition sufficiency?"><svg class="ico" viewBox="0 0 24 24" style="width:20px;height:20px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
  </div>

  <div class="dateline gut">
    <div class="pill">
      <button class="arr" id="prevDay" aria-label="Previous day"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="lbl" id="dayBtn" aria-label="Select date" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="dayLabel">Today</span></button>

var NAME = Q.get("state") || "mid";
var S = STATES[NAME] || STATES.mid;
S.id = STATES[NAME] ? NAME : "mid";

/* ?rail= picks how "What shaped your score?" answers itself. icons is the
   default: the four macros, with their glyphs and their bars, sit under that
   heading and there is no second macro card lower down. cards is the glass
   stat rail. Anything else falls back to icons. On the one state with nothing
   to measure at all, noplanempty, there are no macros to show, so that state
   keeps the cards whichever way the flag is set. */
var RAILMODE = Q.get("rail") === "cards" ? "cards" : "icons";
/* How the meal card offers "log the rest of this plan". cta is the full width
   secondary button we shipped; tick is a parent control row that commands the
   food rows below it; text is GoodFlip's own quiet action. */
var ICONRAIL = RAILMODE === "icons" && S.macros.mode !== "hide";

var fmt = function (n) { return n.toLocaleString("en-US"); };
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function run(dur, step) {
  if (REDUCED) { step(1); return function () {}; }
  var t0 = performance.now(), id = 0, live = true, done = false;
  (function frame(t) {
    if (!live) return;
    /* clamped at both ends: a frame clock that does not share its timebase with
       performance.now would otherwise drive the easing past either end and
       print numbers that were never real */
    var p = Math.max(0, Math.min(1, (t - t0) / dur));
    step(1 - Math.pow(1 - p, 3));
    if (p < 1) id = requestAnimationFrame(frame); else done = true;

     last frame is guaranteed on a timer rather than left to the frame loop */
  setTimeout(function () { if (live && !done) { done = true; step(1); } }, dur + 90);
  return function () { live = false; cancelAnimationFrame(id); };
}

/* ============================================================
   The day being viewed, and the calendar behind the chip.

   Today is Tuesday 15 September 2026. The person joined on 1 Sep
   and their coach set the plan on 5 Sep, so this one month holds
   every kind of day the sheet has to draw: scored, perfect, one
   nothing was logged on, four that came before the plan, and the
   days that have not happened yet.
   ============================================================ */
var CAL = {
  today: { y: 2026, m: 9, d: 15 },
  join: { y: 2026, m: 9, d: 1 },
  score: {
    "2026-9-5": 74, "2026-9-6": 52, "2026-9-7": 88, "2026-9-8": 100, "2026-9-9": 70,
    "2026-9-10": 46, "2026-9-11": 79, "2026-9-12": 66, "2026-9-14": 61, "2026-9-15": 54
  },
  /* logged, but before the plan existed, so there is nothing to score them against */
  preplan: { "2026-9-1": 1, "2026-9-2": 1, "2026-9-3": 1, "2026-9-4": 1 }
};

var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
var SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
var WDAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
var DAY_MS = 86400000;

function dkey(y, m, d) { return y + "-" + m + "-" + d; }
function dts(y, m, d) { return Date.UTC(y, m - 1, d); }
var TODAY_TS = dts(CAL.today.y, CAL.today.m, CAL.today.d);
var JOIN_TS = dts(CAL.join.y, CAL.join.m, CAL.join.d);

function dayKind(y, m, d) {
  var t = dts(y, m, d);
  if (t > TODAY_TS) return "future";
  if (t < JOIN_TS) return "before";
  if (t === TODAY_TS) return "today";
  if (CAL.preplan[dkey(y, m, d)]) return "preplan";
  if (CAL.score[dkey(y, m, d)] != null) return "scored";
  return "missed";
}
function dayLabel(y, m, d) {
  return WDAY[new Date(dts(y, m, d)).getUTCDay()] + ", " + d + " " + SHORT[m - 1];
}
/* which page state a day opens into */
var STATE_FOR = { today: "mid", scored: "past", missed: "missed", preplan: "noplan" };

/* The day the page is actually showing. Usually ?date, but a bare ?state=past
   or ?state=missed names its day in the chip alone, and the week strip and the
   delta have to agree with the chip rather than with the calendar. */
function selectedTs(day) {
  if (day === "Today") return TODAY_TS;
  for (var i = 1; i <= 21; i++) {
    var t = new Date(TODAY_TS - i * DAY_MS);
    if (dayLabel(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()) === day) return t.getTime();
  }
  return TODAY_TS;
}

/* the day on screen: ?date=y-m-d, or today */
var VIEW = (function () {
  var raw = Q.get("date");
  if (raw) {
    var p = raw.split("-").map(Number);
    if (p.length === 3 && p.every(function (n) { return n === n; })) return { y: p[0], m: p[1], d: p[2] };
  }
  return { y: CAL.today.y, m: CAL.today.m, d: CAL.today.d };
})();

  S.day = dayLabel(VIEW.y, VIEW.m, VIEW.d);

    S.hero.score = sc;

       be read back from its score: two nudged down, two up, mean unchanged.

    var T = [95, 238, 63, 30], OFF = [-6, 4, 2, 0];

(function () {
  var col = document.getElementById("col");

  var dsPrev = document.getElementById("dsPrev"), dsNext = document.getElementById("dsNext");

  /* the sheet is a demo, so a flag can park it in a state that needs a server
     to reach: ?sheet=1 open, and empty | loading | error */
  var flag = Q.get("sheet");
  var mode = flag === "loading" || flag === "error" ? flag : "grid";
  var SHOW = { y: VIEW.y, m: VIEW.m };

  document.getElementById("dsWeek").innerHTML = ["M", "T", "W", "T", "F", "S", "S"]
    .map(function (d) { return "<span>" + d + "</span>"; }).join("");

  function ring(pct, o) {
    o = o || {};
    var C = 2 * Math.PI * 13;
    /* a day nothing was logged on is drawn dashed, so it reads as open rather
       than as a day that cannot be reached */
    return '<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">' +
      '<circle cx="16" cy="16" r="13" fill="none" style="stroke:var(' + (o.faint ? "--g-100" : "--g-200") + ')" stroke-width="3"' +

      (o.full ? '<circle cx="16" cy="16" r="3" style="fill:var(--brand-200)"/>' : "") + "</svg>";
  }

  function cell(y, m, d) {
    var k = dayKind(y, m, d);
    var sc = CAL.score[dkey(y, m, d)];
    var off = k === "future" || k === "before";
    var sel = VIEW.y === y && VIEW.m === m && VIEW.d === d && !off;
    var vis = k === "preplan" ? '<span class="dsdot"></span>'
      : off ? ring(0, { faint: true })
      : k === "missed" ? ring(0, { open: true })
      : ring(sc / 100, { full: sc >= 100 });
    var says = k === "future" ? "not yet" : k === "before" ? "before you joined"
      : k === "preplan" ? "logged, before your plan" : k === "missed" ? "nothing logged"
      : sc + " out of 100";
    return '<button class="dsd' + (k === "today" ? " today" : "") + (sel ? " sel" : "") + '"' + (off ? " disabled" : "") +
      ' data-d="' + d + '" aria-label="' + d + " " + MONTHS[m - 1] + ", " + says + '"' + (sel ? ' aria-current="date"' : "") + '>' +

  }

    var y = SHOW.y, m = SHOW.m;
    var first = (new Date(dts(y, m, 1)).getUTCDay() + 6) % 7;
    var days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var h = "";
    for (var i = 0; i < first; i++) h += '<div class="dsblank"></div>';
    for (var d = 1; d <= days; d++) h += cell(y, m, d);

  }
