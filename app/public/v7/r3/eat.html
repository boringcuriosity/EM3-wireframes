    monthEl.textContent = MONTHS[SHOW.m - 1] + " " + SHOW.y;
    dsPrev.disabled = dts(SHOW.y, SHOW.m, 1) <= dts(CAL.join.y, CAL.join.m, 1);
    dsNext.disabled = dts(SHOW.y, SHOW.m, 1) >= dts(CAL.today.y, CAL.today.m, 1);

    if (mode === "loading") {
      var sh = "";
      for (var i = 0; i < 30; i++) {
        sh += '<div class="dsd" style="cursor:default"><span class="shim" style="width:14px;height:12px"></span>' +
          '<span class="shim dsshim"><i></i></span></div>';
      }
      bodyEl.innerHTML = '<div class="dsg">' + sh + "</div>";
      return;
    }
    if (mode === "error") {
      bodyEl.innerHTML = '<div class="dsmsg"><p>We could not load this month. Check your connection and try again.</p>' +
        '<button class="dsretry" id="dsRetry">Retry</button></div>';
      document.getElementById("dsRetry").onclick = function () { mode = "grid"; draw(); };
      return;
    }
    bodyEl.innerHTML = grid() +
      '<p class="dsl">The ring is your nutrition sufficiency out of 100</p>';
  }

  function go(y, m, d) {
    var k = dayKind(y, m, d);
    if (k === "future" || k === "before") return;
    var q = new URLSearchParams(location.search);
    q.set("state", STATE_FOR[k]);
    if (k === "today") q.delete("date"); else q.set("date", dkey(y, m, d));
    q.delete("sheet");
    location.search = q.toString();
  }
  function step(delta) {
    var t = new Date(dts(VIEW.y, VIEW.m, VIEW.d) + delta * DAY_MS);
    go(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }

  /* the chip: back a day, forward a day, and the label opens the month */
  prevDay.disabled = dts(VIEW.y, VIEW.m, VIEW.d) - DAY_MS < JOIN_TS;
  nextDay.disabled = !S.next;
  prevDay.onclick = function () { step(-1); };
  nextDay.onclick = function () { step(1); };

  var SEL_TS = selectedTs(S.day);


  /* The delta beside the date. Grey, always, whichever way it went. A day that
     has barely started has nothing to compare, so it says nothing rather than
     reporting a drop that is only the clock. When empty, .solo centres the
     date pill so the row does not look unfinished on the right. */
  window.paintDelta = function (score, mealsIn) {
    var el = document.getElementById("dayDelta");
    var line = el && el.closest(".dateline");
    if (!el) return;
    /* A day still being lived has no number to compare. Yesterday is a whole
       day; today is however much of one has happened. Showing "-7" against a
       finished day punishes the user for the time of day, so the delta waits
       until today's plan is actually complete. */
    var running = S.day === "Today" &&
      (mealsIn == null ? S.hero.mealsIn : mealsIn) < (S.hero.mealSlots || 6);
    var prev = new Date(SEL_TS - DAY_MS);
    var was = CAL.score[dkey(prev.getUTCFullYear(), prev.getUTCMonth() + 1, prev.getUTCDate())];
    if (score == null || was == null || running) {
      el.textContent = "";
      if (line) line.classList.add("solo");
      return;
    }
    var n = Math.round(score - was);
    el.innerHTML = '<svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px">' +
      (n < 0 ? '<path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>'
             : '<path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>') +
      "</svg>" + (n > 0 ? "+" : "") + n + " from yesterday";
    if (line) line.classList.remove("solo");
  };
  window.paintDelta(S.hero.score);

  var open = function () { SHOW = { y: VIEW.y, m: VIEW.m }; draw(); col.classList.add("open-date"); };
  var close = function () { col.classList.remove("open-date"); };
  document.getElementById("dayBtn").onclick = open;
  document.getElementById("dsX").onclick = close;
  dsPrev.onclick = function () { SHOW.m--; if (SHOW.m < 1) { SHOW.m = 12; SHOW.y--; } draw(); };
  dsNext.onclick = function () { SHOW.m++; if (SHOW.m > 12) { SHOW.m = 1; SHOW.y++; } draw(); };
  bodyEl.addEventListener("click", function (e) {
    var b = e.target.closest(".dsd");
    if (b && b.dataset.d) go(SHOW.y, SHOW.m, +b.dataset.d);
  });
  window.closeDateSheet = close;
  if (flag === "1" || flag === "loading" || flag === "error") open();
})();

/* ---------- scripts fetched only when a flag asks for them ---------- */
/* plate.js is the hero, so it ships in the page. Everything else, including
   three.js and the alternate calorie strips, is a ?hero= or ?cal= experiment
   and is pulled in only when one of those flags names it. */
var LAZY = { three: "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js", shaders: "vendor/paper-shaders.js" };
var HERO_DIR = {
  cloud: "", orb: "", portal: "", smoke: "", metal: "", sunrise: "", metalhex: "", chrome: "", vortex: "",
  aura: "", planet: "", lotus: "", blob: "", citrus: "", broth: "",
  pebble: "backup/", gem: "backup/", stardust: "backup/", ferro: "backup/", pool: "backup/",
  dinnerplate: "backup/", thali: "backup/", hexfood: "backup/", scale: "backup/", halo3d: "backup/",
  halodome: "backup/", halobeads: "backup/", fluted: "backup/", merge: "backup/", jar: "backup/", sprout: "backup/"
};
function loadScripts(list, done) {
  var i = 0;
  (function next() {
    if (i >= list.length) return done();
    var s = document.createElement("script");
    s.src = list[i++];
    s.onload = next;
    s.onerror = next;
    document.head.appendChild(s);
  })();
}

/* ---------- the plate ---------- */
(function () {
  var name = Q.get("hero") || "cloud";   /* Cloud Drop is the score; ?hero=plate brings back the old one */
  var el = document.getElementById("hero");
  var shown = S.hero.score == null ? "" : S.hero.score + "%";

  /* an alternate hero is a flag, so it arrives with its dependencies when the
     flag is there and costs nothing when it is not */
  if (!(window.HEROES && window.HEROES[name]) && HERO_DIR[name] != null) {
    /* the liquid score brings its own renderer, so it skips three.js */
    loadScripts((name === "cloud" ? [] : [LAZY.three, LAZY.shaders]).concat("heroes/" + HERO_DIR[name] + name + ".js" + (name === "cloud" ? "?v=17" : "")), start);   /* ?v busts the cache when the liquid score is updated */
    return;
  }
  start();

  function start() {
  var make = window.HEROES && window.HEROES[name];
  if (typeof make !== "function") {
    el.innerHTML = '<div class="hero-missing"><div><b>' + shown + '</b>Hero "' + name + '" is on its way</div></div>';
    return;
  }
  /* ponytail: run the hero only while it is on screen. The gallery shows many
     phones at once and Chrome drops the oldest WebGL contexts past ~16. */
  var opts = { score: S.hero.score, state: S.id, mealsIn: S.hero.mealsIn, mealSlots: S.hero.mealSlots };
  /* arriving from a log: the logger left the gain behind, so the score starts
     where the day stood and steps up, rather than playing its intro again */
  try {
    var gained = +sessionStorage.getItem("gfLogged");
    sessionStorage.removeItem("gfLogged");
    if (gained > 0 && S.hero.score != null) opts.from = Math.max(0, S.hero.score - gained);
  } catch (e) {}
  /* a log earns FlipCoins: the app's coin toast lands once the score has finished stepping up. Only after a log:
     gfLogged is set by the logger alone and cleared above on first read, so a reload never replays it */
  if (gained > 0 && window.GFFlipcoin)
    setTimeout(window.GFFlipcoin.show, 2000);
  var live = null;
  var mount = function () {
    if (live) return;
    el.innerHTML = "";
    try { live = make(el, opts) || { dispose: function () {} }; }
    catch (e) { console.error(e); live = { dispose: function () {} }; el.innerHTML = '<div class="hero-missing"><div><b>' + shown + '</b>Hero "' + name + '" failed to load</div></div>'; }
  };
  var unmount = function () {
    if (!live) return;
    try { live.dispose(); } catch (e) {}
    live = null;
    el.innerHTML = "";
  };
  if (window.top === window) {
    mount();
  } else {
    window.addEventListener("message", function (e) {
      if (e.data === "hero:mount") mount();
      else if (e.data === "hero:unmount") unmount();
    });
    parent.postMessage("hero:ready", "*");
  }

  /* The hero owns its own number and only counts up when it mounts, so a live
     score is a remount with a new one. The page pays for the wait with its own
     feedback first: a rising delta and a pulse, both inside 400ms. */
  var pending = null, timer = null;
  window.setHeroScore = function (n, delta) {
    if (opts.score === n && !delta) return;
    opts.score = n;
    if (delta) {
      var wrap = document.getElementById("heroWrap");
      wrap.classList.remove("bump");
      void wrap.offsetWidth;
      wrap.classList.add("bump");
      var tag = document.createElement("div");
      tag.className = "delta" + (delta < 0 ? " down" : "");
      tag.textContent = (delta > 0 ? "+" : "") + delta;
      wrap.appendChild(tag);
      setTimeout(function () { tag.remove(); }, 1200);
    }
    /* if the hero can take a new number in place, let it. A day that was empty
       or had a padlock has also crossed into a scored state, so it is told
       which one. Otherwise the hero is remounted, which reads as a re-tally. */
    if (live && typeof live.set === "function") {
      window.HERO_NATIVE = true;
      /* a history day or a locked one keeps its own face, whatever the number
         does. A live day follows the score. */
      var TODAY = { empty: 1, first: 1, mid: 1, full: 1, perfect: 1 };
      var into = null;
      if (TODAY[opts.state]) {
        into = n <= 0 ? "empty" : n >= 100 ? "perfect" : n >= 80 ? "full" : opts.state === "empty" ? "first" : "mid";
        if (into === opts.state) into = null; else opts.state = into;
      }
      live.set(n, into ? { state: into } : {});
      return;
    }
    pending = n;
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (pending === null) return;
      pending = null;
      unmount();
      mount();
    }, 420);
  };
  }
})();

/* ---------- the verdict, and the wash behind the plate ----------
   The plate keeps its own face. What follows the score is the pill under it
   and one tint behind it, so a day that is not going well does not read green.
   Early in the day the pill reports progress instead, because a score that is
   meant to be low at breakfast is not a bad score.                          */
(function () {
  var pill = document.getElementById("verdict"), stage = document.getElementById("stage");
  /* GoodFlip's own verdict wording, taken from the CGM screens, where the
     emoji sits inside the text node so the status survives greyscale and is
     never carried by colour alone. The voice is a coach, not a grader:
     "Let's work on this", never "Needs attention". */
  var BANDS = [[100, "ok", "\uD83C\uDF1F Every target met"], [85, "ok", "\uD83C\uDF1F You're on track"],
               [50, "warn", "\u26C5 Room to improve"], [0, "bad", "\u26A0\uFE0F Let's work on this"]];

  window.paintVerdict = function (score, mealsIn) {
    var slots = S.hero.mealSlots || 6;
    var live = S.day === "Today";
    var cls = "flat", text;
    if (S.macros.mode === "loading") {
      pill.className = "shim";
      pill.style.cssText = "width:120px;height:22px;border-radius:8px";
      pill.textContent = "";
      return;
    }
    if (score == null && (S.macros.mode === "grams" || S.macros.mode === "hide")) {
      /* The plate already has a padlock in its middle. A chip under it saying
         the score is not set is the same sentence a second time, and it is a
         verdict slot being used to report an absence. */
      pill.hidden = true;
      stage.className = "stage flat";
      /* Without a pill the plate ends on empty light, so the 40px a section
         needs to clear a verdict is just more of the same gap. Pull the first
         thing under the plate up to meet it.

         On the next frame, not now: this runs before the macro block has
         decided whether to hide itself, so asking now picks the section that
         is about to disappear and the gap stays exactly as it was. */
      requestAnimationFrame(function () {
        var next = stage.nextElementSibling;
        while (next && (next.hidden || next.offsetParent === null)) next = next.nextElementSibling;
        if (next) next.classList.add("tight");
      });
      return;
    }
    pill.hidden = false;
    if (score == null) {
      text = "Nothing logged";
    } else if (live && mealsIn < slots) {
      /* Today is not finished, so there is no verdict to give: a score of 54 at
         lunchtime is not "room to improve", it is halfway through. And it is
         never a tally. The score measures how well the day is fed, not how many
         meals were attended, and a plan can hold three meals or nine, so a
         count here would bind the score to a number it does not depend on. */
      text = mealsIn > 0 ? "\uD83C\uDF31 Building your day" : "Log your first meal";
    } else {
      for (var i = 0; i < BANDS.length; i++) {
        if (score >= BANDS[i][0]) { cls = BANDS[i][1]; text = BANDS[i][2]; break; }
      }
    }
    pill.className = "gf-verdict " + cls;
    pill.textContent = text;
    stage.className = "stage " + cls;
  };
  window.paintVerdict(S.hero.score, S.hero.mealsIn);
})();

/* ---------- macros ---------- */
(function () {
  var M = S.macros;
  var box = document.getElementById("macros"), h2 = document.getElementById("nutTitle");
  var nutSect = document.getElementById("nutSect");
  /* ?rail=icons: the card itself moves up under "What shaped your score?", so
     the screen carries one macro block rather than two. It keeps its own shape
     and its own contents, only its heading and its place change, and the
     section it leaves behind is the calorie block alone. The rail owns the
     heading from here, so this card stops writing one. */
  if (ICONRAIL) {
    var slot = document.getElementById("railMacros");
    slot.hidden = false;
    slot.appendChild(box);
    /* and its footer with it. They are one card now, so they cannot live in
       two sections with a section margin between them. */
    slot.appendChild(document.getElementById("calstrip"));
    nutSect.remove();
    document.getElementById("rail").hidden = true;
    h2.hidden = true;
    h2 = document.getElementById("railTitle");
    h2.appendChild(document.createElement("span")).className = "gapslot";
  } else {
    /* The rail is now one card per macro plus calories, so this section would
       print the same eight numbers a second time. The cards variant IS the
       answer to "what shaped your score", not a preface to it. */
    nutSect.hidden = true;
    h2.innerHTML = (M.title || "Your nutrition") + (M.tag ? '<span class="tag">' + M.tag + '</span>' : "") + '<span class="gapslot"></span>';
  }
  /* nothing to measure and nothing eaten, so the section stands down and
     Kaira's card carries the day. The first thing logged brings the calories
     back, which is why the section is hidden rather than removed. */
  if (M.mode === "hide") {
    /* With no targets there is nothing that shaped anything, so the whole
       question goes rather than being answered with two cards that say the
       score is not set. Kaira's card below carries the day on its own. */
    box.remove(); nutSect.hidden = true;
    document.getElementById("railSect").hidden = true;
    return;
  }
  if (M.mode === "loading") {
    if (!ICONRAIL) h2.innerHTML = '<span class="shim" style="display:block;height:16px;width:150px"></span>';
    box.innerHTML = '<div class="mgrid">' + [0, 1, 2, 3].map(function () {
        return '<div class="m"><div class="shim" style="width:64px;height:16px"></div>' +
          '<div class="shim" style="width:80px;height:24px"></div><div class="shim" style="height:4px"></div></div>';
      }).join("") + '</div>';
    return;
  }
  var LOCK = '<svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px;color:var(--g-300);margin-top:2px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  var KMARK = '<svg width="26" height="28" viewBox="0 0 22 24" fill="none" style="flex-shrink:0;margin-top:1px"><path d="M11 1.2 20.1 6.6v10.8L11 22.8 1.9 17.4V6.6z" style="stroke:var(--in-600)" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  /* the concentric arc watermark the system puts behind its nutrition numbers,
     bled off the card's right edge. Decoration only, and it carries no colour. */
  box.classList.toggle("kcard", !!M.head);
  var head = M.head ? '<div class="mhead">' + KMARK + '<div><h4>' + M.head.title + '</h4><p>' + M.head.sub + '</p></div></div>' : "";
  var lock = M.lock ? '<p class="mnote">' + LOCK + M.lock + '</p>' : "";

  /* Macros are one colour with their own icons, never a hue each. The glyph is
     a mask, so the flat grey the Figma uses is just the element's background. */
  var G = [
    { cls: "glyph-protein", name: "Protein" },
    { cls: "glyph-carbs", name: "Carbs" },
    { cls: "glyph-fats", name: "Fats" },
    { cls: "glyph-fibre", name: "Fibre" }
  ];
  var SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>';

  function cells(vals) {
    return G.map(function (g, i) {
      var v = (vals || [])[i] || [0, 0], eaten = v[0], target = v[1];
      var pct = M.mode === "goals" ? 0 : (target ? Math.max(0, Math.min(1, eaten / target)) : 0);
      /* a day with no food in it names its targets or stays quiet, never prints
         a column of zeros */
      var val = M.mode === "grams" ? "<strong>" + fmt(eaten) + "g</strong>"
        : M.mode === "goals" ? "<strong>" + fmt(target) + "</strong><span>g</span>"
        : M.mode === "blank" ? "<span>Not logged</span>"
        : "<strong data-n=\"" + eaten + "\">" + fmt(eaten) + "</strong><span>/" + fmt(target) + "g</span>";
      /* with no target there is nothing to measure against, so the row carries a
         plain rule rather than a bar that would imply one */
      /* the glyph is the gauge: grams mode has no target so it stays a flat
         silhouette, goals mode has nothing in it yet so it stays empty */
      var fillCls = M.mode === "grams" ? " flat" : M.mode === "goals" || M.mode === "blank" ? " empty" : "";
      var done = pct >= 1 ? " done" : "";
      return '<div class="m' + done + '">' +
        '<span class="gwrap"><span class="gfill ' + g.cls + fillCls + '"' +
        (fillCls ? "" : ' style="--f:' + (pct * 100).toFixed(1) + '%"') + '></span></span>' +
        '<span class="mtext"><span class="mval">' + val + '</span>' +
        '<span class="mname">' + g.name + '</span></span></div>';
    }).join("");
  }

  /* cells() writes the final --f inline, so a freshly built glyph would simply
     appear at its level. Park each fill at `from`, force a reflow, then let it
     travel. On arrival `from` is zero and the four stagger; on a repaint it is
     wherever each glyph already stood, so a tick moves it rather than resetting.
     The percentages are read back off the DOM, so there is no second source. */
  function travel(grid, from) {
    var fills = grid.querySelectorAll(".gfill");
    var to = [].map.call(fills, function (f) { return f.style.getPropertyValue("--f") || "0%"; });
    for (var i = 0; i < fills.length; i++) {
      if (fills[i].classList.contains("flat") || fills[i].classList.contains("empty")) continue;
      fills[i].style.transitionDelay = (from ? 0 : i * 90) + "ms";
      fills[i].style.setProperty("--f", from ? from[i] || "0%" : "0%");
    }
    void grid.offsetWidth;
    for (var j = 0; j < fills.length; j++) fills[j].style.setProperty("--f", to[j]);
    return to;
  }
  function fillsNow(grid) {
    return [].map.call(grid.querySelectorAll(".gfill"), function (f) {
      return getComputedStyle(f).getPropertyValue("--f").trim() || "0%";
    });
  }

  box.innerHTML = head +
    '<div class="mgrid">' + cells(M.v) + '</div>' +
    (M.note ? '<p class="mnote">' + M.note + '</p>' : "") + lock;

  if (!REDUCED) { var g0 = box.querySelector(".mgrid"); if (g0) travel(g0, null); }

  /* Live repaint. The glyphs cross-fade to their new fill, the grams count
     rather than jump, and the furthest nutrient from its target is named once,
     in gold, because that is the single thing worth acting on. */
  window.paintMacros = function (vals, gapName, live) {
    var grid = box.querySelector(".mgrid");
    if (!grid) return;
    /* the first thing logged turns a card of targets, or an empty past day,
       into a card of real grams */
    if (live && (M.mode === "goals" || M.mode === "blank")) {
      M.mode = "targets";
      /* with ?rail=icons the heading belongs to the rail, which rewrites it
         from the same day a moment later, so this card leaves it alone */
      if (!ICONRAIL && h2 && h2.firstChild) h2.firstChild.nodeValue = S.id === "past" || S.id === "missed" ? "What you ate" : "What you have eaten";
      var note = box.querySelector(".mnote");
      if (note && !M.lock) note.remove();
    }
    var olds = [].map.call(grid.querySelectorAll(".mval strong"), function (s) { return +s.getAttribute("data-n") || 0; });
    var wasAt = REDUCED ? null : fillsNow(grid);
    grid.innerHTML = cells(vals);
    if (wasAt) travel(grid, wasAt);
    var news = [].map.call(grid.querySelectorAll(".mval strong"), function (s) { return +s.getAttribute("data-n") || 0; });
    if (olds.length === news.length) {
      var nodes = grid.querySelectorAll(".mval strong");
      run(520, function (t) {
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = fmt(Math.round((olds[i] + (news[i] - olds[i]) * t) * 10) / 10);
      });
    }
    var slot = h2.querySelector(".gapslot");
    if (slot) slot.innerHTML = gapName ? '<span class="gap">' + SPARK + gapName + ' is the gap</span>' : "";
  };
})();

/* ---------- the calorie budget ----------
   Not the fuse. The fuse was decoration and it was the third green graphic in
   a 300px run. Calories are not what the score measures, so they take the
   system's own calorie dressing instead: an indigo wash, a warm flame, and a
   bar that reads as a budget at a glance.                                    */
(function () {
  var host = document.getElementById("calstrip"), C = S.cal;
  var sect = document.getElementById("nutSect");

  /* an explicit ?cal= is the strip picker, so it wins and shows its own numbers */
  var want = Q.get("cal");
  if (want && C.mode === "fuse") {
    loadScripts(["parts/cal.js"], function () {
      var list = (window.PARTS && window.PARTS.cal) || [];
      var opt = list.filter(function (o) { return o.id === want; })[0];
      if (opt) opt.mount(host); else build();
    });
    return;
  }
  build();

  function build() {
  if (C.mode === "loading") {
    host.innerHTML = '<div class="shim" style="height:78px;border-radius:12px;margin-top:12px"></div>';
    return;
  }
  /* nothing logged and no goal: a bar at zero would be a picture of nothing,
     so the block stands down and the card above does the talking. It is only
     hidden, because the first thing logged brings it back. */
  if (C.mode === "hide") host.hidden = true;

  /* the same concentric arcs the system puts behind its calorie numbers */
  /* GoodFlip's own calorie watermark, exported from the design system
     (eIycxrJSM8IOSLgAavFUE4, node 5399:4628): a flame shaped frond of 17
     nested contour lines in #E0EAFF. It used to be concentric circles drawn
     here by hand, which was not the pattern at all. In Figma it is 131x156
     sitting at x+238 of a 340 wide block, so it runs off the right edge. */
  var WM = '<img class="wm" src="../icons/calorie-frond.svg" alt="" aria-hidden="true">';
  /* the one warm gradient in the nutrition set, amber to red */
  /* Shaheer's flame, the filled cut rather than the outlined one, in the
     house ink. Filled because at 16px an outline loses its inner
     detail anyway, and a solid silhouette is the same mark every
     glyph on this screen already is. */
  var FLAME = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +

       f("Garden salad", "1 bowl", 1, 1, 3.5, 0, 3, "Eaten first, it slows everything after it down. That is the whole point of it.")]
    ] },
  { id: "bed", name: "Bedtime", time: "10:00 - 11:00 PM", core: false,
    opts: [[f("Walnut", "1 piece", 2, 0.6, 0.5, 2.6, 0.3, "Two walnuts are for the fat, not the calories. They are the last small thing of the day."),
      f("Chamomile tea", "1 cup", 1, 0, 0.5, 0, 0, "It is here to end the day, not to feed you.")]],
    tips: [{ title: "Soak 5 almonds ready for tomorrow morning", tip: "In a small bowl of water, before bed. Peel them in the morning.", done: false }] }
];

/* Each meal's suggested window, read back out of the line the card already
   shows, in minutes. The app decides a log's meal from the time it was eaten,
   so the window is what the confirm step measures a chosen time against. */
function mins(s) {
  var p = s.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
  var h = +p[1] % 12;
  if (p[3] && p[3].toUpperCase() === "PM") h += 12;
  return h * 60 + +p[2];
}
function clock(t) {
  t = (t + 1440) % 1440;
  var h = Math.floor(t / 60), m = t % 60;
  return (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + " " + (h < 12 ? "AM" : "PM");
}
MEALS.forEach(function (m) {
  var e = m.time.split(" - "), ap = (e[1].match(/AM|PM/i) || [""])[0];
  m.from = mins(/AM|PM/i.test(e[0]) ? e[0] : e[0] + " " + ap);
  m.to = mins(e[1]);
  m.at = m.from + 30; /* where the confirm step opens: half an hour in */
});
/* the meal a time belongs to: the window it falls in, else the nearest one */
function mealAt(t) {
  var best = null, near = 1e9;
  MEALS.forEach(function (m) {
    if (S.diary.mode === "free" && !m.core) return;
    var gap = t < m.from ? m.from - t : t > m.to ? t - m.to : 0;
    if (gap < near) { near = gap; best = m; }
  });
  return best;
}

/* which option each meal is on, and which of its items are logged */
var LOGS = {
  none: {},
  first: { bf: { opt: 1, done: [0] } },
  mid: { pre: { opt: 0, done: [0] }, bf: { opt: 0, done: "all", extras: true }, lunch: { opt: 1, done: [0, 1, 2] } },
  all: { pre: { opt: 0, done: "all" }, bf: { opt: 0, done: "all", extras: true }, lunch: { opt: 1, done: "all" },
    snack: { opt: 0, done: "all" }, dinner: { opt: 0, done: "all" }, bed: { opt: 0, done: "all" } }
};

(function applyLogs() {
  var L = LOGS[S.diary.logged] || LOGS.none;
  MEALS.forEach(function (m) {
    var l = L[m.id];
    m.chosen = l ? l.opt : -1;
    m.show = l ? l.opt : 0;
    m.logExtras = !!(l && l.extras);
    m.opts.forEach(function (items, oi) {
      items.forEach(function (it, ii) {
        it.done = !!(l && oi === l.opt && (l.done === "all" || (l.done || []).indexOf(ii) > -1));
        it.skip = false;
      });
    });
    /* anything logged outside the plan sits in one list above it, whether it
       came with the day or was added by hand just now */
    m.manual = (m.logExtras ? (m.extras || []).slice() : []);
    m.manual.forEach(function (it) { it.done = true; });
    m.tips && m.tips.forEach(function (t) { t.done = S.diary.logged === "all" || (S.diary.logged === "mid" && t.title.indexOf("methi") > -1); });
  });
})();

var sum = function (xs) { return xs.reduce(function (n, x) { return n + x.cal; }, 0); };
var RO = S.diary.mode === "past";

/* ============================================================
   The live day.

   The state table's numbers stay authoritative on open, so every
   documented state still reads exactly as STATES.md says. From
   there each thing ticked, added or removed applies its own
   macros as a delta, and the score is recomputed the real way:
   the mean of four ratios, each capped at its target.
   ============================================================ */
var MK = ["p", "c", "fa", "fb"];
var MNAME = ["Protein", "Carbs", "Fats", "Fibre"];
var TGT = (S.macros.v || []).map(function (v) { return v[1]; });
var SCORED = S.hero.score !== null && TGT.length === 4 && TGT[0];
var GOAL = S.cal.goal || 0;

var LIVE = { cal: S.cal.eaten || 0 };
MK.forEach(function (k, i) { LIVE[k] = ((S.macros.v || [])[i] || [0])[0] || 0; });

/* How a coach's plan food gets logged: "card" (the default) logs it on this
   screen from a bar at the bottom; "logger" sends the tick to the logging
   screen as before. ?plog= picks, and the choice is remembered. */
var PLOG = (function () {
  var v = Q.get("plog");
  try { if (v) localStorage.setItem("gfPlog", v); else v = localStorage.getItem("gfPlog"); } catch (e) {}
  return v === "logger" ? "logger" : "card";
})();
/* a log made from the bar comes back here as the page reloads under the win
   moment: those foods are ticked and counted, once, and only on the same day */
(function inlineLogs() {
  var raw = null;
  try { raw = JSON.parse(sessionStorage.getItem("gfInline") || "null"); sessionStorage.removeItem("gfInline"); } catch (e) {}
  if (!raw || Date.now() - raw.t > 20000 || raw.state !== (Q.get("state") || "")) return;
  var m = MEALS.filter(function (x) { return x.id === raw.meal; })[0];
  if (!m) return;
  raw.refs.forEach(function (ref) {
    var p = ref.split("|"), it = (m.opts[+p[1]] || [])[+p[2]];
    if (it && !it.done) { it.done = true; it.skip = false; apply(it, 1); }
  });
  if (m.chosen < 0) m.chosen = raw.opt;
  m.show = raw.opt;
  /* land at the top, where the score is stepping up, as a log from the logger does */
  try { history.scrollRestoration = "manual"; } catch (e) {}
  window.scrollTo(0, 0);
})();

function rawScore(t) {
  if (!SCORED) return null;
  var s = 0;
  MK.forEach(function (k, i) { s += Math.min(1, TGT[i] ? t[k] / TGT[i] : 0); });
  return Math.round(s / MK.length * 100);
}
/* the table's score wins on open, so the difference between it and the formula
   is carried forward rather than snapping away on the first tick */
var LIFT = SCORED ? S.hero.score - rawScore(LIVE) : 0;
var SHOWN = SCORED ? S.hero.score : null;

function apply(it, sign) {
  MK.forEach(function (k) { LIVE[k] = Math.max(0, Math.round((LIVE[k] + sign * it[k] * it.n) * 10) / 10); });
  LIVE.cal = Math.max(0, LIVE.cal + sign * it.cal);
}

/* the nutrient furthest from its target, which is the one thing worth saying */
function gapIdx() {
  if (!SCORED) return -1;
  var worst = -1, low = 1;
  MK.forEach(function (k, i) {
    var r = TGT[i] ? LIVE[k] / TGT[i] : 1;
    if (r < low) { low = r; worst = i; }
  });
  return low >= 0.999 ? -1 : worst;
}

/* the biggest untouched source of one nutrient still left on today's plan, so
   the fix Kaira offers is always something the day can still do */
function bestLeft(k) {
  var best = null;
  MEALS.forEach(function (m) {
    var items = m.opts[m.chosen < 0 ? m.show : m.chosen] || [];
    items.forEach(function (it) {
      if (it.done || it[k] * it.n <= 0) return;
      if (!best || it[k] * it.n > best.it[k] * best.it.n) best = { it: it, m: m };
    });
  });
  return best;
}
var kairaSay = document.getElementById("kairaSay");
function speak() {
  if (!kairaSay || S.kaira.edu || S.kaira.mode === "loading") return;
  var g = gapIdx();
  if (g < 0) { kairaSay.innerHTML = "<strong>Every target met today.</strong> Worth remembering what you ate, this is the day to repeat."; return; }
  if (LIVE.cal <= 0) { kairaSay.innerHTML = S.kaira.say; return; }
  var lag = "<strong>" + MNAME[g] + " is the one lagging at " + fmt(Math.round(LIVE[MK[g]] * 10) / 10) + "g of " + TGT[g] + "g</strong>";
  var b = bestLeft(MK[g]);
  kairaSay.innerHTML = b
    ? lag + ": the " + b.it.name.toLowerCase() + " at your " + b.m.name.toLowerCase() + " adds " + Math.round(b.it[MK[g]] * b.it.n * 10) / 10 + "g."
    : lag + ", and your plan is finished for today. Anything more has to be added by hand.";
}

var bloomed = S.hero.score === 100;
function refresh() {
  var vals = MK.map(function (k, i) { return [Math.round(LIVE[k] * 10) / 10, TGT[i]]; });
  var g = gapIdx();
  if (window.paintMacros) window.paintMacros(vals, g > -1 && LIVE.cal > 0 ? MNAME[g] : "", LIVE.cal > 0);
  if (window.paintCal) window.paintCal(Math.round(LIVE.cal), GOAL);
  if (SCORED) {
    var next = Math.max(0, Math.min(100, rawScore(LIVE) + LIFT));
    if (window.setHeroScore) window.setHeroScore(next, next - SHOWN);
    SHOWN = next;
    /* the one day everything lands gets one bloom of light, and only once. The
       plate blooms for itself when it can, so the page does not do it twice. */
    if (next === 100 && !bloomed && !REDUCED && !window.HERO_NATIVE) {
      bloomed = true;
      var b = document.createElement("div");
      b.className = "bloom";
      document.body.appendChild(b);
      setTimeout(function () { b.remove(); }, 1700);
    }
    if (next < 100) bloomed = false;
  }
  speak();
  /* the rail, the verdict and the delta all read the same day, so they move
     together with the score rather than going stale behind it */
  if (window.paintRail) window.paintRail();
  if (window.paintVerdict) window.paintVerdict(SHOWN, mealsIn());
  if (window.paintDelta) window.paintDelta(SHOWN, mealsIn());
}

/* ---------- rows ---------- */
function itemRow(it, opts) {
  opts = opts || {};
  var dis = RO;
  var lab = it.skip ? it.name + " was skipped, tap to log it" : it.done ? it.name + " is logged, tap to undo" : "Log " + it.name;
  return '<div class="item' + (it.done ? " done" : "") + (it.skip ? " skipped" : "") + '" data-ref="' + opts.ref + '">' +
    '<button class="tickbtn"' + (dis ? " disabled" : "") + ' aria-label="' + lab + '" aria-pressed="' + (it.done ? "true" : "false") + '">' +
      '<span class="tick' + (it.done ? " on" : "") + '">' + (it.done ? I.check : it.skip ? I.dash : "") + '</span></button>' +
    '<span class="nm">' + it.name + '<span>' + it.qty + '</span></span>' +
    (it.skip ? '<span class="skiptag">Skipped</span>' : it.moved ? '<span class="manual">Moved here</span>' : opts.manual ? '<span class="manual">Manual</span>' : "") +
    (it.skip ? "" : '<span class="kc">' + it.cal + ' cal</span>') +
    (RO ? "" : '<button class="dots" aria-label="Options for ' + it.name + '">' + I.dots + '</button>') + '</div>';
}

function body(m) {
  var h = "";
  if (m.manual.length) h += '<div class="extras">' + m.manual.map(function (it, i) { return itemRow(it, { manual: true, ref: m.id + "|m|" + i }); }).join("") + '</div>';
  h += '<div class="lab">Your coach\'s plan</div>';
  if (m.opts.length > 1) {
    h += '<div class="chips">' + m.opts.map(function (o, i) {
      /* No progress on a chip: options often share foods, so a fill would claim
         two options at once. The chip simply carries a check once any food in
         it is logged. */
      var any = o.some(function (x) { return x.done; });
      return '<button class="chip' + (i === m.show ? " on" : "") + (any ? " done" : "") +
          '" data-meal="' + m.id + '" data-opt="' + i + '"' +
          ' aria-label="Option ' + (i + 1) + (any ? ", logged" : "") + '">' +
        '<span class="ot"><b>Option ' + (i + 1) + '</b></span>' +
        (any ? I.checkG : "") + '</button>';
    }).join("") + '</div>';
  }
  var items = m.opts[m.show];
  /* Another option, while one is already going. Nothing is disabled: what you
     actually ate always goes in. The line is guidance, and it says what the
     coach intended rather than what the screen will not let you do. */
  /* No sentence explaining which option was started. The chip says it: a
     paragraph that repeats what a control already shows is a second copy of
     the same state, and it went stale the moment the chips were able to carry
     progress themselves. */
  /* wrapped, so the 12 between rows is one gap on the parent rather than a
     margin repeated on every child */
  h += '<div class="items">' +
    items.map(function (it, i) { return itemRow(it, { ref: m.id + "|" + m.show + "|" + i }); }).join("") +
    '</div>';
  /* Neither Log all nor Undo all. Writing four foods at once was a shortcut
     past the screen that asks for a quantity and a time, and the undo existed
     only to make that shortcut reversible. What is left is the one thing a
     plan cannot anticipate: that you ate something it does not list. */
  if (!RO) {
    h += '<div class="textrow"><div class="elselab">Had something else?</div>' +
      '<div class="acts">' +
        '<button class="achip elsebtn" data-meal="' + m.id + '">' + I.plusSq + 'Search and log</button>' +
        '<button class="achip k kairabtn" data-meal="' + m.id + '">' + GFKaira.mark(16, { halo: false }) + 'Log with KAIRA</button>' +
      '</div></div>';
  }
  if (m.tips) {
    h += '<div class="tips"><div class="lab">Tips from your coach</div><div class="tiplist">' + m.tips.map(function (t, i) {
      /* a tip's mark is square and grey, not the round green tick, because it
         does not open the confirm step a food's tick opens */
      return '<div class="tip' + (t.done ? " done" : "") + '" data-tip="' + m.id + "|" + i + '"><button class="tickbtn"' + (RO ? " disabled" : "") + ' aria-label="' + (t.done ? "Mark as not done: " : "Mark as done: ") + t.title + '" aria-pressed="' + (t.done ? "true" : "false") + '">' +
        '<span class="tmark' + (t.done ? " on" : "") + '">' + (t.done ? I.check : "") + '</span></button>' +
        /* Kaira's chip takes the info circle's place. A circle could only say
           "there is more about this"; she can actually answer the question the
           tip raises, and the chip says so in words. */
        '<div><div class="tt"><span>' + t.title + '</span>' +
          '<button class="askk" data-tipask="' + m.id + "|" + i + '">' + GFKaira.mark(12, { halo: false }) + 'Ask KAIRA</button>' +
        '</div><div class="td">' + t.tip + '</div></div></div>';
    }).join("") + '</div></div>';
  }
  return h;
}

/* What the meal has taken in. It counts every logged food in the meal, whichever
   option it sat under, so switching the chips changes what you are looking at
   and never what the day adds up to. The target beside it still comes from the
   option on screen. */
function mealCal(m) {
  return m.opts.reduce(function (n, o) {
    return n + sum(o.filter(function (x) { return x.done; }));
  }, sum(m.manual));
}

function card(m) {
  var logged = mealCal(m);
  var target = sum(m.opts[m.show]);
  /* a meal with nothing in it says what it holds, or that the day passed it by,
     rather than opening with a zero */
  var line = logged ? logged + " of " + target + " kcal" : target + " kcal planned";
  return '<section class="meal" id="meal-' + m.id + '">' +
    '<div class="mh">' +
      '<div class="t"><div class="n">' + m.name + '</div>' +
      '<div class="s">Suggested ' + m.time.replace(" - ", "\u2013") + ' · ' + line + '</div></div>' +
      /* no plus here: a planned meal carries "I have eaten something else" at
         the foot of its own list, which says what the button was for */
    '</div>' +
    '<div class="mb"><div><div class="mbi">' + body(m) + '</div></div></div></section>';
}

/* no plan yet: four core meals, nothing to tick, just a way in */
function freeSeed(m) {
  return S.diary.logged ? (m.id === "bf" ? 727 : m.id === "lunch" ? 486 : 0) : 0;
}
function freeCard(m) {
  var logged = freeSeed(m) + sum(m.manual);
  return '<section class="meal" id="meal-' + m.id + '"><div class="mh">' +
    '<div class="t"><div class="n">' + m.name + '</div>' +
    '<div class="s">Suggested ' + m.time.replace(" - ", "\u2013") + (logged ? ' · ' + logged + ' kcal logged' : '') + '</div></div>' +
    '<button class="plus sq" aria-label="Log something for ' + m.name + '" data-meal="' + m.id + '" data-stop="1"><i>' + I.plusSq + '</i></button></div>' +
    (m.manual.length ? '<div class="mb"><div><div class="mbi"><div class="extras">' +
      m.manual.map(function (it, i) { return itemRow(it, { manual: true, ref: m.id + "|m|" + i }); }).join("") + '</div></div></div></div>' : "") +
    '</section>';
}

var diary = document.getElementById("diary");
document.getElementById("secTitle").textContent = S.diary.title;
document.getElementById("secCount").textContent = S.diary.count || "";
if (S.diary.intro) document.getElementById("diaryIntro").innerHTML = '<p class="intro">' + S.diary.intro + '</p>';

function render() {
  if (S.diary.mode === "loading") {
    diary.innerHTML = '<div class="shim shim-card"></div><div class="shim shim-card"></div><div class="shim shim-card"></div>';
    return;
  }
  if (S.diary.mode === "free") {
    diary.innerHTML = MEALS.filter(function (m) { return m.core; }).map(freeCard).join("");
    return;
  }
  var h = MEALS.map(card).join("");
  diary.innerHTML = h;
}
render();

/* how much of the day has actually been logged. The plan mode counts a meal
   with any calories in it, the free mode counts the ones that carry a log. */
/* The first meal of the day that has nothing in it yet, in plan order. It is
   what the rail names instead of counting meals off against a total. */
function nextMealName() {
  var found = null;
  MEALS.forEach(function (m) {
    if (found) return;
    if (S.diary.mode === "free") { if (m.core && freeSeed(m) + sum(m.manual) === 0) found = m.name; }
    else if (mealCal(m) === 0) found = m.name;
  });
  return found;
}

function mealsIn() {
  var n = 0;
  MEALS.forEach(function (m) {
    if (S.diary.mode === "free") { if (m.core && freeSeed(m) + sum(m.manual) > 0) n++; }
    else if (mealCal(m) > 0) n++;
  });
  return n;
}

/* ---------- what shaped your score ----------
   Four glass cards in indigo, sitting directly under a green score. That
   contrast is the point, and it is also the first real answer the screen gives
   to "why is it 54?". Every value is read off the live day, never typed.     */
(function () {
  var host = document.getElementById("rail"), sect = document.getElementById("railSect");
  var title = document.getElementById("railTitle");
  /* a finished day is spoken about in the past tense, here as well as in the
     calorie block beside it */
  var PASTDAY = S.day !== "Today";
  var IC = {
    gap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>',
    near: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>',
    meals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
  };

  /* Two ways of answering "what shaped your score", and this is the second:
     one card per subject instead of one card holding all four. The rail used
     to mix summaries ("your biggest gap", "up next") with a full macro card
     underneath, which said the same numbers twice and left no card that was
     simply about protein. Now each card has exactly one subject and the last
     one is calories, so the reader compares like with like by scrolling
     rather than by scanning across a row.

     The bar is the same measure the glyph fills to in the other variant, laid
     flat. With no target there is nothing to measure against, so the bar is
     left off rather than drawn empty. */
  function cards() {
    var G = ["glyph-protein", "glyph-carbs", "glyph-fats", "glyph-fibre"];
    var M = S.macros, vals = M.v || [], out = [];
    if (M.mode !== "hide" && M.mode !== "loading") {
      MNAME.forEach(function (name, i) {
        var v = vals[i] || [0, 0], had = v[0], tgt = v[1];
        var val = M.mode === "grams" ? fmt(had) + "g"
          : M.mode === "goals" ? "<s>target</s> " + fmt(tgt) + "g"
          : M.mode === "blank" ? "<s>Not logged</s>"
          : fmt(had) + "<s> of " + fmt(tgt) + "g</s>";
        out.push({ glyph: G[i], label: name, value: val,
          pct: M.mode === "targets" && tgt ? Math.min(1, had / tgt) : null,
          over: M.mode === "targets" && tgt ? had > tgt : false });
      });
    }
    /* calories last, because it is the sum the four above add up to */
    var anyFood = LIVE.cal > 0;
    var cv = !GOAL ? (anyFood ? fmt(Math.round(LIVE.cal)) + "<s> kcal</s>" : "<s>None yet</s>")
      : S.cal.mode === "none" ? "<s>None logged</s>"
      : fmt(Math.round(LIVE.cal)) + "<s> of " + fmt(GOAL) + "</s>";
    out.push({ icon: IC.cal, label: "Calories", value: cv,
      pct: GOAL ? Math.min(1, LIVE.cal / GOAL) : null,
      over: GOAL ? LIVE.cal > GOAL : false });
    return out;
  }

  window.paintRail = function () {
    if (S.diary.mode === "loading") {
      if (!ICONRAIL) {
        host.innerHTML = [0, 1, 2].map(function () {
          return '<div class="gf-stat shim-stat"><div class="shim" style="height:14px;width:96px"></div>' +
            '<div class="shim" style="height:20px;width:120px;margin-top:10px"></div></div>';
        }).join("");
      }
      return;
    }
    /* Only ask what shaped a score when there is one. On a day with no plan, a
       day not started and a day nothing was logged on, what sits below answers
       "there is no score", so the question above it was asking for trouble.
       With ?rail=icons the four macros sit there instead, and a day that has

(function () {
  var XI = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32"><path style="fill:var(--g-400)" d="M16 3a13 13 0 1 0 13 13A13.013 13.013 0 0 0 16 3m4.708 16.293a1 1 0 0 1-1.415 1.415L16 17.414l-3.293 3.293a1 1 0 0 1-1.415-1.415L14.587 16l-3.293-3.293a1 1 0 1 1 1.415-1.415L16 14.587l3.293-3.293a1 1 0 0 1 1.415 1.415L17.414 16z"/></svg>';

        return;
      }
      if (b.dataset.act === "skip" || b.dataset.act === "unskip") {
        var on = b.dataset.act === "skip", was = it.done;
        setSkip(m, it, on);
        window.closeSheets();
        repaint(m, ref);
        refresh();
        if (on) toast(it.name + " marked as skipped", function () {
          setSkip(m, it, false);
          if (was) setDone(m, it, true);
          repaint(m, ref);
          refresh();
        });
        return;
      }
      /* remove: the row goes, and the toast holds the way back */
      var was = it.done, at = t.i;
      if (was) apply(it, -1);
      t.list.splice(at, 1);
      it.done = false;
      window.closeSheets();
      repaint(m);
      refresh();
      toast(it.name + " removed", function () {
        t.list.splice(at, 0, it);
        if (was) { it.done = true; apply(it, 1); }
        repaint(m);
        refresh();
      });
    });
  }

  function qty(m, it, ref) {
    var n = it.n;
    var el = openSheet("it-sheet", it.name, '<div class="qty"><span class="lab2">How much did you have?</span>' +
      '<span class="st"><button data-q="-1" aria-label="Less">&minus;</button><b id="qn"></b><button data-q="1" aria-label="More">+</button></span></div>' +
      '<p class="cfcal" id="qc"></p><button class="ok" data-save="1">Save</button>');
    var nb = el.querySelector("#qn"), cb = el.querySelector("#qc");
    var per = Math.round(it.p * 4 + it.c * 4 + it.fa * 9);
    function paint() {
      nb.textContent = n + " x " + it.unit;
      cb.textContent = per * n + " cal, " + Math.round(it.p * n * 10) / 10 + "g protein";
      el.querySelector('[data-q="-1"]').disabled = n <= 1;
    }
    paint();
    el.querySelector(".sbody").addEventListener("click", function (e) {
      var s = e.target.closest("[data-q]");
      if (s) { n = Math.max(1, Math.min(6, n + +s.dataset.q)); return paint(); }
      if (!e.target.closest("[data-save]")) return;
      if (it.done) apply(it, -1);
      it.n = n;
      it.qty = n > 1 ? n + " x " + it.unit : it.unit;
      it.cal = per * n;
      if (it.done) apply(it, 1);
      window.closeSheets();
      repaint(m, it.done ? ref : "");
      refresh();
    });
  }

  /* ---------- the confirm step on a tick ----------
     A tick is a log, and a log carries a quantity and a time. The time is not
     decoration: it is what decides which meal the food lands in, so when the
     chosen time sits in another meal's window the sheet says so before you
     agree to it. */
  var CLOCKI = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0M12 7v5l3 2"/></svg>';

  function confirmLog(m, it, ref) {
    var n = it.n, t = typeof it.at === "number" ? it.at : m.at;
    var per = Math.round(it.p * 4 + it.c * 4 + it.fa * 9);
    var el = openSheet("it-sheet", it.name,
      '<div class="qty cfrow"><span class="lab2">How much did you have?</span>' +
      '<span class="st"><button data-q="-1" aria-label="Less">&minus;</button><b id="qn"></b><button data-q="1" aria-label="More">+</button></span></div>' +
      '<p class="cfcal" id="qc"></p>' +
      '<div class="qty cfrow" style="margin-top:12px;padding-top:14px"><span class="lab2">When did you have it?</span>' +
      '<span class="st"><button data-t="-15" aria-label="Earlier">&minus;</button><b id="tn"></b><button data-t="15" aria-label="Later">+</button></span></div>' +
      '<div class="cfmove" id="mv" hidden>' + CLOCKI + '<p style="margin:0" id="mvt"></p></div>' +
      '<button class="ok" data-save="1">Log it</button>');
    var nb = el.querySelector("#qn"), cb = el.querySelector("#qc"), tb = el.querySelector("#tn"),
      mv = el.querySelector("#mv"), mvt = el.querySelector("#mvt");
    function dest() { return mealAt(t) || m; }
    function paint() {
      nb.textContent = n + " x " + it.unit;
      cb.textContent = per * n + " cal, " + Math.round(it.p * n * 10) / 10 + "g protein";
      tb.textContent = clock(t);
      el.querySelector('[data-q="-1"]').disabled = n <= 1;
      var d = dest();
      mv.hidden = d === m;
      if (d !== m) mvt.textContent = clock(t) + " falls in your " + d.name.toLowerCase() + ", so it will be logged there.";
    }
    paint();
    el.querySelector(".sbody").addEventListener("click", function (e) {
      var q = e.target.closest("[data-q]"), s = e.target.closest("[data-t]");
      if (q) { n = Math.max(1, Math.min(6, n + +q.dataset.q)); return paint(); }
      if (s) { t = (t + +s.dataset.t + 1440) % 1440; return paint(); }
      if (!e.target.closest("[data-save]")) return;
      var d = dest();
      window.closeSheets();
      if (d === m) {
        /* the quantity and the time belong to the log, so the plan row only
           takes them when the log is what the plan row becomes */
        it.n = n;
        it.qty = n > 1 ? n + " x " + it.unit : it.unit;
        it.cal = per * n;
        it.at = t;
        setDone(m, it, true);
        repaint(m, ref);
        refresh();
        toast(it.name + " logged at " + clock(t), function () {
          setDone(m, it, false);
          repaint(m, ref);
          refresh();
        });
        return;
      }
      /* the time sent it elsewhere, so that is where it shows up */
      var mv2 = f(it.name, it.unit, n, it.p, it.c, it.fa, it.fb, it.why);
      mv2.done = true; mv2.moved = true; mv2.at = t;
      d.manual.push(mv2);
      apply(mv2, 1);
      repaint(d);
      refresh();
      toast(it.name + " logged in " + d.name.toLowerCase() + " at " + clock(t), function () {
        d.manual.splice(d.manual.indexOf(mv2), 1);
        apply(mv2, -1);
        repaint(d);
        refresh();
      });
    });
  }

  /* ---------- wiring ---------- */
  diary.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (chip) {
      var cm = byId(chip.dataset.meal);
      cm.show = +chip.dataset.opt;
      repaint(cm);
      return;
    }

    var dots = e.target.closest(".dots");
    if (dots) return itemMenu(dots.closest(".item").dataset.ref);

    var plus = e.target.closest(".plus");
    if (plus) return goLog("plus", plus.dataset.meal);

    /* "I have eaten something else": the one way into logging a planned meal
       leaves from, now that Log all is gone. It opens the tray empty, because
       whatever is being added is by definition not on the plan. */
    var els = e.target.closest(".elsebtn");
    if (els) {
      /* a push, not a cut: this screen eases left and dims while the logger
         slides in over it (assets/search-push.js), and the logger opens with
         the search field focused and the keyboard up */
      try { sessionStorage.setItem("gfPush", "search"); } catch (err) {}
      if (REDUCED || !document.body.animate) return goLog("plus", els.dataset.meal);
      document.body.animate([{ transform: "none", opacity: 1 }, { transform: "translateX(-24%)", opacity: .55 }],
        { duration: 220, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" });
      return setTimeout(function () { goLog("plus", els.dataset.meal); }, 200);
    }

    /* The two Kaira entries. The prototype has no conversation behind her yet,
       so both open a sheet that says what she would do rather than pretending
       to do it. ponytail: one sheet for both, split it when she is real. */
    var kb = e.target.closest(".kairabtn");
    if (kb) return openSheet("kairasheet", "Log with KAIRA",
      '<div class="why quiet">' + GFKaira.mark(20, { halo: false }) +
      '<p>Tell KAIRA what you ate in your own words, "two rotis and dal", and KAIRA works out the foods, ' +
      'the quantities and the calories. Nothing is logged until you confirm it.</p></div>');
    var ta = e.target.closest(".askk");
    if (ta) {
      var tq = ta.dataset.tipask.split("|"), qm = byId(tq[0]), qt = qm.tips[+tq[1]];
      return askKaira(qt.title);
    }

    var tick = e.target.closest(".tickbtn");
    if (!tick || tick.disabled) return;

    var tip = tick.closest(".tip");
    if (tip) {
      var tp = tip.dataset.tip.split("|"), tm = byId(tp[0]), t = tm.tips[+tp[1]];
      t.done = !t.done;
      /* only doing a tip is celebrated. Taking one back is a correction, and
         a correction that throws confetti reads as mockery. */
      repaint(tm, tip.dataset.tip);
      return;
    }

    var row = tick.closest(".item");
    if (!row) return;
    var tgt = find(row.dataset.ref), item = tgt.list[tgt.i];
    /* Ticking a coach's food is the start of a log, not the whole of it, so it
       goes where every other log goes rather than asking here. The logging
       screen opens on Your plan, on the option this card is showing, with the
       ticked food already in the tray, so the person sees the thing they chose
       and can still change the quantity and the time before it is written.
       A food added by hand is not on the plan and has no option to open on, so
       it keeps the confirm sheet.

       Pressing the mark on a food already logged opens its menu rather than
       undoing it. Undo was the one destructive thing on this card reachable in
       a single tap, on a 24px mark sitting beside the name people press to
       read about the food, and the toast was the only thing standing behind
       it. The menu names what it is about to do first, and still holds Change
       the quantity, which is what most of those taps actually wanted. */
    if (!item.done) {
      if (tgt.manual) return confirmLog(tgt.m, item, row.dataset.ref);
      /* the "On the card" variant (the default): the plan is logged right here,
         one meal at a time, from a bar at the bottom (assets/plan-tray.js) */
      if (PLOG === "card" && window.GFPlanTray) return GFPlanTray.toggle({ m: tgt.m, ref: row.dataset.ref, it: item });
      return goLog("tick", tgt.m.id, { opt: tgt.m.show, food: LOGID[item.name], qty: item.n });
    }
    return itemMenu(row.dataset.ref);
  });

  /* Snap and Voice, wherever Kaira offers them. They open the logging screen at
     the meal the clock is in, which is the same meal a food logged now would
     land in. Kaira's own button is her sheet's, not this screen's. */
  document.addEventListener("click", function (e) {
    var now = new Date(), nm = mealAt(now.getHours() * 60 + now.getMinutes());
    var door = e.target.closest("[data-door]");
    if (door) return goLog(door.dataset.door, nm && nm.id);
    /* Logging a day from memory is a typing job, not a speaking one, and the
       button's own pencil icon says so. It used to open the microphone. */
    if (e.target.closest(".logday")) return goLog("search", nm && nm.id);
  });

  /* cards arrive in order on open, which is enough to make the page feel built
     rather than dumped */
  if (!REDUCED) {
    [].forEach.call(document.querySelectorAll("#diary .meal"), function (el, i) {
      el.classList.add("rise");
      el.style.animationDelay = Math.min(i, 5) * 55 + 60 + "ms";
    });
  }
})();
</script>
<script src="chrome.js"></script>
<script src="assets/kaira-aurora.js?v=3"></script>
</body>
