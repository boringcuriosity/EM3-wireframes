<style>
  /* ============================================================
     Mind's Trend, coming soon. Move's screen (move/trend.html), itself Nutrition's
     (v7/r3/trend-soon.html?v=fan, a hand of four cards dealt one by one), copied so every
     tap stays inside Mind. The cards speak for sleep and the day's calm, in Mind's gold. No KAIRA.
     No header, the nav as on the Trend tab. Motion plays once and
     ends still. A tap on the art plays it again.
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #fff; font-family: Roboto, Arial, sans-serif; letter-spacing: .25px; color: var(--g-900); -webkit-font-smoothing: antialiased; }
  button { font: inherit; letter-spacing: inherit; }
  .col { position: relative; max-width: var(--col); margin: 0 auto; min-height: 100vh; padding-bottom: 96px; overflow-x: hidden; background: #fff; display: flex; flex-direction: column; }
  .gut { padding-left: var(--gut); padding-right: var(--gut); }
  .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .backico { width: 22px; height: 22px; fill: currentColor; stroke: none; flex-shrink: 0; }

  .soon { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px var(--gut) 48px; }
  .art { position: relative; width: 100%; height: 260px; display: grid; place-items: center; cursor: pointer; }
  .art::before { content: ""; position: absolute; inset: 10px 8px; border-radius: 50%; background: radial-gradient(closest-side, var(--gold-50), rgba(255,251,238,0)); }
  .art > * { position: relative; }
  .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 12px 4px 8px; border-radius: 9999px; background: var(--gold-100); color: var(--olive-700); font: 600 12px/18px Roboto, sans-serif; }
  .pill svg { width: 14px; height: 14px; color: var(--gold-800); }
  .soonchip { margin-top: 8px; }
  .soonchip svg { width: 12px; height: 12px; }
  h1 { margin: 14px 0 0; font: 600 28px/36px "Playfair Display", serif; letter-spacing: 0; color: var(--g-900); text-wrap: balance; }
  h1 em { font-style: normal; color: var(--brand-600); }
  .body { margin: 10px 0 0; max-width: 320px; font: 400 15px/23px Roboto, sans-serif; color: var(--g-600); text-wrap: pretty; }
  /* a slim rule that fades out at both ends, setting the nudge apart */
  .nudge::before { content: ""; display: block; width: 200px; height: 1px; margin: 0 auto 14px; background: linear-gradient(90deg, rgba(208,213,221,0), #D0D5DD 50%, rgba(208,213,221,0)); }
  .nudge { margin: 16px 0 0; font: 500 15px/22px Roboto, sans-serif; color: var(--g-700); }

  /* the words arrive after the art, one step apart */
  .up { opacity: 0; transform: translateY(8px); animation: up .5s cubic-bezier(.4,0,.2,1) var(--d, 0s) forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }

  /* ---------- glimpse cards: what Trend will hold, as four small cards ---------- */
  .gc { width: 168px; height: 116px; padding: 11px 12px 10px; border-radius: 16px; background: #fff; text-align: left;
    box-shadow: 0 0 0 1px var(--g-200), 0 12px 22px -14px rgba(16,24,40,.28); display: flex; flex-direction: column; gap: 6px; }
  .gc .lb { display: flex; align-items: center; gap: 5px; font: 600 11px/14px Roboto, sans-serif; color: var(--g-600); letter-spacing: .2px; }
  .gc .lb i { width: 14px; height: 14px; background: var(--g-500); -webkit-mask: var(--g) center / contain no-repeat; mask: var(--g) center / contain no-repeat; }
  .gc .bd { flex: 1; position: relative; min-height: 0; }
  .gc svg { width: 100%; height: 100%; overflow: visible; }
  .gc.bars .bd { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 2px; }
  .gc.bars .bd b { width: 13px; border-radius: 5px 5px 3px 3px; background: linear-gradient(180deg, #F3D161, #FDE8A4); }
  .gc.bars .bd b.t { background: var(--gold-50); border: 1.5px dashed var(--gold-700); }
  .gc.avg .bd { display: flex; align-items: center; gap: 10px; }
  .fan .gc.avg .rn, .bn .gc.avg .rn { width: 44px; height: 44px; }
  .fan .gc .lb { font-size: 10px; }
  .bn .gc.kai .ln:nth-child(3) { display: none; }
  .bn .gc.kai .ln { margin-top: 6px; }
  .gc.avg .rn { width: 58px; height: 58px; flex: none; }
  .gc.avg .sk { display: block; height: 8px; border-radius: 5px; background: #F2F4F7; }
  .gc.avg .up { opacity: 1; transform: none; animation: none; display: inline-flex; align-items: center; gap: 3px; margin-top: 8px; padding: 2px 7px; border-radius: 9999px; background: var(--gold-50); color: #826E2D; font: 600 10px/14px Roboto, sans-serif; white-space: nowrap; }
    
  .gc.kai .orb { width: 18px; height: 18px; margin: -2px 0; background: url(/v7/icons/trend-kaira-mark.png) center / contain no-repeat; }
  .gc.kai .ln { display: block; height: 8px; border-radius: 5px; background: #F2F4F7; margin-top: 7px; }
  /* fan: a hand of cards, dealt one by one */
  .fan { position: relative; width: 320px; height: 230px; }
  .fan .gc { position: absolute; left: 50%; top: 50%; width: 124px; height: 112px; margin: -56px 0 0 -62px; padding: 10px; opacity: 0; transform-origin: 50% 130%;
    animation: dealf .75s cubic-bezier(.2,0,0,1) var(--d) forwards; }
  @keyframes dealf { from { opacity: 0; transform: translateY(40px) rotate(0); } to { opacity: 1; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }

  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--col); background: #fff; border-top: 1px solid var(--g-200); display: flex; padding: 8px 6px calc(8px + var(--gf-home-h, 20px) + env(safe-area-inset-bottom, 0px)); z-index: 20; }
  .nav a, .nav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--g-500); cursor: pointer; min-height: 48px; justify-content: center; text-decoration: none; }
  .nav .on { color: var(--brand-600); font-weight: 700; }
  .nav .on .ico { stroke-width: 2.4; }
  .nav .ico { width: 22px; height: 22px; stroke-width: 1.8; }
  .nav .on .ico { stroke-width: 2.4; }
</style>
</head>
<body>

<script>
const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
/* the score's verdict chip, in its gold state: the conic edge, the soft fill */
const pill = d => '<span class="gf-verdict warn soonchip up" style="--d:' + d + 's">' + CLOCK + 'Coming soon</span>';
const V = {
  fan: { art: () => glimpse("fan"), t: 0 },   /* the words land at once; the cards deal in after them */
};
/* the four glimpse cards, laid out four ways */
const G = "/v7/icons/glyph-";
const CARDS = [
  () => '<div class="gc mac"><span class="lb">Your sleep</span><div class="bd"><svg viewBox="0 0 144 60" preserveAspectRatio="none" fill="none">' +
    [["M2 44 C 30 40, 44 22, 72 26 S 116 12, 142 8", 1], ["M2 30 C 26 34, 50 40, 76 34 S 118 28, 142 30", .55], ["M2 52 C 34 50, 56 46, 84 48 S 122 40, 142 42", .3]]
      .map(([d, o]) => '<path d="' + d + '" stroke="#CDA935" stroke-opacity="' + o + '" stroke-width="2.4" stroke-linecap="round"/>').join("") + '</svg></div></div>',
  () => '<div class="gc bars"><span class="lb">How you did</span><div class="bd">' + [70, 86, 58, 94, 76, 40, 0].map((h, i) => '<b' + (i === 5 ? ' class="t"' : '') + ' style="height:' + (i === 6 ? 6 : h) + '%' + (i === 6 ? ';background:#F2F4F7' : '') + '"></b>').join("") + '</div></div>',
  () => '<div class="gc avg"><span class="lb">Where you stand</span><div class="bd"><svg class="rn" viewBox="0 0 58 58" fill="none"><circle cx="29" cy="29" r="24" stroke="#FFF8E0" stroke-width="7"/><circle cx="29" cy="29" r="24" stroke="#E7C144" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="78 100" transform="rotate(-90 29 29)"/></svg>' +
    '<div style="flex:1"><span class="sk" style="width:44px;height:14px;border-radius:7px;background:#FFF8E0"></span><span class="sk" style="width:62px;margin-top:6px"></span><span class="up">&#8593; this week</span></div></div></div>',
  /* in place of Nutrition's KAIRA card: when you went to bed, night by night */
  () => '<div class="gc kai"><span class="lb">When you slept</span><div class="bd">' + [100, 62, 84, 30].map(w => '<span class="ln" style="width:' + w + '%;background:' + (w > 60 ? '#FDE8A4' : '#F2F4F7') + '"></span>').join("") + '</div></div>',
];
function glimpse(kind) {
  const c = CARDS.map(f => f());
  const st = (html, style) => html.replace('class="gc', 'style="' + style + '" class="gc');
  if (kind === "fan") {
    const P = [["-96px", "16px", "-12deg"], ["-32px", "-4px", "-4deg"], ["32px", "-4px", "4deg"], ["96px", "16px", "12deg"]];
    return '<div class="fan">' + c.map((h, i) => st(h, "--x:" + P[i][0] + ";--y:" + P[i][1] + ";--r:" + P[i][2] + ";--d:" + (.45 + i * .14) + "s;z-index:" + i)).join("") + '</div>';
  }
}
/* one message on every version: what's coming, and what to do meanwhile */
const TITLE = 'Trends are on the way';
const BODY = "Soon you'll see how your Rhythm moves, week after week: your sleep, your wind-down and the calm in your day.";
const NUDGE = "Keep logging your sleep and your day, and your trends will be ready soon.";
const v = V.fan;
function render() {
  const t = v.t;
  document.getElementById("soon").innerHTML =
    '<div class="art" id="art">' + v.art() + '</div>' + pill(t) +
    '<h1 class="up" style="--d:' + (t + .08) + 's">' + TITLE + '</h1>' +
    '<p class="body up" style="--d:' + (t + .16) + 's">' + BODY + '</p>' +
    '<p class="nudge up" style="--d:' + (t + .2) + 's">' + NUDGE + '</p>';
  const art = document.getElementById("art");
  const tk = document.getElementById("tk");
  if (tk) {
    /* a swipe moves the dots; the art doesn't replay on tap, so swiping stays swiping */
    art.style.cursor = "default";
    tk.addEventListener("scroll", () => { const i = Math.round(tk.scrollLeft / 232); art.querySelectorAll(".dots i").forEach((d, j) => d.classList.toggle("on", j === i)); }, { passive: true });
  } else art.onclick = render;
}
render();
</script>
