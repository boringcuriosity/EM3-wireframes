</head><body><div class="g" id="g"></div>

// ponytail: side-by-side review of one character style, ?s=a..f picks the file
var q=new URLSearchParams(location.search), s=q.get('s')||'a';
var css=[...document.styleSheets];
document.write('<script src="/v7/mind/breath-lab/'+(s==='frames'?'frames':'chars-'+s)+'.js"><\/script>');
</script>
<script>
(function(){ // copy the phone frame CSS from index.html
 fetch('/v7/mind/breath-lab/index.html').then(r=>r.text()).then(t=>{var m=t.match(/<style>([\s\S]*?)<\/style>/);var st=document.createElement('style');st.textContent=m[1].replace(/body \{[^}]*\}/,'');document.head.appendChild(st);
 Object.keys(LAB.V).forEach(k=>LAB.V[k].forEach(v=>{if(!/^([a-f]|frames)-/.test(v.id))return;var c=document.createElement('div');c.className='c';c.innerHTML='<b>'+v.id+'</b>';document.getElementById('g').appendChild(c);LAB.phone(c,k,v);}));
 setTimeout(()=>LAB.kick(),300);});
