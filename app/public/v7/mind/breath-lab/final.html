<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathing, Final</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap">
<style>
  :root { --ink: #101828; --sub: #475467; --mute: #667085; --line: #EAECF0; --gold: #A68A2D; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; color: var(--ink); font: 400 15px/22px Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 32px 24px 96px; }
  .top { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .eyebrow { font: 600 12px/16px Roboto; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold); }
  h1 { font: 600 36px/44px "Playfair Display", serif; margin: 8px 0 8px; }
  .lede { max-width: 760px; color: var(--sub); margin: 0; }
  .ctl { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ctl button, .ctl a { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: 500 13px Roboto; color: var(--sub); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .ctl button[aria-pressed=true] { background: #FFF8E0; border-color: #F3D161; color: #5C4E1F; }
  section { margin-top: 48px; }
  section > h2 { font: 600 24px/32px Roboto; margin: 0; }
  section > .pat { color: var(--mute); margin: 4px 0 4px; }
  section > .why { color: var(--sub); margin: 0 0 20px; max-width: 820px; }
  .row { display: flex; gap: 28px; overflow-x: auto; padding: 4px 4px 16px; scroll-snap-type: x proximity; }
  .card { flex: 0 0 320px; scroll-snap-align: start; display: flex; flex-direction: column; }
  .card .lp { margin-top: auto; }
  .card h3 { font: 600 16px/22px Roboto; margin: 0 0 2px; }
  .card .id { font: 500 12px Roboto; color: var(--mute); }
  .card p { font-size: 13px; line-height: 19px; color: var(--sub); margin: 4px 0 12px; min-height: 57px; }
  .card .ref { font-size: 12px; color: var(--mute); margin: -8px 0 12px; min-height: 18px; }
  .empty { color: var(--mute); font-style: italic; padding: 24px 0; }

  /* the phone: the Mind player's frame (v7/mind/variants/breath.js, look f) */
  .lp { position: relative; width: 320px; height: 640px; border-radius: 28px; border: 1px solid var(--line); overflow: hidden;
    background: linear-gradient(180deg, #FFFDF5 0%, #FFFFFF 46%, #FFFFFF 100%); box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 12px 32px -12px rgba(16,24,40,.12);
    display: flex; flex-direction: column; align-items: center; color: #5C4E1F; }
  .lp-top { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 44px 16px 0; font: 500 13px Roboto; position: relative; z-index: 2; }
  .lp-x { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.7); }
  .lp-x svg { width: 20px; height: 20px; }
  .lp-n { flex: 1; text-align: center; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lp-tm { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .lp-stage { position: relative; width: 320px; height: 360px; margin-top: 8px; overflow: hidden; }
  .lp-w { font: 300 32px/38px Roboto; letter-spacing: .3px; margin-top: 4px; position: relative; z-index: 2; }
  .lp-c { font: 500 15px/20px Roboto; color: #A68A2D; font-variant-numeric: tabular-nums; margin-top: 6px; min-height: 20px; position: relative; z-index: 2; }
  .lp-s { font-size: 13px; line-height: 18px; color: #667085; margin-top: 2px; position: relative; z-index: 2; }
  .lp-b { position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; gap: 12px; z-index: 2; }
  .lp-b button { height: 48px; border-radius: 8px; font: 600 15px Roboto; cursor: pointer; }
  .lp-end { flex: 1; border: 1px solid #A6E9C9; background: #fff; color: #2A805A; }
  .lp-pp { flex: 1; border: 0; background: #299D6B; color: #fff; display: grid; place-items: center; }
  .lp-pp svg { width: 22px; height: 22px; }
  .lp.dark { color: #F2F4F7; border-color: #1D2939; }
  .lp.dark .lp-x { background: rgba(255,255,255,.08); }
  .lp.dark .lp-s { color: #98A2B3; }
  .lp.dark .lp-c { color: #FDE8A4; }
  .lp.dark .lp-end { background: transparent; border-color: #344054; color: #D0D5DD; }
  @media (max-width: 600px) { .wrap { padding: 20px 16px 64px; } h1 { font-size: 28px; line-height: 36px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div>
    <div class="eyebrow">Mind · Breathing · Final</div>
    <h1>The agreed breathing visuals</h1>
    <p class="lede">One screen per breathing, added as each is agreed. <a href="/v7/mind/breath-lab/index.html" style="color:#2A805A">All the variants</a> · <a href="/v7/mind/breath-lab/FINAL.md" style="color:#2A805A">The spec</a></p>
  </div></div>
  <div class="ctl"><button id="rm" aria-pressed="false">Reduced motion</button><button id="sp" aria-pressed="false">2× speed</button></div>
  <div id="secs"></div>
</div>
<script src="/v7/mind/breath-lab/lab.js"></script>
<script src="/v7/mind/breath-lab/final.js"></script>
<script src="/v7/mind/breath-lab/ai-frames.js"></script>
<script src="/v7/mind/breath-lab/final-list.js"></script>
<script>
(function () {
  /* the final list lives in final-list.js (LAB.FINAL), shared with the patient player */
  var FINAL = LAB.FINAL_ORDER.map(function (k) { var f = LAB.FINAL[k]; return [k, f.look, f.desc, f.visual()]; });
  var host = document.getElementById("secs");
  FINAL.forEach(function (f) {
    var P = LAB.PAT[f[0]], s = document.createElement("section"); s.id = f[0];
    s.innerHTML = "<h2>" + P.name + "</h2><div class=\"pat\">" + P.seq.map(function (x) { return x[2] + " " + x[1] + " s"; }).join(" · ") + "</div><p class=\"why\"><b>" + f[1] + ".</b> " + f[2] + "</p><div class=\"row\"><div class=\"card\"></div></div>";
    host.appendChild(s);
    LAB.phone(s.querySelector(".card"), f[0], f[3]);
  });
  var rm = document.getElementById("rm"), sp = document.getElementById("sp");
  LAB.reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; rm.setAttribute("aria-pressed", LAB.reduced);
  rm.onclick = function () { LAB.reduced = !LAB.reduced; rm.setAttribute("aria-pressed", LAB.reduced); };
  sp.onclick = function () { LAB.speed = LAB.speed === 2 ? 1 : 2; sp.setAttribute("aria-pressed", LAB.speed === 2); };
  LAB.kick();
})();
</script>
</body>
</html>
