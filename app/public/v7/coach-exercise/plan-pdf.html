<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move plan PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Onest:wght@400;500;600;700&display=swap">
<!-- The Move plan as the patient keeps it: printed, or shared on WhatsApp as a PDF, and opened on the day.
     Every day can differ, so the plan reads day by day: each day's steps goal, then its workouts and small moves
     under the time of day they belong to.

     FOR DEVELOPMENT
     Render this page with the plan, then print it to PDF (A4, no browser header or footer), for example headless Chrome:
       chrome --headless=new --no-pdf-header-footer --print-to-pdf=plan.pdf "file:///…/plan-pdf.html?plan=cases"
     Data: one JSON object, read here from localStorage "gfMovePlanPdf" (swap that one line for your API response):
       { name, patient, coach, start: "YYYY-MM-DD", nowalk: bool,
         parts: [{ k: "morning", label: "Morning", from: "06:00", to: "12:00" }, …afternoon, evening, night],
         weeks: [{ week_no, days: [{ day_no, rest_day: "Y"|"N", routines: [{ routine_no, time: part k or "",
           exercises: [{ title, exerciseType, reps, sets, rest_post_sets, rest_post_sets_unit, rest_post_exercise, rest_post_exercise_unit,
                         duration, duration_units: "min"|"sec", met (optional, the intensity level the coach picked) }] }] }] }],
         steps: { "week_no-day_no": 8000 or "off" },            no key = not set
         neat:  { "week_no-day_no": { morning: [{ title, sub }], … } },   small moves per part of the day
         noff:  { "week_no-day_no": true } }                     a no small moves day
     Effort, MET and kcal come from the exercise MET list (data/exercise-lists.js, inlined in the shareable copy):
       kcal = MET × 3.5 × 65 ÷ 200 × minutes; effort = the picked level, else MET bands (under 1.5 Very light, under 3 Light, under 6 Moderate, else Vigorous).
     Samples: ?plan=simple (1 week, as the live "simple plan.pdf"), ?plan=exercise (2 weeks, two routines a day), ?plan=cases (every kind of day:
       rest, no steps, no small moves, all off, few to many small moves). ?print=1 opens the print dialog. -->
<script src="/v7/data/exercise-lists.js"></script>
<style>
  /* colours: GoodFlip tokens only (goodflip-design.vercel.app/foundations/colors). Neutrals carry the page, colour is the exception */
  :root {
    --green: #299d6b;        /* text-flipgreen, border-flipgreen-active */
    --deep: #2a805a;         /* background-flipgreen-highlight-strong */
    --tint: #f3fcf8;         /* background-flipgreen-subtle */
    --ink: #101828;          /* text-primary */
    --body: #344054;         /* text-secondary */
    --muted: #667085;        /* text-tertiary */
    --faint: #98a2b3;        /* text-disabled */
    --line: #e4e7ec;         /* border-strong */
    --line2: #f2f4f7;        /* border-default */
    --soft: #f9fafb;         /* background-secondary */
    --page: #f2f4f7;         /* background-tertiary */
    --morning: #dc6803; --morning-t: #fffaeb;     /* text-orange, background-orange */
    --afternoon: #a68a2d; --afternoon-t: #fffbee; /* icon-gold-strong, background-gold */
    --evening: #299d6b; --evening-t: #e6faf1;     /* text-flipgreen, background-flipgreen */
    --night: #444ce7; --night-t: #eef4ff;         /* text-indigo, background-indigo */
    --any: #667085; --any-t: #f2f4f7;             /* text-tertiary, background-tertiary */
  }
  @page { size: A4; margin: 13mm 13mm 15mm;
    @bottom-left { content: var(--foot, "GoodFlip Move plan"); font: 500 8pt Onest, sans-serif; color: #98a2b3; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 500 8pt Onest, sans-serif; color: #98a2b3; } }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; background: var(--page); font: 400 9.5pt/1.45 Onest, system-ui, sans-serif; color: var(--body); }
  h1, h2 { font-family: Montserrat, Onest, sans-serif; color: var(--ink); margin: 0; }

  /* screen: one A4 column, with a bar to save the PDF */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  .bar b { flex: 1; font: 600 14px Onest, sans-serif; color: var(--ink); }
  .bar button { height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--green); color: #fff; font: 600 14px Onest, sans-serif; cursor: pointer; }
  .bar button:hover { background: var(--deep); }
  .doc { width: 210mm; margin: 24px auto 48px; padding: 13mm; background: #fff; border-radius: 4px; box-shadow: 0 1px 3px var(--line); }
  @media print { body { background: #fff; } .bar { display: none; } .doc { width: auto; margin: 0; padding: 0; box-shadow: none; border-radius: 0; } }
  @media screen and (max-width: 820px) { .doc { width: auto; margin: 12px; padding: 20px 16px; } }

  /* the plan's head: who it is for, from whom, and when */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 6mm; padding-bottom: 5mm; margin-bottom: 6mm; border-bottom: 1.5px solid var(--green); }
  .head img { display: block; height: 22px; margin-bottom: 4mm; }
  h1 { font-size: 20pt; line-height: 1.15; font-weight: 800; }
  .who { margin-top: 1.5mm; font-size: 9.5pt; }
  .who b { color: var(--ink); font-weight: 600; }
  .dates { flex: none; text-align: right; font: 600 9.5pt Onest, sans-serif; color: var(--ink); }
  .dates small { display: block; font-weight: 500; color: var(--muted); }

  /* a day */
  .day { margin-bottom: 7mm; }
  .dh { display: flex; align-items: center; gap: 3.5mm; padding: 2.5mm 0 3mm; border-bottom: 1px solid var(--line); break-after: avoid; break-inside: avoid; }
  .dd { flex: none; width: 13mm; padding: 1.2mm 0 1.5mm; border-radius: 8px; background: var(--deep); color: #fff; text-align: center; line-height: 1.05; }
  .dd small { display: block; font: 700 6.5pt Onest, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .dd b { display: block; font: 800 14pt Montserrat, sans-serif; }
  .dti { flex: 1; min-width: 0; }
  .dti h2 { font-size: 12pt; font-weight: 800; }
  .dti h2 span { margin-left: 2mm; font: 600 8.5pt Onest, sans-serif; color: var(--faint); }
  .dsum { margin-top: .5mm; font-size: 8.5pt; color: var(--muted); }
  .dsum b { color: var(--ink); font-weight: 600; }
  .stp { flex: none; display: flex; align-items: center; gap: 2mm; padding: 1.8mm 3mm; border-radius: 9px; background: var(--tint); color: var(--deep); font: 700 10pt Onest, sans-serif; font-variant-numeric: tabular-nums; }
  .stp svg { width: 14px; height: 14px; }
  .stp small { font-weight: 500; font-size: 7.5pt; color: var(--muted); margin-left: 1px; }
  .stp.off { background: var(--any-t); color: var(--muted); font-size: 8.5pt; }
  .bx { flex: none; display: inline-block; width: 3.8mm; height: 3.8mm; border: 1.3px solid var(--line2); border-radius: 3px; vertical-align: middle; }
  .bx.o { border-radius: 50%; }

  /* the parts of a day, in order, each with what happens in it */
  .slot { display: grid; grid-template-columns: 24mm minmax(0, 1fr); gap: 4mm; padding: 3mm 0; border-bottom: 1px dashed var(--line); }
  .ex thead { display: table-header-group; }   /* a long workout carries on over the page, with its column heads repeated */
  .slot.short { break-inside: avoid; }   /* a short part of the day stays whole; a long workout may carry on over the page */
  .keep { break-inside: avoid; }   /* a day's heading never sits alone at the foot of a page */
  .slot:last-child { border-bottom: 0; }
  .sl { padding-top: .6mm; font: 700 9pt Onest, sans-serif; }
  .sl small { display: block; font-weight: 500; font-size: 7.5pt; color: var(--muted); }
  .sl i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 2px; vertical-align: 1px; }
  .t-morning { color: var(--morning); } .t-morning i { background: var(--morning); }
  .t-afternoon { color: var(--afternoon); } .t-afternoon i { background: var(--afternoon); }
  .t-evening { color: var(--evening); } .t-evening i { background: var(--evening); }
  .t-night { color: var(--night); } .t-night i { background: var(--night); }
  .t-any { color: var(--any); } .t-any i { background: var(--any); }
  .what { display: flex; flex-direction: column; gap: 3mm; min-width: 0; }

  .wh { display: flex; align-items: baseline; gap: 2mm; font: 700 9pt Onest, sans-serif; color: var(--ink); }
  .wh span { font-weight: 500; font-size: 8pt; color: var(--muted); }
  table.ex { width: 100%; margin-top: 1mm; border-collapse: collapse; font-size: 8.5pt; table-layout: fixed; }
  /* the same columns on every day, so the eye finds them in the same place */
  .ex col.rs { width: 21mm; } .ex col.rb { width: 29mm; } .ex col.ra { width: 21mm; } .ex col.ef { width: 21mm; } .ex col.tm { width: 15mm; }
  .ex th { padding: 1.4mm 2mm; font: 700 6.5pt Onest, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ex td { padding: 2mm 2mm; border-bottom: 1px solid var(--line2); vertical-align: middle; font-variant-numeric: tabular-nums; }
  .ex tr { break-inside: avoid; }
  .ex tbody tr:last-child td { border-bottom: 0; }
  .ex td.c, .ex th.c { width: 6mm; padding-right: 0; }
  .ex td.nm { font-weight: 600; color: var(--ink); }
  .ex .r { text-align: right; white-space: nowrap; }
  /* the middle columns centre under their heads, so each value sits in the middle of its column */
  .ex .m { text-align: center; white-space: nowrap; }
  .ex .e { white-space: nowrap; color: var(--body); }
  .ex .dash { color: var(--faint); }

  .mvs { display: flex; flex-direction: column; gap: 1.6mm; }
  .mv { display: flex; gap: 2.5mm; align-items: flex-start; }
  .mv .dot { flex: none; width: 5px; height: 5px; margin-top: 1.9mm; border-radius: 50%; background: var(--faint); }
  .mv b { font-weight: 600; color: var(--ink); }
  .mv span { color: var(--muted); }
  .mvl { font: 700 6.5pt Onest, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  .rest { display: flex; align-items: center; gap: 3mm; margin-top: 3mm; padding: 3mm 4mm; border-radius: 10px; background: var(--soft); font-size: 9pt; color: var(--body); break-inside: avoid; }
  .rest b { color: var(--ink); }

  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 6mm; margin-top: 4mm; padding: 4mm 4.5mm; border-radius: 12px; background: var(--soft); font-size: 8.5pt; break-inside: avoid; }
  .notes b { display: block; color: var(--ink); font-weight: 600; }
  .notes span { color: var(--muted); }
  .help { margin-top: 4mm; display: flex; gap: 3mm; align-items: center; padding: 3.5mm 4.5mm; border-radius: 12px; background: var(--tint); color: var(--body); font-size: 9pt; break-inside: avoid; }
  .help svg { width: 18px; height: 18px; flex: none; color: var(--green); }
</style>
</head>
<body>
<div class="bar"><b id="barT">Move plan</b><button type="button" onclick="window.print()">Save as PDF</button></div>
<main class="doc" id="doc"></main>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var P = null;
  try { P = JSON.parse(localStorage.getItem("gfMovePlanPdf") || "null"); } catch (e) {}
  var which = Q.get("plan") || (Q.get("sample") === "1" ? "cases" : "");
  if (which === "simple") P = simple(); else if (which === "exercise") P = exercise(); else if (which === "cases" || !P) P = sample();

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var n = function (x) { return Math.round(x).toLocaleString("en-IN"); };
  var plural = function (c, w) { return c + " " + w + (c === 1 ? "" : "s"); };
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var WDL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var start = new Date(P.start + "T00:00:00");
  var dateOf = function (wi, di) { var d = new Date(start); d.setDate(d.getDate() + wi * 7 + di); return d; };
  var dmy = function (d) { return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); };
  var t12 = function (hm) { var h = +hm.slice(0, 2), m = hm.slice(3, 5); return ((h % 12) || 12) + (m === "00" ? "" : ":" + m) + " " + (h < 12 ? "AM" : "PM"); };
  var PARTS = P.parts.concat([{ k: "any", label: "Any time" }]);
  var key = function (wi, di) { return P.weeks[wi].week_no + "-" + (di + 1); };

  /* MET, effort and kcal, the builder's way: each exercise's own MET from the exercise list, or the level the coach picked */
  var nk = function (t) { return String(t || "").toLowerCase().replace(/[^a-z0-9]/g, ""); };
  var EXM = {}; ((window.EXL || {}).coach || []).forEach(function (c) { EXM[nk(c.orig)] = EXM[nk(c.n)] = c; });
  function met(ex) {
    var c = EXM[nk(ex.title)], L = c ? c.i : [];
    if (ex.met != null && L.some(function (x) { return x.m === ex.met; })) return ex.met;
    return c ? c.met : ex.exerciseType === "Breathing" ? 1.5 : 4.5;
  }
  /* an exercise with one fixed MET takes its effort from the standard MET bands (under 1.5, under 3, under 6, then vigorous), as the coach portal shows it */
  function band(m) { return m < 1.5 ? "Very light" : m < 3 ? "Light" : m < 6 ? "Moderate" : "Vigorous"; }
  function effort(ex) { var c = EXM[nk(ex.title)], m = met(ex), l = c ? c.i.filter(function (x) { return x.m === m; })[0] : null; return l ? l.n : band(m); }
  var mins = function (ex) { var v = +ex.duration || 0; return ex.duration_units === "sec" ? v / 60 : v; };
  var kcal = function (ex) { return Math.round(met(ex) * 3.5 * 65 / 200 * mins(ex)); };
  /* every rest says something: the builder requires one, so an empty one only comes from an older plan, and reads as no rest */
  var unit = function (v, u) { return v === "" || v == null || +v === 0 ? "No rest" : v + " " + (u === "min" ? "min" : "sec"); };

  var IC = {
    st: '<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="7" rx="3" ry="4.2"/><ellipse cx="16" cy="12" rx="3" ry="4.2"/><rect x="5.6" y="12.5" width="4.8" height="3.4" rx="1.7"/><rect x="13.6" y="17.5" width="4.8" height="3.4" rx="1.7"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5h16v10H9l-5 4v-14z"/></svg>'
  };

  /* ---------- one day: its steps goal, then each part of the day with its workouts and small moves ---------- */
  function dayHTML(wi, di) {
    var D = P.weeks[wi].days[di], k = key(wi, di), date = dateOf(wi, di);
    var rest = D.rest_day === "Y", st = P.nowalk ? null : P.steps[k], nm = (P.noff && P.noff[k]) ? null : P.neat[k];
    var rs = rest ? [] : D.routines.map(function (r) { return { time: r.time || "", ex: r.exercises.filter(function (e) { return e.title; }) }; }).filter(function (r) { return r.ex.length; });
    /* a routine with no time of day (older plans) takes the next free part of the day, in order: Morning, Afternoon, Evening, Night */
    var used = rs.map(function (r) { return r.time; }), free = P.parts.map(function (p) { return p.k; }).filter(function (k) { return used.indexOf(k) < 0; });
    rs.forEach(function (r) { if (!r.time) r.time = free.shift() || "any"; });
    var noMoves = !!(P.noff && P.noff[k]);
    var moves = {}; if (nm) P.parts.forEach(function (p) { moves[p.k] = (nm[p.k] || []).filter(function (m) { return m.title && m.title.trim(); }); });
    var wMin = rs.reduce(function (s, r) { return s + r.ex.reduce(function (a, e) { return a + mins(e); }, 0); }, 0);
    var nMov = Object.keys(moves).reduce(function (s, p) { return s + moves[p].length; }, 0);

    var sum = [rest ? "<b>Rest day</b>" : wMin ? "<b>" + Math.round(wMin) + " min</b> of workout" + (rs.length > 1 ? " in " + rs.length + " parts of the day" : "") : "",
      nMov ? "<b>" + plural(nMov, "small move") + "</b>" : noMoves ? "No small moves today" : ""].filter(Boolean).join(" · ");
    var steps = P.nowalk ? "" : st === "off" ? '<div class="stp off">No steps goal today</div>' : st ? '<div class="stp">' + IC.st + n(+st) + '<small>steps</small></div>' : "";

    var slots = PARTS.map(function (p) {
      var R = rs.filter(function (r) { return r.time === p.k; }), M = moves[p.k] || [];
      if (!R.length && !M.length) return "";
      var w = R.map(function (r) {
        var m = r.ex.reduce(function (a, e) { return a + mins(e); }, 0), kc = r.ex.reduce(function (a, e) { return a + kcal(e); }, 0);
        return '<div><div class="wh">Workout<span>' + Math.round(m) + ' min · ' + plural(r.ex.length, "exercise") + ' · about ' + kc + ' kcal</span></div>' +
          '<table class="ex"><colgroup><col><col class="rs"><col class="rb"><col class="ra"><col class="ef"><col class="tm"></colgroup>' +
          '<thead><tr><th>Exercise</th><th class="m">Reps × sets</th><th class="m">Rest between sets</th><th class="m">Rest after</th><th class="m">Effort</th><th class="r">Time</th></tr></thead><tbody>' +
          r.ex.map(function (e) {
            return '<tr><td class="nm">' + esc(e.title) + '</td>' +
              '<td class="m">' + (e.reps || "–") + ' × ' + (e.sets || "–") + '</td><td class="m">' + unit(e.rest_post_sets, e.rest_post_sets_unit) + '</td><td class="m">' + unit(e.rest_post_exercise, e.rest_post_exercise_unit) + '</td>' +
              '<td class="m e">' + (esc(effort(e)) || '<span class="dash">–</span>') + '</td>' +
              '<td class="r">' + (+e.duration || 0) + " " + (e.duration_units === "sec" ? "sec" : "min") + '</td></tr>';
          }).join("") + '</tbody></table></div>';
      }).join("");
      var mv = M.length ? '<div class="mvs"><div class="mvl">Small moves</div>' + M.map(function (m) {
        return '<div class="mv"><span class="dot"></span><div><b>' + esc(m.title.trim()) + '</b>' + (m.sub && m.sub.trim() ? ' <span>· ' + esc(m.sub.trim()) + '</span>' : "") + '</div></div>';
      }).join("") + '</div>' : "";
      var rows = R.reduce(function (a, r) { return a + r.ex.length; }, 0) + M.length;
      return '<div class="slot' + (rows <= 8 ? " short" : "") + '"><div class="sl t-' + p.k + '"><i></i>' + p.label + (p.from ? '<small>' + t12(p.from) + ' to ' + t12(p.to) + '</small>' : "") + '</div><div class="what">' + w + mv + '</div></div>';
    });
    /* the heading travels with the first part of the day when that part is short; with a long one, with the rest-day note at least */
    var firstShort = slots.length && /class="slot short"/.test(slots.filter(Boolean)[0] || "");
    slots = slots.filter(Boolean);
    var restNote = rest ? '<div class="rest"><b>Rest day.</b> Let your body recover today.' + (slots.length ? " Your small moves still count." : st && st !== "off" && !P.nowalk ? " A gentle walk toward your steps still counts." : "") + '</div>' : "";

    return '<section class="day"><div class="keep"><header class="dh"><div class="dd"><small>' + WD[date.getDay()] + '</small><b>' + date.getDate() + '</b><small>' + MON[date.getMonth()] + '</small></div>' +
      '<div class="dti"><h2>' + WDL[date.getDay()] + '<span>Week ' + P.weeks[wi].week_no + ', Day ' + (di + 1) + '</span></h2><div class="dsum">' + (sum || "Nothing planned") + '</div></div>' + steps + '</header>' +
      restNote + (firstShort ? slots.shift() : "") + '</div>' + slots.join("") + '</section>';
  }

  var days = [];
  P.weeks.forEach(function (w, wi) { w.days.forEach(function (_, di) { days.push(dayHTML(wi, di)); }); });
  var first = dateOf(0, 0), last = dateOf(P.weeks.length - 1, P.weeks[P.weeks.length - 1].days.length - 1);

  var head = '<header class="head"><div><img src="/v7/img/coach/goodflip_logo_large.png" alt="GoodFlip"><h1>' + esc(P.name || "Move plan") + '</h1>' +
    '<div class="who">' + (P.patient ? 'For <b>' + esc(P.patient) + '</b>' : "") + (P.coach ? (P.patient ? " · " : "") + 'From your coach <b>' + esc(P.coach) + '</b>' : "") + '</div></div>' +
    '<div class="dates">' + dmy(first) + ' to ' + dmy(last) + '<small>' + plural(P.weeks.length, "week") + ', day by day</small></div></header>';

  var notes = '<div class="notes"><div><b>Reps × sets</b><span>12 × 3 means do it 12 times, rest, and do that 3 times in all.</span></div>' +
    '<div><b>Rest between sets</b><span>The pause before you repeat the same exercise.</span></div>' +
    '<div><b>Rest after</b><span>The pause before you start the next exercise.</span></div>' +
    '<div><b>Effort</b><span>Light feels easy, moderate makes you breathe faster, vigorous makes talking hard.</span></div></div>' +
    '<div class="help">' + IC.chat + '<span>If anything hurts or feels too hard, stop and message your coach' + (P.coach ? ", " + esc(P.coach) + "," : "") + ' in the GoodFlip app.</span></div>';

  document.getElementById("doc").innerHTML = head + days.join("") + notes;
  document.getElementById("barT").textContent = (P.name || "Move plan") + (P.patient ? " · " + P.patient : "");
  document.title = (P.name || "Move plan") + (P.patient ? ", " + P.patient : "");
  document.documentElement.style.setProperty("--foot", '"' + (P.name || "Move plan").replace(/"/g, "") + (P.patient ? " · " + P.patient.replace(/"/g, "") : "") + '"');
  if (Q.get("print") === "1") addEventListener("load", function () { setTimeout(print, 300); });

  /* ---------- "simple plan.pdf" from the live portal: one week, one routine a day, no time of day, no small moves or steps ---------- */
  function simple() {
