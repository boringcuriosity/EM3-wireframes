<!doctype html>
<!--
  FTUX variant: "What is new, shown on your screen"
  A short sheet (about 45% of the screen) steps through a coach-mark tour of
  the real Eat screen behind it. A soft spotlight opens on each part in turn:
  the score bubble, the "What shaped your score?" tiles, a meal card, then the
  score again for the medal. The sheet says what that part means in a line or
  two. Targets are measured inside the same-origin iframe, which scrolls to
  bring each one into view; fixed positions stand in if measuring fails.

  Flags
    ?who=current   someone who already logs, seeing the score for the first time
    ?who=new       a first-time user with a fresh plan from their coach (default)
    ?step=N        open at step N (0 score, 1 protein carbs and fat, 2 meal, 3 medal)
    ?still=1       no animation, end states only
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Is New</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/v7/r3/goodflip-ui.css">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: Roboto, system-ui, sans-serif; color: var(--g-900); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font: inherit; }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .stage > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; background: #fff; }

  /* ---------------------------------------------------------- the spotlight
     One rounded hole whose shadow is the scrim. It travels between targets on
     the same ease as the page scrolling under it, so the two move as one. */
  .spot { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; will-change: transform;
    box-shadow: 0 0 0 200vmax rgba(0,0,0,.5); opacity: 0; transition: opacity .42s var(--ease); }
  .ring { position: absolute; inset: -1px; border-radius: inherit; border: 2px solid rgba(255,255,255,.9);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand-400) 0%, transparent);
    transition: box-shadow .6s var(--ease), border-color .6s var(--ease); }
  /* on arrival the edge takes the score's green, softly, and stays there */
  .spot.lit .ring { border-color: color-mix(in srgb, var(--brand-300) 90%, white);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--brand-400) 35%, transparent), 0 0 28px 4px color-mix(in srgb, var(--brand-300) 40%, transparent); }
  .open .spot { opacity: 1; }

  /* ---------------------------------------------------------- the sheet */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px;
    height: 45%; min-height: 352px; max-height: 90%; background: #fff; border-radius: var(--r-xl) var(--r-xl) 0 0;
    box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(105%); transition: transform .42s cubic-bezier(0,0,.2,1); }
  .open .sheet { transform: translateY(0); }
  .closing .sheet { transition: transform .32s cubic-bezier(.4,0,1,1); }
  .shd { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 6px 4px 16px; }
  .shd h2 { flex: 1; margin: 0; font: 600 18px/24px Roboto, sans-serif; color: var(--g-900); }
  .x { width: 44px; height: 44px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer; border-radius: 9999px; }
  .x:focus-visible { outline: 2px solid var(--in-600); outline-offset: -2px; }

  /* progress: four short lines, the done ones green, the current one filling */
  .prog { flex: none; display: flex; gap: 4px; padding: 4px 16px 0; }
  .prog i { position: relative; flex: 1; height: 3px; border-radius: 9999px; background: var(--g-100); overflow: hidden; }
  .prog i::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--brand-600);
    transform: scaleX(0); transform-origin: left center; transition: transform .5s var(--ease); }
  .prog i.done::after { transform: scaleX(1); }

  .body { position: relative; flex: 1 1 auto; overflow-y: auto; padding: 16px 16px 8px; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .pane { transition: opacity .26s var(--ease), transform .26s var(--ease); }
  .pane.out { opacity: 0; transform: translateY(6px); }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; margin-bottom: 8px; border-radius: 9999px;
    background: var(--gold-100); color: var(--olive-700); font: 600 11px/22px Roboto, sans-serif; letter-spacing: .4px; text-transform: uppercase; }
  .pane h3 { margin: 0; font: 600 16px/24px Roboto, sans-serif; color: var(--g-900); }
  .pane p { margin: 4px 0 0; font: 400 14px/21px Roboto, sans-serif; color: var(--g-600); text-wrap: pretty; }
  .pane p b { font-weight: 600; color: var(--g-900); }

  .foot { flex: none; display: flex; gap: 12px; padding: 8px 16px calc(26px + env(safe-area-inset-bottom, 0px)); }
  .back { flex: none; width: 48px; height: 48px; padding: 0; border-radius: var(--r-md); border: 1px solid var(--g-200); background: #fff; color: var(--g-700);
    display: grid; place-items: center; cursor: pointer; transition: opacity .3s var(--ease); }
  .back[hidden] { display: none; }
  .cta { flex: 1; height: 48px; border: 0; border-radius: var(--r-md); background: var(--brand-600); color: #fff;
    font: 600 16px/24px Roboto, sans-serif; box-shadow: 0 7px 0 var(--brand-700); cursor: pointer; }
  .cta:active { transform: translateY(2px); box-shadow: 0 5px 0 var(--brand-700); }
  .cta:focus-visible, .back:focus-visible { outline: 2px solid var(--in-600); outline-offset: 2px; }

  /* ---------------------------------------------------------- small pictures */
  .viz { margin-top: 12px; }
  .band { position: relative; height: 40px; margin: 0 2px; }
  .band .track { position: absolute; left: 0; right: 0; top: 16px; height: 8px; border-radius: 9999px;
    background: linear-gradient(90deg, var(--g-100) 0%, var(--brand-200) 40%, var(--brand-200) 72%, var(--gold-200) 86%, var(--red-200) 100%); }
  .band .full { position: absolute; top: 16px; height: 8px; left: 40%; width: 20%; border-radius: 3px; background: var(--brand-500);
    transform: scaleX(0); transition: transform .7s cubic-bezier(.65,0,.35,1) .15s; }
  .band .flag { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font: 600 11px/14px Roboto, sans-serif; color: var(--g-900); white-space: nowrap; }
  .band .tick { position: absolute; top: 13px; left: 50%; width: 2px; height: 14px; margin-left: -1px; border-radius: 1px; background: var(--g-900); }
  .band .lbl { position: absolute; top: 27px; transform: translateX(-50%); font: 400 11px/13px Roboto, sans-serif; color: var(--g-500); }
  .band .lbl.r { right: 0; transform: none; color: var(--g-400); }
  .band.go .full { transform: scaleX(1); }

  .weights { display: flex; gap: 3px; height: 26px; }
  .weights .seg { border-radius: 6px; background: var(--brand-100); display: grid; place-items: center;
    font: 600 12px/1 Roboto, sans-serif; color: var(--brand-800); font-variant-numeric: tabular-nums;
    transform-origin: left center; transform: scaleX(0); transition: transform .6s cubic-bezier(.65,0,.35,1); }
  .weights .seg.on { background: var(--brand-600); color: #fff; }
  .weights.go .seg { transform: scaleX(1); }
  .wl { display: flex; gap: 3px; margin-top: 4px; }
  .wl span { min-width: 0; text-align: center; white-space: nowrap; font: 400 11px/14px Roboto, sans-serif; color: var(--g-500); }
  .wl span.on { color: var(--g-900); font-weight: 600; }

  .medal { display: grid; grid-template-columns: 1fr 36px; gap: 12px; align-items: center; }
  .mtrack { position: relative; height: 8px; border-radius: 9999px; background: var(--g-100); margin-bottom: 14px; }
  .mtrack .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 9999px;
    background: linear-gradient(90deg, var(--brand-300), var(--brand-500)); transition: width 1.1s cubic-bezier(.65,0,.35,1) .1s; }
  .mtrack .line { position: absolute; left: 80%; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--gold-700); }
  .mtrack span { position: absolute; top: 13px; font: 400 11px/13px Roboto, sans-serif; color: var(--g-400); }
  .mtrack .t80 { left: 80%; transform: translateX(-50%); font-weight: 600; color: var(--olive-700); }
  .mtrack .t100 { right: 0; }
  .medal svg { filter: grayscale(1); opacity: .45; transition: filter .6s var(--ease) 1s, opacity .6s var(--ease) 1s; }
  .medal.go .fill { width: 86%; }
  .medal.go svg { filter: none; opacity: 1; }

  /* logging a meal, flowing into the score */
  .grow { display: flex; align-items: center; gap: 8px; }
  .gmeal, .gscore { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9999px;
    font: 500 13px/18px Roboto, sans-serif; white-space: nowrap; }
  .gmeal { background: #fff; border: 1px solid var(--g-200); color: var(--g-700); }
  .gmeal b { font-weight: 600; color: var(--brand-700); }
  .garrow { flex: 1; min-width: 16px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, var(--g-200), var(--brand-300));
    transform: scaleX(0); transform-origin: left center; transition: transform .6s cubic-bezier(.65,0,.35,1) .15s; }
  .gscore { background: var(--g-50); color: var(--g-500); font-weight: 400; transition: background .5s var(--ease) .6s; }
  .gscore b { font: 700 16px/1 Roboto, sans-serif; color: var(--g-900); font-variant-numeric: tabular-nums; transition: color .5s var(--ease) .6s; }
  .grow.go .garrow { transform: scaleX(1); }
  .grow.go .gscore { background: var(--brand-50); }
  .grow.go .gscore b { color: var(--brand-700); }

  .replay { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); padding: 8px 16px; border-radius: 9999px;
    border: 1px solid var(--g-200); background: #fff; color: var(--g-700); font: 500 13px/18px Roboto, sans-serif; cursor: pointer;
    box-shadow: var(--shadow-card); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
  .replay.on { opacity: 1; pointer-events: auto; }

  .still *, .still *::before, .still *::after { transition: none !important; animation: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; transition-delay: 0s !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <iframe id="eat" tabindex="-1" aria-hidden="true" title=""></iframe><script>/* new users see the day with their plan and nothing logged yet */ document.currentScript.previousElementSibling.src = "/v7/r3/eat.html" + (/who=current/.test(location.search) ? "" : "?state=empty");</script>
  <div class="spot" id="spot"><span class="ring"></span></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="shd">
      <h2 id="sheetTitle">Meet Your Score</h2>
      <button class="x" id="close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32"><path style="fill:var(--g-400)" d="M16 3a13 13 0 1 0 13 13A13.013 13.013 0 0 0 16 3m4.708 16.293a1 1 0 0 1-1.415 1.415L16 17.414l-3.293 3.293a1 1 0 0 1-1.415-1.415L14.587 16l-3.293-3.293a1 1 0 1 1 1.415-1.415L16 14.587l3.293-3.293a1 1 0 0 1 1.415 1.415L17.414 16z"/></svg></button>
    </div>
    <div class="prog" id="prog" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="body"><div class="pane" id="pane" aria-live="polite"></div></div>
    <div class="foot">
      <button class="back" id="back" aria-label="Back" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="cta" id="next">Next</button>
    </div>
  </div>

  <button class="replay" id="replay">Replay</button>
</div>

<script>
/* the Eat page's hero waits for a handshake */
addEventListener("message", function (e) { if (e.data === "hero:ready" && e.source) e.source.postMessage("hero:mount", "*"); });

(function () {
  var Q = new URLSearchParams(location.search);
  var WHO = Q.get("who") === "current" ? "current" : "new";
  var STILL = Q.get("still") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (Q.get("still") === "1") document.documentElement.classList.add("still");

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), spot = $("spot"), sheet = $("sheet"), pane = $("pane"), frame = $("eat");

  /* ---------- small pictures ---------- */
  var VIZ = {
    grow: '<div class="viz grow" role="img" aria-label="Logging breakfast adds about 17 to today\'s score.">' +
      '<span class="gmeal">Breakfast logged <b>+17</b></span><span class="garrow"></span>' +
      '<span class="gscore"><b data-to="17">0</b>of 100 today</span></div>',
    band: '<div class="viz"><div class="band" role="img" aria-label="Protein target 15 g. Full marks from 12 g to 18 g.">' +
      '<span class="track"></span><span class="full"></span><span class="tick"></span><span class="flag">Target 15 g</span>' +
      '<span class="lbl" style="left:40%">12 g</span><span class="lbl" style="left:60%">18 g</span><span class="lbl r">Full marks in green</span></div></div>',
    weights: '<div class="viz" role="img" aria-label="Breakfast is worth 20, lunch 35, snack 10, dinner 35.">' +
      '<div class="weights"><span class="seg on" style="flex:20">20</span><span class="seg" style="flex:35;transition-delay:.1s">35</span>' +
      '<span class="seg" style="flex:10;transition-delay:.2s">10</span><span class="seg" style="flex:35;transition-delay:.3s">35</span></div>' +
      '<div class="wl"><span class="on" style="flex:20">Breakfast</span><span style="flex:35">Lunch</span><span style="flex:10">Snack</span><span style="flex:35">Dinner</span></div></div>',
    medal: '<div class="viz medal" role="img" aria-label="A day at 80 or more earns a medal.">' +
      '<div class="mtrack"><span class="fill"></span><b class="line"></b><span class="t0">0</span><span class="t80">80</span><span class="t100">100</span></div>' +
      '<svg width="36" height="42" viewBox="0 0 44 52" fill="none" aria-hidden="true">' +
        '<path d="M12 2h8l6 16h-8z" fill="var(--in-500)"/><path d="M32 2h-8l-6 16h8z" fill="var(--in-300)"/>' +
        '<circle cx="22" cy="32" r="17" fill="var(--gold-600)"/><circle cx="22" cy="32" r="13" fill="var(--gold-300)" stroke="var(--gold-700)" stroke-width="1.5"/>' +
        '<path d="M22 24.5l2.3 4.7 5.2.8-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.8z" fill="var(--gold-700)"/></svg></div>'
  };

  /* ---------- the tour ---------- */
  var TITLE = WHO === "current" ? "New on Your Eat Screen" : "Meet Your Score";
  var STEPS = WHO === "current" ? [
    { at: "hero", pill: "New", h: "Your meals now add up to a score",
      p: "Every meal you log now adds to today's <b>Nutrition sufficiency</b>, out of 100. It starts fresh each morning.", v: "grow" },
    { at: "macros", h: "Protein, carbs and fat",
      p: "Each meal is checked against your coach's targets. Landing close, from a little under to a little over, earns full marks.", v: "band" },
    { at: "meal", h: "Bigger meals count for more",
      p: "A meal's calories decide its share of the day. For example, a 300 kcal breakfast in a 1,500 kcal day is worth 20 of the 100.", v: "weights" },
    { at: "hero", h: "Reach 80 for a medal",
      p: "A day at 80 or more earns a medal. Keep logging the way you do and watch it grow.", v: "medal" }
  ] : [
    { at: "hero", h: "Nutrition sufficiency",
      p: "This is today's score, out of 100. It grows each time you log a meal that matches your coach's plan.", v: "grow" },
    { at: "macros", h: "Protein, carbs and fat",
      p: "Your coach sets how much of each a meal should have. Landing close, from a little under to a little over, earns full marks.", v: "band" },
    { at: "meal", h: "Bigger meals count for more",
      p: "Each meal is checked against its own targets, and its calories decide its share. For example, a 300 kcal breakfast in a 1,500 kcal day is worth 20 of the 100.", v: "weights" },
    { at: "hero", h: "Reach 80 for a medal",
      p: "A day at 80 or more earns a medal. Every meal you log adds to your score, and each day starts fresh.", v: "medal" }
  ];
  var LAST = WHO === "current" ? "Got It" : "Log Your First Meal";
  $("sheetTitle").textContent = TITLE;

  var step = Math.max(0, Math.min(STEPS.length - 1, parseInt(Q.get("step"), 10) || 0));

  /* ---------- measuring the Eat screen ----------
     Rects are in the iframe's document coordinates. FALL is what a 390 wide
     Eat screen measured, for when the page cannot be read. */
  var FALL = { hero: { x: 81, y: 138, w: 227, h: 227, round: true }, macros: { x: 8, y: 446, w: 374, h: 211 }, meal: { x: 8, y: 1086, w: 374, h: 710 } };
  function doc() { try { return frame.contentDocument; } catch (e) { return null; } }
  function measure(at) {
    var d = doc(), r = null;
    try {
      var sy = d.scrollingElement.scrollTop, sx = d.scrollingElement.scrollLeft;
      var box = function (el, pad) {
        var b = el.getBoundingClientRect();
        return b.height > 0 ? { x: b.left + sx - pad, y: b.top + sy - pad, w: b.width + pad * 2, h: b.height + pad * 2 } : null;
      };
      if (at === "hero") {
        var hb = box(d.querySelector("#heroWrap") || d.querySelector("#hero"), 0);
        /* the hero is one canvas: the bubble sits in its upper part, the note under it */
        if (hb) { var s = hb.h * .86, cy = hb.y + hb.h * .37; r = { x: hb.x + (hb.w - s) / 2, y: cy - s / 2, w: s, h: s, round: true }; }
      } else if (at === "macros") {
        var t = d.querySelector("#railTitle"), m = d.querySelector("#railMacros:not([hidden])") || d.querySelector(".macros");
        var a = t && box(t, 8), b2 = m && box(m, 8);
        if (a && b2) r = { x: Math.min(a.x, b2.x), y: a.y, w: Math.max(a.x + a.w, b2.x + b2.w) - Math.min(a.x, b2.x), h: b2.y + b2.h - a.y };
        else r = b2 || a;
      } else if (at === "meal") {
        var el = d.querySelector("#meal-bf") || d.querySelector(".meal");
        r = el && box(el, 6);
      }
    } catch (e) { r = null; }
    return r || FALL[at];
  }
  /* where the page should sit and where the hole lands, for a target */
  function frameFor(at) {
    var R = measure(at), d = doc();
    var vh = stage.clientHeight;
    /* the sheet's laid-out height, so a sheet still sliding in measures the same */
    var top = 72, bottom = vh - (sheet.offsetHeight || vh * .45) - 20;
    var avail = Math.max(120, bottom - top);
    var h = Math.min(R.h, avail);
    var max = 0;
    try { max = d.scrollingElement.scrollHeight - vh; } catch (e) { max = 4000; }
    var s = R.h <= avail ? R.y - top - (avail - R.h) / 2 : R.y - top;
    s = Math.max(0, Math.min(max, s));
    /* held 8px in from the screen edges, so the ring always reads as a ring */
    var vw = stage.clientWidth, x = Math.max(8, R.x), w = Math.min(vw - 8, R.x + R.w) - x;
    if (R.round) { x = R.x; w = R.w; }
    return { s: s, x: x, y: R.y - s, w: w, h: h, r: R.round ? R.w / 2 : 20 };
  }

  /* ---------- moving ---------- */
  var cur = null, raf = 0;
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function getScroll() { try { return doc().scrollingElement.scrollTop; } catch (e) { return 0; } }
  function setScroll(v) { try { doc().scrollingElement.scrollTop = v; } catch (e) {} }
  function paint(f) {
    spot.style.transform = "translate(" + f.x + "px," + f.y + "px)";
    spot.style.width = f.w + "px"; spot.style.height = f.h + "px";
    spot.style.borderRadius = Math.min(f.r, f.w / 2, f.h / 2) + "px";
  }
  function go(at, instant) {
    cancelAnimationFrame(raf);
    var to = frameFor(at);
    spot.classList.remove("lit");
    if (instant || STILL || !cur) {
      setScroll(to.s); cur = to; paint(to);
      setTimeout(function () { spot.classList.add("lit"); }, instant || STILL ? 0 : 420);
      return;
    }
    var from = { s: getScroll(), x: cur.x, y: cur.y, w: cur.w, h: cur.h, r: Math.min(cur.r, cur.w / 2, cur.h / 2) };
    var dist = Math.abs(to.s - from.s) + Math.abs(to.y - from.y);
    var dur = Math.max(560, Math.min(900, 520 + dist * .35)), t0 = performance.now();
    (function tick(now) {
      var k = ease(Math.min(1, (now - t0) / dur)), f = {};
      ["s", "x", "y", "w", "h", "r"].forEach(function (p) { f[p] = from[p] + (to[p] - from[p]) * k; });
      setScroll(f.s); paint(f); cur = f;
      if (k < 1) raf = requestAnimationFrame(tick);
      else { cur = to; spot.classList.add("lit"); }
    })(t0);
  }

  /* ---------- the sheet ---------- */
  function render() {
    var S = STEPS[step];
    pane.innerHTML = (S.pill ? '<span class="pill">' + S.pill + '</span>' : "") +
      "<h3>" + S.h + "</h3><p>" + S.p + "</p>" + (S.v ? VIZ[S.v] : "");
    [].forEach.call($("prog").children, function (b, i) { b.classList.toggle("done", i <= step); });
    $("back").hidden = step === 0;
    $("next").textContent = step === STEPS.length - 1 ? LAST : "Next";
    var v = pane.querySelector(".grow,.band,.weights,.medal");
    if (v) { if (STILL) v.classList.add("go"); else setTimeout(function () { requestAnimationFrame(function () { v.classList.add("go"); }); }, 260); }
    /* the score counts up as the meal lands in it */
    var n = pane.querySelector("[data-to]");
    if (n) {
      var to = +n.dataset.to;
      if (STILL) n.textContent = to;
      else setTimeout(function () {
        var t0 = performance.now();
        (function tick(now) { var k = ease(Math.min(1, (now - t0) / 700)); n.textContent = Math.round(to * k); if (k < 1) requestAnimationFrame(tick); })(t0);
      }, 900);
    }
  }
  var swapT = 0;
  function show(n) {
    var first = n === step && !pane.innerHTML;
    step = n;
    go(STEPS[n].at, false);
    if (first || STILL) return render();
    clearTimeout(swapT);
    pane.classList.add("out");
    swapT = setTimeout(function () { render(); requestAnimationFrame(function () { pane.classList.remove("out"); }); }, 260);
  }

  function open() {
    $("replay").classList.remove("on");
    stage.classList.remove("closing");
    pane.innerHTML = ""; cur = null;
    step = Math.max(0, Math.min(STEPS.length - 1, parseInt(Q.get("step"), 10) || 0));
    render();
    go(STEPS[step].at, true);
    if (STILL) { stage.classList.add("open"); return; }
    spot.classList.remove("lit");
    requestAnimationFrame(function () { requestAnimationFrame(function () { stage.classList.add("open"); }); });
    setTimeout(function () { spot.classList.add("lit"); }, 480);
  }
  function close() {
    cancelAnimationFrame(raf);
    stage.classList.add("closing");
    stage.classList.remove("open");
    spot.classList.remove("lit");
    /* the page settles back to the top, so the score is what is left showing */
    var from = getScroll(), t0 = performance.now();
    if (STILL) setScroll(0);
    else (function tick(now) { var k = ease(Math.min(1, (now - t0) / 600)); setScroll(from * (1 - k)); if (k < 1) requestAnimationFrame(tick); })(t0);
    setTimeout(function () { $("replay").classList.add("on"); }, STILL ? 0 : 420);
  }

  $("next").onclick = function () { if (step < STEPS.length - 1) show(step + 1); else close(); };
  $("back").onclick = function () { if (step > 0) show(step - 1); };
  $("close").onclick = close;
  $("replay").onclick = open;
  addEventListener("keydown", function (e) {
    if (!stage.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowRight" && step < STEPS.length - 1) show(step + 1);
    if (e.key === "ArrowLeft" && step > 0) show(step - 1);
  });
  addEventListener("resize", function () { if (stage.classList.contains("open")) go(STEPS[step].at, true); });

  /* Open at once on the stand-in positions, then settle onto the measured
     ones as soon as the Eat page has laid itself out. */
  frame.addEventListener("load", function () {
    try { var st = doc().createElement("style"); st.textContent = "html{scrollbar-width:none}html::-webkit-scrollbar{display:none}"; doc().head.appendChild(st); } catch (e) {}
  });
  open();
  var tries = 0;
  (function settle() {
    var d = doc(), el = d && d.querySelector("#heroWrap");
    var ready = el && el.getBoundingClientRect().height > 0 && d.querySelector(".meal");
    if (ready || tries++ > 40) {
      setTimeout(function () { if (stage.classList.contains("open")) go(STEPS[step].at, false); }, 250);
      return;
    }
    setTimeout(settle, 100);
  })();
})();
</script>
</body>
