<!doctype html>
<!--
  FTUX sheet: "The score, taken apart" (anatomy)
  A premium product reveal in four phases, one caption each:
    1 whole   the green score ring with today's number (0 for new, a sample 58, dinner still to log for current)
    2 split   the ring parts into its meal segments, sized by how much each counts
    3 zoom    Breakfast lifts out and opens into its protein, carbs and fat marks
    4 fold    everything folds back into the ring, and the medal mark at 80 appears
  Autoplay at a calm pace (about 3 s a phase). Tap the ring to pause or play. Back and Next step by hand.

  Flags:
    ?who=new (default) | current
    ?step=1|2|3|4     open at a phase
    ?still=1          skip animations and autoplay, show end states
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score Anatomy Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/v7/r3/goodflip-ui.css">
<link rel="stylesheet" href="/v7/icons/glyph-masks.css">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: Roboto, system-ui, sans-serif; color: var(--g-900); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .42s var(--ease); z-index: 10; }
  .open .scrim { opacity: 1; }

  .sheet:focus { outline: none; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 390px; max-height: 90vh; display: flex; flex-direction: column; z-index: 11;
    background: #fff; border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-sheet);
    transform: translate(-50%, 100%); transition: transform .42s cubic-bezier(0,0,.2,1); }
  .open .sheet { transform: translate(-50%, 0); }
  .closing .sheet { transition: transform .36s cubic-bezier(.4,0,1,1); }
  .shead { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 8px; }
  .shead h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; }
  .x { width: 44px; height: 44px; margin-right: -6px; border: 0; padding: 0; background: none; display: grid; place-items: center; border-radius: 9999px; cursor: pointer; flex: none; }
  .sbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px 4px; display: flex; flex-direction: column; gap: 12px; }
  .sfoot { flex: none; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }

  .newline { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--gold-50); border: 1px solid var(--gold-200); font-size: 14px; line-height: 20px; color: var(--g-800); }
  .newline .tag { flex: none; padding: 2px 8px; border-radius: 9999px; background: var(--gold-600); color: var(--g-900); font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }

  /* the stage: a soft white room with a faint green floor light */
  .stage { position: relative; flex: none; width: 100%; height: 320px; border-radius: var(--r-xl); cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(120% 70% at 50% 100%, var(--brand-50) 0%, #fff 62%); }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .num { position: absolute; left: 50%; top: 160px; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
  .num .v { display: block; font-size: 56px; line-height: 60px; font-weight: 700; color: var(--brand-700); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .num .o { display: block; font-size: 13px; line-height: 18px; color: var(--g-500); }
  .lab { position: absolute; transform: translate(-50%, -50%); text-align: center; pointer-events: none; white-space: nowrap; }
  .lab .n { display: block; font-size: 12px; line-height: 16px; color: var(--g-500); }
  .lab .w { display: block; font-size: 16px; line-height: 20px; font-weight: 700; color: var(--g-800); font-variant-numeric: tabular-nums; }
  .medal { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; pointer-events: none; }
  .medal img { width: 28px; height: 28px; filter: drop-shadow(0 2px 4px rgba(29,77,56,.25)); }
  .medal b { font-size: 13px; font-weight: 700; color: var(--olive-700); }

  /* the opened meal, in the house card style */
  .card { position: absolute; inset: 0; padding: 16px; border-radius: var(--r-xl); border: 1px solid transparent; box-shadow: 2px 2px 0 var(--g-200); isolation: isolate; overflow: hidden;
    background: linear-gradient(180deg, var(--in-25) 0%, #fff 34%) padding-box, conic-gradient(from 0deg, var(--in-600) 0deg, var(--g-200) 43deg, var(--g-200) 317deg, var(--in-600) 360deg) border-box;
    display: flex; flex-direction: column; gap: 12px; clip-path: circle(0 at 50% 50%); pointer-events: none; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 92px; z-index: -1; opacity: .6; background: url(/v7/icons/meals/bg/bf.webp) right top / auto 100% no-repeat;
    -webkit-mask: linear-gradient(90deg, transparent 30%, #000 75%); mask: linear-gradient(90deg, transparent 30%, #000 75%); }
  .card > * { opacity: 0; transform: translateY(6px); transition: opacity .4s var(--ease), transform .4s var(--ease); }
  .card.in > * { opacity: 1; transform: none; }
  .card.in > :nth-child(2) { transition-delay: .08s; } .card.in > :nth-child(3) { transition-delay: .16s; } .card.in > :nth-child(4) { transition-delay: .24s; } .card.in > :nth-child(5) { transition-delay: .32s; }
  .card .hd .n { font-size: 16px; line-height: 22px; font-weight: 600; }
  .card .hd .s { font-size: 13px; line-height: 18px; color: var(--g-500); margin-top: 2px; }
  .bands { display: flex; flex-direction: column; gap: 12px; }
  .band .top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .gl { width: 18px; height: 18px; flex: none; background: var(--brand-600); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
  .band .nm { font-size: 14px; line-height: 20px; font-weight: 600; }
  .band .ate { font-size: 13px; line-height: 18px; color: var(--g-500); font-variant-numeric: tabular-nums; }
  .band .mk { margin-left: auto; padding: 2px 8px; border-radius: 9999px; font-size: 12px; line-height: 16px; font-weight: 600; background: var(--g-100); color: var(--g-600); font-variant-numeric: tabular-nums; transition: background-color .4s var(--ease), color .4s var(--ease); }
  .band .mk.full { background: var(--brand-100); color: var(--brand-800); }
  .rail { position: relative; height: 8px; border-radius: 9999px; background: var(--g-100); }
  .rail .zone { position: absolute; top: 0; bottom: 0; border-radius: 9999px; background: var(--brand-200); }
  .rail .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--brand-800); }
  .rail .dot { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 9999px; background: var(--brand-600); box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(16,24,40,.2);
    transition: left .9s cubic-bezier(.65,0,.35,1); }
  .card .adds { margin: auto 0 0; font-size: 13px; line-height: 18px; color: var(--g-600); }
  .card .adds b { font-weight: 600; color: var(--g-900); }
  .card .res { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--brand-50); font-size: 13px; line-height: 18px; color: var(--g-700); }
  .card .res b { font-size: 18px; line-height: 22px; font-weight: 700; color: var(--brand-700); font-variant-numeric: tabular-nums; }
  .card .res .key { display: inline-flex; align-items: center; gap: 6px; }
  .card .res .key i { width: 14px; height: 8px; border-radius: 9999px; background: var(--brand-200); }

  .pausehint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 4px 10px; border-radius: 9999px; background: rgba(255,255,255,.92); border: 1px solid var(--g-200);
    font-size: 12px; line-height: 16px; font-weight: 600; color: var(--g-600); opacity: 0; transition: opacity .3s var(--ease); pointer-events: none; }
  .paused .pausehint { opacity: 1; }

  .caption { margin: 0; min-height: 42px; font-size: 15px; line-height: 21px; color: var(--g-700); text-align: center; padding: 0 8px; transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .caption.out { opacity: 0; transform: translateY(4px); }

  .nav { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .link { border: 0; background: none; padding: 4px 0; font-size: 14px; font-weight: 600; color: var(--brand-600); cursor: pointer; min-width: 44px; min-height: 44px; text-align: left; }
  .link[disabled] { visibility: hidden; }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dots i { position: relative; width: 6px; height: 6px; border-radius: 9999px; background: var(--g-200); overflow: hidden; transition: width .42s var(--ease), background-color .42s var(--ease); }
  .dots i.done { background: var(--brand-300); }
  .dots i.on { width: 28px; background: var(--brand-100); }
  .dots i b { position: absolute; inset: 0; width: 0; background: var(--brand-600); border-radius: inherit; }
  .dots i.on.held b, .dots i.done b { width: 100%; }
  .pp { width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; border-radius: 9999px; color: var(--g-500); }
  .pp svg { width: 20px; height: 20px; }
  .pp[hidden] { display: grid; visibility: hidden; }
  .btn { width: 100%; height: 48px; border: 0; border-radius: var(--r-sm); background: var(--brand-600); color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 7px 0 var(--brand-700); cursor: pointer; margin-bottom: 7px; transition: transform .12s var(--ease), box-shadow .12s var(--ease); }
  .btn:active { transform: translateY(3px); box-shadow: 0 4px 0 var(--brand-700); }
  .btn:focus-visible, .link:focus-visible, .pp:focus-visible, .x:focus-visible, .stage:focus-visible { outline: 2px solid var(--brand-600); outline-offset: 2px; }

  .replay { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 12; padding: 10px 18px; border: 1px solid var(--g-200); border-radius: 9999px; background: #fff; box-shadow: var(--shadow-card); font-size: 14px; font-weight: 600; color: var(--brand-600); cursor: pointer; }
  .replay[hidden] { display: none; }

  .still *, .still *::before, .still *::after { transition: none !important; animation: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<iframe class="bg" tabindex="-1" aria-hidden="true" title=""></iframe><script>/* new users see the day with their plan and nothing logged yet */ document.currentScript.previousElementSibling.src = "/v7/r3/eat.html" + (/who=current/.test(location.search) ? "" : "?state=empty");</script>
<div class="scrim"></div>

<section class="sheet" id="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <header class="shead">
    <h2 id="sTitle">Your score, up close</h2>
    <button class="x" id="close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32"><path style="fill:var(--g-400)" d="M16 3a13 13 0 1 0 13 13A13.013 13.013 0 0 0 16 3m4.708 16.293a1 1 0 0 1-1.415 1.415L16 17.414l-3.293 3.293a1 1 0 0 1-1.415-1.415L14.587 16l-3.293-3.293a1 1 0 1 1 1.415-1.415L16 14.587l3.293-3.293a1 1 0 0 1 1.415 1.415L17.414 16z"/></svg></button>
  </header>

  <div class="sbody">
    <div class="newline" data-who="current"><span class="tag">New</span><span>Your meals now add up to a score each day.</span></div>
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Pause or play">
      <svg viewBox="0 0 358 320" aria-hidden="true">
        <g id="tracks"></g>
        <g id="fills"></g>
      </svg>
      <div class="num" id="num"><span class="v" id="val">0</span><span class="o">of 100</span></div>
      <div id="labs"></div>
      <div class="medal" id="medal" style="opacity:0"><img src="/v7/icons/badge/simple/heart-apple.svg" alt=""><b>80</b></div>
      <div class="card" id="card">
        <div class="hd"><div class="n">Breakfast</div><div class="s">Counts for 20 of 100 · say you ate this</div></div>
        <div class="bands" id="bands"></div>
        <p class="adds">So this breakfast adds about <b>17 of its 20</b> to your day.</p>
        <div class="res"><span class="key"><i></i>Close to target, full marks</span><span>Scores <b id="cScore">83</b></span></div>
      </div>
      <div class="pausehint">Paused · tap to play</div>
    </div>
    <p class="caption" id="cap" aria-live="polite"></p>
  </div>

  <footer class="sfoot">
    <div class="nav">
      <button class="link" id="back">Back</button>
      <div class="dots" id="dots" aria-hidden="true"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
      <button class="pp" id="pp" aria-label="Pause"></button>
    </div>
    <button class="btn" id="next">Next</button>
  </footer>
</section>
<button class="replay" id="replay" hidden>Replay</button>

<script>
(function () {
  addEventListener("message", function (e) { if (e.data === "hero:ready" && e.source) e.source.postMessage("hero:mount", "*"); });

  var Q = new URLSearchParams(location.search);
  var WHO = Q.get("who") === "current" ? "current" : "new";
  var STILL = Q.get("still") === "1";
  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (STILL) document.documentElement.classList.add("still");
  var $ = function (id) { return document.getElementById(id); };
  document.querySelectorAll("[data-who]").forEach(function (el) { if (el.dataset.who !== WHO) el.remove(); });
  var CSSV = getComputedStyle(document.documentElement);
  var tok = function (n) { return CSSV.getPropertyValue(n).trim(); };

  /* the plan, and what each meal has earned today */
  var SEG = [
    { n: "Breakfast", w: 20 }, { n: "Lunch", w: 35 }, { n: "Snack", w: 10 }, { n: "Dinner", w: 35 }
  ];
  var EARNED = WHO === "current" ? [17, 32, 9, 0] : [0, 0, 0, 0];      /* current: a sample 58, dinner still to log */
  var END = WHO === "current" ? [17, 32, 9, 0] : [17, 0, 0, 0];         /* new: one breakfast like the example */
  var CX = 179, CY = 160, R = 100, SW = 22;
  var starts = [], acc = 0;
  SEG.forEach(function (s) { starts.push(acc); acc += s.w; });

  var CAP = {
    new: [
      "This ring is today's Nutrition sufficiency. It starts fresh at 0 each day.",
      "Each meal fills its own part. Bigger meals count for more.",
      "Each meal is checked against its own protein, carbs and fat.",
      "A breakfast like this adds 17. Reach 80 in a day to earn a medal."
    ],
    current: [
      "This ring is today's Nutrition sufficiency. You are at 58 so far.",
      "Each meal fills its own part. Bigger meals count for more.",
      "Each meal is checked against its own protein, carbs and fat.",
      "Your meals add up to 58 so far. Dinner can take you past 80, and that earns a medal."
    ]
  }[WHO];
  var CTA = WHO === "current" ? "See My Score" : "Log Your First Meal";

  /* four phases as numbers the renderer draws from */
  var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
  var PH = [
    { draw: 1, gap: 0, push: 0, pack: 1, lab: 0, dim: 0, card: 0, medal: 0, fill: EARNED, val: sum(EARNED) },
    { draw: 1, gap: 6, push: 10, pack: 0, lab: 1, dim: 0, card: 0, medal: 0, fill: EARNED, val: sum(EARNED) },
    { draw: 1, gap: 6, push: 10, pack: 0, lab: 0, dim: 1, card: 1, medal: 0, fill: EARNED, val: sum(EARNED) },
    { draw: 1, gap: 0, push: 0, pack: 1, lab: 0, dim: 0, card: 0, medal: 1, fill: END, val: sum(END) }
  ];
  var DUR = [3000, 3000, 4200, 3000];   /* the opened meal holds a little longer, it has the most to read */
  function clone(p) { return Object.assign({}, p, { fill: p.fill.slice() }); }
  var S = clone(PH[0]); S.draw = 0; S.val = 0; S.fill = [0, 0, 0, 0];

  /* geometry: angles in degrees, clockwise from twelve o'clock */
  function pt(a, r) { var t = (a - 90) * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; }
  function arc(a0, a1, dx, dy) {
    if (a1 - a0 < .05) return "";
    if (a1 - a0 >= 359.99) a1 = a0 + 359.99;
    var p = pt(a0, R), q = pt(a1, R);
    return "M" + (p[0] + dx).toFixed(2) + " " + (p[1] + dy).toFixed(2) + "A" + R + " " + R + " 0 " + (a1 - a0 > 180 ? 1 : 0) + " 1 " + (q[0] + dx).toFixed(2) + " " + (q[1] + dy).toFixed(2);
  }
  var NS = "http://www.w3.org/2000/svg";
  function mk(parent, stroke) { var p = document.createElementNS(NS, "path"); p.setAttribute("fill", "none"); p.setAttribute("stroke", stroke); p.setAttribute("stroke-width", SW); parent.appendChild(p); return p; }
  var trk = SEG.map(function () { return mk($("tracks"), tok("--g-100")); });
  var glow = mk($("tracks"), tok("--brand-200"));
  var fil = SEG.map(function () { return mk($("fills"), tok("--brand-600")); });
  $("labs").innerHTML = SEG.map(function (s, i) {
    var mid = (starts[i] + s.w / 2) * 3.6, p = pt(mid, 146);
    var w = WHO === "current" ? EARNED[i] + " of " + s.w : s.w;
    return '<div class="lab" style="left:' + p[0].toFixed(1) + 'px;top:' + p[1].toFixed(1) + 'px;opacity:0"><span class="n">' + s.n + '</span><span class="w">' + w + '</span></div>';
  }).join("");
  var labs = [].slice.call(document.querySelectorAll(".lab"));
  /* the 80 mark: a gold notch across the ring, with the medal just outside it */
  var notch = document.createElementNS(NS, "line"), n0 = pt(288, R - 15), n1 = pt(288, R + 19);
  notch.setAttribute("x1", n0[0]); notch.setAttribute("y1", n0[1]); notch.setAttribute("x2", n1[0]); notch.setAttribute("y2", n1[1]);
  notch.setAttribute("stroke", tok("--gold-700")); notch.setAttribute("stroke-width", 3); notch.setAttribute("stroke-linecap", "round"); notch.setAttribute("opacity", 0);
  $("fills").appendChild(notch);
  var mp = pt(288, 142); $("medal").style.left = mp[0] + "px"; $("medal").style.top = mp[1] + "px";
  var bfMid = pt(36, R + 14);

  function render() {
    var packedAt = 0;
    SEG.forEach(function (s, i) {
      var a0 = starts[i] * 3.6, a1 = (starts[i] + s.w) * 3.6, mid = (a0 + a1) / 2;
      var push = S.push + (i === 0 ? 14 * S.dim : 0);
      var off = pt(mid, push), dx = off[0] - CX, dy = off[1] - CY;
      /* a hair of overlap while joined, so neighbours meet without a seam */
      var seam = Math.max(0, .8 - S.gap);
      var t0 = a0 + S.gap / 2, t1 = Math.min(a1 - S.gap / 2 + seam, S.draw * 360);
      trk[i].setAttribute("d", t1 > t0 ? arc(t0, t1, dx, dy) : "");
      trk[i].setAttribute("opacity", i === 0 ? 1 : 1 - .65 * S.dim);
      if (i === 0) { glow.setAttribute("d", arc(t0, a1 - S.gap / 2, dx, dy)); glow.setAttribute("opacity", S.dim); }
      /* a fill sits packed end to end in the whole ring, and inside its own meal when split */
      var len = S.fill[i] * 3.6, inLen = len * (a1 - a0 - S.gap) / (a1 - a0);
      var f0 = packedAt * 3.6 * S.pack + t0 * (1 - S.pack);
      var f1 = f0 + len * S.pack + inLen * (1 - S.pack);
      packedAt += S.fill[i];
      fil[i].setAttribute("d", arc(f0, f1 > f0 + .05 && i < 3 && S.fill[i + 1] > .05 ? f1 + .8 * S.pack : f1, dx, dy));
      fil[i].setAttribute("opacity", i === 0 ? 1 : 1 - .65 * S.dim);
      labs[i].style.opacity = S.lab;
    });
    $("val").textContent = Math.round(S.val);
    $("num").style.opacity = 1 - S.card;
    $("medal").style.opacity = S.medal; notch.setAttribute("opacity", S.medal);
    $("medal").style.transform = "translate(-50%, calc(-50% + " + (6 * (1 - S.medal)).toFixed(1) + "px))";
    var rad = S.card * 460;
    $("card").style.clipPath = "circle(" + rad.toFixed(1) + "px at " + bfMid[0].toFixed(1) + "px " + bfMid[1].toFixed(1) + "px)";
  }

  var ease = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  var clamp = function (x) { return Math.max(0, Math.min(1, x)); };
  var raf = 0;
  function tweenTo(T, dur, done) {
    cancelAnimationFrame(raf);
    var A = clone(S);
    if (STILL || REDUCED || !dur) { S = clone(T); render(); done && done(); return; }
    var t0 = performance.now();
    var opening = T.card > A.card;
    (function step(now) {
      var t = clamp((now - t0) / dur);
      ["draw", "gap", "push", "pack", "lab", "dim", "medal", "val"].forEach(function (k) {
        /* labels leave early and arrive late, so they never ride on moving arcs */
        var tt = k === "lab" ? (T.lab > A.lab ? clamp((t - .45) / .55) : clamp(t / .4)) : k === "medal" ? clamp((t - .5) / .5) : t;
        S[k] = A[k] + (T[k] - A[k]) * ease(tt);
      });
      /* the card opens once the segment has lifted, and closes before the ring rejoins */
      var ct = opening ? clamp((t - .3) / .7) : clamp(t / .55);
      S.card = A.card + (T.card - A.card) * ease(ct);
      S.fill = A.fill.map(function (v, i) { return v + (T.fill[i] - v) * ease(clamp((t - .2) / .8)); });
      render();
      if (t < 1) raf = requestAnimationFrame(step); else done && done();
    })(t0);
  }

  /* the opened meal: the brief's worked example */
  var BF = { t: [15, 40, 9], ate: [9, 58, 9], mk: [75, 75, 100] };
  var MAC = [{ k: "protein", n: "Protein" }, { k: "carbs", n: "Carbs" }, { k: "fats", n: "Fat" }];
  $("bands").innerHTML = MAC.map(function (x, j) {
    var t = BF.t[j], max = t * 1.6, lo = t * .8, hi = Math.max(t * 1.2, t + 3);
    var pc = function (v) { return Math.min(100, v / max * 100).toFixed(1) + "%"; };
    return '<div class="band"><div class="top"><i class="gl glyph-' + x.k + '"></i><span class="nm">' + x.n + '</span><span class="ate">' + BF.ate[j] + ' g of ' + t + ' g</span>' +
      '<span class="mk" data-v="' + BF.mk[j] + '">0 marks</span></div><div class="rail"><div class="zone" style="left:' + pc(lo) + ';width:calc(' + pc(hi) + ' - ' + pc(lo) + ')"></div>' +
      '<div class="tick" style="left:' + pc(t) + '"></div><div class="dot" data-to="' + pc(BF.ate[j]) + '" style="transition-delay:' + (450 + j * 150) + 'ms"></div></div></div>';
  }).join("");
  var counters = [];
  function count(el, b, suf, delay, dur) {
    if (STILL || REDUCED) { el.textContent = b + suf; return; }
    counters.push(setTimeout(function () {
      var t0 = performance.now();
      (function tick(now) { var p = clamp((now - t0) / dur); el.textContent = Math.round(b * ease(p)) + suf; if (p < 1) requestAnimationFrame(tick); })(t0);
    }, delay));
  }
  function cardIn(on) {
    counters.forEach(clearTimeout); counters = [];
    var c = $("card");
    c.classList.toggle("in", on);
    c.querySelectorAll(".band").forEach(function (b, j) {
      var d = b.querySelector(".dot"), m = b.querySelector(".mk"), v = +m.dataset.v;
      d.style.left = on ? d.dataset.to : "0%";
      if (on) { count(m, v, " marks", 800 + j * 150, 500); m.classList.toggle("full", v === 100); }
      else { m.textContent = "0 marks"; m.classList.remove("full"); }
    });
    if (on) count($("cScore"), 83, "", 1300, 700); else $("cScore").textContent = "0";
  }

  /* phases, autoplay, pause */
  var cur = 0, playing = !STILL, timer = 0, bar = null;
  var dots = [].slice.call(document.querySelectorAll("#dots i"));
  var PAUSE = '<svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3.5" height="12" rx="1.2"/><rect x="11.5" y="4" width="3.5" height="12" rx="1.2"/></svg>';
  var PLAY = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 4.6v10.8a1 1 0 0 0 1.5.86l8.6-5.4a1 1 0 0 0 0-1.72L7.5 3.74A1 1 0 0 0 6 4.6z"/></svg>';

  function setCaption(i, instant) {
    var c = $("cap");
    if (instant || STILL || REDUCED) { c.textContent = CAP[i]; c.classList.remove("out"); return; }
    c.classList.add("out");
    setTimeout(function () { c.textContent = CAP[i]; c.classList.remove("out"); }, 300);
  }
  function chrome() {
    dots.forEach(function (d, k) { d.classList.toggle("on", k === cur); d.classList.toggle("done", k < cur); d.classList.toggle("held", k === cur && (!playing || cur === 3)); });
    $("back").disabled = cur === 0;
    $("next").textContent = cur === 3 ? CTA : "Next";
    var auto = cur < 3 && !STILL;
    $("pp").hidden = !auto;
    $("pp").innerHTML = playing ? PAUSE : PLAY;
    $("pp").setAttribute("aria-label", playing ? "Pause" : "Play");
    document.body.classList.toggle("paused", !playing && auto && !STILL);
  }
  function arm() {
    clearTimeout(timer); if (bar) { bar.cancel(); bar = null; }
    if (!playing || cur >= 3) return;
    var b = dots[cur].querySelector("b");
    bar = b.animate([{ width: "0%" }, { width: "100%" }], { duration: DUR[cur], easing: "linear", fill: "both" });
    bar.onfinish = function () { go(cur + 1); };
  }
  function go(i, instant) {
    i = Math.max(0, Math.min(3, i));
    var leavingCard = cur === 2 && i !== 2;
    cur = i;
    if (leavingCard) cardIn(false);
    setCaption(i, instant);
    tweenTo(PH[i], instant ? 0 : 1300, function () { if (cur === 2 && i === 2) cardIn(true); });
    if (i === 3) playing = false;
    chrome(); arm();
  }
  function toggle() {
    if (cur >= 3 || STILL) return;
    playing = !playing;
    if (bar) { playing ? bar.play() : bar.pause(); } else arm();
    chrome();
  }
  /* leaving the app pauses the reveal, so nobody comes back to a skipped phase */
  document.addEventListener("visibilitychange", function () { if (document.hidden && playing && cur < 3) toggle(); });
  $("stage").addEventListener("click", toggle);
  $("stage").addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
  $("pp").onclick = toggle;
  $("next").onclick = function () { if (cur === 3) close(); else go(cur + 1); };
  $("back").onclick = function () { go(cur - 1); };

  /* open, close, replay */
  function open(fromReplay) {
    $("replay").hidden = true;
    document.body.classList.remove("closing");
    var start = fromReplay ? 0 : Math.max(1, Math.min(4, parseInt(Q.get("step"), 10) || 1)) - 1;
    playing = !STILL && start < 3;
    cardIn(false);
    S = clone(PH[0]); S.draw = 0; S.val = 0; S.fill = [0, 0, 0, 0]; render();
    cur = start; setCaption(start, true); chrome();
    if (bar) { bar.cancel(); bar = null; } clearTimeout(timer);
    requestAnimationFrame(function () { requestAnimationFrame(function () { document.body.classList.add("open"); }); });
    if (STILL) { S = clone(PH[start]); render(); if (start === 2) cardIn(true); return; }
    /* the ring draws itself in as the sheet settles */
    timer = setTimeout(function () {
      if (start === 0) tweenTo(PH[0], 1400, function () { arm(); });
      else { tweenTo(PH[start], 1300, function () { if (cur === 2) cardIn(true); }); arm(); }
    }, 380);
    setTimeout(function () { $("sheet").focus({ preventScroll: true }); }, 450);
  }
  function close() {
    cancelAnimationFrame(raf); clearTimeout(timer); if (bar) { bar.cancel(); bar = null; }
    document.body.classList.add("closing");
    document.body.classList.remove("open", "paused");
    setTimeout(function () { $("replay").hidden = false; }, STILL ? 0 : 400);
  }
  $("close").onclick = close;
  $("replay").onclick = function () { open(true); };
  addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("open")) close(); });
  open(false);
})();
</script>
</body>
</html>
