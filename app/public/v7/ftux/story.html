<!doctype html>
<!--
  FTUX bottom sheet, variant "story": A short story in four scenes.
  A paged sheet over the real Eat screen. Each page is one calm animated
  illustration with two short lines under it. Dots, Back and Next move between
  pages (swipe the picture or use the arrow keys too).

  Flags
    ?who=new       (default) first-time user. Plate, check, full marks, score. CTA "Log Your First Meal".
    ?who=current   existing logger. Opens with what is new, then check, full marks, score. CTA "See My Score".
    ?step=N        open at page N (1 based).
    ?still=1       skip all motion and show every end state (also used for prefers-reduced-motion).
-->
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/v7/r3/goodflip-ui.css">
<link rel="stylesheet" href="/v7/icons/glyph-masks.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: Roboto, system-ui, sans-serif; color: var(--g-900); -webkit-font-smoothing: antialiased; }
  :root { --gut: 24px; --out: cubic-bezier(.2,0,0,1); --io: cubic-bezier(.45,0,.25,1); }

  /* the real Eat screen behind */
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .42s var(--out); }
  .open .scrim { opacity: 1; }

  /* sheet: white, 24 top corners, header fixed, body scrolls, at most 90% tall */
  .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 390px; max-height: 90vh; display: flex; flex-direction: column;
    background: #fff; border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-sheet);
    transform: translate(-50%, 100%); transition: transform .32s cubic-bezier(.4,0,1,1); }
  .open .sheet { transform: translate(-50%, 0); transition: transform .42s var(--out); }
  .sheet:focus { outline: none; }
  .shead { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px var(--gut) 8px; }
  .shead h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: .1px; }
  .x { flex: none; width: 44px; height: 44px; margin: -6px -6px -6px 0; display: grid; place-items: center; border: 0; padding: 0; background: none; border-radius: 9999px; cursor: pointer; }
  .x:focus-visible, .back:focus-visible, .cta:focus-visible, .dot:focus-visible { outline: 2px solid var(--in-500); outline-offset: 2px; }
  .sbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px var(--gut) 0; }
  .sfoot { flex: none; padding: 16px var(--gut) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }

  /* pages share one grid cell, so the sheet keeps the height of the tallest page */
  .pages { display: grid; }
  .pg { grid-area: 1 / 1; display: grid; gap: 24px; align-content: start; opacity: 0; visibility: hidden;
    transform: translateX(calc(var(--dx, 1) * 24px)); transition: opacity .36s var(--io), transform .36s var(--io), visibility 0s .36s; }
  .pg.on { opacity: 1; visibility: visible; transform: none; transition: opacity .42s var(--io) .06s, transform .42s var(--io) .06s, visibility 0s; }
  .pg.off-l { transform: translateX(-24px); }

  /* the illustration: the house card, an indigo wash on top and a two-tone conic edge */
  .stage { position: relative; height: 248px; border-radius: var(--r-xl); border: 1px solid transparent; overflow: hidden; isolation: isolate; touch-action: pan-y;
    background: linear-gradient(180deg, var(--in-50) 0%, var(--in-25) 38%, #fff 100%) padding-box,
      conic-gradient(from 0deg, var(--in-400) 0deg, var(--g-200) 48deg, var(--g-200) 312deg, var(--in-400) 360deg) border-box; }
  .stage.scene::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 150px; z-index: -1; opacity: .5;
    background: var(--scene) right top / auto 100% no-repeat;
    -webkit-mask: linear-gradient(90deg, transparent 20%, #000 70%), linear-gradient(180deg, #000 30%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .tag { position: absolute; left: 16px; top: 16px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .4px; color: var(--in-700); text-transform: uppercase; }

  .copy { display: grid; gap: 8px; padding: 0 4px; }
  .copy h3 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -.2px; color: var(--g-900); text-wrap: balance; }
  .copy p { margin: 0; font-size: 15px; line-height: 23px; color: var(--g-600); text-wrap: pretty; }

  .gl { display: inline-block; width: 20px; height: 20px; background: var(--brand-600); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }

  /* footer: back, dots, then the one action */
  .nav { display: grid; grid-template-columns: 72px 1fr 72px; align-items: center; height: 24px; }
  .back { justify-self: start; height: 44px; margin: -10px 0 -10px -8px; padding: 0 8px; border: 0; background: none; font: 500 15px Roboto, sans-serif; color: var(--brand-600); cursor: pointer; border-radius: var(--r-sm); transition: opacity .3s var(--io); }
  .back[hidden] { display: block; visibility: hidden; opacity: 0; }
  .dots { justify-self: center; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 9999px; background: var(--g-200); cursor: pointer; position: relative; transition: width .42s var(--io), background-color .42s var(--io); }
  .dot::after { content: ""; position: absolute; inset: -18px -4px; }
  .dot.on { width: 24px; background: var(--brand-600); }
  .cta { width: 100%; height: 48px; margin-bottom: 7px; border: 0; border-radius: var(--r-sm); background: var(--brand-600); color: #fff;
    font: 600 16px Roboto, sans-serif; letter-spacing: .2px; box-shadow: 0 7px 0 var(--brand-700); cursor: pointer; transition: transform .12s var(--io), box-shadow .12s var(--io); }
  .cta:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--brand-700); }

  .replay { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); height: 40px; padding: 0 20px; border: 0; border-radius: 9999px;
    background: #fff; color: var(--brand-700); font: 500 14px Roboto, sans-serif; box-shadow: var(--shadow-card); cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .3s var(--io); }
  .closed .replay { opacity: 1; pointer-events: auto; }

  /* ---------- scene 1: the coach's plate ---------- */
  .plate { position: absolute; left: 50%; top: 50%; width: 176px; height: 176px; transform: translate(-50%, -46%); }
  .plate svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 18px rgba(45,49,166,.12)); }
  .plate .wedge { fill: var(--brand-200); transform-box: view-box; transform-origin: 100px 100px; transform: scale(0); }
  .plate .edge { fill: none; stroke: var(--brand-400); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: .9; }
  .plate .pg-gl { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; background: var(--brand-700); }
  .chip { position: absolute; display: grid; gap: 2px; opacity: 0; transform: translateY(6px); }
  .chip small { font-size: 12px; line-height: 16px; color: var(--g-500); }
  .chip b { font-size: 18px; line-height: 22px; font-weight: 600; color: var(--g-900); font-variant-numeric: tabular-nums; }
  .chip.r { text-align: right; }
  .play .plate .wedge { animation: fillUp .9s var(--io) both; }
  .play .plate .w1 { animation-delay: .3s; } .play .plate .w2 { animation-delay: .7s; } .play .plate .w3 { animation-delay: 1.1s; }
  .play .plate .g1 { animation: fadeIn .5s var(--io) .9s both; } .play .plate .g2 { animation: fadeIn .5s var(--io) 1.3s both; } .play .plate .g3 { animation: fadeIn .5s var(--io) 1.7s both; }
  .play .c1 { animation: rise .5s var(--io) 1.0s both; } .play .c2 { animation: rise .5s var(--io) 1.4s both; } .play .c3 { animation: rise .5s var(--io) 1.8s both; }
  @keyframes fillUp { to { transform: scale(1); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ---------- scene 2: logged beside planned ---------- */
  .rows { position: absolute; inset: 44px 16px 44px 16px; display: grid; gap: 20px; align-content: center; }
  .row { display: grid; grid-template-columns: 20px 52px 1fr 72px; align-items: center; gap: 8px; }
  .row .n { font-size: 13px; line-height: 16px; font-weight: 500; color: var(--g-700); }
  .row .v { text-align: right; font-size: 13px; line-height: 16px; color: var(--g-500); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .v b { font-size: 15px; font-weight: 600; color: var(--g-900); }
  .track { position: relative; height: 14px; }
  .plan { position: absolute; left: 0; top: 0; bottom: 0; width: 60%; border-radius: 9999px; border: 1.5px dashed var(--g-400); background: rgba(255,255,255,.7); }
  .ate { position: absolute; left: 0; top: 2px; bottom: 2px; width: var(--w); border-radius: 9999px; background: var(--brand-500); transform-origin: left center; transform: scaleX(0); }
  .row .v b { opacity: 0; }
  .play .ate { animation: grow .8s var(--io) both; }
  .play .r1 .ate { animation-delay: .4s; } .play .r2 .ate { animation-delay: .7s; } .play .r3 .ate { animation-delay: 1s; }
  .play .r1 .v b { animation: fadeIn .4s var(--io) .9s both; } .play .r2 .v b { animation: fadeIn .4s var(--io) 1.2s both; } .play .r3 .v b { animation: fadeIn .4s var(--io) 1.5s both; }
  @keyframes grow { to { transform: scaleX(1); } }
  .key { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 20px; font-size: 12px; line-height: 16px; color: var(--g-500); }
  .key span { display: inline-flex; align-items: center; gap: 8px; }
  .key i { width: 20px; height: 10px; border-radius: 9999px; }
  .key .kp { border: 1.5px dashed var(--g-400); }
  .key .ka { background: var(--brand-500); }

  /* ---------- scene 3: the full marks band ---------- */
  .band-wrap { position: absolute; left: 24px; right: 24px; top: 152px; height: 12px; }
  .rail { position: absolute; inset: 0; border-radius: 9999px; background: var(--g-100); }
  .zone { position: absolute; top: -6px; bottom: -6px; left: 50%; width: 25%; border-radius: var(--r-sm); background: var(--ok-50); box-shadow: inset 0 0 0 1.5px var(--ok-300); transition: background-color .6s var(--io), box-shadow .6s var(--io); }
  .zone::after { content: ""; position: absolute; inset: -10px; border-radius: 14px; background: radial-gradient(closest-side, rgba(18,183,106,.32), rgba(18,183,106,0)); opacity: 0; }
  .play .zone::after { animation: fadeIn .8s var(--io) 1.25s both; }
  .play .zone { animation: zoneLit .8s var(--io) 1.25s both; }
  @keyframes zoneLit { to { background-color: var(--ok-100); box-shadow: inset 0 0 0 1.5px var(--ok-500); } }
  .tick { position: absolute; top: 26px; transform: translateX(-50%); font-size: 12px; line-height: 16px; color: var(--g-500); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tick.t { top: 26px; color: var(--g-800); font-weight: 600; }
  .pin { position: absolute; bottom: 6px; width: 0; }
  .pin .stem { position: absolute; left: -1px; bottom: 0; width: 2px; height: 30px; background: var(--g-300); border-radius: 1px; }
  .pin .head { position: absolute; left: -18px; bottom: 28px; width: 36px; height: 36px; border-radius: 9999px; background: #fff; display: grid; place-items: center;
    box-shadow: 0 4px 10px rgba(16,24,40,.10), inset 0 0 0 1.5px var(--g-200); font-size: 13px; font-weight: 600; color: var(--g-400); font-variant-numeric: tabular-nums; }
  .pin svg { position: absolute; inset: -4px; width: 44px; height: 44px; transform: rotate(-90deg); }
  .pin svg circle { fill: none; stroke-width: 3; stroke-linecap: round; }
  .pin .lbl { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); font-size: 12px; line-height: 16px; white-space: nowrap; color: var(--g-500); opacity: 0; }
  .pin { opacity: 0; transform: translateY(-28px); }
  .play .pa { animation: land .7s var(--io) .45s both; } .play .pb { animation: land .7s var(--io) 1.9s both; }
  @keyframes land { to { opacity: 1; transform: none; } }
  .pa .head { transition: none; }
  .play .pa .head { animation: lightFull .6s var(--io) 1.25s both; }
  .play .pa .stem { animation: stemLit .6s var(--io) 1.25s both; }
  .play .pb .head { animation: lightPart .6s var(--io) 2.55s both; }
  @keyframes lightFull { to { background: var(--ok-500); color: #fff; box-shadow: 0 6px 16px rgba(18,183,106,.35), inset 0 0 0 1.5px var(--ok-500); } }
  @keyframes lightPart { to { background: var(--ok-50); color: var(--ok-600); box-shadow: 0 4px 10px rgba(16,24,40,.10), inset 0 0 0 1.5px var(--ok-100); } }
  @keyframes stemLit { to { background: var(--ok-500); } }
  .pb .arc { stroke: var(--ok-500); stroke-dasharray: 0 100; }
  .play .pb .arc { animation: arcPart .8s var(--io) 2.55s both; }
  @keyframes arcPart { to { stroke-dasharray: 75 25; } }
  .play .pa .lbl { animation: fadeIn .5s var(--io) 1.45s both; } .play .pb .lbl { animation: fadeIn .5s var(--io) 2.85s both; }
  .pa .lbl { color: var(--ok-600); font-weight: 600; transform: translateX(-30%); }
  .pb .lbl { transform: translateX(-70%); }

  /* ---------- scene 4: meals add up, medal at 80 ---------- */
  .ring { position: absolute; left: 50%; top: 50%; width: 176px; height: 176px; transform: translate(-62%, -46%); }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring circle { fill: none; stroke-width: 16; }
  .ring .trk { stroke: var(--brand-100); }
  .ring .fil { stroke: var(--ok-500); }
  .play .ring .fil { animation: arcIn var(--d, .6s) var(--io) var(--dl, 0s) both; }
  @keyframes arcIn { from { stroke-dasharray: 0 100; } }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .num { font-size: 44px; line-height: 48px; font-weight: 600; letter-spacing: -1px; font-variant-numeric: tabular-nums; color: var(--g-900); }
  .ring .of { font-size: 12px; line-height: 16px; color: var(--g-500); }
  .ml { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; font-size: 11px; line-height: 13px; color: var(--g-500); white-space: nowrap; opacity: 0; }
  .ml b { font-size: 12px; font-weight: 600; color: var(--g-800); font-variant-numeric: tabular-nums; }
  .play .ml { animation: fadeIn .5s var(--io) var(--dl) both; }
  .medal { position: absolute; right: 22px; top: 50%; width: 76px; transform: translateY(-40%); display: grid; justify-items: center; gap: 8px; text-align: center; }
  .medal .m { position: relative; width: 60px; height: 70px; }
  .medal .m::before { content: ""; position: absolute; inset: -18px; border-radius: 9999px; background: radial-gradient(closest-side, rgba(231,193,68,.45), rgba(231,193,68,0)); opacity: 0; transition: opacity .9s var(--io); }
  .medal img { position: relative; width: 100%; height: 100%; object-fit: contain; filter: grayscale(1) opacity(.28); transition: filter .9s var(--io); }
  .medal small { font-size: 12px; line-height: 16px; color: var(--g-500); transition: color .6s var(--io); }
  .medal.won img { filter: drop-shadow(0 6px 8px rgba(29,77,56,.25)); }
  .medal.won .m::before { opacity: 1; }
  .medal.won small { color: var(--olive-700); font-weight: 600; }

  /* ---------- scene 0 (current users): what is new ---------- */
  .logs { position: absolute; left: 16px; top: 52px; width: 160px; display: grid; gap: 8px; }
  .lg { display: grid; grid-template-columns: 32px 1fr 20px; gap: 8px; align-items: center; height: 48px; padding: 0 8px; border-radius: var(--r-md); background: #fff; box-shadow: var(--shadow-card); opacity: 0; transform: translateY(8px); }
  .lg img { width: 32px; height: 32px; border-radius: var(--r-sm); object-fit: cover; }
  .lg span { font-size: 13px; line-height: 16px; font-weight: 500; color: var(--g-700); }
  .lg .tk { width: 20px; height: 20px; border-radius: 9999px; background: var(--brand-100); display: grid; place-items: center; }
  .lg .tk svg { width: 12px; height: 12px; }
  .play .l1 { animation: rise .5s var(--io) .3s both; } .play .l2 { animation: rise .5s var(--io) .6s both; } .play .l3 { animation: rise .5s var(--io) .9s both; }
  .flow { position: absolute; left: 182px; top: 120px; width: 28px; height: 2px; background: linear-gradient(90deg, var(--g-200), var(--ok-300)); transform-origin: left; transform: scaleX(0); }
  .play .flow { animation: grow .5s var(--io) 1.3s both; }
  .new-ring { position: absolute; right: 20px; top: 58px; width: 128px; height: 128px; }
  .new-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .new-ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .new-ring .trk { stroke: var(--brand-100); }
  .new-ring .fil { stroke: var(--ok-500); }
  .play .new-ring .fil { animation: arcIn 1.2s var(--io) 1.6s both; }
  .new-ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .new-ring .num { font-size: 34px; line-height: 38px; font-weight: 600; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
  .new-ring .of { font-size: 11px; line-height: 14px; color: var(--g-500); }
  .newpill { position: absolute; right: 16px; top: 12px; height: 24px; padding: 0 10px; border-radius: 9999px; background: var(--gold-100); box-shadow: inset 0 0 0 1px var(--gold-300);
    color: var(--olive-700); font-size: 12px; line-height: 24px; font-weight: 600; letter-spacing: .3px; opacity: 0; }
  .play .newpill { animation: fadeIn .6s var(--io) 2.6s both; }

  /* still and reduced motion: every end state, at once */
  .still *, .still *::before, .still *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition-duration: 0s !important; transition-delay: 0s !important; }
</style>
</head>
<body>
<iframe class="bg" tabindex="-1" aria-hidden="true" title=""></iframe><script>/* new users see the day with their plan and nothing logged yet */ document.currentScript.previousElementSibling.src = "/v7/r3/eat.html" + (/who=current/.test(location.search) ? "" : "?state=empty");</script>
<div class="scrim" aria-hidden="true"></div>

<section class="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <header class="shead">
    <h2 id="sTitle">How your score works</h2>
    <button class="x" type="button" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32"><path style="fill:var(--g-400)" d="M16 3a13 13 0 1 0 13 13A13.013 13.013 0 0 0 16 3m4.708 16.293a1 1 0 0 1-1.415 1.415L16 17.414l-3.293 3.293a1 1 0 0 1-1.415-1.415L14.587 16l-3.293-3.293a1 1 0 1 1 1.415-1.415L16 14.587l3.293-3.293a1 1 0 0 1 1.415 1.415L17.414 16z"/></svg></button>
  </header>
  <div class="sbody"><div class="pages" id="pages" aria-live="polite"></div></div>
  <footer class="sfoot">
    <div class="nav">
      <button class="back" type="button" hidden>Back</button>
      <div class="dots" id="dots" role="tablist" aria-label="Pages"></div>
      <span></span>
    </div>
    <button class="cta" type="button">Next</button>
  </footer>
</section>
<button class="replay" type="button">Replay</button>

<script>
(function () {
  addEventListener("message", function (e) { if (e.data === "hero:ready" && e.source) e.source.postMessage("hero:mount", "*"); });

  var Q = new URLSearchParams(location.search);
  var WHO = Q.get("who") === "current" ? "current" : "new";
  var STILL = Q.get("still") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (STILL) document.documentElement.classList.add("still");

  var ICON = "/v7/icons/";
  var gl = function (m, cls) { return '<i class="gl glyph-' + m + (cls ? " " + cls : "") + '" aria-hidden="true"></i>'; };
  var tick = '<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.3 2.3 4.7-4.9" stroke="var(--brand-600)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* plate wedges: protein on the left, carbs top right, fat bottom right */
  function wedge(a0, a1, r) {
    var p = function (a) { var t = a * Math.PI / 180; return (100 + r * Math.cos(t)).toFixed(2) + " " + (100 + r * Math.sin(t)).toFixed(2); };
    return "M100 100 L" + p(a0) + " A" + r + " " + r + " 0 0 1 " + p(a1) + " Z";
  }
  function arcEdge(a0, a1, r) {
    var p = function (a) { var t = a * Math.PI / 180; return (100 + r * Math.cos(t)).toFixed(2) + " " + (100 + r * Math.sin(t)).toFixed(2); };
    return "M" + p(a0) + " A" + r + " " + r + " 0 0 1 " + p(a1);
  }
  var W = [[120, 240], [240, 360], [0, 120]];   /* degrees; white spokes part them */
  function glyphAt(i, m) {
    var mid = (W[i][0] + W[i][1]) / 2 * Math.PI / 180, r = 44;
    var x = (100 + r * Math.cos(mid)) / 200 * 100, y = (100 + r * Math.sin(mid)) / 200 * 100;
    return '<i class="gl glyph-' + m + ' pg-gl g' + (i + 1) + '" style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%" aria-hidden="true"></i>';
  }

  /* the day, worth 100: Breakfast 20, Lunch 35, Snack 10, Dinner 35. Earned 17, 30, 8, 30 = 85 */
  var DAY = [["Breakfast", 20, 17], ["Lunch", 35, 30], ["Snack", 10, 8], ["Dinner", 35, 30]];
  var GAP = 1.4, T0 = .35, SEG = [.7, .8, .45, .8];

  var art = {
    plate:
      '<div class="stage scene" style="--scene:url(' + ICON + 'meals/bg/bf.webp)"><span class="tag">Breakfast plan</span>' +
      '<div class="plate"><svg viewBox="0 0 200 200" aria-hidden="true">' +
        '<circle cx="100" cy="100" r="98" fill="#fff"/><circle cx="100" cy="100" r="98" fill="none" stroke="var(--g-200)"/>' +
        '<circle cx="100" cy="100" r="84" fill="var(--g-25)" stroke="var(--g-100)"/>' +
        W.map(function (w, i) { return '<path class="wedge w' + (i + 1) + '" d="' + wedge(w[0], w[1], 76) + '"/><path class="edge" d="' + arcEdge(w[0] + 2, w[1] - 2, 76) + '"/>'; }).join("") +
        [0, 120, 240].map(function (a) { var t = a * Math.PI / 180; return '<line x1="100" y1="100" x2="' + (100 + 84 * Math.cos(t)).toFixed(2) + '" y2="' + (100 + 84 * Math.sin(t)).toFixed(2) + '" stroke="var(--g-25)" stroke-width="4" stroke-linecap="round"/>'; }).join("") +
      '</svg>' + glyphAt(0, "protein") + glyphAt(1, "carbs") + glyphAt(2, "fats") + '</div>' +
      '<div class="chip c1" style="left:24px;top:112px"><small>Protein</small><b>15 g</b></div>' +
      '<div class="chip c2 r" style="right:24px;top:60px"><small>Carbs</small><b>40 g</b></div>' +
      '<div class="chip c3 r" style="right:24px;top:164px"><small>Fat</small><b>9 g</b></div>' +
      '</div>',

    check:
      '<div class="stage scene" style="--scene:url(' + ICON + 'meals/bg/bf.webp)"><span class="tag">Breakfast</span>' +
      '<div class="rows">' +
        row(1, "protein", "Protein", 9, 15) + row(2, "carbs", "Carbs", 58, 40) + row(3, "fats", "Fat", 9, 9) +
      '</div>' +
      '<div class="key"><span><i class="kp"></i>Coach’s plan</span><span><i class="ka"></i>You ate</span></div>' +
      '</div>',

    band:
      '<div class="stage"><span class="tag">Protein, target 15 g</span>' +
      '<div class="band-wrap"><div class="rail"></div><div class="zone"></div>' +
        '<span class="tick" style="left:0;transform:none">0 g</span><span class="tick" style="left:50%">12 g</span><span class="tick t" style="left:62.5%">15 g</span><span class="tick" style="left:75%">18 g</span>' +
        '<div class="pin pa" style="left:62.5%"><span class="lbl">Full marks</span><span class="stem"></span><span class="head">100</span></div>' +
        '<div class="pin pb" style="left:37.5%"><span class="lbl">9 g eaten</span><span class="stem"></span><span class="head"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="arc" cx="22" cy="22" r="20" pathLength="100"/></svg>75</span></div>' +
      '</div>' +
      '<div class="key" style="justify-content:center"><span><i style="width:16px;height:10px;border-radius:3px;background:var(--ok-100);box-shadow:inset 0 0 0 1.5px var(--ok-500)"></i>Full marks, from 12 g to 18 g</span></div>' +
      '</div>',

    ring: ringArt(),

    news:
      '<div class="stage"><span class="tag">What is new</span>' +
      '<div class="logs">' +
        log(1, "bf", "Breakfast") + log(2, "lunch", "Lunch") + log(3, "dinner", "Dinner") +
      '</div><span class="flow"></span>' +
      '<div class="new-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="50" pathLength="100"/>' +
        '<circle class="fil" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="64 36"/></svg>' +
        '<div class="mid"><span class="num" data-count="64" data-dl="1.6" data-d="1.2">64</span><span class="of">of 100</span></div></div>' +
      '<span class="newpill">New</span>' +
      '</div>'
  };

  function row(i, m, n, ate, plan) {
    var w = Math.min(ate / plan, 1.5) * 60;   /* the plan box is 60% of the track */
    return '<div class="row r' + i + '">' + gl(m) + '<span class="n">' + n + '</span>' +
      '<span class="track"><span class="plan"></span><span class="ate" style="--w:' + w.toFixed(1) + '%"></span></span>' +
      '<span class="v"><b>' + ate + '</b> of ' + plan + ' g</span></div>';
  }
  function log(i, img, n) {
    return '<div class="lg l' + i + '"><img src="' + ICON + 'meals/bg/' + img + '.webp" alt=""><span>' + n + '</span><span class="tk">' + tick + '</span></div>';
  }

  function ringArt() {
    var at = 0, t = T0, s = "", labels = "";
    DAY.forEach(function (d, i) {
      var len = d[1] - GAP, fil = len * d[2] / d[1];
      s += '<circle class="trk" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="' + len + " " + (100 - len) + '" stroke-dashoffset="' + (-at) + '"/>';
      s += '<circle class="fil" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="' + fil.toFixed(2) + " " + (100 - fil).toFixed(2) + '" stroke-dashoffset="' + (-at) + '" style="--dl:' + t.toFixed(2) + 's;--d:' + SEG[i] + 's"/>';
      var mid = (at + d[1] / 2) / 100 * 2 * Math.PI, rr = 108;
      labels += '<span class="ml" style="left:' + (88 + rr * Math.sin(mid)).toFixed(1) + 'px;top:' + (88 - rr * Math.cos(mid)).toFixed(1) + 'px;--dl:' + t.toFixed(2) + 's">' + d[0] + '<b>' + d[1] + '</b></span>';
      at += d[1]; t += SEG[i] + .1;
    });
    return '<div class="stage"><span class="tag">Today</span>' +
      '<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true">' + s + '</svg>' +
      '<div class="mid"><span class="num" id="dayNum">85</span><span class="of">of 100</span></div>' + labels + '</div>' +
      '<div class="medal" id="medal"><span class="m"><img src="' + ICON + 'badge/simple/heart-apple.svg" alt=""></span><small>80 earns a medal</small></div>' +
      '</div>';
  }

  var COPY = {
    news:  ["Your meals now add up to a score", "Everything you log on GoodFlip now builds a daily score out of 100. Here is how it works."],
    plate: ["Your coach plans every meal", "Each meal gets its own amount of protein, carbs and fat, set just for you."],
    check: WHO === "current"
      ? ["Each meal is checked against its own plan", "Your coach sets protein, carbs and fat for every meal. What you log sits right beside it."]
      : ["Each meal is checked against its own plan", "Log what you ate, and it sits right beside what your coach planned for that meal."],
    band:  ["Close to the target earns full marks", "A little under or a little over counts in full. Further away earns part of the marks."],
    ring:  ["Your meals add up to today’s score", "Bigger meals count for more of the day. Reach 80 out of 100 and you earn a medal."]
  };
  var ORDER = WHO === "current" ? ["news", "check", "band", "ring"] : ["plate", "check", "band", "ring"];
  var LAST = WHO === "current" ? "See My Score" : "Log Your First Meal";

  var pagesEl = document.getElementById("pages"), dotsEl = document.getElementById("dots");
  var back = document.querySelector(".back"), cta = document.querySelector(".cta");
  ORDER.forEach(function (k, i) {
    var p = document.createElement("article");
    p.className = "pg"; p.dataset.k = k;
    p.setAttribute("aria-label", "Page " + (i + 1) + " of " + ORDER.length);
    p.innerHTML = art[k] + '<div class="copy"><h3>' + COPY[k][0] + '</h3><p>' + COPY[k][1] + '</p></div>';
    pagesEl.appendChild(p);
    var d = document.createElement("button");
    d.className = "dot"; d.type = "button"; d.setAttribute("role", "tab"); d.setAttribute("aria-label", "Page " + (i + 1));
    d.addEventListener("click", function () { go(i); });
    dotsEl.appendChild(d);
  });
  var pages = [].slice.call(pagesEl.children), dots = [].slice.call(dotsEl.children);

  var cur = -1, timers = [], raf = 0;
  function clearRun() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); }

  /* a number that eases along a list of [time, value] stops, in step with the arcs */
  function countAlong(el, stops, onTick) {
    if (STILL) { var last = stops[stops.length - 1][1]; el.textContent = last; onTick && onTick(last); return; }
    var start = performance.now();
    var ease = function (x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
    (function f(now) {
      var t = (now - start) / 1000, v = stops[0][1];
      for (var i = 0; i < stops.length - 1; i++) {
        var a = stops[i], b = stops[i + 1];
        if (t >= b[0]) v = b[1];
        else if (t > a[0]) { v = a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])); break; }
        else break;
      }
      el.textContent = Math.round(v); onTick && onTick(v);
      if (t < stops[stops.length - 1][0]) raf = requestAnimationFrame(f);
    })(start);
  }

  function play(p) {
    p.classList.remove("play"); void p.offsetWidth; p.classList.add("play");
    if (p.dataset.k === "ring") {
      var medal = p.querySelector("#medal"); medal.classList.remove("won");
      var t = T0, v = 0, stops = [[0, 0], [T0, 0]];
      DAY.forEach(function (d, i) { t += SEG[i]; v += d[2]; stops.push([t, v]); t += .1; stops.push([t, v]); });
      countAlong(p.querySelector("#dayNum"), stops, function (val) { if (val >= 80) medal.classList.add("won"); });
    }
    if (p.dataset.k === "news") {
      var n = p.querySelector(".num");
      countAlong(n, [[0, 0], [1.6, 0], [2.8, 64]]);
    }
  }

  function go(i, wait) {
    if (i < 0 || i >= pages.length || i === cur) return;
    clearRun();
    var dir = i > cur ? 1 : -1;
    pages.forEach(function (p, k) {
      p.style.setProperty("--dx", k > i ? 1 : -1);
      var on = k === i; p.classList.toggle("on", on); p.setAttribute("aria-hidden", on ? "false" : "true");
      if (!on) p.classList.remove("play");
    });
    dots.forEach(function (d, k) { d.classList.toggle("on", k === i); d.setAttribute("aria-selected", k === i); });
    cur = i;
    back.hidden = i === 0;
    cta.textContent = i === pages.length - 1 ? LAST : "Next";
    if (wait && !STILL) { var pp = pages[i]; timers.push(setTimeout(function () { play(pp); }, wait)); } else play(pages[i]);
    document.querySelector(".sbody").scrollTop = 0;
  }

  cta.addEventListener("click", function () { if (cur < pages.length - 1) go(cur + 1); else close(); });
  back.addEventListener("click", function () { go(cur - 1); });
  document.querySelector(".x").addEventListener("click", close);
  document.querySelector(".replay").addEventListener("click", function () { open(0); });
  addEventListener("keydown", function (e) {
    if (!document.body.classList.contains("open")) return;
    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
    if (e.key === "Escape") close();
  });

  /* swipe the picture to turn the page */
  var sx = null;
  pagesEl.addEventListener("pointerdown", function (e) { if (e.target.closest(".stage")) sx = e.clientX; });
  addEventListener("pointerup", function (e) {
    if (sx === null) return; var dx = e.clientX - sx; sx = null;
    if (dx < -40) go(cur + 1); else if (dx > 40) go(cur - 1);
  });

  function open(at) {
    document.body.classList.remove("closed");
    cur = -1; pages.forEach(function (p) { p.classList.remove("on", "play"); });
    requestAnimationFrame(function () {
      document.body.classList.add("open");
      /* the first page rides up with the sheet; its scene plays once the sheet has settled */
      go(at, 380);
      setTimeout(function () { document.querySelector(".sheet").focus({ preventScroll: true }); }, STILL ? 0 : 440);
    });
  }
  function close() {
    clearRun();
    document.body.classList.remove("open");
    setTimeout(function () { document.body.classList.add("closed"); }, STILL ? 0 : 340);
  }

  var start = Math.max(0, Math.min(pages.length - 1, (parseInt(Q.get("step"), 10) || 1) - 1));
  open(start);
})();
</script>
</body>
</html>
