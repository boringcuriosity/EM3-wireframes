<!doctype html>
<!--
  FTUX variant: "KAIRA walks you through it"
  A conversational bottom sheet over the real Eat screen. KAIRA explains the
  Nutrition sufficiency score in short bubbles, one at a time, each arriving
  through a soft shimmer. Two quick replies after each turn let the person
  steer; "Got It, Let Me Log" in the footer always finishes.

  Flags
    ?who=new       first-time user, just got the coach's plan (default)
    ?who=current   has been logging already, sees the score for the first time
    ?step=N        open at turn N with the earlier turns already in the thread
                   0 hello, 1 how it is worked out, 2 eating more,
                   3 bigger meals, 4 the medal, 5 wrap up
    ?still=1       no animation, every turn up to ?step shown in its end state
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAIRA Explains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/v7/r3/goodflip-ui.css">
<link rel="stylesheet" href="/v7/icons/glyph-masks.css">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: Roboto, system-ui, sans-serif; color: var(--g-900); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font: inherit; }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .stage > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; background: #fff; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .42s var(--ease); }
  .open .scrim { opacity: 1; }

  /* ---------------------------------------------------------- the sheet */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px;
    height: 58%; min-height: 430px; max-height: 90%; background: #fff; border-radius: var(--r-xl) var(--r-xl) 0 0;
    box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(105%); transition: transform .42s cubic-bezier(0,0,.2,1); }
  .open .sheet { transform: translateY(0); }
  .closing .sheet { transition: transform .32s cubic-bezier(.4,0,1,1); }
  /* her wash at the very top: indigo resolving into white, so the sheet reads as hers */
  .sheet::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 120px; pointer-events: none;
    background: linear-gradient(180deg, var(--in-25), rgba(255,255,255,0)); }
  .shd { position: relative; flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 6px 10px 16px; }
  .shd .who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .shd h2 { margin: 0; font: 600 18px/24px Roboto, sans-serif; color: var(--g-900); }
  .shd .sub { display: block; font: 400 12px/16px Roboto, sans-serif; color: var(--g-500); }
  .x { width: 44px; height: 44px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer; border-radius: 9999px; }
  .x:focus-visible { outline: 2px solid var(--in-600); outline-offset: -2px; }

  .thread { position: relative; flex: 1 1 auto; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: none; overscroll-behavior: contain; }
  .thread::-webkit-scrollbar { display: none; }
  .foot { flex: none; padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--g-100); background: #fff; }

  /* ---------------------------------------------------------- her lines */
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .gut { width: 24px; flex: none; padding-top: 4px; }
  .bub { position: relative; max-width: 86%; padding: 11px 14px; border-radius: 4px var(--r-lg) var(--r-lg) var(--r-lg);
    background: #fff; border: 1px solid var(--in-100); font: 400 14px/21px Roboto, sans-serif; color: var(--g-800); text-wrap: pretty; }
  .bub b { font-weight: 600; color: var(--g-900); }
  .bub.wide { width: 86%; }
  .row.k { opacity: 0; transform: translateY(6px); transition: opacity .36s var(--ease), transform .36s var(--ease); }
  .row.k.in { opacity: 1; transform: none; }
  /* the shimmer: two soft lines her colours pass across, then the words resolve out of them */
  .bub .shim { display: grid; gap: 7px; padding: 4px 0; }
  .bub .shim i { display: block; height: 8px; border-radius: 9999px;
    background: linear-gradient(100deg, var(--in-50) 0%, var(--in-100) 30%, var(--teal-100) 50%, var(--in-100) 70%, var(--in-50) 100%);
    background-size: 240% 100%; animation: shim 1.3s cubic-bezier(.45,0,.55,1) infinite; }
  .bub .shim i:nth-child(2) { width: 62%; animation-delay: .12s; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: -140% 0; } }
  .bub .say { transition: opacity .32s var(--ease); }
  .bub.typing .say { position: absolute; visibility: hidden; }
  .bub.typing { width: 170px; }

  /* what the person tapped, in the mirrored corner */
  .row.me { justify-content: flex-end; margin: 6px 0 2px; }
  .row.me .bub { border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg); background: var(--in-50); border-color: var(--in-50); color: var(--in-900); }

  /* quick replies, in her column */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 32px; margin-top: 4px; }
  .chip { min-height: 36px; padding: 7px 14px; border-radius: 9999px; border: 1px solid var(--in-200); background: #fff;
    color: var(--in-700); font: 500 13px/20px Roboto, sans-serif; cursor: pointer; text-align: left;
    opacity: 0; transform: translateY(4px); transition: opacity .3s var(--ease), transform .3s var(--ease), background .2s var(--ease), border-color .2s var(--ease); }
  .chip.in { opacity: 1; transform: none; }
  .chip:hover { background: var(--in-25); }
  .chip:focus-visible { outline: 2px solid var(--in-600); outline-offset: 2px; }
  .chips.gone .chip { opacity: 0; pointer-events: none; }

  /* ---------------------------------------------------------- the button */
  .cta { width: 100%; height: 48px; border-radius: var(--r-md); font: 600 16px/24px Roboto, sans-serif; cursor: pointer;
    border: 1.5px solid var(--brand-600); background: #fff; color: var(--brand-600); box-shadow: 0 4px 0 var(--brand-200);
    transition: background .5s var(--ease), color .5s var(--ease), box-shadow .5s var(--ease), border-color .5s var(--ease); }
  .cta:active { transform: translateY(2px); }
  /* once she has said everything, the way out becomes the main thing on the screen */
  .cta.main { background: var(--brand-600); color: #fff; box-shadow: 0 7px 0 var(--brand-700); }
  .foot { padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }

  /* ---------------------------------------------------------- inline visuals */
  .viz { margin-top: 10px; }
  .cap { font: 400 12px/16px Roboto, sans-serif; color: var(--g-500); }

  /* the target band: where a meal's protein earns full marks */
  .band { position: relative; height: 54px; margin: 4px 2px 0; }
  .band .track { position: absolute; left: 0; right: 0; top: 18px; height: 10px; border-radius: 9999px;
    background: linear-gradient(90deg, var(--g-100) 0%, var(--brand-200) 40%, var(--brand-200) 72%, var(--gold-200) 86%, var(--red-200) 100%); }
  .band .full { position: absolute; top: 18px; height: 10px; left: 40%; width: 20%; border-radius: 3px; background: var(--brand-500);
    transform: scaleX(0); transition: transform .7s cubic-bezier(.65,0,.35,1); }
  .band .tick { position: absolute; top: 12px; width: 2px; height: 22px; margin-left: -1px; border-radius: 1px; background: var(--g-900); opacity: 0; transition: opacity .3s var(--ease) .5s; }
  .band .flag { position: absolute; top: -4px; transform: translateX(-50%); font: 600 11px/14px Roboto, sans-serif; color: var(--g-900); white-space: nowrap; opacity: 0; transition: opacity .3s var(--ease) .5s; }
  .band .lbl { position: absolute; top: 34px; transform: translateX(-50%); font: 400 11px/14px Roboto, sans-serif; color: var(--g-500); white-space: nowrap; opacity: 0; transition: opacity .3s var(--ease) .7s; }
  .band .dot { position: absolute; top: 14px; width: 18px; height: 18px; margin-left: -9px; border-radius: 9999px; background: #fff;
    border: 2px solid var(--g-300); box-shadow: 0 1px 3px rgba(16,24,40,.16); left: 8%;
    transition: left 1.1s cubic-bezier(.65,0,.35,1) .5s, border-color .4s var(--ease) 1.4s; }
  .band.go .full { transform: scaleX(1); }
  .band.go .tick, .band.go .flag, .band.go .lbl { opacity: 1; }
  .band.go .dot { left: 55%; border-color: var(--brand-600); }
  .key { display: flex; gap: 12px; margin-top: 2px; }
  .key span { display: inline-flex; align-items: center; gap: 5px; font: 400 11px/14px Roboto, sans-serif; color: var(--g-500); }
  .key i { width: 8px; height: 8px; border-radius: 2px; }

  /* the breakfast worked through */
  .marks { display: grid; gap: 6px; margin-top: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--g-50); }
  .mrow { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; font: 400 13px/18px Roboto, sans-serif; color: var(--g-600); }
  .mrow .gl { width: 16px; height: 16px; background: var(--brand-600); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
  .mrow b { font-weight: 600; color: var(--g-900); font-variant-numeric: tabular-nums; }
  .mrow .pts { min-width: 36px; text-align: center; padding: 1px 8px; border-radius: 9999px; font: 600 12px/18px Roboto, sans-serif; font-variant-numeric: tabular-nums;
    background: var(--g-100); color: var(--g-500); transition: background .5s var(--ease), color .5s var(--ease); }
  .marks.go .mrow .pts { background: var(--brand-100); color: var(--brand-800); }
  .marks .tot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; margin-top: 2px; border-top: 1px solid var(--g-200);
    font: 500 13px/18px Roboto, sans-serif; color: var(--g-700); }
  .marks .tot b { font: 700 16px/20px Roboto, sans-serif; color: var(--brand-700); font-variant-numeric: tabular-nums; }

  /* how the day's 100 is shared out */
  .weights { display: flex; gap: 3px; height: 30px; margin-top: 10px; }
  .weights .seg { position: relative; border-radius: 6px; background: var(--brand-100); transform-origin: left center; transform: scaleX(0);
    transition: transform .6s cubic-bezier(.65,0,.35,1), background .5s var(--ease); display: grid; place-items: center;
    font: 600 12px/1 Roboto, sans-serif; color: var(--brand-800); font-variant-numeric: tabular-nums; }
  .weights .seg.on { background: var(--brand-600); color: #fff; }
  .weights.go .seg { transform: scaleX(1); }
  .wl { display: flex; gap: 3px; margin-top: 5px; }
  .wl span { font: 400 11px/14px Roboto, sans-serif; color: var(--g-500); white-space: nowrap; text-align: center; min-width: 0; }
  .wl span.on { color: var(--g-900); font-weight: 600; }

  /* the medal line */
  .medal { display: grid; grid-template-columns: 1fr 44px; gap: 12px; align-items: center; margin-top: 10px; }
  .mtrack { position: relative; height: 10px; border-radius: 9999px; background: var(--g-100); }
  .mtrack .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 9999px; background: linear-gradient(90deg, var(--brand-300), var(--brand-500));
    transition: width 1.2s cubic-bezier(.65,0,.35,1); }
  .mtrack .line { position: absolute; left: 80%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--gold-700); }
  .mtrack .t80 { position: absolute; left: 80%; top: 16px; transform: translateX(-50%); font: 600 11px/14px Roboto, sans-serif; color: var(--olive-700); }
  .mtrack .t0, .mtrack .t100 { position: absolute; top: 16px; font: 400 11px/14px Roboto, sans-serif; color: var(--g-400); }
  .mtrack .t0 { left: 0; } .mtrack .t100 { right: 0; }
  .medal svg { display: block; filter: grayscale(1); opacity: .45; transition: filter .6s var(--ease) 1.1s, opacity .6s var(--ease) 1.1s; }
  .medal.go .fill { width: 86%; }
  .medal.go svg { filter: none; opacity: 1; }
  .medal + .cap { margin-top: 18px; }

  /* replay, for reviewers */
  .replay { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); padding: 8px 16px; border-radius: 9999px;
    border: 1px solid var(--g-200); background: #fff; color: var(--g-700); font: 500 13px/18px Roboto, sans-serif; cursor: pointer;
    box-shadow: var(--shadow-card); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
  .replay.on { opacity: 1; pointer-events: auto; }

  /* KAIRA's mark, transcribed from assets/kaira.js */
  @keyframes gfkColor1{0%,100%{stop-color:#444ce7}50%{stop-color:#44e7e7}}
  @keyframes gfkColor2{0%,100%{stop-color:#6366f1}50%{stop-color:#22d3ee}}
  @keyframes gfkColor3{0%,100%{stop-color:#44e7e7}50%{stop-color:#444ce7}}
  @keyframes gfkShift{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,10px)}}
  @keyframes gfkGlow{0%,100%{filter:blur(15px) brightness(1.2)}50%{filter:blur(20px) brightness(1.5)}}
  .gfk{position:relative;display:inline-block;line-height:0}
  .gfk .halo{position:absolute;inset:0;z-index:0;line-height:0;animation:gfkGlow 3s ease-in-out infinite}
  .gfk .ring{position:relative;z-index:1}
  .gfk .g{animation:gfkShift 4s ease-in-out infinite}
  .gfk .s1{animation:gfkColor1 3s ease-in-out infinite}
  .gfk .s2{animation:gfkColor2 3s ease-in-out infinite .5s}
  .gfk .s3{animation:gfkColor3 3s ease-in-out infinite 1s}

  /* still and reduced motion: every end state, nothing travelling */
  .still *, .still *::before, .still *::after { transition: none !important; animation: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; transition-delay: 0s !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <iframe tabindex="-1" aria-hidden="true" title=""></iframe><script>/* new users see the day with their plan and nothing logged yet */ document.currentScript.previousElementSibling.src = "/v7/r3/eat.html" + (/who=current/.test(location.search) ? "" : "?state=empty");</script>
  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="shd">
      <div class="who">
        <span id="headMark"></span>
        <div><h2 id="sheetTitle">Your Score, With KAIRA</h2><span class="sub" id="headSub">A quick chat about your new score</span></div>
      </div>
      <button class="x" id="close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32"><path style="fill:var(--g-400)" d="M16 3a13 13 0 1 0 13 13A13.013 13.013 0 0 0 16 3m4.708 16.293a1 1 0 0 1-1.415 1.415L16 17.414l-3.293 3.293a1 1 0 0 1-1.415-1.415L14.587 16l-3.293-3.293a1 1 0 1 1 1.415-1.415L16 14.587l3.293-3.293a1 1 0 0 1 1.415 1.415L17.414 16z"/></svg></button>
    </div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="foot"><button class="cta" id="cta">Got It, Let Me Log</button></div>
  </div>

  <button class="replay" id="replay">Replay</button>
</div>

<script>
/* the Eat page's hero waits for a handshake */
addEventListener("message", function (e) { if (e.data === "hero:ready" && e.source) e.source.postMessage("hero:mount", "*"); });

(function () {
  var Q = new URLSearchParams(location.search);
  var WHO = Q.get("who") === "current" ? "current" : "new";
  var STEP = Math.max(0, Math.min(5, parseInt(Q.get("step"), 10) || 0));
  var STILL = Q.get("still") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (Q.get("still") === "1") document.documentElement.classList.add("still");

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), thread = $("thread"), cta = $("cta");

  /* ---------- KAIRA's mark ---------- */
  var RING = "M32.965 8.04864C34.4835 8.92532 35.4189 10.5455 35.4189 12.2989V27.0811C35.4189 28.8345 34.4835 30.4546 32.965 31.3313L20.1629 38.7225C18.6444 39.5991 16.7736 39.5991 15.2551 38.7224L2.45382 31.3313C0.935387 30.4547 0 28.8345 0 27.0811V12.2988C0 10.5455 0.935386 8.92531 2.45381 8.04862L15.2551 0.657547C16.7736 -0.219161 18.6444 -0.219184 20.1629 0.657488L32.965 8.04864ZM6.94998 10.5516C5.43151 11.4282 4.49609 13.0484 4.49609 14.8018V24.2383C4.49609 25.9917 5.43151 27.6119 6.94997 28.4886L15.1223 33.2068C16.6408 34.0835 18.5116 34.0835 20.03 33.2068L28.2024 28.4886C29.7208 27.6119 30.6562 25.9917 30.6562 24.2383V14.8018C30.6562 13.0484 29.7208 11.4282 28.2024 10.5516L20.03 5.83328C18.5116 4.9566 16.6408 4.9566 15.1223 5.83328L6.94998 10.5516Z";
  var uid = 0;
  function mark(px, halo) {
    var id = "gfk" + ++uid, w = Math.round(px * 36 / 40);
    var h = !halo ? "" :
      '<span class="halo" style="width:' + w + 'px;height:' + px + 'px"><svg width="' + w + '" height="' + px + '" viewBox="0 0 180 180" fill="none">' +
      '<defs><linearGradient class="g" id="' + id + 'h" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="160" y2="160"><stop class="s1" offset="0" stop-color="#444ce7"/><stop class="s3" offset="1" stop-color="#44e7e7"/></linearGradient></defs>' +
      '<path d="M90 15L155.9 52.5V127.5L90 165L24.1 127.5V52.5L90 15Z" fill="url(#' + id + 'h)" opacity=".4"/>' +
      '<path d="M90 45L135.9 70.5V121.5L90 147L44.1 121.5V70.5L90 45Z" fill="url(#' + id + 'h)" opacity=".3"/>' +
      '<path d="M90 60L120.9 78V114L90 132L59.1 114V78L90 60Z" fill="white" opacity=".8"/></svg></span>';
    return '<span class="gfk" aria-hidden="true" style="width:' + w + 'px;height:' + px + 'px">' + h +
      '<svg class="ring" width="' + w + '" height="' + px + '" viewBox="0 0 36 40" fill="none"><defs><linearGradient class="g" id="' + id + '" gradientUnits="userSpaceOnUse" x1="-2.73987" y1="0" x2="41.6018" y2="4.35983">' +
      '<stop class="s1" stop-color="#444ce7"/><stop class="s2" offset="0.5" stop-color="#6366f1"/><stop class="s3" offset="1" stop-color="#44e7e7"/></linearGradient></defs><path d="' + RING + '" fill="url(#' + id + ')"/></svg></span>';
  }
  $("headMark").innerHTML = mark(30, true);
  $("headSub").textContent = WHO === "current" ? "What is new on your Eat screen" : "A quick chat about your score";

  /* ---------- the inline pictures ---------- */
  var VIZ = {
    band:
      '<div class="viz"><div class="band" role="img" aria-label="Protein target 15 g. Full marks from 12 g to 18 g.">' +
        '<span class="track"></span><span class="full"></span>' +
        '<span class="lbl" style="left:40%">12 g</span><span class="lbl" style="left:60%">18 g</span>' +
        '<span class="tick" style="left:50%"></span><span class="flag" style="left:50%">Target 15 g</span>' +
        '<span class="dot"></span></div>' +
      '<div class="key"><span><i style="background:var(--brand-500)"></i>Full marks</span><span><i style="background:var(--brand-200)"></i>Part marks</span><span><i style="background:var(--red-200)"></i>Marks taken away</span></div></div>',
    marks:
      '<div class="marks" role="img" aria-label="Breakfast. Protein 9 of 15 g, 75 marks. Carbs 58 of 40 g, 75 marks. Fat 9 of 9 g, 100 marks. Meal score 83.">' +
        '<div class="mrow"><span class="gl glyph-protein"></span><span>Protein <b>9</b> of 15 g</span><span class="pts">75</span></div>' +
        '<div class="mrow"><span class="gl glyph-carbs"></span><span>Carbs <b>58</b> of 40 g</span><span class="pts">75</span></div>' +
        '<div class="mrow"><span class="gl glyph-fats"></span><span>Fat <b>9</b> of 9 g</span><span class="pts">100</span></div>' +
        '<div class="tot"><span>Breakfast scores</span><b>83</b></div></div>',
    weights:
      '<div class="viz" role="img" aria-label="Breakfast is worth 20, lunch 35, snack 10, dinner 35. Together 100.">' +
        '<div class="weights"><span class="seg on" style="flex:20;transition-delay:0s">20</span><span class="seg" style="flex:35;transition-delay:.12s">35</span>' +
        '<span class="seg" style="flex:10;transition-delay:.24s">10</span><span class="seg" style="flex:35;transition-delay:.36s">35</span></div>' +
        '<div class="wl"><span class="on" style="flex:20">Breakfast</span><span style="flex:35">Lunch</span><span style="flex:10">Snack</span><span style="flex:35">Dinner</span></div></div>',
    medal:
      '<div class="medal" role="img" aria-label="A day at 80 or more earns a medal.">' +
        '<div class="mtrack"><span class="fill"></span><span class="line"></span><span class="t0">0</span><span class="t80">80</span><span class="t100">100</span></div>' +
        '<svg width="44" height="52" viewBox="0 0 44 52" fill="none" aria-hidden="true">' +
          '<path d="M12 2h8l6 16h-8z" fill="var(--in-500)"/><path d="M32 2h-8l-6 16h8z" fill="var(--in-300)"/>' +
          '<circle cx="22" cy="32" r="17" fill="var(--gold-600)"/><circle cx="22" cy="32" r="13" fill="var(--gold-300)" stroke="var(--gold-700)" stroke-width="1.5"/>' +
          '<path d="M22 24.5l2.3 4.7 5.2.8-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.8z" fill="var(--gold-700)"/></svg></div>'
  };

  /* ---------- what she says ----------
     Each turn: what the person tapped (empty for the opening), her lines, and
     which replies come next. Lines may carry a picture. */
  var ORDER = ["hello", "how", "more", "bigger", "medal", "end"];
  var ASK = {
    how: "How is it worked out?",
    more: "What if I eat more?",
    bigger: "Why do bigger meals count more?",
    medal: "What is the medal?"
  };
  var seen = {};
  function lines(id) {
    if (id === "hello") return WHO === "current" ? [
      "Hi, I'm KAIRA. Here's something new: <b>the meals you log now add up to a score.</b>",
      "That green bubble at the top is your <b>Nutrition sufficiency</b> score. It shows how closely today's meals match your coach's plan, out of 100."
    ] : [
      "Hi, I'm KAIRA. Your coach's plan is ready, and that green bubble at the top is your <b>Nutrition sufficiency</b> score.",
      "It shows how closely today's meals match that plan, out of 100. Let me show you how it grows."
    ];
    if (id === "how") return [
      "Your coach sets how much <b>protein, carbs and fat</b> each meal should have. I check every meal you log against its own targets.",
      { t: "Land close to the target and that one gets <b>full marks</b>. Anywhere from a little under to a little over counts.", v: "band", wide: true }
    ];
    if (id === "more") return [
      "A little over still earns full marks. Further away earns part of them, and eating much more than the target can take marks away.",
      { t: "Here's a breakfast worked through, with targets of 15 g protein, 40 g carbs and 9 g fat:", v: "marks", wide: true }
    ];
    if (id === "bigger") return [
      { t: "Bigger meals are a bigger part of your day, so they carry more of the 100. A 300 kcal breakfast in a 1,500 kcal day is worth <b>20</b>.", v: "weights", wide: true },
      seen.more ? "So that breakfast scoring 83 adds about <b>17 of its 20</b> to today." : "Each meal fills its own share, and together they make today's score."
    ];
    if (id === "medal") return [
      { t: "Reach <b>80 or more</b> in a day and you earn a medal.", v: "medal", wide: true },
      "Every meal you log adds to your score, so it grows as you go. Tomorrow starts fresh."
    ];
    return [WHO === "current"
      ? "That's everything that's new. Your next meal is the best place to see it work."
      : "That's all you need. Your first meal is the best place to start."];
  }
  function next(id) {
    var left = ["how", "more", "bigger", "medal"].filter(function (k) { return !seen[k] && k !== id; });
    var pref = { hello: ["how", "medal"], how: ["more", "bigger"], more: ["bigger", "medal"], bigger: ["medal", "more"], medal: ["how", "bigger"] }[id] || [];
    var pick = pref.filter(function (k) { return left.indexOf(k) > -1; });
    left.forEach(function (k) { if (pick.indexOf(k) < 0) pick.push(k); });
    return pick.slice(0, 2);
  }

  /* ---------- the thread ---------- */
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, STILL ? 0 : ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function toBottom(instant) {
    thread.scrollTo({ top: thread.scrollHeight, behavior: instant || STILL ? "auto" : "smooth" });
  }

  function addMe(text) {
    thread.insertAdjacentHTML("beforeend", '<div class="row me"><div class="bub">' + text + '</div></div>');
  }

  /* one of her lines: shimmer first, then the words, then the picture plays */
  function addLine(L, first, instant, done) {
    var o = typeof L === "string" ? { t: L } : L;
    var row = document.createElement("div");
    row.className = "row k";
    row.innerHTML = '<span class="gut">' + (first ? mark(22, false) : "") + '</span>' +
      '<div class="bub' + (o.wide ? " wide" : "") + (instant ? "" : " typing") + '">' +
        (instant ? "" : '<span class="shim" aria-hidden="true"><i></i><i></i></span>') +
        '<div class="say"' + (instant ? "" : ' style="opacity:0"') + '>' + o.t + (o.v ? VIZ[o.v] : "") + '</div></div>';
    thread.appendChild(row);
    var play = function () { [].forEach.call(row.querySelectorAll(".band,.marks,.weights,.medal"), function (v) { v.classList.add("go"); }); };
    if (instant) { row.classList.add("in"); play(); return done && done(); }
    requestAnimationFrame(function () { row.classList.add("in"); toBottom(); });
    var think = Math.min(1500, 650 + o.t.length * 6);
    later(function () {
      var bub = row.querySelector(".bub"), say = row.querySelector(".say");
      bub.classList.remove("typing");
      var sh = bub.querySelector(".shim"); if (sh) sh.remove();
      requestAnimationFrame(function () { say.style.opacity = 1; toBottom(); });
      later(play, 120);
      later(function () { done && done(); }, o.v ? 900 : 380);
    }, think);
  }

  function addChips(id, instant) {
    var opts = next(id);
    if (!opts.length) return;
    var box = document.createElement("div");
    box.className = "chips";
    box.innerHTML = opts.map(function (k) { return '<button class="chip" data-k="' + k + '">' + ASK[k] + '</button>'; }).join("");
    thread.appendChild(box);
    [].forEach.call(box.children, function (c, i) {
      if (instant) c.classList.add("in");
      else later(function () { c.classList.add("in"); }, 80 + i * 90);
      c.onclick = function () { pick(c.dataset.k, box); };
    });
    if (!instant) later(function () { toBottom(); }, 120);
  }

  var busy = false;
  function pick(k, box) {
    if (busy) return;
    busy = true;
    box.classList.add("gone");
    later(function () { box.remove(); addMe(ASK[k]); toBottom(); later(function () { turn(k, false); }, 360); }, 220);
  }

  /* a whole turn of hers */
  function turn(id, instant, done) {
    seen[id] = true;
    var L = lines(id), i = 0;
    (function step() {
      if (i >= L.length) {
        busy = false;
        var more = next(id);
        if (!more.length && id !== "end") { return turn("end", instant, done); }
        if (id === "end" || !more.length) { cta.classList.add("main"); }
        else addChips(id, instant);
        return done && done();
      }
      addLine(L[i], i === 0, instant, function () { i++; step(); });
    })();
  }

  /* ?step=N: the turns before N sit in the thread already, N plays */
  function start() {
    clearTimers();
    thread.innerHTML = ""; seen = {}; busy = false; cta.classList.remove("main");
    var path = ORDER.slice(0, STEP + 1);
    path.forEach(function (id, n) {
      var last = n === path.length - 1;
      if (n > 0 && id !== "end") addMe(ASK[id]);
      if (!last) {
        seen[id] = true;
        lines(id).forEach(function (L, i) { addLine(L, i === 0, true); });
      }
    });
    var id = path[path.length - 1];
    if (STILL) { turn(id, true); toBottom(true); }
    else later(function () { turn(id, false); }, STEP ? 300 : 520);
    toBottom(true);
  }

  /* ---------- open and close ---------- */
  function open() {
    $("replay").classList.remove("on");
    stage.classList.remove("closing");
    if (STILL) { stage.classList.add("open"); start(); return; }
    requestAnimationFrame(function () { requestAnimationFrame(function () { stage.classList.add("open"); }); });
    start();
  }
  function close() {
    clearTimers();
    stage.classList.add("closing");
    stage.classList.remove("open");
    setTimeout(function () { $("replay").classList.add("on"); }, STILL ? 0 : 360);
  }
  $("close").onclick = close;
  cta.onclick = close;
  $("replay").onclick = open;
  addEventListener("keydown", function (e) { if (e.key === "Escape" && stage.classList.contains("open")) close(); });
  open();
})();
</script>
</body>
</html>
