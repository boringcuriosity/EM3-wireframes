<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Up next bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<style>
  /* Move: the Up next bar in the exercise player's dock. Each phone is the live player with ?upnext=, cropped to the dock,
     once at rest and once with the steps scrolled so text passes under the bar. */
  :root { --g-200: #E4E7EC; --g-500: #667085; --g-600: #475467; --g-900: #101828; --brand-50: #F3FCF8; --brand-200: #CBF0E0; --brand-700: #2A805A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--g-900); font-family: Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: .2px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 56px 24px 80px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--g-500); }
  h1 { margin: 12px 0 10px; font-size: 40px; line-height: 48px; font-weight: 600; }
  .lede { max-width: 720px; margin: 0; font-size: 17px; line-height: 27px; color: var(--g-600); }
  .grid { display: flex; flex-wrap: wrap; gap: 40px 24px; margin-top: 24px; }
  figure { margin: 0; width: 300px; }
  figcaption { min-height: 112px; margin-bottom: 12px; }
  figcaption b { display: flex; align-items: center; gap: 8px; font-size: 18px; line-height: 26px; }
  figcaption .rec { font-size: 12px; font-weight: 600; color: var(--brand-700); background: var(--brand-50); border: 1px solid var(--brand-200); border-radius: 999px; padding: 1px 8px; }
  figcaption p { margin: 6px 0 0; font-size: 14px; line-height: 21px; color: var(--g-600); }
  .crop { position: relative; width: 300px; height: 300px; overflow: hidden; border-radius: 20px; border: 1px solid var(--g-200); box-shadow: 3px 4px 0 rgba(152,162,179,.3); }
  section { margin-top: 56px; }
  h2 { margin: 0; font-size: 26px; line-height: 34px; font-weight: 600; }
  .sub { margin: 6px 0 0; font-size: 15px; line-height: 23px; color: var(--g-600); }
  .crop + .crop { margin-top: 12px; }
  .crop iframe { position: absolute; left: 0; bottom: 0; width: 390px; height: 780px; border: 0; pointer-events: none; transform: scale(.7692); transform-origin: 0 100%; }
  .tag { margin-top: 8px; font-size: 13px; color: var(--g-500); }
  @media (max-width: 720px) { .wrap { padding: 32px 16px 56px; } h1 { font-size: 30px; line-height: 38px; } figure, .crop { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">Move · Exercise player</span>
  <h1>The Up next bar</h1>
  <p class="lede">The bar above Next names the move that comes after this one. Today it sits on a flat pale green band. Each phone is the live player with that style: the top one at rest, the lower one with the steps scrolled, so you can see how the bar sits over text.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
/* Liquid is built into the player; the others were tried and dropped, so only Liquid shows live */
const G = [
  ["Chosen", "Liquid glass, now the player's Up next bar.", [
    ["liquid", "Liquid", "White glass with a 16 px corner, a bright rim on top, a softer one below and a faint mint to indigo light behind it. The steps blur as they slide under it.", true],
  ]],
];
const TRIED = "Also tried: Liquid mint, Liquid clear, Liquid prism, and the Mint mist family (Mist, Mist glow, Mist progress, Mist glass, Mist sheen), as well as Frosted glass, Aurora wash and Smoked ink.";
const src = (k, act) => '/move/index.html?act=' + act;
const fig = ([k, n, line, rec]) =>
  '<figure><figcaption><b>' + n + (rec ? ' <span class="rec">Chosen</span>' : "") + '</b><p>' + line + '</p></figcaption>' +
  '<div class="crop"><iframe src="' + src(k, "portrait") + '" title="' + n + ', at rest" tabindex="-1" loading="lazy"></iframe></div>' +
  '<div class="crop"><iframe src="' + src(k, "reading") + '" title="' + n + ', over the steps" tabindex="-1" loading="lazy"></iframe></div>' +
  '<div class="tag">At rest, then over the steps</div></figure>';
document.getElementById("grid").outerHTML = G.map(([h, sub, R]) =>
  '<section><h2>' + h + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : "") + '<div class="grid">' + R.map(fig).join("") + '</div></section>').join("") + '<p class="sub" style="margin-top:40px">' + TRIED + '</p>';
</script>
</body>
</html>
