  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <div style=\"padding:8px 10px;font-size:13.5px;font-weight:500;color:#1D4D38\">Overview<\u002Fdiv>\n      <div style=\"padding:8px 10px;font-size:13.5px;font-weight:500;color:#1D4D38\">Chat with Kaira<\u002Fdiv>\n      <div style=\"font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#667085;margin:16px 6px 6px\">Care triad<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13.5px;font-weight:500;color:#1D4D38\"><span style=\"width:7px;height:7px;border-radius:50%;background:#299D6B\"><\u002Fspan>Diet Coach<\u002Fdiv>\n      <div style=\"padding:8px 10px 8px 28px;font-size:12.5px;font-weight:500;color:#1D4D38\">Baseline Assessment<\u002Fdiv>\n      <div style=\"padding:8px 10px 8px 28px;font-size:12.5px;font-weight:500;color:#1D4D38\">Follow-up Assessments<\u002Fdiv>\n      <div style=\"padding:8px 10px 8px 28px;border-radius:11px;font-size:12.5px;font-weight:600;color:#299D6B;background:#E6FAF1\">List of Diet Plans<\u002Fdiv>\n      <div style=\"padding:8px 10px 8px 28px;font-size:12.5px;font-weight:500;color:#1D4D38\">Adherence &amp; User View<\u002Fdiv>\n      <div style=\"padding:8px 10px 8px 28px;font-size:12.5px;font-weight:500;color:#1D4D38\">Diet Reports<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13.5px;font-weight:500;color:#1D4D38\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2DA6A6\"><\u002Fspan>Exercise Coach<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13.5px;font-weight:500;color:#1D4D38\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2D8282\"><\u002Fspan>Success Coach<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n  <main style=\"min-width:0\">\n    <div style=\"height:67px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 30px;background:rgba(249,250,251,.9);border-bottom:1px solid #E4E7EC;position:sticky;top:0;z-index:5\">\n      <h2 style=\"margin:0;font:800 18px Montserrat,sans-serif;color:#1D4D38\">List of Diet Plans<\u002Fh2>\n      <div style=\"display:flex;gap:16px;align-items:center\">\n        <button sc-camel-on-click=\"{{ openCreate }}\" style=\"height:38px;padding:0 16px;border-radius:11px;font-size:13px;font-weight:600;border:1.5px solid #299D6B;background:#299D6B;color:#fff\">+ Create Diet Plan<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#299D6B;color:#fff;font:700 11px/30px Onest;text-align:center\">CA<\u002Fspan><div><div style=\"font-size:12.5px;line-height:15px;font-weight:700;color:#1D4D38\">Coach A<\u002Fdiv><div style=\"font-size:10.5px;color:#667085\">Nutritionist<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 30px 60px\">\n      <div style=\"display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap\">\n        <span style=\"height:38px;padding:0 16px;border-radius:11px;border:1.5px solid #299D6B;background:#299D6B;color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center\">All<\u002Fspan>\n        <span style=\"height:38px;padding:0 16px;border-radius:11px;border:1.5px solid #E4E7EC;background:#fff;color:#1D4D38;font-size:13px;font-weight:600;display:inline-flex;align-items:center\">Pending<\u002Fspan>\n        <span style=\"height:38px;padding:0 16px;border-radius:11px;border:1.5px solid #E4E7EC;background:#fff;color:#1D4D38;font-size:13px;font-weight:600;display:inline-flex;align-items:center\">Approved<\u002Fspan>\n        <span style=\"height:38px;padding:0 16px;border-radius:11px;border:1.5px solid #E4E7EC;background:#fff;color:#1D4D38;font-size:13px;font-weight:600;display:inline-flex;align-items:center\">Drafts<\u002Fspan>\n        <span style=\"height:38px;padding:0 16px;border-radius:11px;border:1.5px solid #E4E7EC;background:#fff;color:#1D4D38;font-size:13px;font-weight:600;display:inline-flex;align-items:center\">Inactive<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"1\">\n          <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:22px;padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 2px rgba(16,24,40,.06)\">\n            <span style=\"width:34px;height:34px;border-radius:10px;background:#F3FCF8;display:grid;place-items:center;color:#299D6B;flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 7c-4-3-9 0-8 6s4 9 8 7c4 2 7-1 8-7s-4-9-8-6z\"><\u002Fpath><path d=\"M12 7c0-2 1-4 3-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"font:700 15px Montserrat,sans-serif;color:#1D4D38\">{{ p.name }}<\u002Fspan><span style=\"padding:3px 6px;border-radius:4px;color:#fff;font-size:11px;font-weight:700;background:{{ p.color }}\">{{ p.st }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#667085;margin-top:3px\">{{ p.d }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button style=\"height:34px;padding:0 14px;border-radius:11px;font-size:12.5px;font-weight:600;border:1.5px solid #299D6B;background:#fff;color:#299D6B\">View PDF \u2192<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showSheet }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;background:#F9FAFB;z-index:20;display:flex;flex-direction:column\">\n  <div style=\"height:60px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid #E4E7EC;background:#fff\">\n    <span style=\"font-size:16px;font-weight:600;color:#299D6B;white-space:nowrap\">Create Diet Plan<\u002Fspan>\n    <div style=\"flex:1;display:flex;justify-content:center;gap:6px;min-width:0;overflow-x:auto\">\n      <sc-if value=\"{{ isBuild }}\">\n        <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ st.onClick }}\" style=\"display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 12px;border-radius:12px;opacity:{{ st.opacity }}\" style-hover=\"background:#F3FCF8\">\n            <span style=\"width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;background:{{ st.circleBg }};color:{{ st.circleColor }}\">{{ st.n }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:flex-start;line-height:16px;white-space:nowrap\"><span style=\"font-size:13.5px;font-weight:600;color:{{ st.labelColor }}\">{{ st.label }}<\u002Fspan><span style=\"font-size:11.5px;color:#667085\">{{ st.sub }}<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isBuild }}\"><button sc-camel-on-click=\"{{ openDrawer }}\" style=\"height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px solid #299D6B;background:#fff;color:#299D6B;white-space:nowrap\">View assessment<\u002Fbutton><\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ close }}\" aria-label=\"Close\" style=\"border:0;background:none;font-size:26px;line-height:1;color:#1D4D38;padding:4px 8px\">\u00d7<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;overflow:auto;min-height:0\">\n\n    <sc-if value=\"{{ isChoose }}\">\n    <div data-screen-label=\"Choose template\" style=\"max-width:1120px;margin:0 auto;padding:32px 32px 48px\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div>\n          <h3 style=\"margin:0;font:800 22px/28px Montserrat,sans-serif;color:#1D4D38\">Start from a template<\u002Fh3>\n          <p style=\"margin:6px 0 0;color:#475467;text-wrap:pretty\">Its foods fill the meals and set each meal's starting target. You set the daily goals first.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ startBlank }}\" style=\"height:40px;padding:0 18px;border-radius:11px;font-size:13.5px;font-weight:600;border:1.5px solid #299D6B;background:#fff;color:#299D6B\">Start a blank plan<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:16px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:44px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr) 150px;gap:12px;align-items:center;padding:12px 18px;background:#299D6B;color:#fff;font-size:13px;font-weight:700\">\n          <span><\u002Fspan><span>Template<\u002Fspan><span>Calorie goal<\u002Fspan><span>Macro split<\u002Fspan><span>Meals<\u002Fspan><span><\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ templates }}\" as=\"t\" hint-placeholder-count=\"7\">\n          <div sc-camel-on-click=\"{{ t.onSelect }}\" style=\"display:grid;grid-template-columns:44px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr) 150px;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid #F2F4F7;cursor:pointer;background:{{ t.bg }}\">\n            <span style=\"width:18px;height:18px;border-radius:50%;border:1.5px solid #299D6B;display:grid;place-items:center\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ t.dot }}\"><\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"font-weight:600;color:#1D4D38\">{{ t.name }}<\u002Fspan><sc-if value=\"{{ t.hasVer }}\"><span style=\"font-size:11px;font-weight:600;color:#3538CD;background:#EEF4FF;border-radius:999px;padding:2px 8px;white-space:nowrap\">{{ t.verChip }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n            <span style=\"font-variant-numeric:tabular-nums\">{{ t.goal }}<\u002Fspan>\n            <span style=\"color:#475467;font-variant-numeric:tabular-nums\">{{ t.split }}<\u002Fspan>\n            <span style=\"color:#475467\">{{ t.meals }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ t.onUse }}\" style=\"height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px solid #299D6B;background:{{ t.btnBg }};color:{{ t.btnColor }}\">Use template<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep1 }}\">\n    <div data-screen-label=\"Step 1 Goals\" style=\"max-width:1120px;margin:0 auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:18px\">\n      <div>\n        <h3 style=\"margin:0;font:800 22px/28px Montserrat,sans-serif;color:#1D4D38\">Set the daily goals<\u002Fh3>\n        <p style=\"margin:6px 0 0;color:#475467\">Start with calories. The macros follow from the split, and you can change any number.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:18px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:16px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">Plan name<\u002Fspan>\n          <input value=\"{{ plan.name }}\" sc-camel-on-change=\"{{ onName }}\" style=\"height:48px;background:#F3FCF8;border:1.5px solid #E4E7EC;border-radius:11px;padding:0 13px;font-size:14px;font-weight:600;color:#101828;outline:none;width:100%\" style-focus=\"border-color:#299D6B;background:#fff\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">Starts<\u002Fspan>\n          <input type=\"date\" value=\"{{ plan.from }}\" sc-camel-on-change=\"{{ onFrom }}\" style=\"height:48px;background:#F3FCF8;border:1.5px solid #E4E7EC;border-radius:11px;padding:0 13px;font-size:14px;font-weight:600;color:#101828;outline:none;width:100%\" style-focus=\"border-color:#299D6B;background:#fff\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">Ends<\u002Fspan>\n          <input type=\"date\" value=\"{{ plan.to }}\" sc-camel-on-change=\"{{ onTo }}\" style=\"height:48px;background:#F3FCF8;border:1.5px solid #E4E7EC;border-radius:11px;padding:0 13px;font-size:14px;font-weight:600;color:#101828;outline:none;width:100%\" style-focus=\"border-color:#299D6B;background:#fff\"><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:18px;flex-wrap:wrap;align-items:stretch\">\n        <div style=\"flex:1 1 300px;background:#fff;border:1px solid #E4E7EC;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">Daily calorie goal<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <button sc-camel-on-click=\"{{ kcalDown }}\" aria-label=\"Less\" style=\"width:44px;height:44px;border-radius:12px;border:1.5px solid #299D6B;background:#fff;color:#299D6B;font-size:20px;font-weight:700;flex:none\">\u2212<\u002Fbutton>\n            <input type=\"number\" value=\"{{ plan.kcal }}\" sc-camel-on-change=\"{{ onKcal }}\" style=\"flex:1;min-width:0;height:64px;background:#F3FCF8;border:1.5px solid #E4E7EC;border-radius:14px;text-align:center;font:700 34px/1 Montserrat,sans-serif;color:#1D4D38;outline:none;font-variant-numeric:tabular-nums\" style-focus=\"border-color:#299D6B;background:#fff\">\n            <button sc-camel-on-click=\"{{ kcalUp }}\" aria-label=\"More\" style=\"width:44px;height:44px;border-radius:12px;border:1.5px solid #299D6B;background:#fff;color:#299D6B;font-size:20px;font-weight:700;flex:none\">+<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"text-align:center;color:#475467;font-size:13px\">kcal per day \u00b7 steps of 50<\u002Fdiv>\n          <sc-if value=\"{{ showTplGoal }}\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:#475467\">Template goal: {{ tplGoal }}<button sc-camel-on-click=\"{{ useTplGoal }}\" style=\"border:0;background:none;color:#299D6B;font-weight:600;padding:2px 4px;text-decoration:underline\">Use it<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:2 1 520px;background:#fff;border:1px solid #E4E7EC;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">Macronutrient split<\u002Fspan>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n              <span style=\"font-size:11.5px;color:#667085\">Quick split, P/C/F:<\u002Fspan>\n              <sc-for list=\"{{ presets }}\" as=\"ps\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ ps.onClick }}\" style=\"height:30px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1.5px solid {{ ps.border }};background:{{ ps.bg }};color:{{ ps.color }}\">{{ ps.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;height:30px;border-radius:10px;overflow:hidden;background:#F2F4F7;gap:2px\">\n            <sc-for list=\"{{ macros }}\" as=\"m\" hint-placeholder-count=\"3\"><span title=\"{{ m.label }}\" style=\"height:100%;width:{{ m.width }};background:{{ m.color }};color:{{ m.ink }};display:flex;align-items:center;gap:6px;padding:0 8px;min-width:0;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:700\"><img src=\"{{ m.iconW }}\" width=\"16\" height=\"16\" alt=\"\" style=\"flex:none\">{{ m.pctText }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 120px 100px;gap:10px 14px;align-items:center\">\n            <span><\u002Fspan>\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">% of kcal<\u002Fspan>\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">Grams / day<\u002Fspan>\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085;text-align:right\">Calories<\u002Fspan>\n            <sc-for list=\"{{ macros }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:12px;min-width:0\"><span style=\"flex:none;width:34px;height:34px;border-radius:11px;background:{{ m.color }};display:grid;place-items:center\"><img src=\"{{ m.iconW }}\" width=\"20\" height=\"20\" alt=\"\"><\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-weight:600;color:#1D4D38\">{{ m.label }}<\u002Fspan><span style=\"font-size:11.5px;color:#667085\">{{ m.per }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;height:44px;background:#F3FCF8;border:1.5px solid #E4E7EC;border-radius:11px;padding:0 12px;gap:4px\" style-focus-within=\"border-color:#299D6B;background:#fff\"><input type=\"number\" value=\"{{ m.pct }}\" sc-camel-on-change=\"{{ m.onPct }}\" style=\"border:0;background:none;outline:none;width:100%;font-size:16px;font-weight:700;color:#1D4D38;font-variant-numeric:tabular-nums\"><span style=\"color:#667085\">%<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;height:44px;background:#F3FCF8;border:1.5px solid #E4E7EC;border-radius:11px;padding:0 12px;gap:4px\" style-focus-within=\"border-color:#299D6B;background:#fff\"><input type=\"number\" value=\"{{ m.grams }}\" sc-camel-on-change=\"{{ m.onGrams }}\" style=\"border:0;background:none;outline:none;width:100%;font-size:16px;font-weight:700;color:#1D4D38;font-variant-numeric:tabular-nums\"><span style=\"color:#667085\">g<\u002Fspan><\u002Fdiv>\n              <span style=\"text-align:right;color:#475467;font-variant-numeric:tabular-nums\">{{ m.kcal }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;background:{{ pctBox.bg }};border:1px solid {{ pctBox.border }};color:{{ pctBox.color }}\">\n            <span style=\"flex:1\">{{ pctBox.text }}<\u002Fspan>\n            <sc-if value=\"{{ pctBox.showFix }}\"><button sc-camel-on-click=\"{{ fixPct }}\" style=\"height:30px;padding:0 12px;border-radius:8px;border:1.5px solid #B42318;background:#fff;color:#B42318;font-size:12.5px;font-weight:600\">{{ pctBox.fixLabel }}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep2 }}\">\n    <div data-screen-label=\"Step 2 Meal targets\" style=\"max-width:1240px;margin:0 auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n        <div>\n          <h3 style=\"margin:0;font:800 22px/28px Montserrat,sans-serif;color:#1D4D38\">Set a target for every meal<\u002Fh3>\n          <p style=\"margin:6px 0 0;color:#475467;text-wrap:pretty\">{{ splitIntro }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:inline-flex;border:1.5px solid #E4E7EC;border-radius:12px;padding:3px;background:#fff;gap:2px\">\n          <sc-if value=\"{{ hasTplSplit }}\"><button sc-camel-on-click=\"{{ splitTpl }}\" style=\"border:0;border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;background:{{ splitTplBg }};color:{{ splitTplColor }}\">From template's foods<\u002Fbutton><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ splitStd }}\" style=\"border:0;border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;background:{{ splitStdBg }};color:{{ splitStdColor }}\">Standard meal shares<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:18px;padding:14px 20px;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap\">\n        <span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085\">Daily goal<\u002Fspan>\n        <span style=\"font:700 18px Montserrat,sans-serif;color:#1D4D38\">{{ day.k }} <span style=\"font:500 13px Onest;color:#667085\">kcal<\u002Fspan><\u002Fspan>\n        <span style=\"color:#1D4D38\"><b>{{ day.p }} g<\u002Fb> <span style=\"color:#667085\">protein<\u002Fspan><\u002Fspan>\n        <span style=\"color:#1D4D38\"><b>{{ day.c }} g<\u002Fb> <span style=\"color:#667085\">carbs<\u002Fspan><\u002Fspan>\n        <span style=\"color:#1D4D38\"><b>{{ day.f }} g<\u002Fb> <span style=\"color:#667085\">fats<\u002Fspan><\u002Fspan>\n        <button sc-camel-on-click=\"{{ goStep1 }}\" style=\"margin-left:auto;border:0;background:none;color:#299D6B;font-weight:600;padding:4px;white-space:nowrap;flex:none\">Edit goals<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px acity:{{ r.op }}\" style-focus=\"border-color:#299D6B\">\n              <input type=\"number\" value=\"{{ r.p.val }}\" sc-camel-on-change=\"{{ r.p.on }}\" disabled=\"{{ r.dis }}\" style=\"height:38px;border:1.5px solid {{ r.p.border }};background:{{ r.p.bg }};border-radius:9px;padding:0 10px;outline:none;font-size:14px;font-weight:600;text-align:right;width:100%;font-variant-numeric:tabular-nums;opacity:{{ r.op }}\" style-focus=\"border-color:#299D6B\">\n              <input type=\"number\" value=\"{{ r.c.val }}\" sc-camel-on-change=\"{{ r.c.on }}\" disabled=\"{{ r.dis }}\" style=\"height:38px;border:1.5px solid {{ r.c.border }};background:{{ r.c.bg }};border-radius:9px;padding:0 10px;outline:none;font-size:14px;font-weight:600;text-align:right;width:100%;font-variant-numeric:tabular-nums;opacity:{{ r.op }}\" style-focus=\"border-color:#299D6B\">\n              <input type=\"number\" value=\"{{ r.f.val }}\" sc-camel-on-change=\"{{ r.f.on }}\" disabled=\"{{ r.dis }}\" style=\"height:38px;border:1.5px solid {{ r.f.border }};background:{{ r.f.bg }};border-radius:9px;padding:0 10px;outline:none;font-size:14px;font-weight:600;text-align:right;width:100%;font-variant-numeric:tabular-nums;opacity:{{ r.op }}\" style-focus=\"border-color:#299D6B\">\n              <div style=\"display:flex;flex-direction:column;gap:4px;opacity:{{ r.op }}\">\n                <div style=\"display:flex;height:6px;border-radius:999px;overflow:hidden;gap:1px;background:#F2F4F7\"><span style=\"background:#444CE7;width:{{ r.mix.p }}\"><\u002Fspan><span style=\"background:#E7C144;width:{{ r.mix.c }}\"><\u002Fspan><span style=\"background:#2D8282;width:{{ r.mix.f }}\"><\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:11.5px;color:#475467;font-variant-numeric:tabular-nums\">{{ r.mix.text }}<\u002Fspan>\n              <\u002Fdiv>\n              <span><sc-if value=\"{{ r.edited }}\"><button sc-camel-on-click=\"{{ r.reset }}\" title=\"Back to the suggested target\" style=\"border:0;backgrou ">Meal targets vs daily goal<\u002Fspan>\n          <sc-for list=\"{{ dayRows }}\" as=\"dr\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12.5px\"><span style=\"color:#475467\">{{ dr.label }}<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums;color:{{ dr.color }}\">{{ dr.val }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085;padding:0 4px 2px\">Meals<\u002Fspan>\n        <sc-for list=\"{{ mealList }}\" as=\"ml\" hint-placeholder-count=\"7\">\n          <button sc-camel-on-click=\"{{ ml.onClick }}\" style=\"display:flex;flex-direction:column;gap:2px;text-align:left;padding:11px 14px;border-radius:12px;border:1.5px solid {{ ml.border }};background:{{ ml.bg }};opacity:{{ ml.op }}\" style-hover=\"border-color:#ABE6CC\">\n            <span style=\"display:flex;align-items:center;gap:8px;width:100%\"><span style=\"width:8px;height:8px;border-radius:50%;flex:none;background:{{ ml.dot }}\"><\u002Fspan><span style=\"font-weight:600;color:#1D4D38;flex:1\">{{ ml.name }}<\u002Fspan><span style=\"font-size:12.5px;color:#475467;font-variant-numeric:tabular-nums\">{{ ml.kcal }}<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:12px;padding-left:16px;color:{{ ml.txtColor }}\">{{ ml.time }} \u00b7 {{ ml.txt }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"min-width:0;background:#fff;border:1px solid #E4E7EC;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n          <div style=\"display:flex;align-items:baseline;gap:10px\"><h3 style=\"margin:0;font:800 21px/26px Montserrat,sans-serif;color:#1D4D38\">{{ cur.name }}<\u002Fh3><span style=\"color:#475467\">{{ cur.time }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#1D4D38\">Include this meal\n            <button sc-camel-on-click=\"{{ toggleCur }}\" aria-label=\"Include this meal\" style=\"width:38px;height:22px;border-radius:11px;border:0;position:relative;padding:0;background:{{ cur.trackBg }}\"><span style=\"position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);left:{{ cur.knobL }}\"><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ cur.skip }}\">\n          <div style=\"padding:28px 20px;border-radius:14px;background:#F2F4F7;border:1px solid #E4E7EC;color:#475467;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center\">\n            <b style=\"color:#1D4D38\">{{ cur.name }} is skipped<\u002Fb>\n            <span>The patient won't see it, and it isn't counted in the day. Its share of the day is free to give to other meals.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ cur.active }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"border:1.5px solid #E4E7EC;border-radius:14px;background:#F3FCF8;padding:12px 14px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <b style=\"color:#1D4D38\">Meal target<\u002Fb>\n              <span style=\"font-size:12px;color:#475467\">Full marks within {{ tolText }} (at least 3 g for macros).<\u002Fspan>\n              <span style=\"margin-left:auto;display:flex;gap:8px;align-items:center\">\n                <sc-if value=\"{{ tViewing }}\">\n                  <sc-if value=\"{{ cur.edited }}\"><button sc-camel-on-click=\"{{ resetTarget }}\" title=\"Back to the target from step 2\" style=\"border:0;background:none;color:#667085;font-size:12.5px;t h:7px;height:7px;border-radius:50%;background:{{ ot.dot }}\"><\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ addOption }}\" style=\"height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px dashed #ABE6CC;background:#fff;color:#299D6B;white-space:nowrap\">+ Add option<\u002Fbutton>\n            <sc-if value=\"{{ canRemoveOpt }}\"><button sc-camel-on-click=\"{{ removeOption }}\" style=\"margin-left:auto;border:0;background:none;color:#B42318;font-size:12.5px;font-weight:600;padding:4px;white-space:nowrap\">Remove this option<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n            <sc-for list=\"{{ meters }}\" as=\"mt\" hint-placeholder-count=\"4\">\n              <div style=\"border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:{{ mt.cardBg }};border:1.5px solid {{ mt.cardBorder }}\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\"><span style=\"font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#667085;display:flex;align-items:center;gap:5px\"><img src=\"{{ mt.icon }}\" width=\"16\" height=\"16\" alt=\"\" style=\"flex:none\">{{ mt.label }}<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:{{ mt.pillBg }};color:{{ mt.pillColor }}\">{{ mt.pill }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-variant-numeric:tabular-nums;white-space:nowrap\"><span style=\"font:700 22px/26px Onest;color:{{ mt.valColor }}\">{{ mt.actual }}<\u002Fspan><span style=\"color:#667085;font-size:13px\"> / {{ mt.target }} {{ mt.u }}<\u002Fspan><\u002Fdiv>\n                <div style=\"position:relative;height:8px;border-radius:999px;background:#F2F4F7\">\n                  <span style=\"positio mber\" value=\"{{ f.qty }}\" sc-camel-on-change=\"{{ f.onQty }}\" disabled=\"{{ f.ro }}\" step=\"0.5\" min=\"0\" style=\"width:52px;height:36px;border:1.5px solid #E4E7EC;border-radius:8px;text-align:center;font-weight:700;outline:none;background:#fff;font-variant-numeric:tabular-nums\" style-focus=\"border-color:#299D6B\">\n                    <button sc-camel-on-click=\"{{ f.inc }}\" disabled=\"{{ f.ro }}\" aria-label=\"More\" style=\"width:32px;height:32px;border-radius:8px;border:1.5px solid #299D6B;background:#fff;color:#299D6B;font-weight:700;flex:none\">+<\u002Fbutton>\n                  <\u002Fdiv>\n                  <span style=\"color:#475467;font-size:13px\">{{ f.unit }}<\u002Fspan>\n                  <span style=\"text-align:right;font-weight:600;font-variant-numeric:tabular-nums\">{{ f.k }}<\u002Fspan>\n                  <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:#475467\">{{ f.p }}<\u002Fspan>\n                  <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:#475467\">{{ f.c }}<\u002Fspan>\n                  <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:#475467\">{{ f.fat }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ f.del }}\" disabled=\"{{ f.ro }}\" aria-label=\"Remove food\" style=\"width:32px;height:32px;border:0;background:none;color:#B42318;border-radius:8px;display:grid;place-items:center\" style-hover=\"background:#FEF3F2\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noFoods }}\">\n                <div style=\"padding:22px 0;border-top:1px solid #F2F4F7;color:#667085;text-align:center\">No food in this option yet.<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;padding-top:12px;border-top:1px solid #F2F4F7\">\n                <button sc-camel-on-click=\"{{ addFood }}\" style=\"height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px solid #299D6B;background:#fff;color:#299D6B\">+ Add food<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #E4E7EC;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:center;gap:8px\"><b style=\"font-size:15px;color:#1D4D38\">Tips for this option<\u002Fb><\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:18px;color:#826E2D;background:#FFFAEB;border:1px solid #FEDF89;border-radius:10px;padding:8px 12px\">Say what to do: a short headline, then one line on how. Leave out the benefits; KAIRA explains them when the patient asks.<\u002Fdiv>\n            <sc-for list=\"{{ tips }}\" as=\"tp\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:flex-start;gap:10px;padding-top:10px;border-top:1px solid #F2F4F7\">\n                <span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#E6FAF1;color:#299D6B;font:700 12px/22px Onest;text-align:center;margin-top:8px\">{{ tp.n }}<\u002Fspan>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n                  <input value=\"{{ tp.h }}\" sc-camel-on-change=\"{{ tp.onH }}\" placeholder=\"Headline, e.g. Soak the methi seeds overnight\" style=\"width:100%;border:1.5px solid #E4E7EC;border-radius:10px;background:#F3FCF8;padding:9px 12px;outline:none;font-weight:600;color:#1D4D38\" style-focus=\"border-color:#299D6B;background:#fff\">\n                  <input value=\"{{ tp.s }}\" sc-camel-on-change=\"{{ tp.onS }}\" placeholder=\"One line on how to do it\" style=\"width:100%;border:1.5px solid #E4E7EC;border-radius:10px;background:#F3FCF8;padding:9px 12px;outline:none;font-size:13px;color:#475467\" style-focus=\"border-color:#299D6B;background:#fff\">\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ tp.del }}\" aria-label=\"Delete tip\" style=\"flex:none;border:0;background:none;color:#B42318;padding:8px;margin-top:2px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noTips }}\"><span style=\"color:#667085;font-size:13px\">No tips for this option yet.<\u002Fspan><\u002Fsc-if>\n            <div><button sc-camel-on-click=\"{{ addTip }}\" style=\"height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;border:1.5px solid #299D6B;background:#fff;color:#299D6B\">+ Add tip<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isBuild }}\">\n  <div style=\"flex:none;border-top:1px solid #E4E7EC;background:#fff;padding:12px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:260px;display:flex;align-items:center;gap:10px;font-size:13.5px\">\n      <span style=\"width:8px;height:8px;border-radius:50%;flex:none;background:{{ foot.dot }}\"><\u002Fspan>\n      <span style=\"font-weight:600;color:{{ foot.color }}\">{{ foot.text }}<\u002Fspan>\n      <sc-if value=\"{{ foot.showJump }}\"><button sc-camel-on-click=\"{{ jumpNext }}\" style=\"border:0;background:none;color:#299D6B;font-weight:600;padding:4px;white-space:nowrap\">Show next \u2192<\u002Fbutton><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ canBack }}\"><button sc-camel-on-click=\"{{ back }}\" style=\"height:40px;padding:0 16px;border-radius:11px;font-size:13.5px;font-weight:600;border:1.5px solid #E4E7EC;background:#fff;color:#1D4D38\">Back<\u002Fbutton><\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ saveDraft }}\" style=\"height:40px;padding:0 16px;border-radius:11px;font-size:13.5px;font-weight:600;border:1.5px solid #299D6B;background:#fff;color:#299D6B\">Save as draft<\u002Fbutton>\n    <sc-if value=\"{{ notLast }}\"><button sc-camel-on-click=\"{{ next }}\" disabled=\"{{ nextDisabled }}\" style=\"height:40px;padding:0 18px;border-radius:11px;font-size:13.5px;font-weight:600;color:#fff;border:1.5px solid {{ nextBg }};background:{{ nextBg }}\">{{ nextLabel }}<\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ isStep3 }}\"><button sc-camel-on-click=\"{{ openPreview }}\" style=\"height:40px;padding:0 18px;border-radius:11px;font-size:13.5px;font-weight:600;color:#fff;border:1.5px solid #299D6B;background:#299D6B\">Preview &amp; assign<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ drawer }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeDrawer }}\" style=\"position:fixed;inset:0;background:rgba(16,24,40,.3);z-index:28\">\n  <div sc-camel-on-click=\"{{ stop }}\" data-screen-label=\"Assessment drawer\" style=\"position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;box-shadow:-8px 0 24px rgba(16,24,40,.14);padding:20px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><b style=\"font:800 17px Montserrat,sans-serif;color:#1D4D38\">Baseline assessment<\u002Fb><span style=\"font-size:10.5px;font-weight:600;color:#667085;background:#F2F4F7;border:1px solid #E4E7EC;border-radius:999px;padding:1px 7px\">Sample data<\u002Fspan><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeDrawer }}\" aria-label=\"Close\" style=\"border:0;background:none;font-size:24px;line-height:1;color:#1D4D38\">\u00d7<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:42px;height:42px;border-radius:14px;background:#299D6B;color:#fff;display:grid;place-items:center;font:700 15px Montserrat,sans-serif\">P<\u002Fspan><div><div style=\"font-weight:700;color:#1D4D38\">Patient A<\u002Fdiv><div style=\"font-size:12.5px;color:#667085\">34 \u00b7 Female \u00b7 Type 2 diabetes<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px\">\n      <div style=\"background:#E6FAF1;border-radius:10px;padding:10px;text-align:center\"><div style=\"font-weight:700;color:#1D4D38\">160 cm<\u002Fdiv><div style=\"font-size:11.5px;color:#475467\">Height<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#E6FAF1;border-radius:10px;padding:10px;text-align:center\"><div style=\"font-weight:700;color:#1D4D38\">72 kg<\u002Fdiv><div style=\"font-size:11.5px;color:#475467\">Weight<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#E6FAF1;border-radius:10px;padding:10px;text-align:center\"><div style=\"font-weight:700;color:#1D4D38\">28.1<\u002Fdiv><div style=\"font-size:11.5px;color:#475467\">BMI<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;font-size:13.5px\">\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F2F4F7\"><span style=\"color:#667085\">HbA1c<\u002Fspan><span style=\"font-weight:600;color:#1D4D38\">7.8%<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F2F4F7\"><span style=\"color:#667085\">Fasting glucose<\u002Fspan><span style=\"font-weight:600;color:#1D4D38\">142 mg/dL<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F2F4F7\"><span style=\"color:#667085\">Activity<\u002Fspan><span style=\"font-weight:600;color:#1D4D38\">Sedentary, desk job<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F2F4F7\"><span style=\"color:#667085\">Diet preference<\u002Fspan><span style=\"font-weight:600;color:#1D4D38\">Vegetarian<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F2F4F7\"><span style=\"color:#667085\">Allergies<\u002Fspan><span style=\"font-weight:600;color:#1D4D38\">None reported<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F2F4F7\"><span style=\"color:#667085\">Medication<\u002Fspan><span style=\"font-weight:600;color:#1D4D38\">Metformin 500 mg<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0\"><span style=\"color:#667085\">Goal<\u002Fspan><span style=\"font-weight:600;color:#1D4D38\">Lose 6 kg in 3 months<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ modal }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:30;display:grid;place-items:center;padding:16px\">\n  <div sc-camel-on-click=\"{{ stop }}\" data-screen-label=\"Preview and assign\" style=\"background:#fff;border-radius:16px;width:min(780px,100%);max-height:88vh;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n    <div>\n      <h4 style=\"margin:0;font:800 18px/24px Montserrat,sans-serif;color:#1D4D38\">{{ plan.name }}<\u002Fh4>\n      <div style=\"color:#475467;font-size:13px;margin-top:4px\">{{ previewSub }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2.2fr) 70px minmax(0,1.2fr);font-size:13px\">\n      <span style=\"background:#299D6B;color:#fff;font-weight:700;padding:10px 12px;border-radius:8px 0 0 0\">Meal<\u002Fspan>\n      <span style=\"background:#299D6B;color:#fff;font-weight:700;padding:10px 12px\">Target<\u002Fspan>\n      <span style=\"background:#299D6B;color:#fff;font-weight:700;padding:10px 12px\">Options<\u002Fspan>\n      <span style=\"background:#299D6B;color:#fff;font-weight:700;padding:10px 12px;border-radius:0 8px 0 0\">Check<\u002Fspan>\n      <sc-for list=\"{{ previewRows }}\" as=\"pr\" hint-placeholder-count=\"7\">\n        <span style=\"padding:10px 12px;border-bottom:1px solid #F2F4F7\"><b style=\"color:#1D4D38\">{{ pr.name }}<\u002Fb><br><span style=\"color:#667085;font-size:12px\">{{ pr.time }}<\u002Fspan><\u002Fspan>\n        <span style=\"padding:10px 12px;border-bottom:1px solid #F2F4F7;color:#1D4D38;font-variant-numeric:tabular-nums\">{{ pr.target }}<\u002Fspan>\n        <span style=\"padding:10px 12px;border-bottom:1px solid #F2F4F7;font-variant-numeric:tabular-nums\">{{ pr.opts }}<\u002Fspan>\n        <span style=\"padding:10px 12px;border-bottom:1px solid #F2F4F7;font-weight:600;color:{{ pr.color }}\">{{ pr.status }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasIssues }}\">\n      <div style=\"display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:#FEF3F2;border:1px solid #FECDCA\">\n        <span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#FEE4E2;color:#B42318;font:800 16px/30px Onest;text-align:center\">!<\u002Fspan>\n        <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;color:#7A271A;font-size:13px\">\n          <b style=\"font-size:14px\">{{ issueTitle }}<\u002Fb>\n          <sc-for list=\"{{ issueList }}\" as=\"il\"><span><b>{{ il.name }}:<\u002Fb> {{ il.opts }}<\u002Fspan><\u002Fsc-for>\n          <span>{{ issueNote }}<\u002Fspan>\n          <sc-if value=\"{{ canConfirm }}\"><label style=\"display:flex;gap:8px;align-items:center;font-weight:600;color:#1D4D38;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ confirm }}\" sc-camel-on-change=\"{{ onConfirm }}\">I've reviewed these and want to assign anyway<\u002Flabel><sc-if value=\"{{ confirm }}\"><label style=\"display:flex;flex-direction:column;gap:6px;color:#1D4D38;font-weight:600\">Why are you assigning it anyway?<textarea value=\"{{ reason }}\" sc-camel-on-change=\"{{ onReason }}\" rows=\"3\" placeholder=\"For example, a veg option for days the patient does not eat eggs\" style=\"width:100%;resize:vertical;min-height:72px;border:1.5px solid #E4E7EC;border-radius:10px;padding:10px 12px;font:400 13.5px/20px Onest;color:#101828;background:#fff;outline:none\" style-focus=\"border-color:#299D6B\"><\u002Ftextarea><span style=\"font-weight:400;font-size:12px;color:#667085\">Needed before you can assign.<\u002Fspan><\u002Flabel><\u002Fsc-if><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ canSaveTpl }}\">\n      <label style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1.5px solid #E4E7EC;cursor:pointer\">\n        <input type=\"checkbox\" checked=\"{{ saveTpl }}\" sc-camel-on-change=\"{{ onSaveTpl }}\" style=\"margin-top:3px\">\n        <span style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"color:#1D4D38\">Also save my changes to the master template<\u002Fb><span style=\"font-size:12.5px;color:#475467\">{{ tplNote }}<\u002Fspan><\u002Fspan>\n      <\u002Flabel>\n    <\u002Fsc-if>\n    <div style=\"display:flex;gap:10px;justify-content:flex-end\">\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"height:40px;padding:0 16px;border-radius:11px;font-size:13.5px;font-weight:600;border:1.5px solid #E4E7EC;background:#fff;color:#1D4D38\">Back to editing<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ assign }}\" disabled=\"{{ assignDisabled }}\" style=\"height:40px;padding:0 18px;border-radius:11px;font-size:13.5px;font-weight:600;color:#fff;border:1.5px solid {{ assignBg }};background:{{ assignBg }}\">{{ assignLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#1D4D38;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.18)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;tolerance&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:5,&quot;max&quot;:40,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Checks&quot;},&quot;checkCalories&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Checks&quot;},&quot;blockAssign&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Checks&quot;}}\">\nconst SLOTS = [\n  { key: 'early', name: 'Early morning', time: '06:30', share: 5, color: '#CBF0E0' },\n  { key: 'breakfast', name: 'Breakfast', time: '08:30', share: 20, color: '#299D6B' },\n  { key: 'msnack', name: 'Morning snack', time: '11:00', share: 10, color: '#ABE6CC' },\n  { key: 'lunch', name: 'Lunch', time: '13:30', share: 30, color: '#246649' },\n  { key: 'evening', name: 'Evening snack', time: '17:00', share: 10, color: '#2DA6A6' },\n  { key: 'dinner', name: 'Dinner', time: '20:00', share: 20, color: '#1D4D38' },\n  { key: 'bed', name: 'Bedtime', time: '22:00', share: 5, color: '#79CCA8' }\n];\nconst MING = 3;\nconst MCOL = { k: '#475467', p: '#444CE7', c: '#E7C144', f: '#2D8282' };\n/* GoodFlip's own macro icons (icons/icon-*.svg) and its flame for calories, inlined so the page stays one file */\nconst MIC = {\"p\": \"data ed will score lower on the day.';\n      v.canConfirm = !block; v.confirm = s.confirm;\n      v.onConfirm = () => this.setState(st => ({ confirm: !st.confirm }));\n      v.reason = s.reason || ''; v.onReason = e => { const x = e.target.value; this.setState({ reason: x }); };\n      const t = P.ti != null ? this.tpl[P.ti] : null;\n      v.canSaveTpl = !!t && s.dirty; v.saveTpl = s.saveTpl;\n      v.onSaveTpl = () => this.setState(st => ({ saveTpl: !st.saveTpl }));\n      v.tplNote = t ? 'These changes will also be applied to the master template \"' + t.name + '\", for every coach.' : '';\n      v.assignDisabled = issues.length > 0 && (block || !s.confirm || !(s.reason || '').trim());\n      v.assignBg = v.assignDisabled ? '#ABE6CC' : '#299D6B';\n      v.assignLabel = issues.length && !block ? 'Assign anyway' : 'Assign to Patient A';\n    }\n    v.openPreview = () => this.setState({ modal: true, search: null, pv: null, confirm: false, reason: '' });\n    v.closeModal = () => this.setState({ modal: false });\n    v.assign = () => {\n      if (issues.length && (block || !s.confirm)) return;\n      let ver = null; if (s.saveTpl && P.ti != null && s.dirty) ver = this.saveTemplate(P);\n      this.setState(st => ({ plans: [{ name: P.name, st: 'Pending', color: '#DC6803', d: fdate(P.from) + ' \u2013 ' + fdate(P.to) }].concat(st.plans), view: 'list', modal: false, plan: null, saveTpl: false }));\n      this.say('Plan sent for approval.' + (ver ? ' Template saved as version ' + ver + '.' : ''));\n    };\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
