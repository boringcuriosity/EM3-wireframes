<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Portal: Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="coach-mind-rhythm/shell.css">
<link rel="stylesheet" href="coach-mind-rhythm/rhythm.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9V3"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-4v12l-6-4"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 7c-3-2-8-1-8 5s4 9 6 9c1 0 1.3-.5 2-.5s1 .5 2 .5c2 0 6-3 6-9s-5-7-8-5z"/><path d="M12 7c0-2 1-4 3-4"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="m12 16 4-5"/></symbol>
  <symbol id="i-plate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.2" stroke-width="2.4"/></symbol>
  <symbol id="i-cutlery" viewBox="0 0 24 24"><path d="M5 3v6c0 1.7 1.3 3 3 3s3-1.3 3-3V3M8 3v6M8 12v9"/><path d="M19 3c-2.5 2-3.5 6-3.5 10 0 1.5 1 2.5 3.5 2.5M19 3v18"/></symbol><!-- from the Plate hero (plate-variants.html) -->
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>
<script>const ic=(n,c='i')=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
let ttN=0;const tip=(label,html,cls='')=>{const id='tt'+(++ttN);return `<span class="tt"><button type="button" class="info" aria-label="About ${label}" aria-describedby="${id}">${ic('info')}</button><span class="tt-b ${cls}" role="tooltip" id="${id}">${html}</span></span>`};</script>

<div class="app">
  <nav class="rail" aria-label="Portal">
    <img class="logo" src="icons/goodflip-logo-small.png" alt="GoodFlip">
    <button aria-label="Home"><script>document.write(ic('home'))</script></button>
    <button aria-label="Chats"><script>document.write(ic('chat'))</script></button>
    <button aria-label="Calendar"><script>document.write(ic('cal'))</script></button>
    <button class="on" aria-label="Patients"><script>document.write(ic('user'))</script></button>
    <button aria-label="Documents"><script>document.write(ic('file'))</script></button>
    <button aria-label="Calls"><script>document.write(ic('video'))</script></button>
  </nav>

  <aside class="side">
    <div class="pt" id="pt"></div>
    <div class="nav" id="nav"></div>
  </aside>

  <div class="nav-scrim" id="nav-scrim"></div>
  <div class="main">
    <header class="top">
      <button class="menu" id="menu" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h2 class="page-title">Patient Overview</h2>
      <div class="me"><span class="av">CA</span><span><b>Coach A</b><small>Psychologist</small></span></div>
    </header>

    <main class="content">
      <div class="proto" role="group" aria-label="Sample patient"><span>Sample patient</span><div class="chips" id="pp"></div><p id="pp-line"></p></div>

      <section class="card">
        <div class="card-h"><script>document.write(ic('pulse'))</script><h3>Clinical Snapshot</h3></div>
        <div class="stats" id="stats"></div>
      </section>

      <!-- ================= Rhythm ================= -->
      <section class="card ns" aria-labelledby="ns-title">
        <div class="ns-top">
          <div class="card-h">
            <span class="ic-h rh"><i aria-hidden="true"></i></span>
            <h3 id="ns-title">Rhythm</h3><span id="help-score"></span>
            <div class="tools">
              <div class="rp">
                <button class="range" id="range" aria-haspopup="dialog" aria-expanded="false"></button>
                <div class="rp-pop" id="rp" role="dialog" aria-label="Choose dates" hidden>
                  <div id="rp-pls"></div>
                  <div class="rp-pre" id="rp-pre"></div>
                  <div class="rp-in"><label>From<input type="date" id="rp-from"></label><label>To<input type="date" id="rp-to"></label></div>
                  <p class="rp-err" id="rp-err" role="alert"></p>
                  <div class="rp-act"><button type="button" class="rp-cancel" id="rp-cancel">Cancel</button><button type="button" class="rp-apply" id="rp-apply">Apply</button></div>
                  <p class="rp-note" id="rp-note"></p>
                </div>
              </div>
              <div class="chips" id="views" role="tablist" aria-label="View">
                <button role="tab" data-v="daily">Daily</button>
                <button role="tab" data-v="weekly">Weekly</button>
                <button role="tab" data-v="monthly">Monthly</button>
              </div>
            </div>
          </div>
          <p class="sub">How well they slept and cared for themselves against the Mind plan, out of 100.</p>
          <div class="rh-plan" id="plan"></div>
        </div>

        <div class="ns-in">
          <div class="kpis"><div id="kpis"></div></div>

          <div class="rh-ins" id="ins" aria-live="polite"></div>

          <div class="ns-body">
            <div class="panel">
              <div class="chart-h">
                <div><h4><span id="chart-title"></span><span id="help-chart"></span></h4><p id="chart-hint"></p></div>
                <div class="legend" id="legend"></div>
              </div>
              <div class="chart" id="chart"></div>
            </div>
            <div class="panel" id="side" aria-live="polite"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="mind/sleep-rule.js?v=2"></script>
<script src="coach-mind-rhythm/data.js"></script>
<script src="coach-mind-rhythm/app.js"></script>
</body>
</html>
