<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EM3, Starting With Eat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #101828; --muted: #667085; --line: #EAECF0; --brand: #299D6B; --ease: cubic-bezier(.2, 0, 0, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; }
  body { font-family: Roboto, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }

  .slide { position: fixed; inset: 0 0 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 40px; padding: 40px 48px 0; opacity: 0; visibility: hidden; transition: opacity .5s var(--ease), visibility 0s linear .5s; }
  .slide.on { opacity: 1; visibility: visible; transition: opacity .5s var(--ease), visibility 0s; }
  h1 { font: 600 clamp(32px, 5vw, 64px)/1.15 'Playfair Display', Georgia, serif; text-align: center; max-width: 18ch; letter-spacing: -.5px; }
  h1.q { max-width: 24ch; font-size: clamp(28px, 4vw, 52px); }
  h2 { font: 600 clamp(24px, 3vw, 40px)/1.2 'Playfair Display', Georgia, serif; text-align: center; }

  .em3 { max-width: min(760px, 100%); max-height: 100%; object-fit: contain; }
  .phones { display: flex; gap: 32px; align-items: flex-start; justify-content: center; min-height: 0; flex: 0 1 auto; max-height: calc(100% - 90px); }
  .phones img { height: 100%; max-height: 560px; width: auto; max-width: 30vw; border-radius: 24px; border: 1px solid var(--line);
    box-shadow: 0 24px 48px -16px rgb(16 24 40 / .2), 0 2px 6px rgb(16 24 40 / .06); object-fit: cover; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 20px; }
  .bar span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .bar button { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font-size: 16px; }
  .prog { position: fixed; left: 0; top: 0; width: 100%; height: 3px; background: var(--brand); transform-origin: left; transition: transform .45s var(--ease); }

  @media (max-width: 700px) {
    .slide { padding: 24px 16px 0; gap: 24px; }
    .phones { gap: 10px; }
    .phones img { max-width: 31vw; border-radius: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .slide, .prog { transition: none; } }
</style>
</head>
<body>
<div class="prog" id="prog"></div>

<section class="slide">
  <img class="em3" src="deck/em3.webp" alt="EM3: Eat, Move, Mind and Measure, around Repeat">
</section>

<section class="slide">
  <h1>Starting with Eat</h1>
</section>

<section class="slide">
  <h2>Today, Eat looks like this</h2>
  <div class="phones">
    <img src="deck/eat-today-diet.webp" alt="The Diet screen today">
    <img src="deck/eat-today-search.webp" alt="Searching for a food today">
    <img src="deck/eat-today-add.webp" alt="Adding a food to the log today">
  </div>
</section>

<section class="slide">
  <h1 class="q">How might we help a program user to do food logging in daily life feel seamless, motivating &amp; healthier?</h1>
</section>

<nav class="bar"><span id="count"></span><button id="prev" aria-label="Previous slide">&larr;</button><button id="next" aria-label="Next slide">&rarr;</button></nav>

<script>
var S = document.querySelectorAll(".slide"), N = S.length, cur = 0;
function go(i) {
  cur = Math.max(0, Math.min(N - 1, i));
  S.forEach(function (s, k) { s.classList.toggle("on", k === cur); });
  document.getElementById("count").textContent = (cur + 1) + " / " + N;
  document.getElementById("prog").style.transform = "scaleX(" + (cur + 1) / N + ")";
  history.replaceState(null, "", "#" + (cur + 1));
}
document.getElementById("prev").onclick = function () { go(cur - 1); };
document.getElementById("next").onclick = function () { go(cur + 1); };
document.addEventListener("keydown", function (e) {
  if (["ArrowRight", "PageDown", " "].indexOf(e.key) > -1) { e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft", "PageUp"].indexOf(e.key) > -1) { e.preventDefault(); go(cur - 1); }
});
var x0 = null;
document.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", function (e) {
  if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
});
function fromHash() { var n = (parseInt(location.hash.slice(1), 10) || 1) - 1; if (n !== cur || !S[cur].classList.contains("on")) go(n); }
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
