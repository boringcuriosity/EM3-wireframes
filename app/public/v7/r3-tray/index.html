<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eat detail, round 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  :root { --bg: #F2F4F7; --ink: #101828; --muted: #667085; --line: #E4E7EC; --green: #299D6B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: Roboto, system-ui, sans-serif; color: var(--ink); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(242,244,247,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  h1 { font-family: Roboto, Arial, sans-serif; font-size: 24px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; min-width: 240px; }
  .ctl { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .ctl button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .ctl button.on { border-color: var(--green); color: var(--green); font-weight: 700; }
  main { display: flex; gap: 40px; padding: 24px; overflow-x: auto; align-items: flex-start; }
  figure { margin: 0; flex-shrink: 0; width: calc(390px * var(--z)); min-width: 220px; }
  figcaption { min-height: 64px; margin-bottom: 12px; }
  figcaption b { display: block; font-size: 15px; margin-bottom: 4px; }
  figcaption p { margin: 0; font-size: 12.5px; line-height: 1.45; color: #344054; }
  .phone { width: calc(390px * var(--z)); height: calc(844px * var(--z)); overflow: hidden; border-radius: calc(28px * var(--z)); background: #fff; box-shadow: 0 20px 25px -5px rgba(0,0,0,.10), 0 8px 10px -6px rgba(0,0,0,.10); border: 1px solid var(--line); }
  iframe { width: 390px; height: 844px; border: 0; transform: scale(var(--z)); transform-origin: 0 0; display: block; }
  .open { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--green); }
  footer { padding: 0 24px 40px; font-size: 13px; }
  footer a { color: var(--green); }
</style>
</head>
<body style="--z: .75">
<header>
  <h1>Eat detail, round 3</h1>
  <p>Same page, many ways to show today's score. Only phones on screen animate. Tap inside a phone to try it: meals expand, the info icon opens the sheet.</p>
  <div class="ctl">Zoom
    <button data-z=".5">50%</button><button data-z=".75" class="on">75%</button><button data-z="1">100%</button>
  </div>
</header>
<main id="board"></main>
<details style="margin:0 24px 24px;border-top:1px solid var(--line);padding-top:16px"><summary style="cursor:pointer;font-size:14px;color:var(--muted)"><b style="color:var(--ink)">Backup</b>, set aside so far</summary><div id="backup" style="display:flex;gap:40px;padding:24px 0;overflow-x:auto"></div></details>
<footer><a href="../index.html">Back to round 2</a></footer>
<script>
const HEROES = [
  ["plate", "Plate", "A plate of dots that light up clockwise to the score, with a fork and knife either side."],
  ["broth", "Broth Bowl", "A bowl seen from above, 54% of the surface covered in food."],
  ["portal", "Portal", "React Bits portal shader in brand greens, the score at its centre."],
  ["orb", "Living Orb", "A glassy 3D orb whose inner light fills to the score."],
  ["smoke", "Smoke Ring", "Paper smoke ring: dense green smoke on 54% of the circle, a faint wisp for the rest."],
  ["metal", "Liquid Metal", "Paper liquid metal flowing along 54% of a ring, a soft track for the rest."],
  ["metalhex", "Metal Hexagon", "Liquid metal poured into Kaira's hexagon, 54% of the way round."],
  ["chrome", "Chrome Number", "The score itself cast in molten green chrome, with a metal arc beneath."],
  ["vortex", "Vortex", "A swirling green portal whose energy has spun up 54% of the ring."],
  ["aura", "Aura", "A pulsing energy border that has charged 54% of the way round."],
  ["sunrise", "Sunrise", "The sun has climbed 54% of its arc, god rays follow it."],
  ["planet", "Planet Phase", "A living green planet, exactly 54% of its face in daylight."],
  ["blob", "Liquid Blob", "A round, wobbling blob of clear green water lit by caustics, filled to 54%."],
  ["lotus", "Lotus Bloom", "A 3D lotus with 54% of its petals open."],
  ["citrus", "Citrus Wheel", "A cut green citrus: 7 of its 13 segments are juicy, the rest are pale."],
];
const BACKUP = [
  ["hexfood", "Ingredient Hexes", "Set aside."],
  ["scale", "Kitchen Scale", "Set aside."],
  ["halo3d", "Halo Orbit", "Set aside."],
  ["halodome", "Halo Dome", "Set aside."],
  ["halobeads", "Halo Beads", "Set aside."],

  ["dinnerplate", "Porcelain plate", "Set aside."],
  ["thali", "Thali", "Set aside."],
  ["jar", "Seed Jar", "Set aside: 3D pebbles pour into a glass jar."],
  ["sprout", "Sprout", "Set aside: a plant that grows with the day."],
  ["fluted", "Fluted Glass", "Set aside."],
  ["merge", "Merge", "Set aside."],
  ["gem", "Gem Ring", "Set aside."],
  ["pebble", "Pebble", "Set aside."],
  ["stardust", "Stardust", "Set aside."],
  ["ferro", "Ferrofluid", "Set aside."],
  ["pool", "Caustic Pool", "Set aside."],
];
const fig = ([id, name, line]) => `
  <figure id="${id}">
    <figcaption><b>${name}</b><p>${line}</p></figcaption>
    <div class="phone"><iframe src="eat.html?hero=${id}" title="${name}"></iframe></div>
    <a class="open" href="eat.html?hero=${id}" target="_blank">Open full size</a>
  </figure>`;
document.getElementById("board").innerHTML = HEROES.map(fig).join("");
document.getElementById("backup").innerHTML = BACKUP.map(fig).join("");
/* ponytail: only phones on screen run their hero; Chrome drops the oldest WebGL contexts past ~16 */
const onScreen = new Map();
const tell = (fr) => fr.contentWindow && fr.contentWindow.postMessage(onScreen.get(fr) ? "hero:mount" : "hero:unmount", "*");
const check = () => document.querySelectorAll("figure").forEach((f) => {
  const r = f.getBoundingClientRect(), fr = f.querySelector("iframe");
  const vis = r.right > -120 && r.left < innerWidth + 120 && r.bottom > 0 && r.top < innerHeight && !!f.offsetParent;
  if (onScreen.get(fr) !== vis) { onScreen.set(fr, vis); tell(fr); }
});
let raf = 0;
const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(check); };
document.getElementById("board").addEventListener("scroll", schedule, { passive: true });
document.querySelectorAll(".row, #backup").forEach((el) => el.addEventListener("scroll", schedule, { passive: true }));
addEventListener("scroll", schedule, { passive: true });
addEventListener("resize", schedule);
document.querySelector("details") && document.querySelector("details").addEventListener("toggle", () => setTimeout(check, 50));
check();
window.addEventListener("message", (e) => {
  if (e.data !== "hero:ready") return;
  const fr = [...document.querySelectorAll("iframe")].find((x) => x.contentWindow === e.source);
  if (fr) tell(fr);
});
document.querySelectorAll(".ctl button").forEach((b) => b.onclick = () => {
  document.body.style.setProperty("--z", b.dataset.z);
  document.querySelectorAll(".ctl button").forEach((x) => x.classList.toggle("on", x === b));
  setTimeout(check, 50);
});
</script>
<script src="../frame.js" defer></script>
</body>
</html>
