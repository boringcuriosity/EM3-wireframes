<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<!--
  Today's to-do, nine ways. One file, two modes:
    todo-studies.html                 the study page (table, clock switcher, phones)
    todo-studies.html?v=A&now=13.5    one live phone (the study page frames these)
  Every phone shares one engine: the sample day, the bar, the review sheet, the wheel, the mood sheet, the win moment
  (ported from screen.html, which ports them from the pillars). Only the list renderer differs per variant.
-->
<style>
  :root { --g: #299D6B; --gdk: #2A805A; --tk: #039855; --hd: #E6FAF1; --g25: #F3FCF8; --g100: #CBF0E0;
    --ink: #101828; --i2: #344054; --i3: #475467; --mu: #667085; --mu2: #98A2B3; --ln: #EAECF0; --ln2: #F2F4F7; --bg2: #F9FAFB;
    --in: #444CE7; --in50: #EEF4FF; --gold: #E7C144; --gold7: #A68A2D; --glide: cubic-bezier(.33,1,.68,1); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: #fff; }
  body { font-family: Roboto, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  img { display: block; }

  /* ================= the study page ================= */
  body.study { padding: 40px 32px 80px; }
  .wrap { max-width: 1440px; margin: 0 auto; }
  .eyebrow { font: 600 12px/16px Roboto, sans-serif; letter-spacing: .8px; text-transform: uppercase; color: var(--mu); }
  .study h1 { margin: 6px 0 10px; font: 600 36px/44px "Playfair Display", serif; color: var(--ink); }
  .lede { max-width: 820px; margin: 0 0 8px; font-size: 16px; line-height: 25px; color: var(--i3); }
  .lede b { color: var(--ink); font-weight: 600; }
  .clock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 24px 0 28px; }
  .clock span { font-size: 14px; color: var(--mu); margin-right: 4px; }
  .clock button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E4E7EC; font: 600 14px/1 Roboto, sans-serif; color: var(--i2); background: #fff; transition: border-color .2s var(--glide), color .2s var(--glide); }
  .clock button[aria-pressed="true"] { border-color: var(--g); box-shadow: 0 0 0 1px var(--g); color: var(--g); }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--ln); border-radius: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; min-width: 980px; }
  th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--ln2); }
  thead th { font: 600 12px/16px Roboto, sans-serif; letter-spacing: .4px; color: var(--mu); background: var(--bg2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.n { font: 700 18px/20px Roboto, sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  td.n small { display: block; margin-top: 4px; font: 400 12px/16px Roboto, sans-serif; color: var(--mu); white-space: normal; }
  td .nm { font-weight: 600; color: var(--ink); }
  td .nm em { font-style: normal; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: var(--g); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .3px; vertical-align: 1px; }
  tr.base td { color: var(--mu); background: #FCFCFD; }
  tr.base td.n { color: var(--mu); }
  td.ld { color: var(--i3); max-width: 300px; }
  td .kept { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--mu); }
  td.tk2 { white-space: nowrap; color: var(--i2); }
  td.tk2 small { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--mu); }
  .meas { font: 500 12px/16px Roboto, sans-serif; color: var(--mu); margin-top: 10px; }
  .phones { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 48px 32px; margin-top: 44px; }
  .pv { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pv h2 { display: flex; align-items: center; gap: 8px; margin: 0; font: 700 18px/24px Manrope, sans-serif; color: var(--ink); }
  .pv h2 i { font-style: normal; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--ln2); font: 700 13px/1 Roboto, sans-serif; color: var(--i3); }
  .pv h2 em { font-style: normal; padding: 3px 9px; border-radius: 999px; background: var(--g); color: #fff; font: 700 11px/14px Roboto, sans-serif; letter-spacing: .3px; }
  .pv.rec h2 i { background: var(--g); color: #fff; }
  .pv p { margin: 0; font-size: 14px; line-height: 21px; color: var(--i3); }
  .pv p.tr { color: var(--mu); }
  .pv p.tr b { color: var(--i2); font-weight: 600; }
  .pv .taps { display: flex; flex-wrap: wrap; gap: 6px; }
  .pv .taps span { padding: 4px 10px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--ln2); font: 500 12px/16px Roboto, sans-serif; color: var(--i3); }
  .pv .taps b { color: var(--ink); }
  .frame { position: relative; width: 340px; height: 736px; margin-top: 6px; border-radius: 40px; background: #101828; padding: 7px; box-shadow: 0 24px 48px -20px rgba(16,24,40,.35); }
  .frame .scr { width: 326px; height: 722px; border-radius: 33px; overflow: hidden; background: #fff; }
  .frame iframe { width: 390px; height: 864px; border: 0; transform: scale(.8359); transform-origin: 0 0; display: block; }
  .open-l { font: 500 13px/18px Roboto, sans-serif; color: var(--g); text-decoration: none; }
  .verdict { margin-top: 56px; max-width: 880px; padding: 24px 28px; border-radius: 20px; background: var(--g25); border: 1px solid var(--g100); }
  .verdict h3 { margin: 0 0 8px; font: 700 20px/28px Manrope, sans-serif; }
  .verdict p, .verdict li { font-size: 15px; line-height: 24px; color: var(--i3); }
  .verdict ul { margin: 8px 0 0; padding-left: 20px; }

  /* ================= the phone ================= */
  body.phone { width: 390px; min-height: 100vh; margin: 0 auto; overflow-x: hidden; }
  .sb { position: sticky; top: 0; z-index: 40; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 32px; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font: 600 15px/1 Roboto, sans-serif; }
  .sb svg { height: 12px; }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 6px 16px 14px; }
  .ph small { display: block; font-size: 13px; line-height: 18px; color: var(--mu); }
  .ph h1 { margin: 0; font: 600 28px/34px "Playfair Display", serif; color: var(--ink); }
  .dring { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mu); white-space: nowrap; padding-bottom: 4px; }
  .dring svg { width: 24px; height: 24px; transform: rotate(-90deg); }
  .dring circle { fill: none; stroke-width: 3; }
  .dring .tr { stroke: var(--hd); }
  .dring .fg { stroke: var(--g); stroke-linecap: round; transition: stroke-dashoffset .6s var(--glide); }
  #list { padding: 0 16px 120px; }
  .tabs { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 390px; z-index: 30; display: flex; justify-content: space-around; padding: 8px 8px 26px; background: #fff; border-top: 1px solid var(--ln2); transition: transform .34s cubic-bezier(.2,0,0,1); }
  .tabs span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--mu); width: 72px; }
  .tabs span.on { color: var(--g); font-weight: 600; }
  .tabs img { width: 24px; height: 24px; }
  body.pt-on .tabs { transform: translate(-50%, 110%); }

  /* ----- the shared row ----- */
  .row { position: relative; isolation: isolate; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; }
  .rb { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; align-self: stretch; padding: 0; }
  .rb b { display: block; font: 600 15px/20px Roboto, sans-serif; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; transition: color .3s ease-out; }
  .rb > span { display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row[data-st="done"] .rb b { color: var(--mu); font-weight: 500; }
  .tm { flex: none; font: 500 13px/18px Roboto, sans-serif; color: var(--mu); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chv { flex: none; width: 20px; height: 20px; display: grid; place-items: center; color: var(--mu2); margin-left: -4px; }
  .chv svg { width: 16px; height: 16px; }
  button.chv { position: relative; }
  button.chv::before { content: ""; position: absolute; inset: -12px; }
  .th { flex: none; width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--ln2); }
  .th img { width: 100%; height: 100%; object-fit: cover; }
  .row[data-st="done"] .th img { filter: saturate(.5) brightness(1.04); }

  /* the tick (screen.html's states): unticked grey ring; waiting = pale green, green ring and check; logged = solid green, white check */
  .tickbtn { position: relative; width: 24px; height: 24px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .tickbtn::after { content: ""; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
  .tick { position: relative; width: 24px; height: 24px; border-radius: 9999px; border: 1.5px solid #D0D5DD; background: #fff; display: grid; place-items: center; flex-shrink: 0;
    transition: background .18s ease-out, border-color .18s ease-out, transform .18s cubic-bezier(.4,0,.2,1); }
  .tick svg { width: 12px; height: 12px; opacity: 0; transform: scale(.6); transition: opacity .22s ease-out, transform .28s ease-out; }
  .tick path { stroke: #fff; }
  .tickbtn:active .tick { transform: scale(.9); }
  [data-st="sel"] > .tickbtn .tick, [data-st="sel"] .tk .tick { background: var(--hd); border-color: var(--tk); }
  [data-st="sel"] > .tickbtn .tick svg, [data-st="done"] > .tickbtn .tick svg, [data-st="sel"] .tk .tick svg, [data-st="done"] .tk .tick svg { opacity: 1; transform: scale(1); }
  [data-st="sel"] > .tickbtn .tick path, [data-st="sel"] .tk .tick path { stroke: var(--tk); }
  [data-st="done"] > .tickbtn .tick, [data-st="done"] .tk .tick { background: var(--tk); border-color: var(--tk); }
  /* some of a meal or workout waits in the bar */
  [data-st="part"] > .tickbtn .tick, [data-st="part"] .tk .tick { border-color: var(--tk); background: linear-gradient(90deg, var(--hd) 50%, #fff 50%); }
  .tick.pop { animation: pop .5s var(--glide) both; }
  .tick.pop::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--tk); pointer-events: none; animation: halo .8s cubic-bezier(.22,.7,.3,1) forwards; }
  .cheer::before { content: ""; position: absolute; inset: 2px -10px; border-radius: 12px; background: var(--hd); pointer-events: none; z-index: -1; animation: flashOut .9s ease forwards; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes halo { 0% { opacity: .5; transform: scale(.65); } 100% { opacity: 0; transform: scale(2.4); } }
  @keyframes flashOut { 0% { opacity: .85; } 100% { opacity: 0; } }

  /* quiet disclosure line, shared */
  .dis { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding: 0; font: 500 14px/20px Roboto, sans-serif; color: var(--i3); }
  .dis span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dis .cv { flex: none; width: 7px; height: 7px; margin: 0 6px 3px; border-right: 1.5px solid var(--mu2); border-bottom: 1.5px solid var(--mu2); transform: rotate(45deg); transition: transform .3s var(--glide); }
  .dis[aria-expanded="true"] .cv { transform: rotate(225deg); margin-bottom: -3px; }

  /* ===== A: one rail ===== */
  .ra { position: relative; }
  .ra::before { content: ""; position: absolute; left: 77px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--ln2); }
  .ra .row { display: grid; grid-template-columns: 54px 24px minmax(0, 1fr) auto; gap: 0 12px; }
  .ra .tm { text-align: right; }
  .ra .row[data-st="done"] .tm { color: var(--mu2); }
  .ra-part { padding: 18px 0 2px 90px; font: 600 12px/16px Roboto, sans-serif; letter-spacing: .6px; text-transform: uppercase; color: var(--mu2); }
  .ra-now { position: relative; display: grid; grid-template-columns: 54px 24px 1fr; gap: 0 12px; align-items: center; height: 28px; }
  .ra-now b { text-align: right; font: 700 12px/16px Roboto, sans-serif; color: var(--g); }
  .ra-now i { justify-self: center; width: 10px; height: 10px; border-radius: 50%; background: var(--g); box-shadow: 0 0 0 4px var(--hd); position: relative; z-index: 1; }
  .ra-now u { height: 1.5px; background: linear-gradient(90deg, var(--g), rgba(41,157,107,0)); text-decoration: none; }
  .ra-more { margin-left: 90px; width: calc(100% - 90px); min-height: 44px; }

  /* ===== B: by pillar ===== */
  .pl { display: flex; flex-direction: column; gap: 12px; }
  .plc { border-radius: 18px; border: 1px solid var(--ln); padding: 4px 14px 6px; }
  .plc-hd { display: flex; align-items: center; gap: 10px; padding: 10px 0 4px; }
  .plc-hd img { width: 30px; height: 30px; }
  .plc-hd b { flex: 1; font: 700 16px/22px Manrope, sans-serif; color: var(--ink); }
  .plc-hd span { font-size: 13px; color: var(--mu); }
  .plc .dis { min-height: 44px; font-size: 13px; color: var(--mu); border-top: 1px solid var(--ln2); }

  /* ===== C to I: the day in four parts, only the inside changes ===== */
  .pp { display: flex; flex-direction: column; }
  .pp-part + .pp-part { margin-top: 8px; border-top: 1px solid var(--ln2); }
  .pp-hd { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 52px; padding: 12px 0 4px; }
  .pp-hd b { font: 600 12px/16px Roboto, sans-serif; letter-spacing: .8px; text-transform: uppercase; color: var(--i3); }
  .pp-part.cur .pp-hd b { color: var(--gdk); }
  .pp.cards .pp-hd b { font: 700 17px/24px Manrope, sans-serif; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .now-l { display: grid; grid-template-columns: 10px auto 1fr; align-items: center; gap: 8px; height: 24px; margin-left: 46px; }
  .now-l i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 0 3px var(--hd); }
  .now-l b { font: 600 11px/14px Roboto, sans-serif; color: var(--g); font-variant-numeric: tabular-nums; }
  .now-l u { height: 1px; background: linear-gradient(90deg, var(--g), rgba(41,157,107,0)); }
  .anc + .now-l, .now-l + .anc { margin-top: 2px; }
  .pp-hd small { flex: 1; min-width: 0; font-size: 13px; line-height: 18px; color: var(--mu2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pp-tag { flex: none; font: 500 12px/16px Roboto, sans-serif; color: var(--mu); }
  .pp-tag.now { padding: 3px 10px; border-radius: 999px; background: var(--hd); color: var(--gdk); font-weight: 600; }
  .pp-tag.open { color: var(--i2); }
  .pp-tag.ok { color: var(--gdk); font-weight: 600; }
  .pp-hd .cv { flex: none; width: 7px; height: 7px; margin: 0 6px 3px 4px; border-right: 1.5px solid var(--mu2); border-bottom: 1.5px solid var(--mu2); transform: rotate(45deg); transition: transform .3s var(--glide); }
  .pp-hd[aria-expanded="true"] .cv { transform: rotate(225deg); margin-bottom: -3px; }
  .pp-bd { padding-bottom: 8px; animation: ppIn .32s var(--glide) both; }
  @keyframes ppIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  /* the part row: time, task, tick on the right where the thumb is */
  .pr { display: grid; grid-template-columns: 56px minmax(0, 1fr) 24px; gap: 0 12px; align-items: center; min-height: 56px; padding: 6px 0; }
  .pr .tm { color: var(--mu); }
  .pr[data-st="done"] .tm { color: var(--mu2); }
  .pr .rb > span i.pw { font-style: normal; font-weight: 600; color: var(--mu); }
  .pr .rb u { text-decoration: none; color: var(--g); font-weight: 500; }
  .pr.mh { grid-template-columns: 56px minmax(0, 1fr); }
  .pr.fd { min-height: 44px; padding: 2px 0; }
  .pr.fd .rb { flex-direction: row; align-items: center; gap: 8px; padding-left: 12px; border-left: 2px solid var(--ln2); align-self: stretch; }
  .pr.fd .rb b { flex: 1; min-width: 0; font: 500 14px/20px Roboto, sans-serif; -webkit-line-clamp: 2; }
  .pr.fd .rb > span { margin: 0; flex: none; font-size: 12px; }
  .pr.fd[data-st="done"] .rb b { color: var(--mu); }
  .pr.nt { grid-template-columns: minmax(0, 1fr) 24px; }
  /* any time box */
  .any { margin: 6px 0 4px; padding: 2px 12px 2px; border-radius: 14px; background: var(--bg2); }
  .any-h { padding: 10px 0 0; font: 600 12px/16px Roboto, sans-serif; letter-spacing: .4px; color: var(--mu); }
  .any .pr { min-height: 52px; }
  /* E: the pillar lives in the tick ring */
  .pe-key { display: flex; gap: 14px; margin: 0 0 4px; font: 500 12px/16px Roboto, sans-serif; color: var(--mu); }
  .pe-key span { display: inline-flex; align-items: center; gap: 6px; }
  .pe-key i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid; }
  .pe .row[data-p="eat"] .tick { border-color: #299D6B; }
  .pe .row[data-p="move"] .tick { border-color: #6172F3; }
  .pe .row[data-p="mind"] .tick { border-color: #CDA935; }
  .pe .row[data-p="move"][data-st="sel"] .tick { background: #EEF4FF; border-color: #444CE7; }
  .pe .row[data-p="move"][data-st="sel"] .tick path { stroke: #444CE7; }
  .pe .row[data-p="move"][data-st="done"] .tick { background: #444CE7; border-color: #444CE7; }
  .pe .row[data-p="mind"][data-st="sel"] .tick { background: #FEF7DC; border-color: #CDA935; }
  .pe .row[data-p="mind"][data-st="sel"] .tick path { stroke: #A68A2D; }
  .pe .row[data-p="mind"][data-st="done"] .tick { background: #CDA935; border-color: #CDA935; }
  .pe .row[data-p="move"] .tick.pop::after { border-color: #444CE7; }
  .pe .row[data-p="mind"] .tick.pop::after { border-color: #CDA935; }
  .pe .row[data-p="move"].cheer::before { background: #EEF4FF; }
  .pe .row[data-p="mind"].cheer::before { background: #FFFBEE; }
  /* F: pillar words inside a part */
  .pg + .pg { margin-top: 4px; }
  .pg-h { padding: 10px 0 0 68px; font: 600 11px/16px Roboto, sans-serif; letter-spacing: .8px; text-transform: uppercase; color: var(--mu2); }
  /* G: meal anchors */
  .anc { margin: 6px 0; padding: 0 12px; border-radius: 16px; border: 1px solid var(--ln); }
  .anc .pr { grid-template-columns: 48px minmax(0, 1fr) 24px; }
  .anc .pr.mh { grid-template-columns: 48px minmax(0, 1fr); }
  .anc .pr + .pr:not(.fd) { border-top: 1px solid var(--ln2); }
  .anc .tm.rel { font-weight: 400; color: var(--mu2); }
  /* H: part cards */
  .pp.cards { gap: 10px; }
  .pp.cards .pp-part { margin: 0; border: 1px solid var(--ln); border-radius: 18px; padding: 0 14px; }
  .pp.cards .pp-part.cur { border-color: var(--g100); background: linear-gradient(180deg, var(--g25), #fff 96px); }
  .pp.cards .pp-hd { padding: 4px 0; min-height: 56px; }
  /* I: light and heavy */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 6px; }
  .pill { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; max-width: 100%; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid #E4E7EC; background: #fff; font: 500 14px/18px Roboto, sans-serif; color: var(--i2); transition: background .3s var(--glide), border-color .3s var(--glide); }
  .pill .tk .tick { width: 20px; height: 20px; }
  .pill .tk .tick svg { width: 10px; height: 10px; }
  .pill[data-st="sel"] { border-color: var(--g100); background: var(--g25); }
  .pill[data-st="done"] { color: var(--mu); border-color: var(--ln2); }
  .mf { display: flex; gap: 4px; margin: -4px 0 8px 68px; }
  .mface { flex: 1; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; line-height: 1; background: var(--bg2); filter: grayscale(1); opacity: .75; transition: filter .3s var(--glide), opacity .3s var(--glide), background .3s var(--glide); }
  .mface.on, .mface:active { filter: none; opacity: 1; background: var(--g25); box-shadow: inset 0 0 0 1px var(--g); }

  /* ===== the floating bar (plan-tray.js float mode, from screen.html) ===== */
  .pt{position:fixed;left:50%;bottom:0;width:100%;max-width:390px;transform:translate(-50%,110%);z-index:80;padding:0 12px 28px;transition:transform .34s cubic-bezier(.2,0,0,1)}
  .pt.up{transform:translate(-50%,0)}
  .pt .flw{position:relative;border-radius:20px}

<script>
/* ======================================================================
   Variant notes for the study page. Tap counts are for 1:30 PM on the sample day, where breakfast,
   two morning exercises (Lateral costal breathing, Side leg raise), one small move, the walk and the
   8 AM mood check-in are still open. "Log" in the bar counts as a tap; scrolling does not.
   tick: 'plan' = one tick on a meal or workout logs what the coach planned, the row opens to change it.
         'each' = every food and exercise has its own tick under its meal or workout.
   def is the tick each variant ships with; A and B are kept as they were (plan only).
   ====================================================================== */
const PLAN_T = { taps: ['2', '2', '4'], tapNote: ['tick, Log', 'tick the workout, Log', 'row, face, Done, Log'] };
const EACH_T = { taps: ['5', '3', '4'], tapNote: ['4 food ticks, Log', '2 ticks, Log', 'row, face, Done, Log'] };
const META = [
  { id: 'A', name: 'One rail', kept: true, def: 'plan', only: 'plan',
    why: 'Time is the only grouping. Every task is one row on a single rail, its tick sits on the rail, and a Now line shows where you are. The four parts are quiet labels on the rail.',
    trade: 'The parts become labels, so the day reads as one long list, not four places. Done ones from earlier tuck behind one line, which moves rows under the thumb.',
    plan: PLAN_T, pics: '0', load: 'Low. One column, one tick per row, time does the grouping.' },
  { id: 'B', name: 'By pillar', kept: true, def: 'plan', only: 'plan',
    why: 'Three cards, Eat, Move and Mind, each with one quiet pictogram. Inside, only what is due now or missed plus the next one; the rest folds into one Later line. Matches how the coach builds the plan.',
    trade: 'Time is split across three cards, so “what do I do at 4 PM” means reading all three. Three pictograms stay on screen. The only kept variant without the four parts.',
    plan: { taps: ['2', '3', '4'], tapNote: ['tick, Log', 'tick, tick, Log', 'row, face, Done, Log'] }, pics: '3', load: 'Medium. Short cards, but you scan three regions to see the day in order.' },
  { id: 'C', name: 'Quiet parts', def: 'plan',
    why: 'Morning, Afternoon, Evening and Night are the only structure. Inside, plain rows: time on the left, the task, the tick on the right under the thumb. Nothing says Eat, Move or Mind. Small moves sit in a soft “Any time this afternoon” box at the end of their part.',
    trade: 'You cannot tell which plan a row came from (“Walk in nature” could be Move or Mind). Slipped morning tasks keep the morning open, so at 1:30 PM the list starts with the morning, not with now.',
    plan: PLAN_T, each: EACH_T, pics: '0', load: 'Lowest. One kind of row, four headers, no tags. A part folds to one line only when all of it is done.' },
  { id: 'D', name: 'Word tag', rec: true, def: 'plan',
    why: 'Quiet parts, plus the pillar as a small grey word at the start of each second line: “Mind · In 5, out 5 · 5 min”. You read it only when you want it. No colour, no pictogram, time still leads.',
    trade: 'Every row carries a second line, so the day is a little taller. The word is redundant on obvious rows like Lunch.',
    plan: PLAN_T, each: EACH_T, pics: '0', load: 'Low. As C, plus one grey word per row that the eye skips until it needs it.' },
  { id: 'E', name: 'Pillar ring', def: 'plan',
    why: 'The pillar lives only in the tick ring: green for Eat, indigo for Move, gold for Mind (from Structured). Logging fills the ring in its own colour, so colour resolves into the thing you touched. A three-word key sits on top once.',
    trade: 'Colour is the only cue, which fails for colour-blind members and bends the rule that only the score carries the pillar colour. Three colours on every screen are louder than one green.',
    plan: PLAN_T, each: EACH_T, pics: '0', load: 'Low to read, but three colours compete for attention on every screen.' },
  { id: 'F', name: 'Pillar groups', def: 'each',
    why: 'Inside each part, small Eat, Move and Mind words group the rows (words, not pictograms). The coach’s three plans stay visible, but the parts still lead. Ships with Each item ticks: foods and exercises sit under their meal or workout, so you tick exactly what you had.',
    trade: 'Time order breaks inside a part (a 7 AM breath sits below an 8 AM breakfast). Up to three extra lines per part, and each-item ticks make lunch 5 taps.',
    plan: PLAN_T, each: EACH_T, pics: '0', load: 'Medium. Two levels of heading (part, then pillar) before the rows.' },
  { id: 'G', name: 'Meal anchors', def: 'plan',
    why: 'Meals are the spine of an Indian day. Each meal is a soft card, and the Move and Mind tasks nearest to it hang under it as before, with or after lines. “Breathe before breakfast” is easier to keep than “breathe at 7” (habit stacking).',
    trade: 'The anchoring is an app rule, not the coach’s. Tasks far from a meal stay loose, and with no Eat plan it falls back to C. Times move to the meal, so a 9:30 PM task reads “before bedtime”.',
    plan: PLAN_T, each: EACH_T, pics: '0', load: 'Low. Common region per meal turns 20 rows into about 6 chunks.' },
  { id: 'H', name: 'Part cards', def: 'each',
    why: 'Four cards, one per part, each with a count. Only the part you are in is open; the others are one line each, so the whole day fits on one screen. Ships with Each item ticks, which the short list can afford.',
    trade: 'Anything still open from the morning is one tap away (the card says “4 still open”), so slipped tasks are easier to ignore. Exercises and mood cost one more tap.',
    plan: { taps: ['2', '3', '5'], tapNote: ['tick, Log', 'open Morning, tick the workout, Log', 'open Morning, row, face, Done, Log'] },
    each: { taps: ['5', '4', '5'], tapNote: ['4 food ticks, Log', 'open Morning, 2 ticks, Log', 'open Morning, row, face, Done, Log'] },
    pics: '0', load: 'Lowest at rest: one open part, three one-line cards.' },
  { id: 'I', name: 'Light and heavy', def: 'plan',
    why: 'Two kinds of row by effort. Meals, workouts, breathing and mood are full rows; one-second tasks (small moves, wind-down, me-time) are pills that wrap at the end of the part. Mood shows its five faces in the row, so a check-in is face, Done, Log.',
    trade: 'Pills lose their time and reason line, and need short names the coach does not write. Two row types to learn, and grey faces add five small pictures per open check-in.',
    plan: { taps: ['2', '2', '3'], tapNote: ['tick, Log', 'tick the workout, Log', 'face, Done, Log'] },
    each: { taps: ['5', '3', '3'], tapNote: ['4 food ticks, Log', '2 ticks, Log', 'face, Done, Log'] },
    pics: '0 (+5 faces)', load: 'Low. Parts are about a third shorter; the eye splits “do this” from “done in a second”.' },
];
const BASE = { name: 'Today (current screen.html)', taps: ['6', '5', '6'], tapNote: ['open Lunch, 4 food ticks, Log', 'open Morning, open Move, 2 ticks, Log', 'open Morning, open Mind, row, face, Done, Log'], pics: '5 to 8', load: 'High. Cards inside cards, a pictogram on every block, two levels of folding.' };

const Q = new URLSearchParams(location.search), V = Q.get('v');
const SVG = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const tickOf = (m, t) => m.only || (t === 'plan' || t === 'each' ? t : m.def);

/* ====================================================================== the study page */
function studyPage() {
  document.body.className = 'study';
  const CLOCK = [['8', '8:00 AM'], ['13.5', '1:30 PM'], ['19', '7:00 PM'], ['22.5', '10:30 PM']];
  const TICK = [['def', 'As each variant ships'], ['plan', 'Logs the plan'], ['each', 'Each item']];
  let now = Q.get('now') || '13.5', tick = Q.get('tick') || 'def';
  const tapCell = (t, n) => `<td class="n">${t}<small>${n}</small></td>`;

    const ask = late ? `<div class="fbn" role="status"><div class="rib">${I.warn}Future time</div><div class="in"><b>You’re logging ${late} future ${noun(T.filter(later), late)}!</b>
      <p>${one ? 'This ' + noun(T.filter(later), 1) + ' is' : 'These ' + noun(T.filter(later), 2) + ' are'} planned for later. Already done ${it}? Log ${it} now, or come back when you have.</p>
      <div class="fbb"><button class="pri" data-pt="setnow">Log ${it} now<small>${fmt(Math.floor(NOWM / 5) * 5)}</small></button><button data-pt="rmlate">Remove ${it}</button></div></div></div>` : '';
    const order = T.map((x, i) => [x, i]).sort((a, b) => later(b[0]) - later(a[0]));
    const rows = order.map(([x, i]) => { const u = U[x.id];
      if (u.kind === 'food') return `<div class="pi"><div class="t"><div class="nm">${u.name}</div><div class="mt">${u.meal.name} · ${helping(u.unit, x.n)} · ${Math.round(u.kc1 * x.n)} kcal</div></div><div class="ctl">
        <button class="tc${later(x) ? ' fut' : ''}" data-pt="wheel" data-i="${i}" aria-label="Change the time for ${u.name}, now ${fmt(x.time)}">${I.clock}${fmt(x.time)}</button>
        <div class="st"><button data-pt="dec" data-i="${i}" aria-label="${x.n === 1 ? 'Remove ' : 'One less '}${u.name}">${I.minus}</button><b>${x.n}</b><button data-pt="inc" data-i="${i}" aria-label="One more ${u.name}">${I.plus}</button></div></div></div>`;
      const meta = u.kind === 'ex' ? `${PNAME[u.part]} · 2 sets · ${u.kc} kcal` : u.kind === 'sm' ? `${PNAME[u.part]} · Small move`
        : u.kind === 'mood' ? `Mood · ${FACES[x.face][0]}` : u.kind === 'br' ? `Breathing · ${u.x.min} min` : u.kind === 'me' ? `Me-time · ${fmt(u.at)}` : `Wind-down · ${fmt(u.at)}`;
      return `<div class="pi"><div class="t"><div class="nm">${u.kind === 'mood' ? 'Mood check-in' : u.name}</div><div class="mt">${meta}</div></div><div class="ctl">
        ${u.kind === 'ex' ? `<button class="tc${later(x) ? ' fut' : ''}" data-pt="wheel" data-i="${i}">${I.clock}${fmt(x.time)}</button>` : ''}
        <button class="bin2" data-pt="rm" data-i="${i}" aria-label="Remove ${u.name}">${I.bin}</button></div></div>`; }).join('');
    const kcal = T.reduce((s, x) => s + (U[x.id].kind === 'food' ? Math.round(U[x.id].kc1 * x.n) : U[x.id].kind === 'ex' ? U[x.id].kc : 0), 0);
    openSheet(sheet, head(ttl) + ask + rows + `<div class="ft">${kcal ? `<div class="tot"><span>Total</span><b>${kcal} kcal</b></div>` : ''}<button class="cta" data-pt="sheetlog"${late ? ' disabled' : ''}>Log ${label(T)}</button></div>`);
  }
  // the time wheel: for a row in the bar (wheelFor.i) or a logged workout (wheelFor.id)
  let wheelFor = null;
  function wheel(m, title, sub) {
    const col = (cls, vals, on) => `<div class="wc ${cls}">${vals.map(v => `<div data-v="${v}"${v === on ? ' class="on"' : ''}>${v}</div>`).join('')}</div>`;
    const hrs = Array.from({ length: 12 }, (_, k) => String(k + 1)), mns = Array.from({ length: 60 }, (_, k) => String(k).padStart(2, '0')), h = Math.floor(m / 60);
    sheet.querySelector('.sh').classList.add('back');
    openSheet(sheet2, head(title, sub) + `<div class="wh"><span class="wband"></span>${col('hr', hrs, String(h % 12 || 12))}${col('mn', mns, String(m % 60).padStart(2, '0'))}${col('ap', ['AM', 'PM'], h < 12 ? 'AM' : 'PM')}</div>
       <div class="whint" aria-live="polite"></div><button class="cta" data-pt="setwheel">Done</button>`);
    sheet2.querySelectorAll('.wc').forEach(c => { const on = c.querySelector('.on'); c.scrollTop = on.offsetTop - 88;
      c.addEventListener('scroll', () => { clearTimeout(c.t); c.t = setTimeout(() => { const k = Math.round(c.scrollTop / 44); c.querySelectorAll('div').forEach((d, j) => d.classList.toggle('on', j === k)); wcheck(); }, 80); }); });
    setTimeout(wcheck, 300);
  }
  const wval = () => { const v = [...sheet2.querySelectorAll('.wc')].map(c => (c.querySelector('.on') || c.firstChild).dataset.v); let h = +v[0] % 12; if (v[2] === 'PM') h += 12; return h * 60 + +v[1]; };
  function wcheck() { const fut = wval() > NOWM; sheet2.querySelector('.whint').textContent = fut ? 'You can only log a time that has passed' : ''; sheet2.querySelector('[data-pt="setwheel"]').disabled = fut; }

  // things already logged: the pillars' own menus
  let menuFor = null, confirmFor = null;
  const mrow = (act, icon, text, warn) => `<button class="menurow${warn ? ' warn' : ''}" data-menu="${act}"><span class="mi">${icon}</span>${text}</button>`;
  function doneMenu(id) {
    menuFor = id; const u = U[id];
    if (u.kind === 'food') return openSheet(sheet, head(u.name, helping(u.unit, u.n) + ' · logged at ' + fmt(u.doneAt)) + mrow('qty', I.pen, 'Change the quantity') + mrow('off', I.undo, 'Take it off your day'));
    if (u.kind === 'ex') return openSheet(sheet, head(u.name, 'Done at ' + fmt(u.doneAt)) + mrow('time', I.clock, 'Edit workout time') + mrow('exundo', I.undo, 'Mark workout as not done'));
    if (u.kind === 'sm') return askUndo(id, "This small move comes off today's log, and what it added to your Momentum score is taken back.");
    if (u.kind === 'mood') return openSheet(sheet, head((u.at < 720 ? 'Morning' : 'Evening') + ' check-in', 'Feeling ' + FACES[u.face][0].toLowerCase()) + mrow('mood', I.pen, 'Change your mood') + mrow('moodrm', I.bin, 'Remove this check-in', true));
    if (u.kind === 'br') return openSheet(sheet, head(u.name) + mrow('again', I.play, 'Breathe again') + mrow('mdundo', I.undo, 'Mark as not done'));
    return openSheet(sheet, head(u.name) + mrow('mdundo', I.undo, 'Mark as not done'));
  }
  function askUndo(id, say) { confirmFor = id; openSheet(sheet, head('Mark as not done?', U[id].name) + `<p class="say">${say}</p><button class="cta" data-menu="yesundo">Mark as not done</button><button class="ghost" data-pt="close">Keep it as done</button>`); }
  function breathStart(id) { const u = U[id]; menuFor = id;
    openSheet(sheet, head(u.name, `${u.x.pat} · ${u.x.min} min, suggested by your coach`) + `<button class="cta" data-menu="startbr" style="margin-top:12px">Start breathing</button><button class="ghost" data-menu="didbr">I've already done it</button>`); }
  let moodFor = null, moodPick = null;
  function moodSheet(id, editing) {
    moodFor = id; moodPick = editing ? U[id].face : (T.find(x => x.id === id) || {}).face ?? null;
    openSheet(sheet, head('How are you feeling?') + `<div class="vm"><div class="vm-faces${moodPick != null ? ' picked' : ''}" role="group" aria-label="How are you feeling?">${FACES.map(([n, e], i) =>
      `<button class="vm-face${moodPick === i ? ' on' : ''}" data-face="${i}" aria-pressed="${moodPick === i}"><span aria-hidden="true">${e}</span>${n}</button>`).join('')}</div><div id="vmOut"></div></div>`);
    if (moodPick != null) moodReply(false);
  }
  function moodReply(wait) {
    const out = sheet.querySelector('#vmOut'); if (!out) return;
    out.innerHTML = `<div class="vm-k${wait ? ' wait' : ''}">${I.quote}${wait ? '<div class="vm-sh" aria-hidden="true"><i></i><i></i><i></i></div>' : `<p aria-live="polite">${REPLY[moodPick]}</p>`}</div>${wait ? '' : '<button class="cta" data-menu="mooddone" style="margin-top:16px">Done</button>'}`;
    if (wait) setTimeout(() => moodFor && moodReply(false), 900);
  }

  // ---------- log: the pillars' win moment, then the FlipCoin toast ----------
  function loadOnce(src) { return new Promise(ok => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ok; document.head.append(s); }); }
  function log() {
    if (anyFuture()) return review();
    const items = T.slice(), names = [...new Set(items.map(barName))], rect = (bar.querySelector('.go') || bar).getBoundingClientRect();
    const ks = [...new Set(items.map(x => U[x.id].p))], k1 = [...new Set(items.map(x => U[x.id].kind))];
    const title = k1.length === 1 && k1[0] === 'food' && names.length === 1 ? 'Meal logged' : items.length === 1 ? ({ ex: 'Workout logged', sm: 'Small move logged', mood: 'Mood checked in', br: 'Breathing done', me: 'Me-time done', wd: 'Wind-down done' })[k1[0]]
      : k1.length === 1 && k1[0] === 'ex' ? items.length + ' workouts logged' : items.length + ' items logged';
    const say = ks.length === 1 ? { eat: 'added to your sufficiency score', move: 'added to your Momentum score', mind: 'added to your Rhythm score' }[ks[0]] : 'added to your day';
    T = []; closeSheet(sheet); closeSheet(sheet2); bar.classList.remove('up'); document.body.classList.remove('pt-on');
    const land = () => {
      items.forEach(x => { const u = U[x.id]; JUST.add(x.id); u.done = true; u.doneAt = x.time; if (x.n) u.n = x.n; if (u.kind === 'mood') u.face = x.face; });
      render(); settle(items.map(x => x.id));
      loadOnce(R + 'flipcoin-toast.js?v=2').then(() => setTimeout(() => window.GFFlipcoin && GFFlipcoin.show(), 2000));
    };
    loadOnce(R + 'win-moment.js?v=14').then(() => {
      const ctl = window.WinMoment && WinMoment.begin(rect, names);
      if (!ctl) return land();
      let landed = false; const finish = () => { if (landed) return; landed = true; land();
        const h = document.querySelector('body > div.wm[role=status]'); if (!h) return;
        h.style.pointerEvents = 'none'; h.style.transition = 'opacity .36s cubic-bezier(.2,0,0,1)';
        requestAnimationFrame(() => requestAnimationFrame(() => { h.style.opacity = '0'; })); setTimeout(() => h.remove(), 420); };
      setTimeout(() => ctl.win({ d: null, n: items.length, title, say }, finish), 600);
      setTimeout(finish, 6200);
    });
  }
  // the logged rows catch the moment: a meal's foods land on the meal row, exercises on the workout row
  function settle(list) {
    const keys = new Set(); list.forEach(id => { const u = U[id]; keys.add(id); if (u.kind === 'food') keys.add('meal:' + u.meal.id); if (u.kind === 'ex') keys.add('wo:' + u.part); });
    [...keys].forEach((k, j) => { const r = root.querySelector(`[data-row="${k}"]`); if (!r) return;
      setTimeout(() => { const tk = r.querySelector('.tick'); r.classList.add('cheer'); tk && tk.classList.add('pop'); setTimeout(() => { r.classList.remove('cheer'); tk && tk.classList.remove('pop'); }, 1000); }, j * 90); });
  }

  // ---------- taps ----------
  function onTick(key, rowEl) {
    if (key.startsWith('meal:')) { const m = MEALS.find(x => x.id === key.slice(5)), e = mealE(m); if (e.done) return mealSheet(m.id); return toggleMany(e.members, rowEl, m.name, e.members.length + ' items, as planned'); }
    if (key.startsWith('wo:')) { const k = key.slice(3), e = woE(k); if (e.done) return woSheet(k); return toggleMany(e.members, rowEl, e.title, e.members.length + (e.members.length > 1 ? ' exercises' : ' exercise')); }
    const u = U[key];
    if (u.kind === 'tip') { u.done = !u.done; refresh(); return; }
    if (u.done) return doneMenu(key);
    if (u.kind === 'mood') return moodSheet(key);
    toggleMany([key], rowEl, u.name, u.kind === 'food' ? helping(u.unit, u.n) : u.kind === 'ex' ? '2 sets · ' + u.kc + ' kcal' : u.kind === 'sm' ? 'Small move' : PNAME[u.part]);
  }
  function onDetail(key, rowEl) {
    if (key.startsWith('meal:')) return mealSheet(key.slice(5));
    if (key.startsWith('wo:')) return woSheet(key.slice(3));
    const u = U[key];
    if (u.kind === 'ex') return toast('The exercise player opens');
    if (u.kind === 'br') return u.done ? doneMenu(key) : breathStart(key);
    if (u.kind === 'mood') return u.done ? doneMenu(key) : moodSheet(key);
    return onTick(key, rowEl);
  }
  function pickFace(a) { moodPick = +a.dataset.face; const fs = sheet.querySelector('.vm-faces'); fs.classList.add('picked');
    fs.querySelectorAll('.vm-face').forEach(b => { const on = b === a; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); moodReply(true); }
  document.addEventListener('click', e => {
    if (!e.target.closest('.pt')) peek(false);
    const ui = e.target.closest('[data-ui]');
    const fo = e.target.closest('[data-fold]');
    if (fo) { S[V] = S[V] || {}; S[V][fo.dataset.fold] = fo.dataset.on !== '1'; return render(); }
    const mf = e.target.closest('[data-mface]');
    if (mf) { moodSheet(mf.dataset.mface); return pickFace(sheet.querySelector(`.vm-face[data-face="${mf.dataset.i}"]`)); }
    if (ui) { const [v, k] = ui.dataset.ui.split('.');
      if (k == null) S[v] = !S[v]; else { S[v] = S[v] || {}; S[v][k] = !S[v][k]; }
      return render(); }
    const ch = e.target.closest('[data-opt]'); if (ch) { optSel[ch.dataset.meal] = +ch.dataset.opt; return refresh(); }
    const sy = e.target.closest('[data-say]'); if (sy) return toast(sy.dataset.say);
    const d = e.target.closest('[data-d]'); if (d) return onDetail(d.dataset.d, d.closest('[data-row]'));
    const t = e.target.closest('[data-t]'); if (t) return onTick(t.dataset.t, t.closest('[data-row]') || t);

    const a = e.target.closest('[data-pt],[data-menu],[data-face],.wc div');
    if (!a) { if (e.target.classList.contains('pts')) closeSheet(e.target); return; }
    if (a.matches('.wc div')) { a.parentElement.scrollTo({ top: a.offsetTop - 88, behavior: 'smooth' }); return; }
    if (a.dataset.face != null) return pickFace(a);
    const act = a.dataset.pt || a.dataset.menu, i = +a.dataset.i;
    switch (act) {
      case 'review': peek(false); return review();
      case 'log': peek(false); return log();
      case 'peek': return peek(!bar.querySelector('.flw').classList.contains('open'));
      case 'clear': T = []; peek(false); renderBar(); return refresh();
      case 'close': return closeSheet(a.closest('.pts'));
      case 'inc': T[i].n++; renderBar(); render(); return review();
      case 'dec': if (T[i].n > 1) T[i].n--; else T.splice(i, 1); renderBar(); render(); return review();
      case 'rm': T.splice(i, 1); renderBar(); render(); return review();
      case 'setnow': { const tt = Math.floor(NOWM / 5) * 5; T.forEach(x => { if (later(x)) x.time = tt; }); review(); sheet.querySelectorAll('.tc').forEach(c => c.classList.add('flash')); return; }
      case 'rmlate': T = T.filter(x => !later(x)); renderBar(); render(); return review();
      case 'sheetlog': return log();
      case 'wheel': { const x = T[i], u = U[x.id]; wheelFor = { i }; return wheel(x.time, u.kind === 'food' ? 'When did you have it?' : 'When did you do it?', u.name); }
      case 'setwheel': { const v = wval(); closeSheet(sheet2);
        if (wheelFor && wheelFor.id) { U[wheelFor.id].doneAt = v; closeSheet(sheet); render(); toast('Workout time updated'); }
        else if (wheelFor) { T[wheelFor.i].time = v; review(); }
        wheelFor = null; return; }
      case 'off': { const u = U[menuFor]; u.done = false; closeSheet(sheet); render(); return toast(`${u.name} taken off your day`); }
      case 'qty': { const u = U[menuFor]; u.n = u.n + 1; closeSheet(sheet); render(); return toast(`${u.name} updated to ${helping(u.unit, u.n)}`); }
      case 'time': wheelFor = { id: menuFor }; return wheel(U[menuFor].doneAt, 'When did you do it?', U[menuFor].name);
      case 'exundo': return askUndo(menuFor, `It comes off today's log, and the ${U[menuFor].kc} kcal it burned leave your Momentum score.`);
      case 'yesundo': U[confirmFor].done = false; closeSheet(sheet); return render();
      case 'mdundo': U[menuFor].done = false; closeSheet(sheet); render(); return toast('Marked as not done');
      case 'again': closeSheet(sheet); return toast('The breathing player opens');
      case 'mood': return moodSheet(menuFor, true);
      case 'moodrm': { const u = U[menuFor]; u.done = false; u.face = null; closeSheet(sheet); render(); return toast('Mood check-in removed'); }
      case 'mooddone': { const id = moodFor; closeSheet(sheet); moodFor = null;
        if (U[id].done) { U[id].face = moodPick; return render(); }   // changing a logged mood replaces it
        const x = T.find(tt => tt.id === id);
        if (x) { x.face = moodPick; return; }
        setTimeout(() => { T.push({ id, time: NOWM, face: moodPick }); renderBar(false); render(); const r = root.querySelector(`[data-row="${id}"]`); if (!toss(r && r.getBoundingClientRect(), 'Mood', FACES[moodPick][0])) renderBar(true); }, 220);
        return; }
      case 'startbr': closeSheet(sheet); return toast('The breathing player opens');
      case 'didbr': U[menuFor].done = true; U[menuFor].doneAt = NOWM; closeSheet(sheet); render(); settle([menuFor]); return toast('Marked as done');
    }
  });

  render();
  // tell the study page how many ticks are in reach without scrolling
  setTimeout(() => { const h = innerHeight - 90; const n = [...root.querySelectorAll('.tickbtn, .tk, .apb.pri')].filter(t => { const r = t.getBoundingClientRect(); return r.width && r.top > 0 && r.bottom < h && r.left >= 0 && r.right <= innerWidth; }).length;
    if (parent !== window) parent.postMessage({ type: 'todo-meas', v: V, ticks: n }, '*'); }, 600);
}

if (V) phone(); else studyPage();
</script>
</body>
</html>
